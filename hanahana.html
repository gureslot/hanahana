<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハナハナ関連</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon_32x32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent:    #ff2a6d;
  --bg:        #080808;
  --surface:   #111111;
  --surface-2: #171717;
  --border:    #1e1e1e;
  --text:      #e0dbd5;
  --muted:     #5e5e5e;
  --serif:     'Noto Serif JP', 'YuMincho', '游明朝', serif;
  --sans:      'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
}

/* ─── layout ─── */
.container {
  max-width: 760px;
  margin: 56px auto 40px;
  padding: 0 24px;
}

.page-title {
  font-family: var(--serif);
  font-size: clamp(26px, 5vw, 34px);
  font-weight: 700;
  letter-spacing: 4px;
  text-align: center;
  margin-bottom: 14px;
}

.intro {
  text-align: center;
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 40px;
  line-height: 1.9;
}

/* ─── list of items ─── */
.list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.item {
  display: block;
  padding: 22px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  text-decoration: none;
  color: var(--text);
  transition: background 0.18s, border-color 0.18s;
}
.item:hover {
  background: var(--surface-2);
  border-color: #2c2c2c;
  border-left-color: var(--accent);
}

.item-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.item h2 {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 1px;
}
.item-arrow {
  color: var(--accent);
  font-size: 14px;
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity 0.18s, transform 0.18s;
  flex-shrink: 0;
}
.item:hover .item-arrow {
  opacity: 1;
  transform: translateX(0);
}
.item p {
  margin-top: 9px;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--muted);
}

/* ─── nav ─── */
.site-nav {
  border-top: 1px solid var(--border);
  margin-top: 8px;
  padding: 34px 24px 40px;
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}
.site-nav a {
  display: inline-block;
  padding: 12px 30px;
  border: 2px solid var(--accent);
  color: var(--text);
  text-decoration: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  transition: background 0.18s, color 0.18s;
}
.site-nav a:hover {
  background: var(--accent);
  color: #fff;
}

/* ─── footer ─── */
footer {
  border-top: 1px solid var(--border);
  padding: 28px 24px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.1em;
  font-family: var(--serif);
}

/* ─── responsive ─── */
@media (max-width: 480px) {
  .container { margin-top: 36px; padding: 0 16px; }
  .item { padding: 20px 18px; }
}
</style>
</head>

<body>

<div class="container">

  <p class="intro">
    リール配列確認や動画、打ち方などを置いています。
  </p>

  <div class="list">

        <span class="item-arrow">→</span>
      </div>
      <p>21コマのリール配列をドラッグ操作で確認できます。</p>
    </a>

    <a class="item" href="hanahana/saisoku.html">

        <h2>最速collection</h2>
        <span class="item-arrow">→</span>
      </div>
      <p>白BARからの最速目押し動画をコレクションしていきます。</p>
    </a>

    <a class="item" href="hanahana/uchikata.html">
      <div class="item-head">
        <h2>ハナハナの打ち方</h2>
        <span class="item-arrow">→</span>
      </div>
      <p>打ち方の動画を置いています。</p>
    </a>

    <a class="item" href="https://gureslot.github.io/hanahana/hanahana/slot_logger.html">
      <div class="item-head">
        <h2>ツール①</h2>
        <span class="item-arrow">→</span>
      </div>
      <p>誰かの役に立ちそうなツール①</p>
    </a>

    <a class="item" href="hanahana/island-tool.html">
      <div class="item-head">
        <h2>島図作成ツール</h2>
        <span class="item-arrow">→</span>

      <p>角台だけの情報から列の棒を作って配置し、島図を作ります。色も付けられます。</p>
    </a>

  </div>

</div>

<nav class="site-nav">
  <a href="index.html">index</a>
</nav>

<footer>
  © グレイト・プレ・善太
</footer>

</body>
</html>
