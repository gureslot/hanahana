<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>チカリアン 設定</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');
  :root{ --gold-hi:#fff3c8; --gold:#e8c25a; --panel:rgba(20,11,16,.9); --border:1.5px solid rgba(232,194,90,.5); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{font-family:'Shippori Mincho','Yu Mincho',serif; color:var(--gold-hi); background:#070409; overflow:hidden;}
  .root{position:relative; width:100%; max-width:480px; margin:0 auto; height:100dvh; overflow:hidden;
        background:#0a0509 radial-gradient(80% 45% at 50% 0%, rgba(60,60,80,.2), transparent 60%); display:flex; flex-direction:column;}
  .head{flex:none; text-align:center; padding:16px 16px 6px;}
  .head .t{font-size:19px; font-weight:800; letter-spacing:4px;}
  .body{flex:1; overflow-y:auto; padding:10px 16px 90px;}
  .sec{font-size:11px; color:#cdb488; letter-spacing:2px; border-left:3px solid var(--gold); padding-left:8px; margin:14px 0 7px;}
  .row{display:flex; align-items:center; justify-content:space-between; background:var(--panel); border:var(--border); border-radius:12px; padding:13px 14px; margin-bottom:8px;}
  .row .k{font-size:14px;} .row .sub{font-size:10px; color:#9a8c70; margin-top:3px;}
  .toggle{width:50px; height:28px; border-radius:16px; background:rgba(255,255,255,.15); position:relative; cursor:pointer; transition:.2s; border:1px solid rgba(232,194,90,.3);}
  .toggle.on{background:linear-gradient(90deg,#e8b54d,#ffd98a);}
  .knob{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s;}
  .toggle.on .knob{left:26px;}
  .slider{width:130px;} input[type=range]{width:100%; accent-color:#e8b54d;}
  .linkRow{font-size:13px; color:#cdb488;}
  .small{font-family:inherit; font-size:12px; color:var(--gold-hi); background:rgba(255,255,255,.05); border:1px solid rgba(232,194,90,.4); border-radius:14px; padding:7px 14px; cursor:pointer;}
  .uid{font-size:11px; color:#9a8c70;}
  .ver{text-align:center; font-size:10px; color:#6a5a4a; margin-top:18px;}
  .back{position:absolute; z-index:7; left:14px; bottom:14px; font-family:inherit; font-size:14px; color:var(--gold-hi); background:var(--panel); border:var(--border); border-radius:22px; padding:10px 20px; cursor:pointer;}
  .toast{position:absolute; z-index:20; left:50%; top:44%; transform:translate(-50%,-50%) scale(.9); background:var(--panel); border:var(--border); border-radius:14px; padding:14px 22px; text-align:center; font-size:13px; opacity:0; pointer-events:none; transition:.25s;} .toast.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
</style>
</head>
<body>
<div class="root">
  <div class="head"><div class="t">設定</div></div>
  <div class="body">
    <div class="sec">サウンド</div>
    <div class="row"><div><div class="k">BGM</div></div><div class="toggle on" data-t="bgm"><div class="knob"></div></div></div>
    <div class="row"><div><div class="k">効果音</div></div><div class="toggle on" data-t="se"><div class="knob"></div></div></div>
    <div class="row"><div class="k">音量</div><div class="slider"><input type="range" min="0" max="100" value="70"></div></div>

    <div class="sec">アカウント・データ</div>
    <div class="row"><div><div class="k">プレイヤーID</div><div class="uid">ck-0000-DEMO（モック）</div></div><button class="small" id="copyId">コピー</button></div>
    <div class="row"><div><div class="k">データ連携</div><div class="sub">本番はアカウントに紐づけて保存（Supabase）</div></div><button class="small" id="linkBtn">連携する</button></div>

    <div class="sec">その他</div>
    <div class="row linkRow"><div class="k">利用規約</div><button class="small">開く</button></div>
    <div class="row linkRow"><div class="k">プライバシーポリシー</div><button class="small">開く</button></div>
    <div class="row linkRow"><div class="k">お問い合わせ</div><button class="small">開く</button></div>

    <div class="ver">チカリアン （開発版モック）<br>build: chikarian-mock-2026-06-07</div>
  </div>
  <button class="back" id="back">‹ 戻る</button>
  <div class="toast" id="toast"></div>
</div>
<script>
  const $=s=>document.getElementById(s);
  document.querySelectorAll('.toggle').forEach(t=>t.addEventListener('click',()=>t.classList.toggle('on')));
  function toast(t){ $('toast').textContent=t; const el=$('toast'); el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1400); }
  $('copyId').addEventListener('click',()=>toast('プレイヤーIDをコピーしました（モック）'));
  $('linkBtn').addEventListener('click',()=>toast('データ連携は本番で実装（Supabase）'));
  document.querySelectorAll('.linkRow .small').forEach(b=>b.addEventListener('click',()=>toast('リンク先は後日設定')));
  $('back').addEventListener('click',()=>{ location.href='./home-mockup.html'; });
</script>
</body>
</html>
