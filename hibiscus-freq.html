<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ハイビスカス 周波数測定（区間記録）</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  :root{--red:#ff2d55;--orange:#ff9500;--yellow:#ffd60a;--green:#32d74b;--blue:#0af;--dark:#0a0a0f;--panel:#13131e;--border:#2a2a3a;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--dark);color:#eee;font-family:'Share Tech Mono',monospace;}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;padding:4px;gap:3px;}
  #camera-wrap{position:relative;width:100%;flex:0 0 32%;background:#000;border-radius:8px;overflow:hidden;}
  #video{width:100%;height:100%;object-fit:cover;display:block;}
  #canvas-hidden{display:none;}
  .rbox{position:absolute;border:2px solid rgba(255,255,255,0.4);border-radius:3px;touch-action:none;cursor:move;display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 3px;font-size:.45rem;user-select:none;}
  .rbox.dragging{opacity:.8;}
  .resize-handle{position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:se-resize;background:rgba(255,255,255,0.3);border-radius:2px 0 3px 0;}
  #side-row{display:flex;gap:4px;}
  .side-btn{flex:1;padding:5px 0;border:1.5px solid var(--border);border-radius:6px;background:var(--panel);color:#666;font-size:.7rem;cursor:pointer;text-align:center;line-height:1.4;}
  .side-btn.active{border-color:var(--red);color:var(--red);}
  #ctrl-row{display:flex;gap:4px;}
  .cbtn{flex:1;padding:7px 0;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:#eee;font-size:.62rem;cursor:pointer;}
  .cbtn.primary{border-color:var(--red);color:var(--red);}
  /* 波形 */
  #wave-wrap{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px;}
  #wave{width:100%;height:70px;display:block;}
  .wave-lbl{font-size:.5rem;color:#777;padding:0 2px;}
  /* 記録 */
  #rec-status{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:.65rem;line-height:1.5;}
  #rec-status b{color:var(--orange);}
  #rec-row{display:flex;gap:4px;}
  .rbtn{flex:1;padding:11px 0;border-radius:6px;font-size:.72rem;cursor:pointer;border:1.5px solid;font-weight:bold;}
  .rbtn.real{border-color:var(--green);color:var(--green);background:#0c1a0c;}
  .rbtn.ng{border-color:var(--red);color:var(--red);background:#1a0c0c;}
  .rbtn.recording{background:var(--red)!important;color:#fff!important;border-color:#fff!important;}
  #csv-info{flex:1;background:#000;border:1px solid var(--border);border-radius:6px;padding:5px 7px;overflow-y:auto;font-size:.56rem;color:#9f9;line-height:1.7;min-height:0;}
  #csv-ctrl{display:flex;gap:4px;}
  .sbtn{flex:1;padding:6px 0;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:#aaa;font-size:.58rem;cursor:pointer;}
  .note{font-size:.5rem;color:#666;line-height:1.5;}
</style>
</head>
<body>
<div id="app">
  <div id="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas-hidden"></canvas>
  </div>

  <div id="side-row">
    <div class="side-btn active" id="btn-L" onclick="setSide('L')">◀ 左ランプ<br><span style="font-size:.5rem;color:#555">めしべ:右上</span></div>
    <div class="side-btn" id="btn-R" onclick="setSide('R')">右ランプ ▶<br><span style="font-size:.5rem;color:#555">めしべ:左上</span></div>
  </div>
  <div id="ctrl-row">
    <button class="cbtn primary" id="btn-cam" onclick="toggleCam()">▶ カメラ開始</button>
    <button class="cbtn" onclick="resetRegions()">座標リセット</button>
  </div>

  <div id="wave-wrap">
    <div class="wave-lbl">輝度波形（花:赤 葉:緑 芯:黄）リアルタイム</div>
    <canvas id="wave"></canvas>
  </div>

  <div id="rec-status">状態: <b id="st">カメラ停止中</b> ／ 採取 <span id="cnt">0</span> サンプル ／ 推定 <span id="livehz">-- Hz</span></div>

  <div id="rec-row">
    <button class="rbtn real" id="rbtn-real" onclick="toggleRec('REAL')">本物を3秒記録</button>
    <button class="rbtn ng" id="rbtn-ng" onclick="toggleRec('NG')">NGを3秒記録</button>
  </div>

  <div id="csv-info">記録なし</div>
  <div id="csv-ctrl">
    <button class="sbtn" onclick="copyCsv()">CSVコピー</button>
    <button class="sbtn" onclick="dlCsv()">CSVダウンロード</button>
    <button class="sbtn" onclick="clearCsv()">クリア</button>
  </div>
  <div class="note">使い方：カメラ開始→点滅源に安定してかざす→「本物を3秒記録」を押す（押している間ずっと取り続け、3秒で自動停止）。本物で2〜3回、MAXBET等で2〜3回。波形が出る区間を記録。溜まったらCSVをコピーして渡してください。1サンプル=1行(時刻ms,花/葉/芯の輝度とRGB)。</div>
</div>

<script>
const MS=50;            // 20fpsサンプリング
const REC_SEC=3;        // 1回の記録秒数
let side='L', stream=null, tid=null, running=false;
let recording=false, recType='', recRows=[], recStart=0;
let waveBuf=[];         // 表示用 {p,l,s}
const WAVE_MAX=240;

const DEFAULT_REGIONS={
  L:{stamen:{x:.58,y:.02,w:.38,h:.28,c:'#ffd60a',n:'芯'},petal:{x:.05,y:.18,w:.68,h:.50,c:'#ff2d55',n:'花'},leaf1:{x:.02,y:.63,w:.26,h:.28,c:'#32d74b',n:'葉左'},leaf2:{x:.70,y:.58,w:.26,h:.28,c:'#32d74b',n:'葉右'}},
  R:{stamen:{x:.04,y:.02,w:.38,h:.28,c:'#ffd60a',n:'芯'},petal:{x:.27,y:.18,w:.68,h:.50,c:'#ff2d55',n:'花'},leaf1:{x:.02,y:.63,w:.26,h:.28,c:'#32d74b',n:'葉左'},leaf2:{x:.70,y:.58,w:.26,h:.28,c:'#32d74b',n:'葉右'}}
};
function loadRegions(){try{const s=localStorage.getItem('hibiscus_regions');if(s)return JSON.parse(s);}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_REGIONS));}
function saveRegions(){localStorage.setItem('hibiscus_regions',JSON.stringify(regions));}
function resetRegions(){regions=JSON.parse(JSON.stringify(DEFAULT_REGIONS));saveRegions();drawBoxes();}
let regions=loadRegions();

const video=document.getElementById('video');
const cvH=document.getElementById('canvas-hidden');
const ctx2=cvH.getContext('2d',{willReadFrequently:true});
const wave=document.getElementById('wave');
const wctx=wave.getContext('2d');

function drawBoxes(){
  const wrap=document.getElementById('camera-wrap');
  [...wrap.querySelectorAll('.rbox')].forEach(e=>e.remove());
  const rs=regions[side];
  Object.entries(rs).forEach(([key,r])=>{
    const div=document.createElement('div');
    div.className='rbox';div.id='rbox-'+key;
    div.style.cssText=`left:${r.x*100}%;top:${r.y*100}%;width:${r.w*100}%;height:${r.h*100}%;border-color:${r.c}88;color:${r.c};`;
    div.textContent=r.n;
    const handle=document.createElement('div');handle.className='resize-handle';div.appendChild(handle);
    makeDraggable(div,key,handle);wrap.appendChild(div);
  });
}
function makeDraggable(el,key,handle){
  const wrap=document.getElementById('camera-wrap');let dragging=false,resizing=false,sx,sy,sl,st,sw,sh;
  const gp=e=>{const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};};
  el.addEventListener('pointerdown',e=>{if(e.target===handle)return;e.preventDefault();dragging=true;el.classList.add('dragging');el.setPointerCapture(e.pointerId);const p=gp(e);sx=p.x;sy=p.y;const r=regions[side][key];sl=r.x;st=r.y;});
  el.addEventListener('pointermove',e=>{if(!dragging)return;e.preventDefault();const p=gp(e);const W=wrap.offsetWidth,H=wrap.offsetHeight;const r=regions[side][key];r.x=Math.max(0,Math.min(1-r.w,sl+(p.x-sx)/W));r.y=Math.max(0,Math.min(1-r.h,st+(p.y-sy)/H));el.style.left=(r.x*100)+'%';el.style.top=(r.y*100)+'%';});
  el.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;el.classList.remove('dragging');saveRegions();});
  handle.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();resizing=true;handle.setPointerCapture(e.pointerId);const p=gp(e);sx=p.x;sy=p.y;const r=regions[side][key];sw=r.w;sh=r.h;});
  handle.addEventListener('pointermove',e=>{if(!resizing)return;e.preventDefault();const p=gp(e);const W=wrap.offsetWidth,H=wrap.offsetHeight;const r=regions[side][key];r.w=Math.max(0.05,Math.min(1-r.x,sw+(p.x-sx)/W));r.h=Math.max(0.05,Math.min(1-r.y,sh+(p.y-sy)/H));el.style.width=(r.w*100)+'%';el.style.height=(r.h*100)+'%';});
  handle.addEventListener('pointerup',e=>{if(!resizing)return;resizing=false;saveRegions();});
}
function setSide(s){side=s;document.getElementById('btn-L').className='side-btn'+(s==='L'?' active':'');document.getElementById('btn-R').className='side-btn'+(s==='R'?' active':'');drawBoxes();}

async function toggleCam(){
  if(running){clearInterval(tid);if(stream)stream.getTracks().forEach(t=>t.stop());running=false;document.getElementById('btn-cam').textContent='▶ カメラ開始';document.getElementById('st').textContent='カメラ停止中';return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}});
    video.srcObject=stream;await video.play();cvH.width=320;cvH.height=240;drawBoxes();initWave();
    running=true;document.getElementById('btn-cam').textContent='⏹ カメラ停止';document.getElementById('st').textContent='待機中（かざして記録）';
    tid=setInterval(sample,MS);
  }catch(e){alert('カメラエラー: '+e.message);}
}

function sampleRegion(img,W,H,rx,ry,rw,rh){
  const x0=Math.floor(rx*W),y0=Math.floor(ry*H),x1=Math.min(Math.floor((rx+rw)*W),W),y1=Math.min(Math.floor((ry+rh)*H),H);
  let r=0,g=0,b=0,n=0;
  for(let y=y0;y<y1;y+=3)for(let x=x0;x<x1;x+=3){const i=(y*W+x)*4;r+=img[i];g+=img[i+1];b+=img[i+2];n++;}
  if(!n)return{r:0,g:0,b:0,br:0};
  return{r:r/n,g:g/n,b:b/n,br:(r/n+g/n+b/n)/3};
}

function sample(){
  if(!video.videoWidth)return;
  ctx2.drawImage(video,0,0,320,240);
  const img=ctx2.getImageData(0,0,320,240).data,W=320,H=240,rs=regions[side];
  const P=sampleRegion(img,W,H,rs.petal.x,rs.petal.y,rs.petal.w,rs.petal.h);
  const L1=sampleRegion(img,W,H,rs.leaf1.x,rs.leaf1.y,rs.leaf1.w,rs.leaf1.h);
  const L2=sampleRegion(img,W,H,rs.leaf2.x,rs.leaf2.y,rs.leaf2.w,rs.leaf2.h);
  const S=sampleRegion(img,W,H,rs.stamen.x,rs.stamen.y,rs.stamen.w,rs.stamen.h);
  const L=(L1.br>=L2.br)?L1:L2;
  const now=Date.now();

  // 表示波形バッファ
  waveBuf.push({p:P.br,l:L.br,s:S.br});
  if(waveBuf.length>WAVE_MAX)waveBuf.shift();
  drawWave();

  // ライブ周波数推定（花輝度のゼロ交差ベース・表示用のみ）
  if(waveBuf.length>=40){
    const arr=waveBuf.slice(-60).map(o=>o.p);
    const m=arr.reduce((s,v)=>s+v,0)/arr.length;
    let cr=0,ls=arr[0]>m?1:-1;
    for(let i=1;i<arr.length;i++){const s=arr[i]>m?1:-1;if(s!==ls){cr++;ls=s;}}
    const sec=(arr.length*MS)/1000;
    const hz=sec>0?((cr/2)/sec):0;
    document.getElementById('livehz').textContent=(hz?hz.toFixed(2):'--')+' Hz';
  }

  // 記録中なら全サンプルを溜める
  if(recording){
    const t=now-recStart;
    recRows.push(`${recType},${t},${P.br.toFixed(1)},${L.br.toFixed(1)},${S.br.toFixed(1)},${P.r.toFixed(0)},${P.g.toFixed(0)},${P.b.toFixed(0)},${L.r.toFixed(0)},${L.g.toFixed(0)},${L.b.toFixed(0)},${S.r.toFixed(0)},${S.g.toFixed(0)},${S.b.toFixed(0)}`);
    curCount++;
    document.getElementById('cnt').textContent=curCount;
    if(t>=REC_SEC*1000)stopRec();
  }
}

let curCount=0;
function initWave(){const r=wave.getBoundingClientRect();wave.width=r.width*devicePixelRatio;wave.height=70*devicePixelRatio;wctx.scale(devicePixelRatio,devicePixelRatio);}
function drawWave(){
  const w=wave.width/devicePixelRatio,h=70;
  wctx.clearRect(0,0,w,h);
  const draw=(key,color)=>{
    wctx.strokeStyle=color;wctx.lineWidth=1;wctx.beginPath();
    waveBuf.forEach((o,i)=>{const x=(i/WAVE_MAX)*w;const y=h-(o[key]/255)*h;i?wctx.lineTo(x,y):wctx.moveTo(x,y);});
    wctx.stroke();
  };
  draw('p','#ff2d55');draw('l','#32d74b');draw('s','#ffd60a');
}

let allRows=[], recCounts={REAL:0,NG:0};
function toggleRec(type){
  if(!running){alert('先にカメラを開始してください');return;}
  if(recording){stopRec();return;}
  recording=true;recType=type;recRows=[];recStart=Date.now();curCount=0;
  document.getElementById('st').textContent=type+' 記録中...';
  document.getElementById('rbtn-'+type.toLowerCase()).classList.add('recording');
}
function stopRec(){
  if(!recording)return;
  recording=false;
  document.getElementById('rbtn-real').classList.remove('recording');
  document.getElementById('rbtn-ng').classList.remove('recording');
  allRows=allRows.concat(recRows);
  recCounts[recType]=(recCounts[recType]||0)+1;
  document.getElementById('st').textContent='待機中（かざして記録）';
  updateInfo();
}
function updateInfo(){
  const real=allRows.filter(r=>r.startsWith('REAL,')).length;
  const ng=allRows.filter(r=>r.startsWith('NG,')).length;
  document.getElementById('csv-info').innerHTML=`記録済み: REAL ${recCounts.REAL}回(${real}行) ／ NG ${recCounts.NG}回(${ng}行)<br>合計 ${allRows.length} 行`;
}
const HEADER='type,t_ms,pBr,lBr,sBr,pR,pG,pB,lR,lG,lB,sR,sG,sB';
function csvText(){return HEADER+'\n'+allRows.join('\n');}
function copyCsv(){if(!allRows.length){alert('記録がありません');return;}navigator.clipboard.writeText(csvText()).then(()=>alert('コピーしました')).catch(()=>alert('コピー失敗。ダウンロードを使ってください'));}
function dlCsv(){if(!allRows.length){alert('記録がありません');return;}const b=new Blob([csvText()],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hibiscus-freq.csv';a.click();}
function clearCsv(){allRows=[];recCounts={REAL:0,NG:0};updateInfo();document.getElementById('csv-info').innerHTML='記録なし';}

window.addEventListener('load',drawBoxes);
window.addEventListener('resize',()=>{if(running)initWave();});
</script>
</body>
</html>
