<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile | グレイト・プレ・善太</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon_32x32.png">

<style>
:root{
  --accent:#ff2a6d;
  --bg:#0d0d0d;
  --border:#252525;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
  line-height:1.6;
  min-height:100vh;
}

.hdr{padding:64px 20px 48px;text-align:center;border-bottom:1px solid var(--border);}
.hdr-eye{font-size:10px;letter-spacing:6px;color:var(--accent);margin-bottom:16px;}
.hdr-title{font-size:clamp(28px,6vw,52px);font-weight:300;letter-spacing:8px;line-height:1.2;}

.wrap{max-width:720px;margin:0 auto;padding:56px 20px 80px;}

.field{margin-bottom:44px;}
.field:last-child{margin-bottom:0;}

.field-label{
  font-size:10px;
  letter-spacing:2px;
  color:#555;
  border-left:2px solid var(--accent);
  padding-left:10px;
  margin-bottom:9px;
}

.field-value{
  font-size:18px;
  line-height:1.8;
  padding-left:12px;
}

.field-credit{
  font-size:14px;
  line-height:1.7;
  color:#888;
  padding-left:12px;
  margin-top:2px;
}

.sns-link{
  color:var(--accent);
  font-weight:700;
  text-decoration:none;
  word-break:break-word;
}
.sns-link:hover{text-decoration:underline;}

.site-nav{border-top:1px solid var(--border);padding:30px 20px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.site-nav a{
  display:inline-block;padding:12px 30px;border:2px solid var(--accent);
  color:#fff;text-decoration:none;border-radius:8px;font-size:15px;
  font-weight:700;letter-spacing:1px;transition:background 0.15s;
}
.site-nav a:hover{background:var(--accent);}

@media(max-width:600px){
  .wrap{padding:40px 16px 60px;}
}
</style>
</head>
<body>

<header class="hdr">
  <p class="hdr-eye">PROFILE</p>
  <h1 class="hdr-title">プロフィール</h1>
</header>

<main class="wrap">

  <div class="field">
    <p class="field-label">Name</p>
    <p class="field-value">グレイト・プレ・善太</p>
  </div>

  <div class="field">
    <p class="field-label">好きなもの</p>
    <p class="field-value">ハナハナ・AI創作・シュールなもの</p>
  </div>

  <div class="field">
    <p class="field-label">好きな漫画</p>
    <p class="field-value">サバイバル</p>
    <p class="field-credit">さいとう・たかを</p>
  </div>

  <div class="field">
    <p class="field-label">好きな映画</p>
    <p class="field-value">どですかでん</p>
    <p class="field-credit">黒澤明監督</p>
  </div>

  <div class="field">
    <p class="field-label">各SNSリンク</p>
    <p class="field-value">
      <a class="sns-link" href="https://lit.link/GreatPresenter" target="_blank" rel="noopener noreferrer">https://lit.link/GreatPresenter</a>
    </p>
  </div>

</main>

<nav class="site-nav">
  <a href="index.html">index</a>
</nav>

</body>
</html>
