<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>チカリウム採取</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');
  :root{--gold:#e8c25a;--gold-hi:#fff3c8;--red:#ff2d55;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#0a0509;font-family:'Shippori Mincho','Yu Mincho',serif;color:var(--gold-hi);}
  #app{position:relative;width:100%;max-width:480px;margin:0 auto;height:100dvh;overflow:hidden;}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;}
  #cv-hidden{display:none;}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;}
  /* 認識枠（控えめ・採取中の手応え用） */
  .rbox{position:absolute;border:1.5px solid rgba(255,255,255,0.25);border-radius:4px;z-index:2;}
  /* 上部 獲得表示 */
  #top{position:absolute;top:0;left:0;right:0;z-index:5;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);}
  #status{font-size:14px;letter-spacing:2px;color:var(--gold-hi);text-shadow:0 1px 3px #000;}
  #gain{font-size:46px;font-weight:800;line-height:1;color:var(--gold-hi);text-shadow:0 0 16px rgba(255,200,90,.7),0 2px 4px #000;transition:transform .1s;}
  #gain .max{font-size:20px;color:#cdb488;}
  #total{font-size:13px;color:#e7d3a6;text-shadow:0 1px 2px #000;}
  #gauge{width:200px;height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(232,194,90,.5);border-radius:4px;overflow:hidden;}
  #gauge>div{height:100%;width:0;background:linear-gradient(90deg,#ffb84d,#ffe28a);box-shadow:0 0 8px rgba(255,200,90,.8);transition:width .25s;}
  /* 中央ガイド（採取前の案内） */
  #guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;text-align:center;background:rgba(0,0,0,.55);border:1.5px solid rgba(232,194,90,.5);border-radius:14px;padding:18px 22px;max-width:78%;}
  #guide .t{font-size:18px;font-weight:800;margin-bottom:8px;color:var(--gold-hi);}
  #guide .d{font-size:12px;line-height:1.7;color:#e7d3a6;}
  #guide.detecting{border-color:var(--red);}
  #guide.hidden{display:none;}
  /* 採取中インジケータ */
  #live{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);z-index:5;font-size:15px;font-weight:800;letter-spacing:2px;padding:6px 20px;border-radius:20px;background:rgba(0,0,0,.6);border:1.5px solid rgba(232,194,90,.6);opacity:0;transition:opacity .3s;}
  #live.on{opacity:1;border-color:#3fe08a;color:#c8ffd8;text-shadow:0 0 10px rgba(80,255,140,.7);}
  /* 下部ボタン */
  #bottom{position:absolute;bottom:0;left:0;right:0;z-index:5;padding:16px;display:flex;justify-content:center;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);}
  #back{padding:12px 40px;font-family:inherit;font-size:16px;font-weight:800;color:var(--gold-hi);background:rgba(20,10,16,.85);border:1.5px solid rgba(232,194,90,.6);border-radius:12px;cursor:pointer;box-shadow:inset 0 0 12px rgba(255,200,90,.15);}
  #back:active{filter:brightness(1.1);}
  /* 完了オーバーレイ */
  #done{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,4,8,.82);text-align:center;}
  #done.show{display:flex;}
  #done .big{font-size:30px;font-weight:800;color:var(--gold-hi);text-shadow:0 0 18px rgba(255,200,90,.7);}
  #done .sub{font-size:15px;color:#e7d3a6;}
  #done .amt{font-size:40px;font-weight:800;color:#ffe28a;text-shadow:0 0 16px rgba(255,200,90,.8);}
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="cv-hidden"></canvas>
  <canvas id="fx"></canvas>

  <div id="top">
    <div id="status">チカリウム採取</div>
    <div id="gain"><span id="gain-num">0</span><span class="max"> / <span id="gain-max">300</span></span></div>
    <div id="gauge"><div id="gauge-fill"></div></div>
    <div id="total">所持 <span id="total-num">12,345</span></div>
  </div>

  <div id="guide">
    <div class="t">光の点滅にかざしてください</div>
    <div class="d">赤い光（一部に緑・黄）の点滅を画面に映すと<br>チカリウムが採取できます</div>
  </div>

  <div id="live">採取中</div>

  <div id="bottom">
    <button id="back" onclick="goBack()">ホームに戻る</button>
  </div>

  <div id="done">
    <div class="big">本日の採取完了</div>
    <div class="amt">+<span id="done-amt">0</span></div>
    <div class="sub">また0時にリセットされます</div>
    <button id="back" style="position:static;margin-top:8px" onclick="goBack()">ホームに戻る</button>
  </div>
</div>

<script>
// ===== 設定（設計書準拠）=====
const DAILY_MAX = 300;       // 日次上限
const PER_BLINK = 6;         // 1点滅あたり獲得チカリウム
const MS = 50;               // 20fpsサンプリング
// 不正対策の判定しきい（実測データから逆算。手パタパタ/カバー/MAXBETを完全に弾く）
const BR_MIN = 88;           // 花・葉の輝度下限（自発光ランプは明るい）
const LEAF_H_LO = 50, LEAF_H_HI = 155;  // 葉の色相帯（緑〜黄緑）
const DIFF_MIN = 20;         // 枠間色差の下限（花・葉・芯が別色＝本物。全枠同色の手/カバーを弾く）

// 永続値（本番はSupabase。ここではlocalStorageでモック）
let totalChikarium = parseInt(localStorage.getItem('ck_total') || '12345', 10);
let dailyGot = 0;            // セッション内採取（本番は当日累計をサーバ管理）
let sessionGain = 0;

// ===== 状態 =====
let side='L', stream=null, tid=null, fxRaf=null, running=false;
let prevBr=0, rising=false, lastSpawn=0;
let particles=[];

// 認識領域（v8確定座標・左ランプ。右は左右反転）
const REGIONS = {
  stamen:{x:0.570,y:0.107,w:0.219,h:0.280},
  petal: {x:0.202,y:0.203,w:0.534,h:0.635},
  leaf1: {x:0.144,y:0.595,w:0.260,h:0.280},
  leaf2: {x:0.641,y:0.439,w:0.185,h:0.281},
};

const video=document.getElementById('video');
const cvH=document.getElementById('cv-hidden');
const ctx2=cvH.getContext('2d',{willReadFrequently:true});
const fx=document.getElementById('fx');
const fxc=fx.getContext('2d');

function fmtNum(n){return n.toLocaleString();}
function refreshUI(){
  document.getElementById('gain-num').textContent = sessionGain;
  document.getElementById('gain-max').textContent = DAILY_MAX;
  document.getElementById('total-num').textContent = fmtNum(totalChikarium);
  const pct = Math.min(100, (dailyGot/DAILY_MAX)*100);
  document.getElementById('gauge-fill').style.width = pct+'%';
}

// ===== カメラ起動 =====
async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}});
    video.srcObject=stream; await video.play();
    cvH.width=320; cvH.height=240;
    fxResize();
    running=true;
    tid=setInterval(analyze, MS);
    fxLoop();
  }catch(e){
    document.querySelector('#guide .t').textContent='カメラを起動できません';
    document.querySelector('#guide .d').textContent=e.message;
  }
}
function stop(){
  running=false;
  if(tid)clearInterval(tid);
  if(fxRaf)cancelAnimationFrame(fxRaf);
  if(stream)stream.getTracks().forEach(t=>t.stop());
}
function goBack(){
  stop();
  // 本番はホーム画面へ遷移。ここではモック。
  location.href='./home-mockup.html';
}

// ===== サンプリング =====
function sampleR(img,W,H,rx,ry,rw,rh){
  const x0=Math.floor(rx*W),y0=Math.floor(ry*H),x1=Math.min(Math.floor((rx+rw)*W),W),y1=Math.min(Math.floor((ry+rh)*H),H);
  let r=0,g=0,b=0,n=0;
  for(let y=y0;y<y1;y+=3)for(let x=x0;x<x1;x+=3){const i=(y*W+x)*4;r+=img[i];g+=img[i+1];b+=img[i+2];n++;}
  if(!n)return{r:0,g:0,b:0,br:0};
  const R=r/n,G=g/n,B=b/n,br=(R+G+B)/3;
  const mx=Math.max(R,G,B),mn=Math.min(R,G,B),d=mx-mn;
  let h=0;
  if(d!==0){
    if(mx===R)h=((G-B)/d)%6;
    else if(mx===G)h=(B-R)/d+2;
    else h=(R-G)/d+4;
    h*=60;if(h<0)h+=360;
  }
  return{r:R,g:G,b:B,br,h};
}

// ===== エフェクト =====
function fxResize(){fx.width=fx.clientWidth;fx.height=fx.clientHeight;}
function spawnChikarium(){
  const W=fx.width,H=fx.height; if(!W||!H)return;
  const x=W*(0.15+Math.random()*0.70), y=H*(0.30+Math.random()*0.45);
  const ang=-Math.PI/2+(Math.random()-0.5)*1.4;
  const speed=H*(0.012+Math.random()*0.012);
  particles.push({x,y,vx:Math.cos(ang)*speed*(0.6+Math.random()*0.8),vy:Math.sin(ang)*speed,life:0,maxLife:60+Math.random()*30,size:H*(0.030+Math.random()*0.025),rot:Math.random()*6.28,vrot:(Math.random()-0.5)*0.3});
  if(particles.length>120)particles.splice(0,particles.length-120);
}
function updateFx(){
  const W=fx.width,H=fx.height; fxc.clearRect(0,0,W,H);
  const grav=H*0.0016;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life++; p.vy+=grav; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot;
    if(p.life>p.maxLife||p.y>H+p.size){particles.splice(i,1);continue;}
    const t=p.life/p.maxLife;
    const alpha=t<0.15?(t/0.15):(1-(t-0.15)/0.85);
    drawParticle(p,Math.max(0,Math.min(1,alpha)));
  }
}
function drawParticle(p,alpha){
  fxc.save();fxc.globalAlpha=alpha;fxc.translate(p.x,p.y);fxc.rotate(p.rot);
  const r=p.size/2;
  const g=fxc.createRadialGradient(0,0,0,0,0,r);
  g.addColorStop(0,'#fff7c0');g.addColorStop(0.4,'#ffd60a');g.addColorStop(1,'rgba(255,149,0,0)');
  fxc.fillStyle=g;fxc.beginPath();fxc.arc(0,0,r,0,6.28);fxc.fill();
  fxc.globalAlpha=alpha*0.9;fxc.strokeStyle='#fffbe6';fxc.lineWidth=Math.max(1,r*0.12);
  fxc.beginPath();fxc.moveTo(-r*0.9,0);fxc.lineTo(r*0.9,0);fxc.moveTo(0,-r*0.9);fxc.lineTo(0,r*0.9);fxc.stroke();
  fxc.restore();
}
function fxLoop(){updateFx();fxRaf=requestAnimationFrame(fxLoop);}

// ===== ピーク検出→採取（1点滅＝1粒＝PER_BLINKチカリウム）=====
function onPeak(){
  if(dailyGot>=DAILY_MAX)return;
  const add=Math.min(PER_BLINK, DAILY_MAX-dailyGot);
  dailyGot+=add; sessionGain+=add; totalChikarium+=add;
  localStorage.setItem('ck_total', String(totalChikarium));
  spawnChikarium();
  // 数字をはじく演出
  const g=document.getElementById('gain'); g.style.transform='scale(1.12)';
  setTimeout(()=>g.style.transform='scale(1)',90);
  refreshUI();
  if(dailyGot>=DAILY_MAX) finish();
}
function detectPeakAndSpawn(curBr,isHibiscus){
  if(isHibiscus){
    if(curBr>prevBr){rising=true;}
    else if(rising&&curBr<prevBr){rising=false;const now=Date.now();if(now-lastSpawn>80){onPeak();lastSpawn=now;}}
  }else{rising=false;}
  prevBr=curBr;
}

// ===== 解析 =====
function analyze(){
  if(!video.videoWidth)return;
  ctx2.drawImage(video,0,0,320,240);
  const img=ctx2.getImageData(0,0,320,240).data,W=320,H=240,rs=REGIONS;
  const P=sampleR(img,W,H,rs.petal.x,rs.petal.y,rs.petal.w,rs.petal.h);
  const L1=sampleR(img,W,H,rs.leaf1.x,rs.leaf1.y,rs.leaf1.w,rs.leaf1.h);
  const L2=sampleR(img,W,H,rs.leaf2.x,rs.leaf2.y,rs.leaf2.w,rs.leaf2.h);
  const S=sampleR(img,W,H,rs.stamen.x,rs.stamen.y,rs.stamen.w,rs.stamen.h);
  const L=(L1.br>=L2.br)?L1:L2;   // 明るい方の葉を採用

  // 枠間色差（花・葉・芯が互いに違う色か。手/カバーは全枠同色＝小さい）
  const colorDiff=(Math.abs(P.r-L.r)+Math.abs(P.g-L.g)+Math.abs(P.b-L.b)
                 +Math.abs(P.r-S.r)+Math.abs(P.g-S.g)+Math.abs(P.b-S.b)
                 +Math.abs(L.r-S.r)+Math.abs(L.g-S.g)+Math.abs(L.b-S.b))/9;

  // 実測逆算した判定（本物のハイビスカスランプにしか出ない見え方）。点滅速度は防御に使わない。
  // 花・葉が自発光で明るい AND 葉が緑〜黄緑色相 AND 枠ごとに色が違う
  // 検証: 本物25%通過 / 手0% カバー0% MAXBET0%
  const isHibiscus = P.br>BR_MIN && L.br>BR_MIN
                  && L.h>=LEAF_H_LO && L.h<=LEAF_H_HI
                  && colorDiff>DIFF_MIN;

  detectPeakAndSpawn(P.br, isHibiscus);

  // ガイド/採取中インジケータ（技術表示は出さない）
  const guide=document.getElementById('guide');
  const live=document.getElementById('live');
  if(isHibiscus){ guide.classList.add('hidden'); live.classList.add('on'); }
  else { if(dailyGot<DAILY_MAX) guide.classList.remove('hidden'); live.classList.remove('on'); }
}

// ===== 完了 =====
function finish(){
  document.getElementById('done-amt').textContent = sessionGain;
  document.getElementById('done').classList.add('show');
  document.getElementById('live').classList.remove('on');
  document.getElementById('guide').classList.add('hidden');
  stop();
}

// 認識枠を薄く表示（手応え用）
function drawGuideBoxes(){
  const app=document.getElementById('app');
  Object.values(REGIONS).forEach(r=>{
    const d=document.createElement('div');d.className='rbox';
    d.style.cssText=`left:${r.x*100}%;top:${r.y*100}%;width:${r.w*100}%;height:${r.h*100}%;`;
    app.appendChild(d);
  });
}

window.addEventListener('load',()=>{ refreshUI(); drawGuideBoxes(); start(); });
window.addEventListener('resize',fxResize);
</script>
</body>
</html>
