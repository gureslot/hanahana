<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受付開始位置確認</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icon_32x32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent:  #ff2a6d;
  --bg:      #080808;
  --border:  #1e1e1e;
  --text:    #e0dbd5;
  --muted:   #5e5e5e;
  --serif:   'Noto Serif JP', 'YuMincho', '游明朝', serif;
  --sans:    'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;

  --cell-h:   33px;
  --cell-w:   66px;
  --gap:       2px;
  --label-w: 116px;   /* リールの右に空ける、注記のための余白 */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
}

/* ─── head ─── */
.head {
  max-width: 760px;
  margin: 32px auto 22px;
  padding: 0 24px;
}

.page-title {
  font-family: var(--serif);
  font-size: clamp(24px, 5vw, 32px);
  font-weight: 700;
  letter-spacing: 4px;
  text-align: center;
  margin-bottom: 12px;
}

.intro {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.9;
}

/* ─── stage ───
   リールと右の注記をまとめた幅をステージとし、それを画面の中央に置く。
   リールの左には何も置かないので、リール自体は中央よりやや左になる。 */
.stage-outer {
  padding: 0 20px;
}

.stage {
  position: relative;
  width: calc(var(--cell-w) * 3 + var(--gap) * 2 + var(--label-w));
  max-width: 100%;
  margin: 0 auto;
}

.reel-wrapper {
  position: relative;
  display: flex;
  gap: var(--gap);
  justify-content: center;
  margin: 0;
  width: calc(var(--cell-w) * 3 + var(--gap) * 2);
  height: calc(var(--cell-h) * 21);
}

.reel {
  width: var(--cell-w);
  height: calc(var(--cell-h) * 21);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  cursor: grab;
}
.reel:active { cursor: grabbing; }

.track { will-change: transform; }

.track img {
  display: block;
  width: var(--cell-w);
  height: var(--cell-h);
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* ─── リール窓 ─── */

/* 窓の枠線。図柄は白背景、周囲は黒背景なので、濃い芯を白で縁取って
   どちらの上でも見えるようにしてある。
   コマの境界が線の中心に来るよう top を3px上げる。 */
.win-line {
  position: absolute;
  left: -10px;
  right: -10px;
  height: 6px;
  background: #101010;
  border-top: 1px solid #f2efe9;
  border-bottom: 1px solid #f2efe9;
  z-index: 3;
  pointer-events: none;
}
.win-line--top    { top: calc(var(--cell-h) * 17 - 3px); }
.win-line--bottom { top: calc(var(--cell-h) * 20 - 3px); }

/* 窓の3段ぶんの範囲を示す囲み。リールの右側に置く */
.win-range {
  position: absolute;
  left: 100%;
  margin-left: 18px;
  top: calc(var(--cell-h) * 17 - 1px);
  height: calc(var(--cell-h) * 3 + 2px);
  width: 9px;
  border: 2px solid var(--text);
  border-left: 0;
  z-index: 3;
  pointer-events: none;
}

.win-range-label {
  position: absolute;
  left: 100%;
  top: 50%;
  transform: translateY(-50%);
  margin-left: 8px;
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--text);
  white-space: nowrap;
}

/* ─── 受付開始ライン ───
   左はリールの22px外まで、右はリールの12px外まで伸ばし、その先の
   余白（--label-w）にラベルを置く。ラベルはリールに被らない。
   D=3 のとき窓の上ラインと同じ高さに来るが、はみ出しぶんで見分けられる。 */
.accept {
  position: absolute;
  left: -22px;
  right: calc(var(--label-w) - 12px);
  height: 4px;
  background: var(--accent);
  z-index: 4;
  pointer-events: none;
}

.accept-label {
  position: absolute;
  left: 100%;
  top: 50%;
  transform: translateY(-50%);
  margin-left: 8px;
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--accent);
  white-space: nowrap;
}

/* ─── nav ─── */
.site-nav {
  border-top: 1px solid var(--border);
  margin-top: 40px;
  padding: 30px 24px 34px;
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}
.site-nav a {
  display: inline-block;
  padding: 12px 30px;
  border: 2px solid var(--accent);
  color: var(--text);
  text-decoration: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  transition: background 0.18s, color 0.18s;
}
.site-nav a:hover {
  background: var(--accent);
  color: #fff;
}

/* ─── footer ─── */
footer {
  border-top: 1px solid var(--border);
  padding: 26px 24px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.1em;
  font-family: var(--serif);
}

@media (max-width: 480px) {
  .head { margin-top: 24px; margin-bottom: 18px; padding: 0 16px; }
  .stage-outer { padding: 0 14px; }
}
</style>
</head>

<body>

<div class="head">
  <h1 class="page-title">受付開始位置確認</h1>
  <p class="intro">
    ドラッグして出目を合わせると、ストップボタンの受付が始まる位置にラインが引かれます。
  </p>
</div>

<div class="stage-outer">
  <div class="stage">

    <div class="reel-wrapper" id="reelWrapper">
      <div class="reel" data-reel="left"></div>
      <div class="reel" data-reel="middle"></div>
      <div class="reel" data-reel="right"></div>
      <div class="win-line win-line--top"></div>
      <div class="win-line win-line--bottom"></div>
      <div class="win-range"><span class="win-range-label">リール窓</span></div>
    </div>

    <div class="accept" id="acceptLine">
      <span class="accept-label">受付開始ライン</span>
    </div>

  </div>
</div>

<nav class="site-nav">
  <a href="../index.html">index</a>
  <a href="../hanahana.html">ハナハナ関連</a>
</nav>

<footer>
  ©PIONEER CO.,LTD.
</footer>

<script>
/* ============================================================
   リール配列（quiz/reels.json と同じ。index0 が1番、
   番号のプラス方向に回転し21番の次は1番）
   ============================================================ */
var REELS = {
  left: ['hibiscus','cherry','whiteBAR','replay','bell','suika','white7',
         'suika','replay','bell','hibiscus','cherry','pinkBAR','replay',
         'bell','suika','replay','bell','pink7','replay','bell'],
  middle: ['replay','cherry','bell','hana','replay','hana','bell','replay',
           'suika','white7','cherry','bell','replay','hana','bell','hana',
           'suika','replay','pink7','bell','suika'],
  right: ['bell','replay','cherry','suika','bell','replay','cherry','suika',
          'bell','replay','white7','whiteBAR','bell','replay','cherry',
          'suika','bell','replay','pink7','cherry','pinkBAR']
};

var CELLS = 21;
var IMG_DIR = '../quiz/images/';

/* 画面の行割り当て（上から r = 0〜20）
     r 0〜16 … 窓の上
     r 17    … 上段
     r 18    … 中段（＝出目 S）
     r 19    … 下段
     r 20    … 枠下
   窓の上ライン … r16 と r17 の境界（＝上から17コマ）
   窓の下ライン … r19 と r20 の境界（＝上から20コマ）              */
var ROW_MID = 18;
var LINE_BOTTOM_ROW = 20;

/* ---------- 数値ユーティリティ ---------- */

function mod(n, m) {
  return ((n % m) + m) % m;
}

function mod21(n) {
  return mod(n, 21);
}

function wrapNum(n) {
  return mod21(n - 1) + 1;
}

/* トラックは上から 21,20,…,1 の順。offset を cell 数で表したとき、
   画面 r 行目のコマ番号は wrapNum(21 − (r + cell))。
   中段（r=18）は wrapNum(3 − cell)。 */
function stopNumFromCell(cell) {
  return wrapNum(21 - ROW_MID - cell);
}

/* 次の基準点（10番・21番）までのコマ数 */
function distToAnchor(S) {
  return Math.min(mod21(10 - S), mod21(21 - S));
}

/* 始動から受付開始までの進行コマ数。K = 3。3リール共通 */
function acceptAdvance(sLeft, sMiddle, sRight) {
  return Math.max(distToAnchor(sLeft), distToAnchor(sMiddle), distToAnchor(sRight)) + 3;
}

/* ---------- サイズ ---------- */

var GAP = 2;
var LABEL_W = 116;
var STAGE_MAX = 560;
var CELL_MAX = 60;
var CELL_MIN = 24;
var cellH = 33;

function measureCellH() {
  var outer = document.querySelector('.stage-outer');

  var availW = 360;
  if (outer) {
    var cs = window.getComputedStyle(outer);
    availW = outer.clientWidth
           - (parseFloat(cs.paddingLeft) || 0)
           - (parseFloat(cs.paddingRight) || 0);
  }
  if (!(availW > 0)) availW = 360;
  availW = Math.min(availW, STAGE_MAX);

  /* 縦は「リールのてっぺんから下まで」が画面に収まればよい。
     見出しや下のボタンは画面外に出てかまわない。 */
  var availH = (window.innerHeight || 768) - 8;

  var byW = Math.floor((availW - LABEL_W - GAP * 2) / 6);
  var byH = Math.floor(availH / CELLS);

  var h = Math.min(CELL_MAX, byW, byH);
  if (!isFinite(h) || h < CELL_MIN) h = CELL_MIN;
  return h;
}

function applyCellH(h) {
  cellH = h;
  var root = document.documentElement;
  root.style.setProperty('--cell-h', h + 'px');
  root.style.setProperty('--cell-w', (h * 2) + 'px');
}

/* ---------- リール ---------- */

var reels = [];

function buildReel(el) {
  var name = el.dataset.reel;
  var arr = REELS[name];

  var track = document.createElement('div');
  track.className = 'track';

  /* 21コマを2周ぶん積む。上から 21,20,…,1,21,20,…,1 */
  for (var i = 0; i < CELLS * 2; i++) {
    var num = wrapNum(21 - i);
    var img = document.createElement('img');
    img.src = IMG_DIR + arr[num - 1] + '.png';
    img.alt = '';
    img.draggable = false;
    track.appendChild(img);
  }

  el.appendChild(track);

  var r = { el: el, track: track, cell: 0, offset: 0, dragging: false, startY: 0, live: 0 };

  function apply(px) {
    r.offset = px;
    track.style.transform = 'translateY(' + (-px) + 'px)';
  }
  r.apply = apply;

  el.addEventListener('pointerdown', function (e) {
    r.dragging = true;
    r.startY = e.clientY;
    r.live = r.cell * cellH;
    if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
  });

  el.addEventListener('pointermove', function (e) {
    if (!r.dragging) return;
    var dy = e.clientY - r.startY;
    var raw = r.cell * cellH + (-dy);
    r.live = mod(raw, cellH * CELLS);
    apply(r.live);
    updateAcceptLine();
  });

  function endDrag() {
    if (!r.dragging) return;
    r.dragging = false;
    r.cell = mod(Math.round(r.live / cellH), CELLS);
    apply(r.cell * cellH);
    updateAcceptLine();
  }

  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);

  apply(0);
  return r;
}

/* ---------- 受付開始ライン ---------- */

function currentStops() {
  return reels.map(function (r) {
    var c = mod(Math.round(r.offset / cellH), CELLS);
    return stopNumFromCell(c);
  });
}

function updateAcceptLine() {
  var S = currentStops();
  var D = acceptAdvance(S[0], S[1], S[2]);
  var line = document.getElementById('acceptLine');
  // ラインの太さ4px。コマの境界が線の中心に来るよう2px上げる
  if (line) line.style.top = ((LINE_BOTTOM_ROW - D) * cellH - 2) + 'px';
}

/* ---------- 初期化 ---------- */

function layout() {
  applyCellH(measureCellH());
  reels.forEach(function (r) { r.apply(r.cell * cellH); });
  updateAcceptLine();
}

/* iOS Safari は上下バーの出し入れだけで resize が飛び、そのたびに
   リールの大きさが変わると鬱陶しい。幅が変わったときと、高さが
   大きく変わったとき（回転など）だけ組み直す。 */
var lastW = 0, lastH = 0;

function relayout(force) {
  var w = window.innerWidth || 0;
  var h = window.innerHeight || 0;
  if (!force && w === lastW && Math.abs(h - lastH) < 100) return;
  lastW = w;
  lastH = h;
  layout();
}

applyCellH(measureCellH());

var els = document.querySelectorAll('.reel');
for (var i = 0; i < els.length; i++) {
  reels.push(buildReel(els[i]));
}

relayout(true);

window.addEventListener('resize', function () { relayout(false); });
window.addEventListener('orientationchange', function () {
  setTimeout(function () { relayout(true); }, 200);
});
if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
  document.fonts.ready.then(function () { relayout(true); });
}
</script>

</body>
</html>
