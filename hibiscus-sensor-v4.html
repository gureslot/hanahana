<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ハイビスカスランプ 認識テスト v4</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  :root {
    --red:#ff2d55;--orange:#ff9500;--yellow:#ffd60a;
    --green:#32d74b;--blue:#0af;--dark:#0a0a0f;
    --panel:#13131e;--border:#2a2a3a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--dark);color:#eee;font-family:'Share Tech Mono',monospace;}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;padding:4px;gap:3px;}

  /* カメラ */
  #camera-wrap{position:relative;width:100%;flex:0 0 40%;background:#000;border-radius:8px;overflow:hidden;}
  #video{width:100%;height:100%;object-fit:cover;display:block;}
  #canvas-hidden{display:none;}

  /* 領域ボックス */
  .rbox{
    position:absolute;border:2px solid rgba(255,255,255,0.4);
    border-radius:3px;touch-action:none;cursor:move;
    display:flex;align-items:flex-start;justify-content:flex-end;
    padding:2px 3px;font-size:.45rem;user-select:none;
  }
  .rbox.dragging{opacity:.8;border-width:2px;}
  .resize-handle{
    position:absolute;bottom:0;right:0;width:14px;height:14px;
    cursor:se-resize;background:rgba(255,255,255,0.3);
    border-radius:2px 0 3px 0;
  }

  /* 中段 */
  #mid{flex:0 0 auto;display:flex;flex-direction:column;gap:3px;}
  #side-row{display:flex;gap:4px;}
  .side-btn{flex:1;padding:5px 0;border:1.5px solid var(--border);border-radius:6px;background:var(--panel);color:#666;font-family:'Share Tech Mono',monospace;font-size:.7rem;cursor:pointer;text-align:center;line-height:1.4;}
  .side-btn.active{border-color:var(--red);color:var(--red);}
  #ctrl-row{display:flex;gap:4px;}
  .cbtn{flex:1;padding:7px 0;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:#eee;font-family:'Share Tech Mono',monospace;font-size:.65rem;cursor:pointer;}
  .cbtn.primary{border-color:var(--red);color:var(--red);}
  .cbtn.warn{border-color:var(--orange);color:var(--orange);}
  .cbtn.danger{border-color:#ff3b30;color:#ff3b30;}

  /* 判定 */
  #result-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
  #result-pattern{font-size:.95rem;flex:1;}
  #result-hz{font-size:.7rem;color:var(--red);white-space:nowrap;}

  /* メーター */
  #meters-row{display:flex;gap:4px;}
  .meter{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 5px;display:flex;align-items:center;gap:4px;}
  .meter-label{font-size:.5rem;color:#666;white-space:nowrap;}
  .meter-val{font-size:.8rem;font-weight:bold;}
  .mbar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
  .mbar-fill{height:100%;border-radius:2px;transition:width .1s;}

  /* 座標表示パネル */
  #coord-panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 8px;display:none;}
  #coord-panel.show{display:block;}
  #coord-title{font-size:.55rem;color:#666;margin-bottom:3px;}
  #coord-text{font-size:.55rem;color:var(--yellow);line-height:1.8;word-break:break-all;}

  /* グラフ */
  #bottom{flex:1;display:flex;flex-direction:column;gap:3px;min-height:0;}
  .glabel{font-size:.5rem;color:#555;margin-bottom:2px;}
  canvas.graph{width:100%;height:55px;background:var(--panel);border:1px solid var(--border);border-radius:6px;display:block;}
  #log-box{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 7px;overflow-y:auto;font-size:.58rem;color:#555;line-height:1.7;min-height:0;}
  .ld{color:var(--green);}.lw{color:var(--orange);}.ls{color:var(--yellow);}
</style>
</head>
<body>
<div id="app">
  <div id="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas-hidden"></canvas>
  </div>
  <div id="mid">
    <div id="side-row">
      <div class="side-btn active" id="btn-L" onclick="setSide('L')">◀ 左ランプ<br><span style="font-size:.5rem;color:#555">めしべ:右上</span></div>
      <div class="side-btn" id="btn-R" onclick="setSide('R')">右ランプ ▶<br><span style="font-size:.5rem;color:#555">めしべ:左上</span></div>
    </div>
    <div id="ctrl-row">
      <button class="cbtn primary" id="btn-cam" onclick="toggleCam()">▶ 開始</button>
      <button class="cbtn warn" onclick="toggleCoord()">座標表示</button>
      <button class="cbtn warn" onclick="resetRegions()">座標リセット</button>
      <button class="cbtn danger" onclick="clearAll()">消去</button>
    </div>
    <div id="result-box">
      <div id="result-pattern" style="color:#555">待機中...</div>
      <div id="result-hz">-- Hz</div>
    </div>
    <div id="meters-row">
      <div class="meter"><span class="meter-label">花</span><span class="meter-val" id="mv-p" style="color:var(--red)">--</span><div class="mbar"><div class="mbar-fill" id="mb-p" style="width:0%;background:var(--red)"></div></div></div>
      <div class="meter"><span class="meter-label">葉</span><span class="meter-val" id="mv-l" style="color:var(--green)">--</span><div class="mbar"><div class="mbar-fill" id="mb-l" style="width:0%;background:var(--green)"></div></div></div>
      <div class="meter"><span class="meter-label">芯</span><span class="meter-val" id="mv-s" style="color:var(--yellow)">--</span><div class="mbar"><div class="mbar-fill" id="mb-s" style="width:0%;background:var(--yellow)"></div></div></div>
      <div class="meter"><span class="meter-label">青%</span><span class="meter-val" id="mv-b" style="color:var(--blue)">--</span><div class="mbar"><div class="mbar-fill" id="mb-b" style="width:0%;background:var(--blue)"></div></div></div>
    </div>
    <div id="coord-panel">
      <div id="coord-title">▌ 現在の座標（私に共有してください）</div>
      <div id="coord-text">-</div>
    </div>
  </div>
  <div id="bottom">
    <div>
      <div class="glabel">輝度波形（花:赤 葉:緑 芯:黄）</div>
      <canvas class="graph" id="gc"></canvas>
    </div>
    <div id="log-box"></div>
  </div>
</div>
<script>
const BUF=300, MS=50;
let side='L', stream=null, tid=null, running=false;
let bP=[],bL=[],bS=[],bA=[],bT=[];

// デフォルト座標
const DEFAULT_REGIONS = {
  L:{
    stamen:{x:.58,y:.02,w:.38,h:.28,c:'#ffd60a',n:'芯'},
    petal: {x:.05,y:.18,w:.68,h:.50,c:'#ff2d55',n:'花'},
    leaf1: {x:.02,y:.63,w:.26,h:.28,c:'#32d74b',n:'葉左'},
    leaf2: {x:.70,y:.58,w:.26,h:.28,c:'#32d74b',n:'葉右'},
  },
  R:{
    stamen:{x:.04,y:.02,w:.38,h:.28,c:'#ffd60a',n:'芯'},
    petal: {x:.27,y:.18,w:.68,h:.50,c:'#ff2d55',n:'花'},
    leaf1: {x:.02,y:.63,w:.26,h:.28,c:'#32d74b',n:'葉左'},
    leaf2: {x:.70,y:.58,w:.26,h:.28,c:'#32d74b',n:'葉右'},
  }
};

// 座標をlocalStorageから読み込み
function loadRegions(){
  try{
    const s=localStorage.getItem('hibiscus_regions');
    if(s) return JSON.parse(s);
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_REGIONS));
}
function saveRegions(){
  localStorage.setItem('hibiscus_regions', JSON.stringify(regions));
}
function resetRegions(){
  regions = JSON.parse(JSON.stringify(DEFAULT_REGIONS));
  saveRegions();
  drawBoxes();
  updateCoordText();
  log('座標をリセットしました');
}

let regions = loadRegions();

const video=document.getElementById('video');
const cvH=document.getElementById('canvas-hidden');
const ctx2=cvH.getContext('2d',{willReadFrequently:true});

// ===== 領域ボックス描画＋ドラッグ =====
function drawBoxes(){
  const wrap=document.getElementById('camera-wrap');
  [...wrap.querySelectorAll('.rbox')].forEach(e=>e.remove());
  const rs=regions[side];
  Object.entries(rs).forEach(([key,r])=>{
    const div=document.createElement('div');
    div.className='rbox';
    div.id='rbox-'+key;
    div.style.cssText=`left:${r.x*100}%;top:${r.y*100}%;width:${r.w*100}%;height:${r.h*100}%;border-color:${r.c}88;color:${r.c};`;
    div.textContent=r.n;
    // リサイズハンドル
    const handle=document.createElement('div');
    handle.className='resize-handle';
    div.appendChild(handle);
    // ドラッグ（移動）
    makeDraggable(div, key, handle);
    wrap.appendChild(div);
  });
}

function makeDraggable(el, key, handle){
  const wrap=document.getElementById('camera-wrap');
  let dragging=false, resizing=false;
  let startX,startY,startL,startT,startW,startH;

  function getPos(e){
    const t=e.touches?e.touches[0]:e;
    return{x:t.clientX,y:t.clientY};
  }

  // 移動
  el.addEventListener('pointerdown',e=>{
    if(e.target===handle)return;
    e.preventDefault();
    dragging=true;
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
    const p=getPos(e);
    startX=p.x; startY=p.y;
    const r=regions[side][key];
    startL=r.x; startT=r.y;
  });
  el.addEventListener('pointermove',e=>{
    if(!dragging)return;
    e.preventDefault();
    const p=getPos(e);
    const W=wrap.offsetWidth, H=wrap.offsetHeight;
    const dx=(p.x-startX)/W, dy=(p.y-startY)/H;
    const r=regions[side][key];
    r.x=Math.max(0,Math.min(1-r.w, startL+dx));
    r.y=Math.max(0,Math.min(1-r.h, startT+dy));
    el.style.left=(r.x*100)+'%';
    el.style.top=(r.y*100)+'%';
    updateCoordText();
  });
  el.addEventListener('pointerup',e=>{
    if(!dragging)return;
    dragging=false;
    el.classList.remove('dragging');
    saveRegions();
    updateCoordText();
  });

  // リサイズ
  handle.addEventListener('pointerdown',e=>{
    e.preventDefault();
    e.stopPropagation();
    resizing=true;
    handle.setPointerCapture(e.pointerId);
    const p=getPos(e);
    startX=p.x; startY=p.y;
    const r=regions[side][key];
    startW=r.w; startH=r.h;
  });
  handle.addEventListener('pointermove',e=>{
    if(!resizing)return;
    e.preventDefault();
    const p=getPos(e);
    const W=wrap.offsetWidth, H=wrap.offsetHeight;
    const dw=(p.x-startX)/W, dh=(p.y-startY)/H;
    const r=regions[side][key];
    r.w=Math.max(0.05,Math.min(1-r.x, startW+dw));
    r.h=Math.max(0.05,Math.min(1-r.y, startH+dh));
    el.style.width=(r.w*100)+'%';
    el.style.height=(r.h*100)+'%';
    updateCoordText();
  });
  handle.addEventListener('pointerup',e=>{
    if(!resizing)return;
    resizing=false;
    saveRegions();
    updateCoordText();
  });
}

function updateCoordText(){
  const rs=regions[side];
  let lines=[];
  Object.entries(rs).forEach(([k,r])=>{
    lines.push(`${r.n}: x=${r.x.toFixed(3)} y=${r.y.toFixed(3)} w=${r.w.toFixed(3)} h=${r.h.toFixed(3)}`);
  });
  document.getElementById('coord-text').textContent=lines.join('\n');
}

let coordVisible=false;
function toggleCoord(){
  coordVisible=!coordVisible;
  document.getElementById('coord-panel').className=coordVisible?'coord-panel show':'coord-panel';
  if(coordVisible) updateCoordText();
}

// ===== 左右切替 =====
function setSide(s){
  side=s;
  document.getElementById('btn-L').className='side-btn'+(s==='L'?' active':'');
  document.getElementById('btn-R').className='side-btn'+(s==='R'?' active':'');
  drawBoxes();
  updateCoordText();
}

// ===== カメラ =====
async function toggleCam(){
  if(running){stopCam();return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}}});
    video.srcObject=stream; await video.play();
    cvH.width=320; cvH.height=240;
    initG(); drawBoxes();
    running=true;
    document.getElementById('btn-cam').textContent='⏹ 停止';
    tid=setInterval(analyze,MS);
    log('開始','d');
  }catch(e){log('エラー:'+e.message,'w');}
}
function stopCam(){
  clearInterval(tid);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  running=false;
  document.getElementById('btn-cam').textContent='▶ 開始';
}

// ===== サンプリング =====
function sampleR(img,W,H,rx,ry,rw,rh){
  const x0=Math.floor(rx*W),y0=Math.floor(ry*H);
  const x1=Math.min(Math.floor((rx+rw)*W),W),y1=Math.min(Math.floor((ry+rh)*H),H);
  let rs=0,gs=0,bs=0,n=0;
  for(let y=y0;y<y1;y+=3)for(let x=x0;x<x1;x+=3){
    const i=(y*W+x)*4;rs+=img[i];gs+=img[i+1];bs+=img[i+2];n++;
  }
  if(!n)return{r:0,g:0,b:0,br:0};
  const r=rs/n,g=gs/n,b=bs/n;
  return{r,g,b,br:(r+g+b)/3};
}

function avg(a){return a.length?a.reduce((s,v)=>s+v,0)/a.length:0;}
function vari(a){if(a.length<2)return 0;const m=avg(a);return a.reduce((s,v)=>s+(v-m)**2,0)/a.length;}
function estHz(buf,times){
  if(buf.length<10)return 0;
  const m=avg(buf);let cr=0,ls=buf[0]>m?1:-1;
  for(let i=1;i<buf.length;i++){const s=buf[i]>m?1:-1;if(s!==ls){cr++;ls=s;}}
  const d=(times[times.length-1]-times[0])/1000;
  return d<0.5?0:+((cr/2)/d).toFixed(2);
}

// ===== 分析 =====
function analyze(){
  if(!video.videoWidth)return;
  ctx2.drawImage(video,0,0,320,240);
  const img=ctx2.getImageData(0,0,320,240).data;
  const W=320,H=240,rs=regions[side];

  const P=sampleR(img,W,H,rs.petal.x,rs.petal.y,rs.petal.w,rs.petal.h);
  const L1=sampleR(img,W,H,rs.leaf1.x,rs.leaf1.y,rs.leaf1.w,rs.leaf1.h);
  const L2=sampleR(img,W,H,rs.leaf2.x,rs.leaf2.y,rs.leaf2.w,rs.leaf2.h);
  const S=sampleR(img,W,H,rs.stamen.x,rs.stamen.y,rs.stamen.w,rs.stamen.h);

  const lAvg=(L1.br+L2.br)/2;
  const lG=(L1.g+L2.g)/2;
  const lR=(L1.r+L2.r)/2;
  const all=(P.br+lAvg+S.br)/3;
  const now=Date.now();

  bP.push(P.br);bL.push(lAvg);bS.push(S.br);bA.push(all);bT.push(now);
  [bP,bL,bS,bA,bT].forEach(b=>{if(b.length>BUF)b.shift();});

  const hz=estHz(bA,bT);
  const va=vari(bA);
  const isBlinking=va>30;
  const avgAll=avg(bA);
  const isStatic=va<10&&avgAll>50;

  // 青成分
  const bRatio=(L1.br>5)?((L1.b/(L1.r+L1.g+L1.b+.001))*100):0;

  // ハナハナ判定条件
  // 花びら（赤）、葉（緑）、芯（黄）が同時に存在するか
  const hasPetal = P.r > 40 && P.r > P.b * 1.5;  // 赤成分あり
  const hasLeaf  = lG > 30 && lG > lR * 1.1;      // 緑成分あり
  const hasStamen= S.r > 30 && S.g > 30 && S.b < S.g * 0.8; // 黄成分あり
  const isHibiscus = hasPetal && (hasLeaf || hasStamen); // 花びら必須＋葉か芯どちらか

  // 速度ラベル
  const f=hz;
  let speedLabel='';
  if(f>0){
    if(f<0.3)speedLabel='超低速';
    else if(f<1.5)speedLabel='低速';
    else if(f<4)speedLabel='中速';
    else if(f<8)speedLabel='通常速';
    else speedLabel='高速';
  }

  // パターン判定
  let pat='判定中...', col='#555';
  if(isBlinking){
    if(!isHibiscus){
      pat='⚠️ ハナハナランプ外'; col='#ff3b30';
    } else {
      pat='🌺 点滅検出'+(speedLabel?' ['+speedLabel+']':'');
      col='var(--green)';
    }
    logThrottle(pat, isHibiscus?'d':'w');
  } else if(isStatic){
    pat='💡 点灯中'; col='var(--orange)';
    logThrottle(pat,'w');
  } else {
    pat='消灯 / 待機'; col='#555';
  }

  // ハナハナ判定インジケーター更新
  document.getElementById('result-pattern').textContent=pat;
  document.getElementById('result-pattern').style.color=col;
  document.getElementById('result-hz').textContent=(hz||'--')+' Hz'+(speedLabel?' ['+speedLabel+']':'');

  // メーター
  ['p','l','s'].forEach((k,i)=>{
    const v=[P.br,lAvg,S.br][i];
    document.getElementById('mv-'+k).textContent=Math.round(v);
    document.getElementById('mb-'+k).style.width=(v/255*100)+'%';
  });
  document.getElementById('mv-b').textContent=Math.round(bRatio)+'%';
  document.getElementById('mb-b').style.width=Math.min(bRatio,100)+'%';

  drawG();
}

// ===== グラフ =====
const gc=document.getElementById('gc');
const gctx=gc.getContext('2d');
function initG(){
  gc.width=gc.offsetWidth*(window.devicePixelRatio||1);
  gc.height=gc.offsetHeight*(window.devicePixelRatio||1);
}
function drawG(){
  const W=gc.width,H=gc.height;
  gctx.fillStyle='#13131e';gctx.fillRect(0,0,W,H);
  [[bP,'rgba(255,45,85,.8)'],[bL,'rgba(50,215,75,.8)'],[bS,'rgba(255,214,10,.8)']].forEach(([buf,c])=>{
    if(buf.length<2)return;
    gctx.strokeStyle=c;gctx.lineWidth=1.5;gctx.beginPath();
    buf.forEach((v,i)=>{const x=(i/(BUF-1))*W,y=H-(v/255)*H;i===0?gctx.moveTo(x,y):gctx.lineTo(x,y);});
    gctx.stroke();
  });
}

// ===== ログ =====
let lastMsg='',lastT=0;
function logThrottle(m,t){const n=Date.now();if(m===lastMsg&&n-lastT<2000)return;lastMsg=m;lastT=n;log(m,t);}
function log(msg,type=''){
  const b=document.getElementById('log-box');
  const t=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const d=document.createElement('div');
  d.className='l'+(type||'');
  d.textContent=t+' '+msg;
  b.appendChild(d);b.scrollTop=b.scrollHeight;
  if(b.children.length>60)b.removeChild(b.firstChild);
}
function clearAll(){
  document.getElementById('log-box').innerHTML='';
  bP=[];bL=[];bS=[];bA=[];bT=[];
}

window.addEventListener('resize',()=>{initG();drawBoxes();});
window.addEventListener('load',()=>{drawBoxes();updateCoordText();});
</script>
</body>
</html>
