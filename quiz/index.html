<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハナハナ最速目押しクイズ（判定確認用）</title>
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<main>
  <section id="titleScreen" class="title-screen">
    <div class="title-logos">
      <img src="images/title1.png" alt="ハナハナ" class="title-logo1">
      <img src="images/title2.png" alt="最速目押しクイズ" class="title-logo2">
    </div>

    <div class="title-select-group">
      <div class="title-diff-buttons" id="titleDiffButtons">
        <button type="button" class="title-diff-btn" data-diff="beginner"><img src="images/syo.png" alt="初心者"></button>
        <button type="button" class="title-diff-btn" data-diff="easy"><img src="images/yasa.png" alt="易"></button>
        <button type="button" class="title-diff-btn" data-diff="normal"><img src="images/nami.png" alt="並"></button>
        <button type="button" class="title-diff-btn" data-diff="hard"><img src="images/kiwami.png" alt="極"></button>
      </div>
      <div class="title-time-buttons" id="titleTimeButtons">
        <button type="button" class="title-time-btn" data-time="30"><img src="images/30.png" alt="30秒"></button>
        <button type="button" class="title-time-btn" data-time="60"><img src="images/60.png" alt="60秒"></button>
      </div>
    </div>

    <button type="button" id="titleStartBtn" class="title-start-btn"><img src="images/start.png" alt="スタート"></button>
  </section>

  <div id="appScreen" hidden>
  <div id="timerDisplay" class="timer-display" hidden>
    <div class="timer-clock">
      <span class="timer-spacer" aria-hidden="true"></span><span id="timerSec" class="timer-ss">00</span><span class="timer-cc-wrap">:<span id="timerCenti">00</span></span>
    </div>
    <p class="timer-prompt">この出目から最速で揃えられる7の形はどれ？</p>
    <div class="timer-counts">
      <span class="count-correct">正解 <span id="correctCountValue">0</span></span>
      <span class="count-wrong">誤答 <span id="wrongCountValue">0</span></span>
    </div>
  </div>

  <audio id="bgmAudio" src="sounds/quizBGM.mp3" preload="auto"></audio>

  <section class="stage-wrap">
    <div id="stage"></div>
  </section>

  <section class="choices-wrap">
    <div id="choices" class="choices-grid"></div>
  </section>

  <p id="resultMessage" class="result-message" aria-live="polite"></p>

  <div id="gameControls" class="game-controls" hidden>
    <button type="button" id="abortBtn" class="abort-btn">中断</button>
  </div>

  <section id="resultScreen" class="result-screen" hidden>
    <div class="result-titles">
      <img src="images/title1.png" alt="ハナハナ" class="result-title1">
      <img src="images/title2.png" alt="最速目押しクイズ" class="result-title2">
    </div>
    <div class="result-score-wrap">
      <img src="images/scoredaiza.png" alt="" class="result-score-daiza">
      <span id="resultScore" class="result-score-value">0</span>
    </div>
    <div class="result-stats-row">
      <button type="button" id="reviewBtn" class="result-side-btn review-entry-btn">答え合わせ</button>
      <div class="result-stats">
        <p class="result-detail">正解 <span id="resultCorrect">0</span>　誤答 <span id="resultWrong">0</span></p>
        <p class="result-meta"><span id="resultDiffLabel">-</span>／<span id="resultTimeLabel">-</span>秒</p>
      </div>
      <button type="button" id="shareBtn" class="result-side-btn share-btn">Xでシェア</button>
    </div>
    <button type="button" id="saveImageBtn" class="save-image-btn">画像を保存</button>

    <p id="rankCheckNote" class="rank-check-note" hidden></p>
    <div id="rankEntry" class="rank-entry" hidden>
      <p class="rank-entry-label">ランクイン！ランキングに登録できます</p>
      <div class="rank-entry-row">
        <input type="text" id="rankNameInput" class="rank-name-input" maxlength="12" placeholder="名前（1〜12文字）">
        <button type="button" id="rankSubmitBtn" class="rank-submit-btn">登録</button>
      </div>
      <p id="rankEntryStatus" class="rank-entry-status"></p>
    </div>
    <button type="button" id="viewRankingBtn" class="view-ranking-btn">ランキングを見る</button>

    <div class="result-buttons">
      <button type="button" id="retryBtn" class="retry-btn"><img src="images/retry.png" alt="もう一度"></button>
      <button type="button" id="backToTitleBtn" class="back-title-btn"><img src="images/title.png" alt="タイトルへ戻る"></button>
    </div>
  </section>

  <section id="reviewScreen" class="review-screen" hidden>
    <p class="review-position"><span id="reviewIndexLabel">1</span>問目 / 全<span id="reviewTotalLabel">0</span>問</p>
    <div class="review-stage-wrap">
      <div id="reviewStage"></div>
    </div>
    <p id="reviewJudge" class="review-judge"></p>
    <div class="review-choices">
      <div class="review-choice-col">
        <p id="reviewPickedLabel" class="review-choice-label">あなたの回答</p>
        <div id="reviewPickedCell" class="choice-cell review-panel"></div>
      </div>
      <div class="review-choice-col">
        <p id="reviewCorrectLabel" class="review-choice-label">正解</p>
        <div id="reviewCorrectCell" class="choice-cell review-panel"></div>
      </div>
    </div>
    <div class="review-nav">
      <button type="button" id="reviewPrevBtn" class="review-nav-btn">◀ 前へ</button>
      <button type="button" id="reviewNextBtn" class="review-nav-btn">次へ ▶</button>
    </div>
    <button type="button" id="reviewBackBtn" class="review-back-btn">リザルトへ戻る</button>
  </section>

  <section id="rankingScreen" class="ranking-screen" hidden>
    <p class="ranking-title">ランキング</p>
    <div class="ranking-board-buttons" id="rankingBoardButtons"></div>
    <div id="rankingBody" class="ranking-body"></div>
    <button type="button" id="rankingBackBtn" class="ranking-back-btn">リザルトへ戻る</button>
  </section>

  <section id="debugPanel" class="debug-panel" hidden></section>

  <section class="dev-controls" id="devControls" hidden>
    <p class="dev-controls-label">確認用UI（本番では出ません）</p>
    <div class="dev-action-buttons">
      <button type="button" id="startBtn" class="start-btn">スタート</button>
      <button type="button" id="previewBtn" class="preview-btn">1問だけ表示</button>
    </div>

    <div class="sound-controls">
      <div class="sound-control-row">
        <span class="sound-control-label">BGM</span>
        <input type="range" id="bgmVolumeSlider" class="volume-slider" min="0" max="100" value="80">
        <button type="button" id="bgmMuteBtn" class="mute-btn">ミュート</button>
      </div>
      <div class="sound-control-row">
        <span class="sound-control-label">SE</span>
        <input type="range" id="seVolumeSlider" class="volume-slider" min="0" max="100" value="80">
        <button type="button" id="seMuteBtn" class="mute-btn">ミュート</button>
      </div>
    </div>
  </section>
  </div>
</main>

<script src="quiz.js" defer></script>
</body>
</html>
