<meta name="description" content="福岡県福岡市早良区の「中華料理 泰洲園」で食べられる、やわ麺皿うどんの紹介。料理・メニュー・外観の写真つき。福岡やわ麺皿うどんMAPより。">

<meta property="og:description" content="福岡県福岡市早良区の「中華料理 泰洲園」で食べられる、やわ麺皿うどんの紹介。料理・メニュー・外観の写真つき。福岡やわ麺皿うどんMAPより。">

<style>
/* 料理を美味しく見せるための配色。サイト全体の黒ではなく、明るい小麦色の地に
   照りの琥珀と醤油色の文字。料理写真をヘッダーのように全幅で置く */
:root {
  --bg:      #fbf5ec;
  --paper:   #ffffff;
  --ink:     #2b1d12;
  --sub:     #6f5642;
  --line:    #ead9c3;
  --amber:   #c9670f;
  --shu:     #d1392b;
  --chip:    #f3e6d4;
  --soy:     #2b1d12;
  --display: 'Shippori Mincho B1', 'Noto Serif JP', 'YuMincho', '游明朝', serif;
  --sans:    'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
}

/* ─── 料理写真（ヘッダー） ─── */
.hero {
  position: relative;
  max-width: 1200px;
  margin: 0 auto;
  aspect-ratio: 16 / 9;
  max-height: 72vh;
  overflow: hidden;
}
.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 60%;
  display: block;
  transform-origin: 50% 60%;
  animation: slowzoom 14s ease-out forwards;
  filter: saturate(1.16) contrast(1.05) brightness(1.08);
}
.hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 22%;
  background: linear-gradient(to bottom, rgba(251, 245, 236, 0), var(--bg));
}
@keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.08); } }

/* 湯気 */
.steam { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.steam i {
  position: absolute;
  bottom: 30%;
  width: 38%;
  height: 55%;
  background: radial-gradient(closest-side, rgba(255, 255, 255, .24), rgba(255, 255, 255, 0));
  filter: blur(14px);
  opacity: 0;
  animation: rise 7s ease-in infinite;
}
.steam i:nth-child(1) { left: 18%; }
.steam i:nth-child(2) { left: 42%; width: 30%; animation-delay: 2.4s; }
.steam i:nth-child(3) { left: 60%; width: 34%; animation-delay: 4.6s; }
@keyframes rise {
  0%   { transform: translate(0, 30%) scale(.7, .9); opacity: 0; }
  30%  { opacity: .9; }
  100% { transform: translate(-8%, -70%) scale(1.25, 1.4); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .steam { display: none; }
  .hero img { animation: none; }
}

/* ─── 本体 ─── */
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px 56px;
}
.no-hero .wrap { padding-top: 56px; }

.eyebrow {
  font-size: 11px;
  letter-spacing: .32em;
  color: var(--amber);
  margin-bottom: 8px;
}
.title {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(32px, 6vw, 52px);
  line-height: 1.15;
  letter-spacing: .06em;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 16px;
}

/* スキ・大スキの印（ハンコ風）。大スキは二重枠 */
.seal {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: 14px;
  line-height: 1.08;
  color: var(--shu);
  border: 2px solid var(--shu);
  border-radius: 4px;
  padding: 6px 5px;
  transform: rotate(-6deg);
}
.seal.is-big {
  outline: 1px solid var(--shu);
  outline-offset: 2px;
}

/* 市町村と、型・汁気・オイリーさ */
.where {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  margin: 12px 0 26px;
  font-size: 14px;
  color: var(--sub);
}
.where .tag {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 13px;
  color: var(--ink);
}

/* ─── 値段 ─── */
.prices {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 760px;
}
.pc {
  flex: 1 1 150px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px 16px;
}
.pc-item {
  display: block;
  font-family: var(--display);
  font-weight: 600;
  font-size: 16px;
  margin-bottom: 6px;
}
.pc-yen {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(34px, 9vw, 44px);
  color: var(--amber);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.pc-yen small {
  font-size: 16px;
  margin-left: 3px;
  color: var(--ink);
  font-weight: 600;
}
.others {
  font-size: 14px;
  color: var(--sub);
  margin-top: 10px;
  padding-left: 4px;
}

/* 麺の硬さ: -2〜2 を横幅に置き換える。中央が0 */
.ax {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto 2.2em;
  gap: 10px;
  align-items: center;
  max-width: 760px;
  margin-top: 22px;
  padding: 12px 16px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.ax-name { font-family: var(--display); font-weight: 600; font-size: 15px; }
.ax-pole { font-size: 12px; color: var(--sub); text-align: center; }
.ax-track { position: relative; height: 16px; }
.ax-track::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 4px;
  margin-top: -2px;
  border-radius: 2px;
  background: var(--chip);
}
.ax-zero {
  position: absolute;
  left: 50%; top: 1px; bottom: 1px;
  width: 1px;
  background: var(--line);
}
.ax-fill {
  position: absolute;
  top: 50%;
  height: 4px;
  margin-top: -2px;
  background: var(--amber);
}
.ax-dot {
  position: absolute;
  top: 50%;
  width: 12px; height: 12px;
  margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 0 3px var(--paper);
}
.ax-val {
  font-family: var(--display);
  font-weight: 800;
  font-size: 15px;
  color: var(--amber);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ─── 見出し ─── */
.label {
  font-family: var(--display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .12em;
  margin-bottom: 12px;
}
.sec { margin-top: 44px; }

/* ─── 動画と本文。動画は本文を読みながら見られる位置に置く ─── */
.read {
  display: grid;
  gap: 24px;
}
.video-col { min-width: 0; }
.video-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 14px;
  overflow: hidden;
  background: var(--soy);
  box-shadow: 0 14px 28px -18px rgba(120, 70, 20, .5);
}
.video-frame.is-short {
  aspect-ratio: 9 / 16;
  max-width: 320px;
  margin: 0 auto;
}
.video-frame iframe { width: 100%; height: 100%; display: block; border: 0; }
.video-btn {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: var(--soy);
  cursor: pointer;
  display: grid;
  place-items: center;
}
.video-btn img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .78;
  transition: opacity .18s;
}
.video-btn:hover img { opacity: .92; }
.video-btn:focus-visible { outline: 3px solid var(--amber); outline-offset: -3px; }
.video-play {
  position: relative;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--shu);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .35);
}
.video-play::after {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  margin: -11px 0 0 -6px;
  border-style: solid;
  border-width: 11px 0 11px 18px;
  border-color: transparent transparent transparent #fff;
}

.comment {
  min-width: 0;
  font-size: 15px;
  line-height: 2.05;
  color: #3d2c1e;
  white-space: pre-wrap;
  max-width: 40em;
}

/* 具材 */
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags span {
  background: var(--chip);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 14px;
  font-weight: 500;
}

/* ─── お店（外観・所在・メニュー） ─── */
.shop {
  display: grid;
  gap: 14px;
  align-items: start;
}
.shop-side { display: grid; gap: 14px; }
.ph {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: var(--paper);
  box-shadow: 0 14px 28px -18px rgba(120, 70, 20, .5);
}
.ph img { width: 100%; display: block; }
.ph-cap {
  position: absolute;
  left: 12px; top: 12px;
  background: rgba(255, 255, 255, .92);
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .1em;
  padding: 4px 10px;
  border-radius: 999px;
}
/* メニューは押すと別タブで元画像が開く（端末のピンチ拡大で字を読めるように） */
.ph-zoom { display: block; cursor: zoom-in; }
.ph-zoom::after {
  content: "拡大";
  position: absolute;
  right: 12px; bottom: 12px;
  background: rgba(43, 29, 18, .78);
  color: #fff;
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 999px;
}
.addr {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-line;
}
.addr b {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--sub);
  letter-spacing: .1em;
}

/* ─── nav / footer ─── */
.site-nav {
  padding: 4px 24px 0;
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.site-nav a {
  display: inline-block;
  padding: 12px 28px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink);
  text-decoration: none;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  transition: background .15s, color .15s;
}
.site-nav a:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

footer {
  border-top: 1px solid var(--line);
  margin-top: 40px;
  padding: 28px 24px;
  text-align: center;
  font-size: 12px;
  color: var(--sub);
  letter-spacing: .1em;
}

/* ─── PC ─── */
@media (min-width: 900px) {
  .read.has-video { grid-template-columns: 320px minmax(0, 1fr); gap: 40px; align-items: start; }
  .read.has-video.is-wide { grid-template-columns: minmax(0, 46%) minmax(0, 1fr); }
  .read.has-video .video-col { position: sticky; top: 24px; }
  .shop { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
}

/* ─── スマホ ─── */
@media (max-width: 700px) {
  .hero { aspect-ratio: 4 / 3.4; max-height: 74vh; }
}
@media (max-width: 899px) {
  /* 縦長の動画は本文の上に置くので、画面を埋めない大きさにする */
  .video-frame.is-short { max-width: min(320px, 62vw); }
}
@media (max-width: 480px) {
  .wrap { padding: 0 20px 48px; }
  .no-hero .wrap { padding-top: 40px; }
}
</style>
</head>

<div class="wrap">

<script>
/* ==================================================================
   店舗データ — このページ1枚分。ここだけ書き換える

   name        : 店舗名。ページタイトルと見出しに入る
   city        : 市区町村名。index.html の city と同じ表記にする
   address     : 住所。書けば「所在」に住所を出し、空なら city を出す
   suki        : 好み。2 = 大スキ、1 = スキ、0 なら印なし。店名の横に印が出る
   type        : 皿うどんの型。次の2つから選ぶ
                 あんかけ / 非あんかけ
   shiruke     : 汁気。'有り' か '無し'。空なら行ごと消える
   oily        : オイリーさ。オイリーなら 'オイリー'。空なら行ごと消える
   prices      : 品名と値段の並び。空なら欄ごと消える
   katasa      : 麺の硬さ。-2 -1 0 1 2 の5段階。右（+）ほど硬く、0がちょうどよい。
                 0 は値なので、未記入は null と書く（null なら行ごと消える）
   ingredients : 具材。空なら欄ごと消える
   comment     : 本文。空なら欄ごと消える。改行はそのまま反映される
   photos      : 外観・メニュー・料理の画像パス。空のものは消える
                 料理の写真はページ上部に横幅いっぱいで出す
   video       : YouTubeの動画ID。URLではなくIDだけ
                 https://www.youtube.com/watch?v=XXXXXXXXXXX -> XXXXXXXXXXX
                 https://youtube.com/shorts/XXXXXXXXXXX      -> XXXXXXXXXXX
                 空なら動画の枠ごと消える
   videoShort  : 縦長動画（ショート）なら true、横長なら false
   videoPoster : 再生前に出す画像。空ならYouTube側のサムネイルを使う

   画像は saraudon/images/ に置く。
   ファイルがまだ無いパスを書いても、その枠が消えるだけで崩れない。
   メニューの画像には「拡大」が付き、押すと別タブで元画像が開く。
   このファイルをコピーして店舗ごとのHTMLを作る。
   ファイル名は index.html の SHOPS に書いた id と揃える。
   ================================================================== */
const SHOP = {
  name: '中華料理 泰洲園',
  city: '福岡市早良区',
  address: '〒814-0163 福岡県福岡市早良区干隈６丁目８−１ ＴＳビル',
  suki:    1,
  type: '非あんかけ',
  shiruke: '有り',
  oily:    '',

  prices: [
    { label: '皿うどん', yen: 950 },
  ],

  katasa: -2,   // 麺の硬さ -2〜2

  ingredients: [],

  comment: '訪問前にGoogleマップを見ると、評価は3.1。\n低評価の口コミをいくつか読むと、目立ったのは「接客や対応は気になるが、料理は美味しい」という内容だった。\nそこが逆に気になって行ってみた。\n\n実際に訪れたときの接客は、特に気になるところもなく普通。口コミは1年ほど前のものが多かったので、その頃とは状況が変わっているのかもしれない。\n\n注文したのは、店の人気No.1という皿うどん。\nまず特徴的なのが、かなり柔らかめの麺。\n口に入れると、さらっとした汁気ではなく、ねっとりと濃厚な旨味が麺にまとわりつくような食感がある。\n\nこの感覚は、飯塚の千寿の皿うどんに少し似ている。\nただし味の方向はかなり違う。\n千寿がちゃんぽんスープを思わせる豚骨系の濃厚さなのに対して、こちらは自分には醤油系を軸にしたような味わいに感じた。\n\nそして、これは美味い。\n旨味をギュッと凝縮したような濃厚さと、ねっとり柔らかな麺の食感がよく合っている。\n派手なインパクトというより、口の中にしっかり旨味が残るタイプ。\nこれは単に「自分の好みだった」というだけではなく、美味しい皿うどんを探している人に、一度食べてみてほしいと思える一皿だった。\n\n皿うどんを食べ歩いていると改めて感じるけれど、「皿うどん」という一つの名前で括るには、店によってあまりにも違う。\n麺の硬さも、汁気も、味の組み立ても全然違う。\n例えば、自分がよく食べる山笠の皿うどんとは、同じやわ麺皿うどんでも方向性がまるで違う。\n優劣というより、もう別の料理を食べているくらいの違いがある。\n\n泰洲園は、濃厚な旨味と、ねっとり柔らかな食感を楽しむ皿うどん。\n皿うどんの幅の広さを感じさせてくれる一皿でした。',

  photos: {
    gaikan: 'images/taishuen-gaikan.jpg',
    menu:   'images/taishuen-menu.jpg',
    ryori:  'images/taishuen-ryori.jpg',
  },

  video:       '44AeOcncXfc',
  videoShort:  true,
  videoPoster: '',
};
/* ================================================================== */
(function () {
  'use strict';

  const SITE = '福岡やわ麺皿うどんMAP';
  const name = (SHOP.name || '').trim();
  const photos = SHOP.photos || {};
  const pic = function (k) { return (photos[k] || '').trim(); };

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  /* --- 料理写真（ヘッダー）。無い・読めないときは出さない --- */
  const hero = document.getElementById('hero');
  const heroImg = document.getElementById('hero-img');
  if (pic('ryori')) {
    heroImg.src = pic('ryori');
    heroImg.alt = name ? name + ' の皿うどん' : '皿うどん';
    hero.hidden = false;
    heroImg.addEventListener('error', function () {
      hero.remove();
      document.body.classList.add('no-hero');
      console.warn('画像が読めないため非表示にしました: ' + pic('ryori'));
    });
  } else {
    document.body.classList.add('no-hero');
  }

  /* --- 見出しとスキの印。2 = 大スキ（二重枠）、1 = スキ --- */
  const title = document.getElementById('shop-name');
  title.appendChild(el('span', '', name));
  if (SHOP.suki >= 1) {
    const seal = el('span', 'seal' + (SHOP.suki >= 2 ? ' is-big' : ''));
    /* 1文字ずつ縦に積む（縦書き指定はフォントによって文字が重なるため使わない） */
    Array.from(SHOP.suki >= 2 ? '大スキ' : 'スキ').forEach(function (ch) {
      seal.appendChild(el('span', '', ch));
    });
    title.appendChild(seal);
  }
  document.title = name ? name + ' | ' + SITE : '店舗ページ | ' + SITE;

  /* --- 市町村と、型・汁気・オイリーさ --- */
  const where = document.getElementById('where');
  const city = (SHOP.city || '').trim();
  if (city) where.appendChild(el('span', '', city));
  const type = (SHOP.type || '').trim();
  const shiruke = (SHOP.shiruke || '').trim();
  const oily = (SHOP.oily || '').trim();
  if (type)    where.appendChild(el('span', 'tag', type));
  if (shiruke) where.appendChild(el('span', 'tag', '汁気 ' + shiruke));
  if (oily)    where.appendChild(el('span', 'tag', oily));
  if (!where.children.length) where.remove();

  /* --- 値段。「皿うどん」を含む品は大きな札で、それ以外は下に1行で --- */
  const prices = (SHOP.prices || []).filter(function (p) {
    return p && (p.label || '').trim() && p.yen > 0;
  });
  if (prices.length) {
    const box = document.getElementById('prices');
    const others = [];
    prices.forEach(function (p) {
      const label = p.label.trim();
      const yen = Number(p.yen).toLocaleString('ja-JP');
      if (label.indexOf('皿うどん') >= 0) {
        const card = el('div', 'pc');
        card.appendChild(el('span', 'pc-item', label));
        const y = el('span', 'pc-yen', yen);
        y.appendChild(el('small', '', '円'));
        card.appendChild(y);
        box.appendChild(card);
      } else {
        others.push(label + '　' + yen + '円');
      }
    });
    if (!box.children.length) box.remove();
    if (others.length) {
      const o = document.getElementById('others');
      o.textContent = others.join('　／　');
      o.hidden = false;
    }
    document.getElementById('price-sec').hidden = false;
  }

  /* --- 麺の硬さ: -2〜2 を横幅に置き換える。中央が0で、そこから値の向きへ伸ばす --- */
  const kv = SHOP.katasa;
  const kbox = document.getElementById('katasa');
  if (typeof kv === 'number' && isFinite(kv)) {
    const MAXV = 2;
    const val = Math.max(-MAXV, Math.min(MAXV, kv));
    const pct = 50 / MAXV;
    const row = el('div', 'ax');
    row.appendChild(el('span', 'ax-name', '麺の硬さ'));
    row.appendChild(el('span', 'ax-pole', 'やわ'));
    const track = el('div', 'ax-track');
    track.setAttribute('role', 'img');
    track.setAttribute('aria-label',
      '麺の硬さ ' + (val > 0 ? '+' : '') + val + '（やわらかい〜かたい の5段階）');
    track.appendChild(el('span', 'ax-zero'));
    if (val !== 0) {
      const fill = el('span', 'ax-fill');
      fill.style.left  = (val > 0 ? 50 : 50 + val * pct) + '%';
      fill.style.width = Math.abs(val) * pct + '%';
      track.appendChild(fill);
    }
    const dot = el('span', 'ax-dot');
    dot.style.left = (50 + val * pct) + '%';
    track.appendChild(dot);
    row.appendChild(track);
    row.appendChild(el('span', 'ax-pole', 'かた'));
    row.appendChild(el('span', 'ax-val', (val > 0 ? '+' : '') + val));
    kbox.appendChild(row);
  } else {
    kbox.remove();
  }

  /* --- 動画と本文。動画は本文を読みながら見られるよう、本文の横（スマホは上）に置く --- */
  const read = document.getElementById('read');
  const vid = (SHOP.video || '').trim();
  const note = (SHOP.comment || '').trim();

  if (vid) {
    const col = document.getElementById('video-col');
    const frame = el('div', 'video-frame' + (SHOP.videoShort ? ' is-short' : ''));
    const btn = el('button', 'video-btn');
    btn.type = 'button';
    btn.setAttribute('aria-label', '動画を再生');

    /* 押されるまでYouTubeを読み込まない */
    const poster = document.createElement('img');
    poster.src = (SHOP.videoPoster || '').trim()
              || 'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg';
    poster.alt = '';
    poster.loading = 'lazy';
    poster.addEventListener('error', function () { poster.hidden = true; });

    btn.appendChild(poster);
    btn.appendChild(el('span', 'video-play'));
    frame.appendChild(btn);

    btn.addEventListener('click', function () {
      const f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + vid
            + '?autoplay=1&rel=0&playsinline=1';
      f.title = name ? name + ' の動画' : '動画';
      f.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';
      f.allowFullscreen = true;
      frame.textContent = '';
      frame.appendChild(f);
    });

    col.appendChild(frame);
    col.hidden = false;
    read.classList.add('has-video');
    if (!SHOP.videoShort) read.classList.add('is-wide');
  }
  if (note) {
    const c = document.getElementById('comment');
    c.textContent = note;
    c.hidden = false;
  }
  if (vid || note) read.hidden = false;

  /* --- 具材 --- */
  const ing = (SHOP.ingredients || []).map(function (s) { return (s || '').trim(); })
                                      .filter(Boolean);
  if (ing.length) {
    const box = document.getElementById('ingredients');
    ing.forEach(function (s) { box.appendChild(el('span', '', s)); });
    document.getElementById('ing-sec').hidden = false;
  }

  /* --- お店: 外観・所在・メニュー --- */
  const shop = document.getElementById('shop');

  function photo(key, label, zoom) {
    const src = pic(key);
    if (!src) return null;
    const fig = el('figure', 'ph');
    const img = document.createElement('img');
    img.src = src;
    img.alt = name ? name + ' の' + label : label;
    img.loading = 'lazy';
    /* ファイルがまだ無いときは壊れた画像を出さず、枠ごと消す */
    img.addEventListener('error', function () {
      fig.remove();
      console.warn('画像が読めないため非表示にしました: ' + src);
    });
    if (zoom) {
      const a = el('a', 'ph-zoom');
      a.href = src;
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', label + 'を拡大表示');
      a.appendChild(img);
      fig.appendChild(a);
    } else {
      fig.appendChild(img);
    }
    fig.appendChild(el('span', 'ph-cap', label));
    return fig;
  }

  const gaikan = photo('gaikan', '外観', false);
  if (gaikan) shop.appendChild(gaikan);

  const side = el('div', 'shop-side');
  const addr = (SHOP.address || SHOP.city || '').trim();
  if (addr) {
    const a = el('div', 'addr');
    a.appendChild(el('b', '', '所在'));
    a.appendChild(document.createTextNode(addr));
    side.appendChild(a);
  }
  const menu = photo('menu', 'メニュー', true);
  if (menu) side.appendChild(menu);
  if (side.children.length) shop.appendChild(side);

  if (shop.children.length) document.getElementById('shop-sec').hidden = false;
})();
</script>

</body>
</html>
