<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店舗ページ | 福岡やわ麺皿うどんMAP</title>

<link rel="icon" type="image/png" sizes="32x32" href="../icon_32x32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --accent:    #ff2a6d;
  --bg:        #080808;
  --surface:   #111111;
  --surface-2: #171717;
  --border:    #1e1e1e;
  --text:      #e0dbd5;
  --muted:     #5e5e5e;
  --serif:     'Noto Serif JP', 'YuMincho', '游明朝', serif;
  --sans:      'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
}

/* ─── page title ─── */
.page-head {
  max-width: 1200px;
  margin: 56px auto 0;
  padding: 0 24px;
}
.page-eyebrow {
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--muted);
  margin-bottom: 12px;
}
.page-title {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 1.3;
}

/* ─── 2-column layout ─── */
.container {
  display: flex;
  max-width: 1200px;
  margin: 32px auto 80px;
  padding: 0 24px;
  gap: 32px;
  align-items: flex-start;
}
.left  { width: 58%; flex-shrink: 0; }
/* 写真を見ながら評価を読めるよう右側は固定。
   画面が低いときだけ内側でスクロールさせ、下が切れないようにする */
.right {
  width: 42%;
  position: sticky;
  top: 24px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
}

.section-label {
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--muted);
  margin: 0 0 10px 0;
}

/* ─── media (left) ─── */
.media { display: flex; flex-direction: column; gap: 26px; }

.shot img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
}

/* 拡大できる画像（メニューなど、字を読む必要があるもの）。
   別タブで元画像を開くので、端末側のピンチ拡大・スクロールがそのまま使える */
.shot-zoom {
  display: block;
  position: relative;
  cursor: zoom-in;
}
.shot-zoom::after {
  content: '拡大';
  position: absolute;
  right: 12px;
  bottom: 12px;
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text);
  background: rgba(8, 8, 8, .74);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 5px 13px;
  opacity: .9;
  transition: background 0.18s, opacity 0.18s;
}
.shot-zoom:hover::after { background: var(--accent); opacity: 1; }

/* 動画: 押されるまでYouTubeを読み込まない */
.video-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
  background: var(--surface);
}
.video-frame.is-short {
  aspect-ratio: 9 / 16;
  max-width: 340px;
}
.video-frame iframe { width: 100%; height: 100%; display: block; border: 0; }

.video-btn {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: var(--surface);
  cursor: pointer;
  display: block;
}
.video-btn img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0.62;
  transition: opacity 0.18s;
}
.video-btn:hover img { opacity: 0.82; }

.video-play {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 62px;
  height: 62px;
  margin: -31px 0 0 -31px;
  border-radius: 50%;
  background: rgba(8, 8, 8, .72);
  border: 2px solid var(--accent);
  transition: background 0.18s;
}
.video-btn:hover .video-play { background: var(--accent); }
.video-play::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  margin: -10px 0 0 -6px;
  border-style: solid;
  border-width: 10px 0 10px 16px;
  border-color: transparent transparent transparent var(--text);
}

.video-cap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  text-align: center;
  font-family: var(--serif);
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--text);
  text-shadow: 0 2px 8px rgba(0, 0, 0, .9);
}

/* ─── text (right) ─── */
.info {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 26px 26px 24px;
}

.facts { margin: 0 0 4px 0; }
.fact {
  display: flex;
  gap: 16px;
  align-items: baseline;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.fact:first-child { padding-top: 0; }
.fact:last-child { border-bottom: none; padding-bottom: 0; }
.fact-key {
  font-family: var(--serif);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--muted);
  flex: 0 0 68px;
}
.fact-val { font-size: 15px; line-height: 1.6; }
.fact-val.is-fav {
  font-family: 'Courier New', monospace;
  color: var(--accent);
  font-size: 16px;
}

/* 区切りを持つ塊。中身が無いものは JS 側で丸ごと消す */
.block {
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
}

/* 価格 */
.price {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  padding: 5px 0;
}
.price-label { font-size: 13px; }
.price-yen {
  font-family: 'Courier New', monospace;
  font-size: 14px;
  white-space: nowrap;
}

/* 評価の見出し数値（好み度・価格に対する満足度）
   ラベルが長いので、facts の狭いキー列ではなくこちらに置く */
.score-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  padding: 5px 0;
}
.score-top-label { font-size: 13px; }
.score-top-val {
  font-family: 'Courier New', monospace;
  font-size: 16px;
  color: var(--accent);
}
.score-axes.has-top {
  margin-top: 13px;
  padding-top: 11px;
  border-top: 1px solid var(--border);
}

/* 評価 — 0を中心に左右へ振れる目盛り */
.ax {
  display: grid;
  grid-template-columns: 4.6em 1.2em 1fr 1.2em 2.1em;
  gap: 8px;
  align-items: center;
  padding: 7px 0;
}
.ax-name { font-size: 12px; line-height: 1.35; }
.ax-pole { font-size: 10px; color: var(--muted); text-align: center; }
.ax-track { position: relative; height: 14px; }
.ax-track::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 2px;
  margin-top: -1px;
  border-radius: 1px;
  background: #1c1c1c;
}
.ax-zero {
  position: absolute;
  left: 50%; top: 2px; bottom: 2px;
  width: 1px;
  margin-left: -0.5px;
  background: #3a3a3a;
}
.ax-fill {
  position: absolute;
  top: 50%;
  height: 4px;
  margin-top: -2px;
  background: var(--accent);
}
.ax-fill.is-pos { border-radius: 0 2px 2px 0; }
.ax-fill.is-neg { border-radius: 2px 0 0 2px; }
.ax-dot {
  position: absolute;
  top: 50%;
  width: 9px; height: 9px;
  margin: -4.5px 0 0 -4.5px;
  border-radius: 50%;
  background: var(--accent);
}
.ax-val {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: var(--accent);
  text-align: right;
}

/* 具材 */
.ingredients { font-size: 13px; line-height: 1.95; }

.comment {
  font-size: 14px;
  line-height: 2;
  white-space: pre-wrap;
}

/* ─── nav / footer ─── */
.site-nav {
  padding: 4px 24px 0;
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
}
.site-nav a {
  display: inline-block;
  padding: 12px 30px;
  border: 2px solid var(--accent);
  color: var(--text);
  text-decoration: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  transition: background 0.15s;
}
.site-nav a:hover { background: var(--accent); }

footer {
  border-top: 1px solid var(--border);
  margin-top: 40px;
  padding: 28px 24px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.1em;
  font-family: var(--serif);
}

/* ─── responsive ─── */
@media (max-width: 900px) {
  .container { flex-direction: column; margin-top: 24px; }
  .left, .right { width: 100%; }
  .left { max-width: 560px; margin: 0 auto; }
  .right {
    position: static;
    max-width: 560px;
    margin: 0 auto;
    max-height: none;
    overflow: visible;
  }
  .video-frame.is-short { max-width: 100%; }
}
@media (max-width: 768px) {
  .page-head { margin-top: 40px; }
  .page-title { font-size: 25px; }
}
@media (max-width: 480px) {
  .page-head, .container { padding: 0 14px; }
  .container { gap: 24px; }
  .media { gap: 20px; }
  .info { padding: 20px 18px 18px; }
}
</style>
</head>

<body>

<div class="page-head">
  <p class="page-eyebrow">FUKUOKA SARA-UDON MAP</p>
  <h1 class="page-title" id="shop-name"></h1>
</div>

<div class="container">

  <!-- LEFT: 画像と動画 -->
  <div class="left">
    <div class="media" id="media"></div>
  </div>

  <!-- RIGHT: テキスト -->
  <div class="right">
    <div class="info">
      <div class="facts" id="facts"></div>

      <section class="block" id="price-sec" hidden>
        <p class="section-label">価格</p>
        <div id="prices"></div>
      </section>

      <section class="block" id="score-sec" hidden>
        <p class="section-label">評価</p>
        <div id="score-top"></div>
        <div class="score-axes" id="scores"></div>
      </section>

      <section class="block" id="ing-sec" hidden>
        <p class="section-label">具材</p>
        <p class="ingredients" id="ingredients"></p>
      </section>

      <section class="block" id="comment-sec" hidden>
        <p class="comment" id="comment"></p>
      </section>
    </div>
  </div>

</div>

<nav class="site-nav">
  <a href="index.html">MAPへ戻る</a>
  <a href="../index.html">index</a>
</nav>

<footer>
  © グレイト・プレ・善太
</footer>

<script>
/* ==================================================================
   店舗データ — このページ1枚分。ここだけ書き換える

   name        : 店舗名。ページタイトルと見出しに入る
   city        : 市区町村名。index.html の city と同じ表記にする
   address     : 住所。書けば「所在」に住所を出し、空なら city を出す
   fav         : 個人的好み度。1〜5の整数。0 や未記入なら行ごと消える
   costSat     : 価格に対する満足度。1〜5の整数。
                 特別な店だけ5を超えて書いてよい（そのまま表示される）
   type        : 皿うどんの型。次の4つから選ぶ
                 あんかけ型 / スープ吸わせ型 / 濃厚スープ絡め型 / 炒め型
   prices      : 品名と値段の並び。空なら欄ごと消える
   scores      : -2 -1 0 1 2 の5段階。右へ行くほど強く、0がちょうどよい。
                 価格だけは右が高く左が安い。
                 0 は「ちょうどよい」という値なので、未記入は null と書く
                 （null の項目だけが行ごと消える）
   ingredients : 具材。空なら欄ごと消える
   comment     : 本文。空なら欄ごと消える。改行はそのまま反映される
   photos      : 外観・メニュー・料理の画像パス。空のものは消える
   video       : YouTubeの動画ID。URLではなくIDだけ
                 https://www.youtube.com/watch?v=XXXXXXXXXXX -> XXXXXXXXXXX
                 https://youtube.com/shorts/XXXXXXXXXXX      -> XXXXXXXXXXX
                 空なら動画の枠ごと消える
   videoShort  : 縦長動画（ショート）なら true、横長なら false
   videoPoster : 再生前に出す画像。空ならYouTube側のサムネイルを使う

   画像は saraudon/images/ に置く。
   ファイルがまだ無いパスを書いても、その枠が消えるだけで崩れない。
   メニューの画像には「拡大」が付き、押すと別タブで元画像が開く。
   対象を増やすときは、下の ZOOMABLE に項目名を足す。
   このファイルをコピーして店舗ごとのHTMLを作る。
   ファイル名は index.html の SHOPS に書いた id と揃える。
   ================================================================== */
const SHOP = {
  name: '居酒屋山笠',
  city: '福岡市博多区',
  address: '〒812-0857 福岡県福岡市博多区西月隈６丁目１−２７',
  fav:     5,
  costSat: 6,
  type: 'あんかけ型',

  prices: [
    { label: '皿うどん',     yen: 580 },
    { label: '皿うどん大盛', yen: 730 },
  ],

  scores: {
    shio:    0,   // 塩味     弱 - 強
    ama:     0,   // 甘味     弱 - 強
    katasa:  1,   // 麺の硬さ  弱 - 強
    mochi:   2,   // もちもち  弱 - 強
    kakaku: -2,   // 価格     安 - 高
  },

  ingredients: ['キャベツ', 'たまねぎ', 'イカ', 'えび', '豚肉', 'もやし', 'かまぼこ', 'さつま揚げ'],

  comment: 'あまりやわ麺皿うどんを食べた経験のない状態で食べて、\n「わぁ、すげぇ」\nと思った山笠の皿うどん。\nいつ食べても最高に美味い。唯一無二の個人的最強皿うどん。\n全然値上げせずに安すぎるのでウーロン茶で売上貢献もしていく。',

  photos: {
    gaikan: 'images/yamakasa-gaikan.jpg',
    menu:   'images/yamakasa-menu.jpg',
    ryori:  'images/yamakasa-ryori.jpg',
  },

  video:       'FuURjcudNqs',
  videoShort:  false,
  videoPoster: '',
};

/* ================================================================== */
(function () {
  'use strict';

  const SITE  = '福岡やわ麺皿うどんMAP';
  const LABEL = { gaikan: '外観', menu: 'メニュー', ryori: '料理' };
  const ORDER = ['gaikan', 'menu', 'ryori'];
  /* 別タブで元画像を開けるようにするもの。外観や料理も対象にしたければここに足す */
  const ZOOMABLE = ['menu'];

  /* --- 見出しとタイトル --- */
  const name = (SHOP.name || '').trim();
  document.getElementById('shop-name').textContent = name;
  document.title = name ? name + ' | ' + SITE : '店舗ページ | ' + SITE;

  /* --- 左: 画像 --- */
  const media = document.getElementById('media');

  ORDER.forEach(function (key) {
    const src = (SHOP.photos && SHOP.photos[key] || '').trim();
    if (!src) return;                     // 未設定の画像は枠ごと出さない

    const box = document.createElement('figure');
    box.className = 'shot';

    const cap = document.createElement('p');
    cap.className = 'section-label';
    cap.textContent = LABEL[key];

    const img = document.createElement('img');
    img.src = src;
    img.alt = name ? name + ' の' + LABEL[key] : LABEL[key];
    img.loading = 'lazy';
    /* ファイルがまだ無いときは壊れた画像を出さず、枠ごと消す */
    img.addEventListener('error', function () {
      box.remove();
      console.warn('画像が読めないため非表示にしました: ' + src);
    });

    box.appendChild(cap);

    if (ZOOMABLE.indexOf(key) >= 0) {
      const zoom = document.createElement('a');
      zoom.className = 'shot-zoom';
      zoom.href = src;
      zoom.target = '_blank';
      zoom.rel = 'noopener';
      zoom.setAttribute('aria-label', LABEL[key] + 'を拡大表示');
      zoom.appendChild(img);
      box.appendChild(zoom);
    } else {
      box.appendChild(img);
    }

    media.appendChild(box);
  });

  /* --- 左: 動画（押されるまでYouTubeを読み込まない） --- */
  const vid = (SHOP.video || '').trim();
  if (vid) {
    const wrap = document.createElement('div');

    const cap = document.createElement('p');
    cap.className = 'section-label';
    cap.textContent = '動画';

    const frame = document.createElement('div');
    frame.className = 'video-frame' + (SHOP.videoShort ? ' is-short' : '');

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'video-btn';
    btn.setAttribute('aria-label', '動画を再生');

    const poster = document.createElement('img');
    poster.src = (SHOP.videoPoster || '').trim()
              || 'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg';
    poster.alt = '';
    poster.loading = 'lazy';
    /* サムネが読めなくても再生ボタンは残す */
    poster.addEventListener('error', function () { poster.hidden = true; });

    const play = document.createElement('span');
    play.className = 'video-play';

    const txt = document.createElement('span');
    txt.className = 'video-cap';
    txt.textContent = '動画を再生';

    btn.appendChild(poster);
    btn.appendChild(play);
    btn.appendChild(txt);
    frame.appendChild(btn);

    btn.addEventListener('click', function () {
      const f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + vid
            + '?autoplay=1&rel=0&playsinline=1';
      f.title = name ? name + ' の動画' : '動画';
      f.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';
      f.allowFullscreen = true;
      frame.textContent = '';
      frame.appendChild(f);
    });

    wrap.appendChild(cap);
    wrap.appendChild(frame);
    media.appendChild(wrap);
  }

  /* --- 右: 所在・型・好み度 --- */
  const facts = document.getElementById('facts');
  function addFact(key, val, cls) {
    if (!val) return;                     // 未設定の項目は行ごと出さない
    const row = document.createElement('div');
    row.className = 'fact';
    const k = document.createElement('span');
    k.className = 'fact-key';
    k.textContent = key;
    const v = document.createElement('span');
    v.className = 'fact-val' + (cls ? ' ' + cls : '');
    v.textContent = val;
    row.appendChild(k);
    row.appendChild(v);
    facts.appendChild(row);
  }
  addFact('所在', (SHOP.address || SHOP.city || '').trim());
  addFact('型',   (SHOP.type || '').trim());

  /* --- 右: 価格 --- */
  const prices = (SHOP.prices || []).filter(function (p) {
    return p && (p.label || '').trim() && p.yen > 0;
  });
  if (prices.length) {
    const box = document.getElementById('prices');
    prices.forEach(function (p) {
      const row = document.createElement('div');
      row.className = 'price';
      const l = document.createElement('span');
      l.className = 'price-label';
      l.textContent = p.label;
      const y = document.createElement('span');
      y.className = 'price-yen';
      y.textContent = Number(p.yen).toLocaleString('ja-JP') + '円';
      row.appendChild(l);
      row.appendChild(y);
      box.appendChild(row);
    });
    document.getElementById('price-sec').hidden = false;
  }

  /* --- 右: 評価 ---
     -2〜2 を横幅に置き換える。中央が0で、そこから値の向きへ伸ばす。
     0 も「ちょうどよい」という値なので、点だけを中央に出す。 */
  const AXES = [
    ['shio',   '塩味',    '弱', '強'],
    ['ama',    '甘味',    '弱', '強'],
    ['katasa', '麺の硬さ', '弱', '強'],
    ['mochi',  'もちもち', '弱', '強'],
    ['kakaku', '価格',    '安', '高'],
  ];
  const MAXV = 2;
  const scoreBox = document.getElementById('scores');
  const topBox   = document.getElementById('score-top');
  let drawn = 0, topDrawn = 0;

  /* 見出しの数値。0や未記入なら行ごと出さない */
  [['好み度', SHOP.fav], ['価格に対する満足度', SHOP.costSat]].forEach(function (t) {
    if (!(t[1] > 0)) return;
    const row = document.createElement('div');
    row.className = 'score-top';
    const l = document.createElement('span');
    l.className = 'score-top-label';
    l.textContent = t[0];
    const v = document.createElement('span');
    v.className = 'score-top-val';
    v.textContent = String(t[1]);
    row.appendChild(l);
    row.appendChild(v);
    topBox.appendChild(row);
    topDrawn++;
  });

  AXES.forEach(function (ax) {
    const key = ax[0];
    const v = SHOP.scores ? SHOP.scores[key] : null;
    if (typeof v !== 'number' || !isFinite(v)) return;   // null は行ごと出さない
    const val = Math.max(-MAXV, Math.min(MAXV, v));
    const pct = 50 / MAXV;                               // 1目盛りあたりの幅(%)

    const row = document.createElement('div');
    row.className = 'ax';

    const nm = document.createElement('span');
    nm.className = 'ax-name';
    nm.textContent = ax[1];

    const lo = document.createElement('span');
    lo.className = 'ax-pole';
    lo.textContent = ax[2];

    const track = document.createElement('div');
    track.className = 'ax-track';
    track.setAttribute('role', 'img');
    track.setAttribute('aria-label',
      ax[1] + ' ' + (val > 0 ? '+' : '') + val + '（' + ax[2] + 'い〜' + ax[3] + 'い の5段階）');

    const zero = document.createElement('span');
    zero.className = 'ax-zero';
    track.appendChild(zero);

    if (val !== 0) {
      const fill = document.createElement('span');
      fill.className = 'ax-fill ' + (val > 0 ? 'is-pos' : 'is-neg');
      fill.style.left  = (val > 0 ? 50 : 50 + val * pct) + '%';
      fill.style.width = Math.abs(val) * pct + '%';
      track.appendChild(fill);
    }

    const dot = document.createElement('span');
    dot.className = 'ax-dot';
    dot.style.left = (50 + val * pct) + '%';
    track.appendChild(dot);

    const hi = document.createElement('span');
    hi.className = 'ax-pole';
    hi.textContent = ax[3];

    const num = document.createElement('span');
    num.className = 'ax-val';
    num.textContent = (val > 0 ? '+' : '') + val;

    row.appendChild(nm);
    row.appendChild(lo);
    row.appendChild(track);
    row.appendChild(hi);
    row.appendChild(num);
    scoreBox.appendChild(row);
    drawn++;
  });
  if (drawn && topDrawn) scoreBox.classList.add('has-top');   // 両方あるときだけ区切る
  if (drawn || topDrawn) document.getElementById('score-sec').hidden = false;

  /* --- 右: 具材 --- */
  const ing = (SHOP.ingredients || []).map(function (s) { return (s || '').trim(); })
                                      .filter(Boolean);
  if (ing.length) {
    document.getElementById('ingredients').textContent = ing.join('・');
    document.getElementById('ing-sec').hidden = false;
  }

  /* --- 右: コメント --- */
  const note = (SHOP.comment || '').trim();
  if (note) {
    document.getElementById('comment').textContent = note;
    document.getElementById('comment-sec').hidden = false;
  }

  /* 先頭に来た塊は上の区切り線を消す */
  const info = document.querySelector('.info');
  if (!facts.children.length) facts.remove();
  const first = info.querySelector('.block:not([hidden])');
  if (first && !info.querySelector('.facts')) {
    first.style.marginTop = '0';
    first.style.paddingTop = '0';
    first.style.borderTop  = 'none';
  }
})();
</script>

</body>
</html>
