<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>講演テキスト正解選択ゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* 1画面アプリ：上＝原稿が積み上がる譜面台、下＝親指で押す2択 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#18212b; --muted:#6b7684; --line:#d6dce3;
  --accent:#1d6b86; --accent-ink:#ffffff; --good:#2f8a55; --bad:#c2413b; --bad-bg:#fbe9e7;
  --aud:#8a6d3b;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-script:"Zen Old Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --panel:#18212a; --ink:#e6ebf0; --muted:#8c98a6; --line:#2a3642;
  --accent:#4fb3d4; --accent-ink:#08131a; --good:#5cc486; --bad:#ef6b62; --bad-bg:#3a1d1c; --aud:#d1b06f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --panel:#18212a; --ink:#e6ebf0; --muted:#8c98a6; --line:#2a3642;
  --accent:#4fb3d4; --accent-ink:#08131a; --good:#5cc486; --bad:#ef6b62; --bad-bg:#3a1d1c; --aud:#d1b06f; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
.screen{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding-inline:16px;box-sizing:border-box}
.screen[hidden]{display:none!important}

/* menu */
#menu{overflow-y:auto;padding-block:20px 28px;gap:18px}
.brand{display:flex;flex-direction:column;gap:6px}
.brand small{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.brand h1{font-family:var(--f-script);font-size:26px;line-height:1.35;margin:0;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.full{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:var(--accent-ink);
  border-radius:14px;padding:16px 18px;cursor:pointer}
.full b{font-size:18px}
.full span{font-size:12px;opacity:.9;font-family:var(--f-num);text-align:right}
.plist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:active,.full:active{opacity:.7}
.pno{font-family:var(--f-num);font-size:15px;color:var(--accent);font-weight:700}
.pname{font-size:15px;line-height:1.4;min-width:0}
.pname small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.pbest{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.opts{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label,.seg button{font:inherit;font-size:13px;padding:8px 14px;border:0;background:var(--panel);color:var(--ink);cursor:pointer}
.seg .on{background:var(--ink);color:var(--bg)}

/* game */
#game{padding-block:8px 12px;gap:8px}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.quit{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
.quit.arm{color:var(--bad);border-color:var(--bad)}
.hpart{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hnums{display:flex;gap:12px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700}
.hnums .miss{color:var(--bad)}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.script{flex:1;min-height:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px 18px;font-family:var(--f-script);font-size:17px;line-height:1.75;scroll-behavior:auto}
.script p{margin:0;color:var(--muted)}
.script p.g{margin-top:.9em}
.script p.a{color:var(--aud);font-family:var(--f-body);font-size:14px;padding-left:1em}
.script p.last{color:var(--ink);font-weight:700}
.script .pad{height:40%}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;min-height:68px;box-sizing:border-box;padding:12px 16px;border-radius:14px;
  background:var(--panel);border:2px solid var(--line);font-family:var(--f-script);font-size:18px;line-height:1.45;cursor:pointer;
  touch-action:manipulation}
.choice:active{border-color:var(--accent)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);pointer-events:none;animation:shake .18s}
@keyframes shake{0%,100%{transform:none}33%{transform:translateX(-5px)}66%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.choice.wrong{animation:none}}

/* mode */
.modebox{display:flex;flex-direction:column;gap:6px}
.mseg{align-self:flex-start}
.mseg button{padding:9px 18px;font-size:14px}
.mdesc{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.choice{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}
.choice.flow{font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:84px}
.choice .badge{font-size:11px;color:var(--muted);font-family:var(--f-body)}
.choice .badge:empty,.choice .fb:empty{display:none}
.choice .fb{font-size:12px;font-family:var(--f-body);font-weight:700}
.script p.fl{font-family:var(--f-body);font-size:15px;line-height:1.65;margin-top:.7em}
/* lock */
#lock{justify-content:center}
.lock{display:flex;flex-direction:column;gap:14px;padding-block:24px}
.lock input{font:inherit;font-family:var(--f-num);font-size:22px;letter-spacing:.2em;text-align:center;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);-webkit-user-select:text;user-select:text}
.lock input:focus{outline:none;border-color:var(--accent)}
.lmsg{margin:0;min-height:1.4em;color:var(--bad);font-size:14px;text-align:center}
.btn:disabled{opacity:.6}
/* result */
#result{overflow-y:auto;padding-block:24px 28px;gap:18px}
.rhead small{font-size:12px;color:var(--muted);letter-spacing:.1em}
.rhead h2{font-family:var(--f-script);margin:4px 0 0;font-size:22px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.stat small{display:block;font-size:11px;color:var(--muted)}
.stat b{font-family:var(--f-num);font-size:22px;font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;font-size:11px;color:var(--good);min-height:1.3em;margin-top:2px}
.best{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.mlist h3{font-size:14px;margin:0 0 8px}
.mitem{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px;line-height:1.6}
.mitem .ok{font-family:var(--f-script);font-weight:700}
.mitem .ng{color:var(--bad);font-size:12px}
.mitem .ng::before{content:"× "}
.rbtns{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:16px;font-weight:700;padding:15px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

</head>
<body>
<section id="lock" class="screen">
  <form id="lform" class="lock" autocomplete="off">
    <div class="brand"><h1>パスワード</h1></div>
    <input id="lpw" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="パスワード" maxlength="20">
    <button id="lbtn" class="btn pri" type="submit">入る</button>
    <p id="lmsg" class="lmsg"></p>
  </form>
</section>

<section id="menu" class="screen" hidden>
  <div class="brand">
    <small>暗記トレーニング</small>
    <h1>次はどっち？</h1>
    <p>正しい続きを選ぶと原稿が進みます。ゲームオーバーはありません。タイムとミス数を記録します。</p>
  </div>
  <div class="modebox"><div class="seg mseg" id="mseg"></div><p id="mdesc" class="mdesc"></p></div>
  <div id="fullBtn" class="full" role="button" tabindex="0"><b>フルバージョン</b><span id="fullBest"></span></div>
  <div id="plist" class="plist"></div>
  <div class="opts"><span>タップの振動</span><div class="seg" id="hseg"></div></div>
</section>

<section id="game" class="screen" hidden>
  <div class="hud">
    <button id="quit" class="quit" type="button">中断</button>
    <div id="hpart" class="hpart"></div>
    <div class="hnums"><span id="htime">0:00.0</span><span class="miss">×<span id="hmiss">0</span></span></div>
  </div>
  <div class="bar"><i id="hbar"></i></div>
  <div id="script" class="script"></div>
  <div id="choices" class="choices"></div>
</section>

<section id="result" class="screen" hidden>
  <div class="rhead"><small id="rpart"></small><h2 id="rtitle">おつかれさまでした</h2></div>
  <div class="stats">
    <div class="stat"><small>タイム</small><b id="rtime"></b><em id="rtimeNew"></em></div>
    <div class="stat"><small>ミス</small><b id="rmiss"></b><em id="rmissNew"></em></div>
    <div class="stat"><small>正答率</small><b id="racc"></b><em></em></div>
  </div>
  <div id="rbest" class="best"></div>
  <div class="rbtns">
    <button id="rnext" class="btn pri" type="button">次のパートへ</button>
    <button id="rretry" class="btn" type="button">もう一度</button>
    <button id="rmenu" class="btn" type="button">パート選択へ</button>
  </div>
  <div id="mlist" class="mlist"></div>
</section>

var DATA;
var MODE_KEY='lecture2taku_mode', MODE='line', ITEMS, PARTS, FULL;
function setMode(m){ if(!DATA[m])m='line'; MODE=m; ITEMS=DATA[m].items; PARTS=DATA[m].parts;
  FULL={name:'フルバージョン', from:0, to:ITEMS.length, q:PARTS.reduce(function(s,p){return s+p.q},0)};
  try{localStorage.setItem(MODE_KEY,m);}catch(e){} }
try{ MODE=localStorage.getItem(MODE_KEY)||'line'; }catch(e){}
function boot(D){ DATA=D; setMode(MODE); buildMenu(); show('menu'); }

/* ---- haptics（slot_logger と同じ方式） ---- */
var HAPTIC_KEY='lecture2taku_haptic', hapticOn=true;
try{ hapticOn = (localStorage.getItem(HAPTIC_KEY)!=='0'); }catch(e){}
function setHaptic(on){ hapticOn=!!on; try{localStorage.setItem(HAPTIC_KEY,hapticOn?'1':'0');}catch(e){} }
/* ボタン本体を<label>にして、中のswitchを実タップで直接トグルさせる（iOSの触覚） */
function hbtn(cls){
  var l=document.createElement('label'); l.className=cls;
  var s=document.createElement('span'); l.appendChild(s);
  var i=document.createElement('input'); i.type='checkbox'; i.setAttribute('switch','');
  i.setAttribute('style','display:none !important'); i.tabIndex=-1; i.setAttribute('aria-hidden','true');
  l.appendChild(i); l._txt=s; return l;
}
function onTap(elm,fn){ elm.onclick=function(e){ if(e&&e.target&&e.target.tagName==='INPUT')return; fn(e); }; }
function haptic(e){
  if(!hapticOn){ if(e&&e.preventDefault)e.preventDefault(); return; }
  if(typeof navigator!=='undefined'&&navigator.vibrate){ if(e&&e.preventDefault)e.preventDefault(); navigator.vibrate(12); return; }
  /* iOS/Safari: 既定動作（label→switch）で触覚が鳴る */
}

/* ---- records ---- */
var REC_KEY='lecture2taku_rec_v1', rec={};
try{ rec=JSON.parse(localStorage.getItem(REC_KEY)||'{}')||{}; }catch(e){ rec={}; }
function saveRec(){ try{localStorage.setItem(REC_KEY,JSON.stringify(rec));}catch(e){} }
function fmt(ms){ var s=ms/1000, m=Math.floor(s/60); s=s-m*60; return m+':'+(s<10?'0':'')+s.toFixed(1); }
function rk(k){ return (MODE==='flow'?'f_':'')+(k<0?'full':'p'+k); }
function bestText(key){ var r=rec[key]; return r ? 'ベスト '+fmt(r.t)+' / ×'+r.m : '未挑戦'; }

/* ---- menu ---- */
var $=function(id){return document.getElementById(id)};
function show(id){ ['lock','menu','game','result'].forEach(function(s){ $(s).hidden=(s!==id); }); }
function buildMenu(){
  $('fullBest').textContent=FULL.q+'問 ・ '+bestText(rk(-1));
  var ms=$('mseg'); ms.innerHTML='';
  [['line','1行ずつ'],['flow','話の流れ']].forEach(function(m){
    var b=document.createElement('button'); b.type='button'; b.textContent=m[1]; if(MODE===m[0])b.className='on';
    b.onclick=function(){ setMode(m[0]); buildMenu(); }; ms.appendChild(b); });
  $('mdesc').textContent = MODE==='flow' ? '次に「何の話をして、何をするか」を選びます。🔴はスライドを進める合図です。' : '次に話す一行を選びます。';
  var pl=$('plist'); pl.innerHTML='';
  PARTS.forEach(function(p,k){
    var r=document.createElement('div'); r.className='prow'; r.setAttribute('role','button'); r.tabIndex=0;
    r.innerHTML='<span class="pno">'+(k<11?String(k+1).padStart(2,'0'):'次回')+'</span><span class="pname"></span><span class="pbest"></span>';
    r.querySelector('.pname').innerHTML='';
    r.querySelector('.pname').appendChild(document.createTextNode(p.name));
    var sm=document.createElement('small'); sm.textContent=p.q+'問'; r.querySelector('.pname').appendChild(sm);
    r.querySelector('.pbest').textContent=bestText(rk(k));
    r.onclick=function(){ start(k); };
    pl.appendChild(r);
  });
  var hs=$('hseg'); hs.innerHTML='';
  var on=hbtn(hapticOn?'on':''); on._txt.textContent='オン';
  var off=document.createElement('button'); off.type='button'; off.textContent='オフ'; if(!hapticOn)off.className='on';
  onTap(on,function(e){ setHaptic(true); on.className='on'; off.className=''; haptic(e); });
  off.onclick=function(){ setHaptic(false); off.className='on'; on.className=''; };
  hs.appendChild(on); hs.appendChild(off);
}
$('fullBtn').onclick=function(){ start(-1); };

/* ---- game ---- */
var G=null, raf=0;
var btnA=hbtn('choice'), btnB=hbtn('choice');
[btnA,btnB].forEach(function(b){ var bd=document.createElement('span'); bd.className='badge'; b.insertBefore(bd,b._txt); b._badge=bd;
  var fb=document.createElement('span'); fb.className='fb'; b.insertBefore(fb,b._txt.nextSibling); b._fb=fb; });
$('choices').appendChild(btnA); $('choices').appendChild(btnB);
function part(k){ return k<0?FULL:PARTS[k]; }
function start(k){
  var p=part(k);
  G={k:k,p:p,i:p.from,done:0,miss:0,missed:[],t0:performance.now(),end:0,wrongHere:false,lastEl:null};
  $('script').innerHTML='<div class="pad"></div>';
  $('hpart').textContent=(MODE==='flow'?'流れ　':'')+(k<0?'':(k<11?'Part '+(k+1)+'　':'次回　'))+p.name;
  $('hmiss').textContent='0'; $('quit').textContent='中断'; $('quit').classList.remove('arm');
  show('game');
  flushAudience(); nextQ(); tick();
}
function addLine(it,cls){
  var el=document.createElement('p'); el.textContent=it.t;
  if(it.g)el.classList.add('g'); if(it.a)el.classList.add('a'); if(MODE==='flow')el.classList.add('fl');
  if(cls){ if(G.lastEl)G.lastEl.classList.remove('last'); el.classList.add('last'); G.lastEl=el; }
  var sc=$('script'); sc.appendChild(el); sc.scrollTop=sc.scrollHeight;
}
function flushAudience(){ while(MODE==='line' && G.i<G.p.to && ITEMS[G.i].a){ addLine(ITEMS[G.i]); G.i++; } }
function nextQ(){
  if(G.i>=G.p.to){ finish(); return; }
  var it=ITEMS[G.i]; G.wrongHere=false;
  var swap=Math.random()<.5, ca=swap?btnB:btnA, wa=swap?btnA:btnB;
  var wo=it.w[Math.floor(Math.random()*it.w.length)], wt=(typeof wo==='string')?wo:wo.t;
  var flow=(MODE==='flow');
  ca._txt.textContent=flow?plain(it.t):it.t; wa._txt.textContent=wt;
  [btnA,btnB].forEach(function(b){ b.classList.toggle('flow',flow); b._fb.textContent='';
    b._badge.textContent=(flow&&it.r)?'🔴'.repeat(it.r)+' スライド':''; });
  wa._fbText = flow ? where(wo,it) : '';
  btnA.classList.remove('wrong'); btnB.classList.remove('wrong');
  onTap(ca,function(e){ haptic(e); correct(); });
  onTap(wa,function(e){ haptic(e); wrong(wa,it,wt); });
  $('hbar').style.width=(G.done/G.p.q*100)+'%';
}
function correct(){ addLine(ITEMS[G.i],true); G.i++; G.done++; flushAudience(); nextQ(); }
function plain(s){ return s.replace(/🔴/g,' ').replace(/\s+/g,' ').trim(); }
function where(wo,it){ if(wo.p===it.p) return wo.a?'→ このパートでもっと後に話す内容':'→ このパートで前に話した内容'; var P=DATA.flow.parts[wo.p]; return '→ '+(wo.p<11?'Part '+(wo.p+1):'次回')+'「'+P.name+'」の内容'; }
function wrong(el,it,wt){
  if(el._fbText) el._fb.textContent=el._fbText;
  el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
  G.miss++; $('hmiss').textContent=G.miss;
  if(!G.wrongHere){ G.wrongHere=true; G.missed.push({t:it.t,w:wt}); }
}
function tick(){ cancelAnimationFrame(raf);
  (function f(){ if(!G||G.end)return; $('htime').textContent=fmt(performance.now()-G.t0); raf=requestAnimationFrame(f); })(); }
$('quit').onclick=function(){
  var q=$('quit');
  if(!q.classList.contains('arm')){ q.classList.add('arm'); q.textContent='もう一度で中断'; setTimeout(function(){ q.classList.remove('arm'); q.textContent='中断'; },2500); return; }
  G.end=1; buildMenu(); show('menu');
};

/* ---- result ---- */
function finish(){
  G.end=performance.now(); var ms=G.end-G.t0; $('hbar').style.width='100%';
  var key=rk(G.k), old=rec[key], nt=false, nm=false;
  if(!old){ rec[key]={t:ms,m:G.miss}; nt=nm=true; }
  else{ if(ms<old.t){old.t=ms;nt=true;} if(G.miss<old.m){old.m=G.miss;nm=true;} }
  saveRec();
  $('rpart').textContent=(G.k<0?'':(G.k<11?'PART '+(G.k+1)+' ・ ':'次回 ・ '))+G.p.name;
  $('rtitle').textContent=G.miss===0?'ノーミスでクリア':'クリア';
  $('rtime').textContent=fmt(ms); $('rmiss').textContent=G.miss;
  $('racc').textContent=Math.round(G.p.q/(G.p.q+G.miss)*100)+'%';
  $('rtimeNew').textContent=nt?'ベスト更新':''; $('rmissNew').textContent=nm?'ベスト更新':'';
  $('rbest').textContent='自己ベスト：タイム '+fmt(rec[key].t)+' ／ ミス '+rec[key].m+'（'+G.p.q+'問）';
  var nx=$('rnext'); nx.hidden=!(G.k>=0&&G.k<PARTS.length-1);
  var ml=$('mlist'); ml.innerHTML='';
  if(G.missed.length){
    var h=document.createElement('h3'); h.textContent='ミスした行（'+G.missed.length+'）'; ml.appendChild(h);
    G.missed.forEach(function(it){
      var d=document.createElement('div'); d.className='mitem';
      var a=document.createElement('div'); a.className='ok'; a.textContent=it.t;
      var b=document.createElement('div'); b.className='ng'; b.textContent=it.w;
      d.appendChild(a); d.appendChild(b); ml.appendChild(d);
    });
  }
  show('result'); $('result').scrollTop=0;
}
$('rretry').onclick=function(){ start(G.k); };
$('rnext').onclick=function(){ start(G.k+1); };
$('rmenu').onclick=function(){ buildMenu(); show('menu'); };

/* ---- lock ---- */
var PW_KEY='lecture2taku_pw';
function b64(s){ var b=atob(s),u=new Uint8Array(b.length); for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
async function unlock(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.s),iterations:ENC.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.i)},key,b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryPw(pw,silent){
  var msg=$('lmsg'), btn=$('lbtn');
  if(!silent){ msg.textContent='確認中…'; btn.disabled=true; }
  try{
    var d=await unlock(pw);
    try{ localStorage.setItem(PW_KEY,pw); }catch(e){}
    boot(d);
  }catch(e){
    if(!silent){ msg.textContent='パスワードが違います'; btn.disabled=false; $('lpw').select(); }
    else{ try{localStorage.removeItem(PW_KEY);}catch(e2){} }
  }
}
$('lform').onsubmit=function(e){ e.preventDefault(); var v=$('lpw').value.trim(); if(v) tryPw(v,false); };
(function(){ var s=null; try{ s=localStorage.getItem(PW_KEY); }catch(e){} if(s) tryPw(s,true); })();
</script>
