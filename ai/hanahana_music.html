<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハナハナ音楽 | グレイト・プレ・善太</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icon_32x32.png">

<style>
:root{
  --accent:#ff2a6d;
  --bg:#0d0d0d;
  --border:#252525;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
  line-height:1.6;
}

.hdr{padding:64px 20px 36px;text-align:center;}
.hdr-eye{font-size:10px;letter-spacing:6px;color:var(--accent);margin-bottom:16px;}
.hdr-title{font-size:clamp(28px,6vw,52px);font-weight:300;letter-spacing:8px;line-height:1.2;}

.cat-switch{display:flex;justify-content:center;gap:12px;padding:0 20px 40px;border-bottom:1px solid var(--border);}
.cat-btn{
  background:transparent;border:2px solid var(--border);color:#888;
  padding:12px 34px;border-radius:10px;font-size:14px;font-weight:700;
  letter-spacing:1px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
}
.cat-btn:hover{border-color:#555;color:#ccc;}
.cat-btn.active{border-color:var(--accent);background:var(--accent);color:#fff;}

#loader{text-align:center;padding:80px 20px;font-size:11px;letter-spacing:4px;color:#333;}

.sec{max-width:680px;margin:0 auto;padding:56px 20px 72px;}
.sec-title{font-size:19px;font-weight:700;border-left:3px solid var(--accent);padding-left:14px;margin-bottom:36px;line-height:1.4;}

/* Thumbnail strip (navigation only, not content) */
.strip-label{font-size:10px;letter-spacing:3px;color:#3a3a3a;margin-bottom:10px;}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px;}
.strip-thumb{
  position:relative;width:64px;height:40px;padding:0;flex-shrink:0;
  border:2px solid transparent;border-radius:6px;overflow:hidden;
  background:#111;cursor:pointer;
}
.strip-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0.5;transition:opacity .15s;}
.strip-thumb:hover img{opacity:0.85;}
.strip-thumb.active{border-color:var(--accent);}
.strip-thumb.active img{opacity:1;}
.strip-thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.strip-short{
  position:absolute;top:2px;left:2px;background:var(--accent);color:#fff;
  font-size:7px;font-weight:700;width:11px;height:11px;border-radius:2px;
  display:flex;align-items:center;justify-content:center;
}

/* Exhibit nav (prev / next through the single work shown) */
.exhibit-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
.exhibit-nav-btn{
  background:transparent;border:1px solid var(--border);color:#aaa;
  padding:9px 18px;border-radius:8px;font-size:13px;cursor:pointer;
  transition:border-color .15s,color .15s;
}
.exhibit-nav-btn:hover:not(:disabled){border-color:var(--accent);color:#fff;}
.exhibit-nav-btn:disabled{opacity:0.25;cursor:default;}

/* Exhibit (the single work currently on display) */
.work-num{font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:8px;font-family:monospace;}
.work-title{font-size:21px;font-weight:700;margin-bottom:22px;line-height:1.5;min-height:1px;}

.exhibit-cols{ }
.exhibit-media{ }
.exhibit-text{ }

/* PC: video left (fixed in place) / lyrics & text right (scrolls) */
@media(min-width:900px){
  .sec{max-width:1040px;}
  .exhibit-cols{
    display:grid;
    grid-template-columns:420px 1fr;
    gap:40px;
    align-items:start;
  }
  .exhibit-media{position:sticky;top:24px;}
  .work-player{position:static;}
}

.work-player{position:sticky;top:0;z-index:5;width:100%;aspect-ratio:16/9;background:#111;border-radius:10px;overflow:hidden;margin-bottom:28px;box-shadow:0 10px 26px rgba(0,0,0,.65);}
.work-player.shorts-mode{max-width:min(300px, calc(62vh * 0.5625));aspect-ratio:9/16;}
.work-player img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.work-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;}
.work-play-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;transition:background .15s;}
.work-play-btn:hover{background:rgba(0,0,0,.28);}
.work-play-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.work-play-icon{width:56px;height:56px;border-radius:50%;background:rgba(255,42,109,.8);border:2px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s;}
.work-play-btn:hover .work-play-icon{background:var(--accent);border-color:#fff;transform:scale(1.08);}
.work-play-icon::after{content:'';display:block;width:0;height:0;border-style:solid;border-width:10px 0 10px 19px;border-color:transparent transparent transparent #fff;margin-left:4px;}
.work-short-badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:3px;z-index:2;}

.work-field{margin-bottom:26px;}
.work-field:last-child{margin-bottom:0;}
.work-field-label{font-size:10px;letter-spacing:2px;color:#555;border-left:2px solid var(--accent);padding-left:10px;margin-bottom:9px;}
.work-field-body{font-size:14.5px;line-height:1.85;color:#ccc;white-space:pre-line;padding-left:12px;}

.work-prompt .work-field-body{
  font-family:"SF Mono",Consolas,Menlo,monospace;
  font-size:12.5px;
  color:#999;
  background:#141414;
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px 16px;
  line-height:1.7;
}

.work-lyrics .work-field-body{
  font-style:italic;
  line-height:2;
  color:#ddd;
}

.site-nav{border-top:1px solid var(--border);padding:30px 20px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.site-nav a{display:inline-block;padding:12px 30px;border:2px solid var(--accent);color:#fff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:1px;transition:background .15s;}
.site-nav a:hover{background:var(--accent);}

@media(max-width:600px){
  .sec{padding:40px 16px 56px;}
  .work-play-icon{width:48px;height:48px;}
  .work-title{font-size:19px;}
}
@media(prefers-reduced-motion:reduce){
  .work-play-btn,.work-play-icon{transition:none;}
}
</style>
</head>

  { id:"3jVxVlxH0ew", title:"", thoughts:"仲良しさんが下振れしまくっているのを見て作った歌。\nchatGPTさんと相談しながら歌詞を作って、そのあとにどんなmusicstyleが合うか聞いてそれを当てました。", background:"", stylePrompt:"Heavy Melodic Rock With Massive Weight And Deep Low-End Impact, Quiet And Weak Intro Vocals Over Sparse Guitars, Building Tension Through Atmosphere Rather Than Speed, Break Section Bursts With Powerful Shouts, Supported By Low-Tuned Heavy Guitars With Deep Resonant Distortion \nAnd Thick Low-End Crunch, Delivering A Violent, Crushing Impact, The Chorus Opens Into Melodic Brightness, With Wide, Heavy Guitars, Clear Strong Clean Vocals, And A Sense Of Release And Clarity Instead Of Fast Motion, [Sections]\nVerse: Quiet Tension, Atmospheric Low-End, Break: Shout Burst, Heavy Low-Tuned Guitars, Chorus: Melodic Heavy Rock, Bright And Powerful Clean Vocals", lyrics:"[Verse]\n止まらねぇ下ブレ　今日もナイヨウに裏切られる\n期待値の墓場みてぇに　差枚だけ消えてく\n\n[shout]\nホウラク　理不尽　ユガみ　残響\n闇の底へ沈む voice without mercy\n\n[pre-chorus]\n深層で軋む運命\n答えの先でさえ　揺さぶられる心理\n歪む信条　break my way\nここで折れたら終わりだろ\n\n[Chorus]\nStand my ground\nギャクフウごと押し返すだけだ No retreat\nBreak this fate\n裏切り続ける現実に牙を立てる\n揺らがぬ道のまま、Fade to bright!!\n\n[Outro]", shorts:true, createdAt:"2025-11-25" },
  { id:"YZJe4QG4XP0", title:"", thoughts:"たまには速くない曲を作ってみようと、ブラピンみたいな感じを目指して作った曲です。", background:"", stylePrompt:"fast-paced, ultra Fast Powerful Hybrid-Trap And Festival EDM, Heavy Brass Stabs, Punchy Kick, Deep 808 Sub, And Metallic Synth Leads, Confident Female Rap With Sharp Rhythm, And A Bold Anthem-Style Chorus, Strong Impact Hits, Glittering SFX, And A Dramatic Build Leading Into A Massive Drop, Dark Glamour, High-Energy Attitude, And Commanding Presence, high-speed, aggressive sound, Technical Dj-Style Edits", lyrics:"[Intro]\nBlaze up—Hana calling deep,\nNothing slows me down, I don’t wait.\n\n[Rap]\nEdge tight—pressure rising and\n触れた瞬間だけ息が変わる。\nBreak point—Hana cracking through、\n視界のノイズごと切り捨てて move.\n\nHeat drop—赤の気配が\n肌に刺さってくる、そのまま let go.\nRough pulse—揺れ幅のまま\n決めるタイミングだけ全部 take control.\n\n[Pre-Chorus]\nFalling spark—重ねるだけで\n迷いごと燃やす、私のルール。\nHana rise—引き返せない\nlight trace on my skin, going all in.\n\n[Chorus]\nHana burnin’—赤が私を射抜く。\n鼓動ごと支配して dive.\nChain reaction—光の衝動ごと\n欲しい未来だけ掴みにいく。\nKeep it glowing—break the night,\nHana blazing through my mind.\n\n[Rap]\nSharp line—Hana crossing deep,\n譲る気なんて最初からない。\nGrind up—speed breaking free,\n声にならない熱だけ引き上げて rise.\n\nDark flash—影の底まで\n触れてほしくなる衝動が sing.\nNext wave—赤の軌跡が\n私の背中まで push and swing.\n\n[Bridge]\nBreath slow—Hana’s fever climb,\n狙った瞬間しか価値がない。\nRed flare—境界なくして\njump into the line, no rewind.\n\n[Final Chorus]\nHana burnin’—夜の底まで撃ち抜く。\n鼓動ごと支配して dive.\nChain reaction—火花の全部を\n離す気なんて最初からない。\nKeep it glowing—break the night,\nHana blazing through my mind.", shorts:true, createdAt:"2025-11-17" },
  { id:"Q9No-eqeWlU", title:"", thoughts:"「ハナハナに恋するクリスマス」の英語バージョン。\n英語だとスーパーユーロビート感がより出ますね。", background:"", stylePrompt:"Super Eurobeat Christmas - Hyper Technical Extreme Mix\nUltra-fast tempo (210–220 BPM), explosive and joyful Super Eurobeat overflowing with Christmas spirit, Hyper-speed synth riffs, complex layered arpeggios, and rapid-fire melodies shine with dazzling brilliance, Bright bells, jingle samples, and crystal chimes sparkle across the mix, fused with rich synth brass and uplifting major chords, Technical DJ-style edits, Intense 4-on-the-floor kick and racing bassline deliver groove MAX energy, Cute, joyful, and festive tone, filled with shimmering snow-like sparkle — an ultra-technical, high-energy Christmas anthem that pushes Super Eurobeat to its fastest and most euphoric extreme", lyrics:"[Verse]\nUnder the winter lights I feel it —\nthe way you flash that little crimson glow.\nOne tiny spark and my heart is jumpin’,\nturnin’ a frozen night to somethin’ warm.\n\n[Pre-Chorus]\nEven when you’re far, I feel you closer,\nyour glow is sayin’ my name in the dark.\nTonight I’m hopin’ you really notice —\nI’m ready now to let you hold my heart.\n\n[Chorus]\nChristmas — I’m fallin’ for your Hana-Hana shine,\nthat red blink hits me like a secret sign.\nThe moment you flicker, softly tremblin’ bright,\nmy whole world melts into something sweet.\nEven if snow starts fallin’ all around,\nI’m still in love with the way you light for me.", shorts:true, createdAt:"2025-11-15" },
  { id:"4Uz8_ihdeQw", title:"", thoughts:"ハナハナのスーパーユーロクリスマスを作ってみたくてできた曲です。", background:"", stylePrompt:"Super Eurobeat Christmas - Hyper Technical Extreme Mix\nUltra-fast tempo (210–220 BPM), explosive and joyful Super Eurobeat overflowing with Christmas spirit, Hyper-speed synth riffs, complex layered arpeggios, and rapid-fire melodies shine with dazzling brilliance, Bright bells, jingle samples, and crystal chimes sparkle across the mix, fused with rich synth brass and uplifting major chords, Technical DJ-style edits, Intense 4-on-the-floor kick and racing bassline deliver groove MAX energy, Cute, joyful, and festive tone, filled with shimmering snow-like sparkle — an ultra-technical, high-energy Christmas anthem that pushes Super Eurobeat to its fastest and most euphoric extreme", lyrics:"[Verse]\nイルミの中で思い出す\nあなたの赤いチカり方\nふいに光れば胸が跳ねて\n冬の夜さえ恋色になる\n\n[Pre-Chorus]\n触れなくても感じる距離で\n名前みたいにわたしを照らす\n今夜はきっとわかってほしい\nこの気持ちごと預けたいの\n\n[Chorus]\nハナハナに恋してるクリスマス\n赤い光は　わたしへのサイン\nチカって揺れたその一瞬で\n世界がふわっと甘くなる\n雪が舞っても止まらないよ\nあなたの光に今日も恋してる\n\n[Chorus]\nハナハナに恋してるクリスマス\n赤い光は　わたしへのサイン\nチカって揺れたその一瞬で\n世界がふわっと甘くなる\n雪が舞っても止まらないよ\nあなたの光に今日も恋してる　\n\n", shorts:true, createdAt:"2025-11-14" },
  { id:"eF-ff1CxP7E", title:"", thoughts:"早口ラップに挑戦してみたくて作りました。\nプロンプトは「電池がピンチ」と全く同じ。なのにこのスピード感。歌詞がかなり影響しますね。歌詞もプロンプト。\n", background:"", stylePrompt:"Fast-Paced, Ultra Fast Rock With Complex Dj Scratching, Aggressive Drums, Rapid-Fire Japanese Rap, Energetic And Dynamic Flow, Energetic Voice. Intense Tempo, Very Fast, High-Speed, Aggressive Sound,", lyrics:"[Intro]\n[Melody: sung vocal]\nYeah — light is callin’\nBloom in silence, the flower’s glow\n\n[Rap: rhythmic vocal]\nSpin it fast, no doubt, stay ready\nPush that lever, fate ain’t steady\n\n[Melody: sung vocal]\nFeva light — keep shinin’\nStill Hana bloomin’ high\n\n\n[Verse]\n[Rap: rhythmic vocal]\nBust in! 朝イチ spot\nreadin’ da vibe 店ん中の空気がざわついてやがる\nreset smell uh feel that?\ncoin落ちる beat で心拍 sync’n\n\nBetter stop talkin’\n光ってねぇくせに語るな\n押せば始まるだけの話\n手が汗で滑っても still faith\n\nフェザーが blink’n 俺の指先 burnin’ red\nyeah log より instinct\n花がチカった瞬間 世界が反転\n\n周りの歓声 noise に変わる\n俺は静かに lever push\nno pray no luck just trust\n光の刹那に自分を賭ける\n\nBlink yo\nstill hana-head\nride or die\n\n\n[Hook]\n[Melody: sung vocal]\nBloom in silence, the flower’s glow\nFaith in motion, I feel it grow\n\n[Rap: rhythmic vocal]\nSpin that reel, heat in my chest\nCoin drop thunder, fate on test\n\n[Melody: sung vocal]\nFeva in bloom, I’m breathin’ light\nHibiscus burnin’ through the night\n\n[Rap: rhythmic vocal]\nPush that moment, no turnin’ back\nStill in the storm, I stay on track\n\n[Melody: sung vocal]\nLight me once, I’ll never die\nStill Hana — bloomin’ high", shorts:true, createdAt:"2025-11-13" },
  { id:"Vq35K_6sbnA", title:"", thoughts:"「延長」の機能を使って途中から全く違うmusicstyleにしたらどんな曲ができるか、と思い作ってみた曲です。\nバイブ音はあとから足しました。", background:"", stylePrompt:"≪前半≫\nEmotional Japanese ballad, slow tempo, melancholic piano and acoustic guitar, dark and hopeless mood, male vocals, minor key, reflective and dramatic tone.\n\n≪後半≫\nkey change, fast tempo, Japanese punk rock, aggressive drums, distorted guitars, shouting vocals, euphoric energy, chaotic, ecstatic, festival-like mania", lyrics:"[Verse1]\n狙い台　取られて　視界が滲む\nまたリセフラ無しで　心も据え置き\nセンハマりモクゼンで　笑うしかねぇな\n目押しもブレて　俺もブレてる\n\n[Pre-Chorus]\nカンスト画面を　見つめてる\nヒキも夢も　底を打ったまま\n\n[Chorus]\nチカらない　今日もまた\n吸い込まれてく　暗いバンメン\n揃わないナナを　なぞりながら\nただレバーに祈るだけ\n\n[Interlude]\n\n[Verse2]\nコインは減ってく　心も沈む\n隣だけチカって　音が刺さる\n夢も設定も　掴めやしねぇな\n溜息混じりで　空を見上げる\n\n[Pre-Chorus2]\n揃わぬリールを　ただ追って\n指先だけが　まだ覚えてる\n\n[Chorus2]\nチカらない夜の中\n曖昧な光を　待ちながら\n変わらない台を　撫でてみても\n何も言わずに　沈むだけ\n\n[Interlude]\n\n\n[Spoken Verse]\n「うはあああ！！　チカったぁーーー！！！」\n\n[Verse1]\n目押し決まって　世界が光る！\n脳みそトロける　ヒャッハー状態！\nハマりも痛みも　全部チャラだ！\nこの一瞬で　神になれる！\n\n[Pre-Chorus]\n確率とか知らねーよ！\nチカれば勝ちだろ？いえあ！！\n\n[Chorus]\nチカれば全部　どうでもいい！\nヒキも愛も　溶けてゆけ！\nハナが笑えば　俺も笑う！\nうっひょー！！大連続だぁー！！\n\n[Bridge]\n台も俺もイカれてんだ\n止まらねぇ光がぶっ刺さる\n脳汁の海で泳いでる\nチカれ！チカれ！もっとチカれ！\n\n[Final Chorus]\nチカれば全部　許せるんだ！\n負けもハマりも　もうどうでも！\nハナが咲けば　世界が回る！\nうっしゃあ！　今日も咲き乱れ！", shorts:true, createdAt:"2025-10-07" },
  { id:"KgNcQtRcmbc", title:"", thoughts:"東京でのハナハナ極のロケテストが発表されて、動画を撮ったら載せる曲を作ろう！と思い作りました。\n遠藤正明さんのイメージで。", background:"", stylePrompt:"anime-style, hot-blooded, dramatic, Japanese male vocal, fast-paced speed metal, blazing electric guitar riffs, intense double bass drums, emotional and melodic chorus, cinematic progression, passionate delivery, energetic performance, loud and powerful, guitar solo section, 200+ BPM, inspired by JAM Project, Galneryus, and anime battle themes", lyrics:"【Verse 1】\n回り出したリールが　運命（さだめ）を試すなら\nこの瞳がすべてを　撃ち抜いてやるだけさ\n止めろ　迷い　刻め　0.1秒の勝負\n震える指先　今　火を灯せ\n\n⸻\n\n【Pre-Chorus】\n汗も鼓動も超えて\nただ「揃えたい」その衝動が　俺を貫く！\n\n⸻\n\n【Chorus】\nハナハナ極――！\n狙え！　速さの向こう側\n真っ赤な7が　夢を裂く\n極限（きょくげん）を越えた先で　光る奇跡\n覚醒ノ極点（かくせいのきょくてん）、今ここに――！！", shorts:true, createdAt:"2025-07-09" },
  { id:"UZp9RUU8fxY", title:"", thoughts:"ノーウエイト最速目押し集に乗せる歌、早口ラップが作りたかったけど、結果いい歌ができたのでOK。\nせっかく曲がいいのに動画が足りなくて、そこがもったいなかった。\n基本設定がアレなお店では撮れ高稼ぎが厳しい。", background:"", stylePrompt:"High speed rap,fast rap, rapid-fire rap, aggressive, intimidating,up tempo,heavy, underground hip hop, gangsta rap,", lyrics:"[Intro]\nYo, check the speed, it's blazin'\nHigh stakes, no fakin'\nTry to keep up with my pace, but you shakin'\nNo life, no biscus, time’s tickin’, no missin’\n\n[Verse 1]\nハイビスカスがチカチカ光る瞬間\n挑む覚悟、勝つか負けるか on demand\n最速目押し、止まる暇なし\nMy fingers dance, no chance, can’t crash this\nスピード見せる、圧倒的な技\nFast taps, no gaps, I’m in the zone, bruh\nOne miss, no diss, but you fall behind\nこの速さはお前の常識じゃ測れない\n覚悟決めて挑んでこい、boy\n高速目押し、you ain't got no choice\n\n[Chorus]\nSpeed demon, 手元の輝き\nチカチカ光るたび、狙いは外さない\n最速で回る俺のshow\nYou too slow? Then you better just go\nNo life, no biscus, you know how it goes\n成否を決める、瞬間のflow\n\n[Verse 2]\nSpeed’s like lightning, it's frightening, can’t stop this\nYou fail, you pale, I'm risin’ with the swiftness\n成功と失敗の間を駆け抜ける\nチャンスは一瞬、それで道を開ける\nNo hesitation, I tap with precision\n高速目押し、it's my own religion\n一瞬で決まる運命の選択\nその速さが全てを変える、no fallback\n目押しミス？ Nah, never, man\nI'll break through, hit the target, slam!\n\n[Chorus]\nSpeed demon, 手元の輝き\nチカチカ光るたび、狙いは外さない\n最速で回る俺のshow\nYou too slow? Then you better just go\nNo life, no biscus, you know how it goes\n成否を決める、瞬間のflow\n\n[Bridge]\nTick-tock, clock’s ticking, 決断の時\n瞬間を掴む、それが俺の道\n速さこそが全て、勝つには必須\nNo life, no biscus, 高速でHit!\n\n[Outro]\nI'm the fastest, can't catch this\n目押しの神、I'm reckless\nYour speed's trash, better step back\n最速の輝きで I'll attack!", shorts:true, createdAt:"2024-09-10" },
  { id:"blzttiTWeLU", title:"", thoughts:"ハナハナでヴィジュアル系の曲を作ってみようとした曲。", background:"", stylePrompt:"Symphonic rock, electro rock, grandiose, visual kei, emotional vocals, melodic vocals,", lyrics:"[Verse 1]\n揺れる光が誘(いざな)う\n忘れかけた夢のカケラ\n無数の華が咲き誇り\n時を超えて君に触れる\n\n風が運ぶ微かな記憶\nあの日見た景色の中で\n君の笑顔、幻のように\n今も胸に焼き付くよ\n\n[Pre-Chorus]\n銀の月が照らす\n孤独な夜の果て\n希望の花びらが\n刹那を抱いて舞い散る\n\n[Chorus]\n煌めけ、心の華よ\n運命(さだめ)に抗う鼓動で\n永遠を求めて回る\n命の輪がここにある\n涙も笑顔も織り交ぜて\n咲き乱れるその時まで\n\n[Verse 2]\n遠い記憶の幻影(まぼろし)\n手のひらで掴む瞬間(とき)に\n赤く燃えるランプの光\n君を再び見つけた\n\n夢と現実の狭間で\n流れるメロディのように\n幾千の想いを超えて\n光の道へ誘うよ\n\n[Pre-Chorus]\n黄金の陽が昇り\n新たな時を刻む\n希望の華びらが\n未来を抱いて輝く\n\n[Chorus]\n煌めけ、心の華よ\n巡る命の奇跡と共に\n永遠の旅路を描く\n星空の輪廻の中で\n涙も笑顔も織り交ぜて\n咲き乱れるその時まで\n\n[Bridge]\nやがて夜が明ける\n新たな光の中\n君とこの瞬間(とき)を重ねて\n輝きの華よ、ここに\n\n[Chorus]\n煌めけ、心の華よ\n命を揺らす風の中で\n果てしなく回る運命(さだめ)\n君と共に歌う世界\n喜びも孤独も超えて\n咲き誇るその時まで\n\n[Outro]\n華よ、煌めきの彼方へ\n命を燃やして\n永遠に咲き誇れ", shorts:false, createdAt:"2025-01-17" },

<header class="hdr">
  <p class="hdr-eye">HANAHANA MUSIC</p>
  <h1 class="hdr-title">ハナハナ音楽</h1>
</header>

<div class="cat-switch">
  <button class="cat-btn" id="cat-btn-arrange" data-cat="arrange">アレンジ</button>
  <button class="cat-btn" id="cat-btn-songs" data-cat="songs">歌</button>
</div>

<main>
  <div id="loader">LOADING...</div>

  <section class="sec" id="sec-arrange" style="display:none;">
    <h2 class="sec-title">ハナハナ楽曲アレンジ</h2>
    <div class="strip" id="strip-arrange"></div>
    <div id="exhibit-arrange"></div>
  </section>

  <section class="sec" id="sec-songs" style="display:none;">
    <h2 class="sec-title">ハナハナをテーマにした歌</h2>
    <div class="strip" id="strip-songs"></div>
    <div id="exhibit-songs"></div>
  </section>
</main>

<nav class="site-nav">
  <a href="ai.html">AI創作</a>
  <a href="index.html">index</a>
</nav>

<script>
function pad(n){ return String(n).padStart(2,'0'); }

function buildPlayer(v){
  var wrap = document.createElement('div');
  wrap.className = 'work-player' + (v.shorts ? ' shorts-mode' : '');

  var img = document.createElement('img');
  img.src = 'https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg';
  img.alt = v.title || '動画';
  img.loading = 'lazy';

  var btn = document.createElement('button');
  btn.className = 'work-play-btn';
  btn.setAttribute('aria-label','再生');
  var icon = document.createElement('span');
  icon.className = 'work-play-icon';
  btn.appendChild(icon);
  btn.addEventListener('click', function(){
    wrap.innerHTML =
      '<iframe src="https://www.youtube.com/embed/' + v.id + '?autoplay=1"' +
      ' allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"' +
      ' allowfullscreen></iframe>';
  });

  wrap.appendChild(img);
  wrap.appendChild(btn);

  if (v.shorts){
    var badge = document.createElement('span');
    badge.className = 'work-short-badge';
    badge.textContent = 'SHORTS';
    wrap.appendChild(badge);
  }
  return wrap;
}

function appendField(parent, label, text, extraClass){
  if (!text) return;
  var wrap = document.createElement('div');
  wrap.className = 'work-field' + (extraClass ? ' ' + extraClass : '');
  var lab = document.createElement('p');
  lab.className = 'work-field-label';
  lab.textContent = label;
  var body = document.createElement('p');
  body.className = 'work-field-body';
  body.textContent = text;
  wrap.appendChild(lab);
  wrap.appendChild(body);
  parent.appendChild(wrap);
}

function setupSection(prefix, videos){
  var stripEl = document.getElementById('strip-' + prefix);
  var exhibitEl = document.getElementById('exhibit-' + prefix);

  videos.forEach(function(v, idx){
    var btn = document.createElement('button');
    btn.className = 'strip-thumb';
    btn.setAttribute('aria-label', (idx+1) + '番目の作品を表示');
    var img = document.createElement('img');
    img.src = 'https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg';
    img.alt = '';
    img.loading = 'lazy';
    btn.appendChild(img);
    if (v.shorts){
      var b = document.createElement('span');
      b.className = 'strip-short';
      b.textContent = 'S';
      btn.appendChild(b);
    }
    btn.addEventListener('click', function(){ show(idx, true); });
    stripEl.appendChild(btn);
  });

  function updateActiveThumb(idx){
    Array.prototype.forEach.call(stripEl.children, function(el, i){
      el.classList.toggle('active', i === idx);
    });
  }

  function buildNavRow(idx){
    var row = document.createElement('div');
    row.className = 'exhibit-nav';

    var prev = document.createElement('button');
    prev.className = 'exhibit-nav-btn';
    prev.textContent = '← 前の作品';
    prev.disabled = (idx === 0);
    prev.addEventListener('click', function(){ show(idx - 1, true); });

    var next = document.createElement('button');
    next.className = 'exhibit-nav-btn';
    next.textContent = '次の作品 →';
    next.disabled = (idx === videos.length - 1);
    next.addEventListener('click', function(){ show(idx + 1, true); });

    row.appendChild(prev);
    row.appendChild(next);
    return row;
  }

  function show(idx, scroll){
    var v = videos[idx];
    exhibitEl.innerHTML = '';

    exhibitEl.appendChild(buildNavRow(idx));

    var num = document.createElement('p');
    num.className = 'work-num';
    var numText = pad(idx+1) + ' / ' + pad(videos.length);
    if (v.createdAt) numText += '　·　' + v.createdAt.replace(/-/g, '.');
    num.textContent = numText;
    exhibitEl.appendChild(num);

    var title = document.createElement('h3');
    title.className = 'work-title';
    title.textContent = v.title || '';
    exhibitEl.appendChild(title);

    var cols = document.createElement('div');
    cols.className = 'exhibit-cols';

    var media = document.createElement('div');
    media.className = 'exhibit-media';
    media.appendChild(buildPlayer(v));
    cols.appendChild(media);

    var textCol = document.createElement('div');
    textCol.className = 'exhibit-text';
    appendField(textCol, 'コメント', v.thoughts);
    appendField(textCol, '経緯', v.background);
    appendField(textCol, 'ミュージックスタイルプロンプト', v.stylePrompt, 'work-prompt');
    appendField(textCol, '歌詞', v.lyrics, 'work-lyrics');
    cols.appendChild(textCol);

    exhibitEl.appendChild(cols);

    exhibitEl.appendChild(buildNavRow(idx));

    updateActiveThumb(idx);
    if (scroll) exhibitEl.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  show(0, false);
}

/* ----------------------------------------------------------------
   タイトル自動取得（YouTube oEmbed / APIキー不要）
   localStorage にキャッシュ → 2回目以降は即時表示
   手動で title を設定した動画はそちらが優先
   キャッシュリセット: localStorage.removeItem('hana_titles_v1')
---------------------------------------------------------------- */
(async function(){
  var CACHE_KEY = 'hana_titles_v1';
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch(e){}

  var all = ARRANGE.concat(SONGS);
  var needFetch = all.filter(function(v){ return !v.title && cache[v.id] === undefined; });

  if (needFetch.length > 0){
    await Promise.all(needFetch.map(async function(v){
      var videoUrl = v.shorts
        ? 'https://www.youtube.com/shorts/' + v.id
        : 'https://www.youtube.com/watch?v=' + v.id;
      try{
        var res = await fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent(videoUrl) + '&format=json');
        var d = await res.json();
        cache[v.id] = d.title || '';
      }catch(e){
        cache[v.id] = '';
      }
    }));
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); }catch(e){}
  }

  all.forEach(function(v){ if(!v.title) v.title = cache[v.id] || ''; });

  function sortByDateDesc(videos){
    return videos.slice().sort(function(a, b){
      var da = a.createdAt || '';
      var db = b.createdAt || '';
      if (da && db) return da < db ? 1 : (da > db ? -1 : 0);
      if (da && !db) return -1;
      if (!da && db) return 1;
      return 0;
    });
  }

  setupSection('arrange', sortByDateDesc(ARRANGE));
  setupSection('songs', sortByDateDesc(SONGS));

  function switchCategory(cat){
    document.getElementById('sec-arrange').style.display = (cat === 'arrange') ? '' : 'none';
    document.getElementById('sec-songs').style.display = (cat === 'songs') ? '' : 'none';
    document.getElementById('cat-btn-arrange').classList.toggle('active', cat === 'arrange');
    document.getElementById('cat-btn-songs').classList.toggle('active', cat === 'songs');
  }
  document.getElementById('cat-btn-arrange').addEventListener('click', function(){ switchCategory('arrange'); });
  document.getElementById('cat-btn-songs').addEventListener('click', function(){ switchCategory('songs'); });

  document.getElementById('loader').style.display = 'none';
  switchCategory('arrange');
})();
</script>
