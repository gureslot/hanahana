<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画像作品 | グレイト・プレ・善太</title>
<link rel="icon" type="image/png" sizes="32x32" href="../icon_32x32.png">

<style>
:root{
  --accent:#ff2a6d;
  --bg:#0d0d0d;
  --border:#252525;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
  line-height:1.6;
}
body.lb-open{overflow:hidden;}

.hdr{padding:64px 20px 36px;text-align:center;}
.hdr-eye{font-size:10px;letter-spacing:6px;color:var(--accent);margin-bottom:16px;}
.hdr-title{font-size:clamp(28px,6vw,52px);font-weight:300;letter-spacing:8px;line-height:1.2;}

/* Category switch */
.cat-switch{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;padding:0 20px 40px;border-bottom:1px solid var(--border);}
.cat-btn{
  background:transparent;border:2px solid var(--border);color:#888;
  padding:12px 26px;border-radius:10px;font-size:14px;font-weight:700;
  letter-spacing:1px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
}
.cat-btn:hover{border-color:#555;color:#ccc;}
.cat-btn.active{border-color:var(--accent);background:var(--accent);color:#fff;}

.sec{max-width:760px;margin:0 auto;padding:52px 20px 72px;}

/* Person filter (人物タブ) */
.person-label{font-size:10px;letter-spacing:3px;color:#3a3a3a;margin-bottom:10px;}
.person-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px;}
.person-chip{
  background:transparent;border:1px solid var(--border);color:#888;
  padding:7px 16px;border-radius:999px;font-size:12.5px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.person-chip:hover{border-color:#555;color:#ccc;}
.person-chip.active{border-color:var(--accent);color:#fff;background:rgba(255,42,109,.14);}
.person-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* Navigation thumbnail strip (switches between works) */
.strip-label{font-size:10px;letter-spacing:3px;color:#3a3a3a;margin-bottom:10px;}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:44px;}
.strip-thumb{
  position:relative;width:64px;height:44px;padding:0;flex-shrink:0;
  border:2px solid transparent;border-radius:6px;overflow:hidden;
  background:#141414;cursor:pointer;color:#555;
  font-size:11px;font-family:monospace;
  display:flex;align-items:center;justify-content:center;
}
.strip-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:.5;transition:opacity .15s;}
.strip-thumb:hover img{opacity:.85;}
.strip-thumb.active{border-color:var(--accent);}
.strip-thumb.active img{opacity:1;}
.strip-thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* Exhibit navigation (prev / next through the single work shown) */
.exhibit-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.exhibit-nav-btn{
  background:transparent;border:1px solid var(--border);color:#aaa;
  padding:9px 18px;border-radius:8px;font-size:13px;cursor:pointer;
  transition:border-color .15s,color .15s;
}
.exhibit-nav-btn:hover:not(:disabled){border-color:var(--accent);color:#fff;}
.exhibit-nav-btn:disabled{opacity:.25;cursor:default;}

.work-num{font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:8px;font-family:monospace;}
.work-title{font-size:21px;font-weight:700;margin-bottom:24px;line-height:1.5;}

/* Artwork (本体 = 画像・動画) */
.artwork{margin-bottom:34px;}

/* 1点のとき：大きめに1点。縦長でも画面に収まるよう高さを制限 */
.art-hero{
  position:relative;display:block;margin:0 auto;padding:0;max-width:100%;
  border:1px solid var(--border);border-radius:12px;overflow:hidden;
  background:#141414;cursor:zoom-in;transition:border-color .15s;
}
.art-hero:hover{border-color:var(--accent);}
.art-hero img,.art-hero video{display:block;margin:0 auto;max-width:100%;max-height:78vh;width:auto;height:auto;}
.art-hero video{pointer-events:none;}
.art-hero:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* 複数のとき：一覧として画面に収まる正方形サムネイル。
   枚数が少なくても横幅いっぱいに伸びて寂しくならない（auto-fit + 1fr）。
   多いと自動で列が増える（最小 約160px = 認識できる大きさ）。 */
.art-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.art-grid-item{
  position:relative;display:block;padding:0;aspect-ratio:1/1;
  border:1px solid var(--border);border-radius:10px;overflow:hidden;
  background:#141414;cursor:zoom-in;transition:border-color .15s;
}
.art-grid-item:hover{border-color:var(--accent);}
.art-grid-item img,.art-grid-item video{width:100%;height:100%;object-fit:cover;display:block;}
.art-grid-item video{pointer-events:none;}
.art-grid-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* 動画の再生マーク */
.play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.play-badge::before{
  content:"";position:absolute;width:48px;height:48px;border-radius:50%;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.55);
}
.play-badge::after{
  content:"";position:absolute;margin-left:4px;
  border-style:solid;border-width:10px 0 10px 16px;
  border-color:transparent transparent transparent #fff;
}

/* X post (コメント／備考 — 画像より下位) */
.remark{margin-bottom:30px;}
.remark-label{font-size:10px;letter-spacing:2px;color:#555;border-left:2px solid var(--accent);padding-left:10px;margin-bottom:12px;}
.work-tweet{min-height:120px;display:flex;justify-content:flex-start;}
.work-tweet .twitter-tweet{margin:0 !important;}
.tweet-loading{
  width:100%;max-width:400px;padding:32px 20px;text-align:center;
  border:1px solid var(--border);border-radius:12px;background:#141414;
  font-size:12px;letter-spacing:1px;color:#666;line-height:1.9;
}
.tweet-loading a{display:inline-block;margin-top:12px;color:var(--accent);text-decoration:none;font-weight:700;letter-spacing:1px;}
.tweet-loading a:hover{text-decoration:underline;}

/* Text fields */
.work-field{margin-bottom:26px;}
.work-field:last-child{margin-bottom:0;}
.work-field-label{font-size:10px;letter-spacing:2px;color:#555;border-left:2px solid var(--accent);padding-left:10px;margin-bottom:9px;}
.work-field-body{font-size:14.5px;line-height:1.85;color:#ccc;white-space:pre-line;padding-left:12px;}
.work-prompt .work-field-body{
  font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12.5px;color:#999;
  background:#141414;border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;line-height:1.7;
}

/* Lightbox (全画面表示 ＋ ホイール拡大／ドラッグ移動) */
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;overflow:hidden;}
.lightbox.open{display:flex;}
.lightbox-img{
  max-width:100vw;max-height:100vh;width:auto;height:auto;display:block;
  transform-origin:0 0;will-change:transform;
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none;cursor:zoom-in;
}
.lightbox-img.zoomed{cursor:grab;}
.lightbox-img.grabbing{cursor:grabbing;}
.lightbox-video{max-width:100vw;max-height:100vh;width:auto;height:auto;display:none;background:#000;}
.lb-btn{
  position:fixed;z-index:1002;background:rgba(20,20,20,.72);border:1px solid rgba(255,255,255,.28);
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .15s,border-color .15s;line-height:1;
}
.lb-btn:hover{background:var(--accent);border-color:#fff;}
.lb-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.lb-close{top:18px;right:18px;width:46px;height:46px;font-size:24px;}
.lb-prev,.lb-next{top:50%;transform:translateY(-50%);width:52px;height:52px;font-size:24px;}
.lb-prev{left:18px;}
.lb-next{right:18px;}
.lb-counter{
  position:fixed;z-index:1002;bottom:20px;left:50%;transform:translateX(-50%);
  font-size:12px;letter-spacing:3px;color:#ccc;font-family:monospace;
  background:rgba(20,20,20,.72);padding:6px 16px;border-radius:20px;
}

/* Bottom nav */
.site-nav{border-top:1px solid var(--border);padding:30px 20px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.site-nav a{display:inline-block;padding:12px 30px;border:2px solid var(--accent);color:#fff;text-decoration:none;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:1px;transition:background .15s;}
.site-nav a:hover{background:var(--accent);}

@media(max-width:600px){
  .sec{padding:40px 16px 56px;}
  .work-title{font-size:19px;}
  .lb-prev,.lb-next{width:44px;height:44px;font-size:22px;}
  .lb-close{width:42px;height:42px;font-size:22px;}
}
@media(prefers-reduced-motion:reduce){
  .lb-btn,.art-hero,.art-grid-item,.strip-thumb img,.person-chip{transition:none;}
}
</style>

<script>
function pad(n){ return String(n).padStart(2,'0'); }
function isVideo(src){ return /\.(mp4|webm|mov)$/i.test(src || ""); }
function mediaURL(src){ return encodeURI(PATH_PREFIX + src); } // フォルダ名の空白等を安全に

/* ---- プレースホルダー画像（未配置のときに表示） ---- */
function placeholderURI(w, h, label){
  w = w || 4; h = h || 3;
  var vw = 800, vh = Math.round(vw * h / w);
  var svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="'+vw+'" height="'+vh+'" viewBox="0 0 '+vw+' '+vh+'">' +
      '<rect width="100%" height="100%" fill="#141414"/>' +
      '<rect x="10" y="10" width="'+(vw-20)+'" height="'+(vh-20)+'" fill="none" stroke="#ff2a6d" stroke-width="2" stroke-dasharray="10 8" opacity="0.55"/>' +
      '<text x="50%" y="46%" fill="#8a8a8a" font-family="monospace" font-size="26" text-anchor="middle">'+ (label || 'IMAGE') +'</text>' +
      '<text x="50%" y="57%" fill="#555" font-family="monospace" font-size="18" text-anchor="middle">ファイルを配置すると表示されます</text>' +
    '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function withPlaceholder(img, w, h, label){
  img.addEventListener('error', function onerr(){
    img.removeEventListener('error', onerr);
    img.src = placeholderURI(w, h, label);
  });
}

/* ---- Xポスト埋め込み（コメント／備考） ---- */
function whenTwttrReady(cb){
  if (window.twttr && twttr.widgets){ cb(); return; }
  var t = setInterval(function(){
    if (window.twttr && twttr.widgets){ clearInterval(t); cb(); }
  }, 120);
  setTimeout(function(){ clearInterval(t); }, 12000);
}

var tweetNodeCache = {}; // tweetId をキーに、埋め込み済みノードを再利用
function getTweetNode(work){
  if (!work.tweetId) return null;
  if (tweetNodeCache[work.tweetId]) return tweetNodeCache[work.tweetId];

  var node = document.createElement('div');
  node.className = 'work-tweet';

  var url = 'https://twitter.com/' + HANDLE + '/status/' + work.tweetId;
  var loading = document.createElement('div');
  loading.className = 'tweet-loading';
  loading.innerHTML = 'ポストを読み込み中…<br><a href="'+url+'" target="_blank" rel="noopener noreferrer">Xで見る</a>';
  node.appendChild(loading);

  whenTwttrReady(function(){
    twttr.widgets.createTweet(work.tweetId, node, {
      theme:'dark', dnt:true, conversation:'none', align:'left', width:400
    }).then(function(el){
      if (el){ if (loading.parentNode) loading.parentNode.removeChild(loading); }
      else { loading.innerHTML = 'ポストを表示できませんでした。<br><a href="'+url+'" target="_blank" rel="noopener noreferrer">Xで見る</a>'; }
    }).catch(function(){
      loading.innerHTML = 'ポストを表示できませんでした。<br><a href="'+url+'" target="_blank" rel="noopener noreferrer">Xで見る</a>';
    });
  });

  tweetNodeCache[work.tweetId] = node;
  return node;
}

/* ---- テキスト項目 ---- */
function appendField(parent, label, text, extraClass){
  if (!text) return;
  var wrap = document.createElement('div');
  wrap.className = 'work-field' + (extraClass ? ' ' + extraClass : '');
  var lab = document.createElement('p');
  lab.className = 'work-field-label';
  lab.textContent = label;
  var body = document.createElement('p');
  body.className = 'work-field-body';
  body.textContent = text;
  wrap.appendChild(lab); wrap.appendChild(body);
  parent.appendChild(wrap);
}

/* ---- 本体（画像・動画。クリックで全画面） ---- */
function makeArtButton(images, i, cls){
  var im = images[i];
  var btn = document.createElement('button');
  btn.className = cls;
  btn.setAttribute('aria-label', (i+1)+'点目を全画面表示');

  if (isVideo(im.src)){
    var v = document.createElement('video');
    v.muted = true;
    v.preload = 'metadata';
    v.playsInline = true;
    v.setAttribute('playsinline','');
    v.onerror = function(){
      v.onerror = null;
      var img = document.createElement('img');
      img.alt = im.alt || '';
      img.src = placeholderURI(16, 9, 'VIDEO');
      if (v.parentNode) v.parentNode.replaceChild(img, v);
    };
    v.src = mediaURL(im.src);
    btn.appendChild(v);
    var badge = document.createElement('span');
    badge.className = 'play-badge';
    btn.appendChild(badge);
  } else {
    var img = document.createElement('img');
    img.alt = im.alt || '';
    img.loading = 'lazy';
    withPlaceholder(img, im.w, im.h, im.alt || 'IMAGE');
    img.src = mediaURL(im.src);
    btn.appendChild(img);
  }

  btn.addEventListener('click', function(){ openLightbox(images, i); });
  return btn;
}
function buildArtwork(images){
  if (!images || !images.length) return null;
  var wrap = document.createElement('div');
  wrap.className = 'artwork';
  if (images.length === 1){
    wrap.appendChild(makeArtButton(images, 0, 'art-hero'));
  } else {
    var grid = document.createElement('div');
    grid.className = 'art-grid';
    images.forEach(function(im, i){
      grid.appendChild(makeArtButton(images, i, 'art-grid-item'));
    });
    wrap.appendChild(grid);
  }
  return wrap;
}

/* ---- ライトボックス（全画面表示 ＋ ホイール拡大／ドラッグ移動／動画再生） ---- */
var LB = {
  el:null, img:null, video:null, prev:null, next:null, counter:null,
  images:[], idx:0,
  scale:1, tx:0, ty:0, MAX:6,
  dragging:false, sx:0, sy:0
};
function lbIsVideoShown(){ return LB.video && LB.video.style.display !== 'none'; }
function lbApply(){
  LB.img.style.transform = 'translate('+LB.tx+'px,'+LB.ty+'px) scale('+LB.scale+')';
  LB.img.classList.toggle('zoomed', LB.scale > 1.001);
}
function lbResetZoom(){
  LB.scale = 1; LB.tx = 0; LB.ty = 0;
  LB.img.classList.remove('zoomed','grabbing');
  lbApply();
}
/* カーソル位置(cx,cy)を中心に factor 倍する（transform-origin:0 0 前提） */
function lbZoomAt(cx, cy, factor){
  var newScale = Math.min(LB.MAX, Math.max(1, LB.scale * factor));
  if (newScale === LB.scale) return;
  if (newScale <= 1.001){ lbResetZoom(); return; }
  var rect = LB.img.getBoundingClientRect();
  var ox = cx - rect.left, oy = cy - rect.top;
  var k = newScale / LB.scale;
  LB.tx -= ox * (k - 1);
  LB.ty -= oy * (k - 1);
  LB.scale = newScale;
  lbApply();
}
function initLightbox(){
  LB.el = document.getElementById('lightbox');
  LB.img = document.getElementById('lb-img');
  LB.video = document.getElementById('lb-video');
  LB.prev = document.getElementById('lb-prev');
  LB.next = document.getElementById('lb-next');
  LB.counter = document.getElementById('lb-counter');
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  LB.prev.addEventListener('click', function(e){ e.stopPropagation(); step(-1); });
  LB.next.addEventListener('click', function(e){ e.stopPropagation(); step(1); });

  document.addEventListener('keydown', function(e){
    if (!LB.el.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === '0') lbResetZoom();
  });

  // ホイールでカーソル位置を中心に拡大／縮小（画像のみ）
  LB.el.addEventListener('wheel', function(e){
    if (!LB.el.classList.contains('open')) return;
    if (lbIsVideoShown()) return;
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.15 : (1/1.15);
    lbZoomAt(e.clientX, e.clientY, factor);
  }, { passive:false });

  // ダブルクリックで拡大↔等倍（画像のみ）
  LB.img.addEventListener('dblclick', function(e){
    e.preventDefault();
    if (LB.scale > 1.001) lbResetZoom();
    else lbZoomAt(e.clientX, e.clientY, 2.4);
  });

  // 拡大中はドラッグで移動（画像のみ）
  LB.img.addEventListener('mousedown', function(e){
    if (LB.scale <= 1.001) return;
    e.preventDefault();
    LB.dragging = true; LB.sx = e.clientX; LB.sy = e.clientY;
    LB.img.classList.add('grabbing');
  });
  window.addEventListener('mousemove', function(e){
    if (!LB.dragging) return;
    LB.tx += (e.clientX - LB.sx);
    LB.ty += (e.clientY - LB.sy);
    LB.sx = e.clientX; LB.sy = e.clientY;
    lbApply();
  });
  window.addEventListener('mouseup', function(){
    if (!LB.dragging) return;
    LB.dragging = false;
    LB.img.classList.remove('grabbing');
  });
}
function renderLB(){
  var im = LB.images[LB.idx];
  lbResetZoom();
  LB.video.pause();

  if (isVideo(im.src)){
    LB.img.style.display = 'none';
    LB.img.removeAttribute('src');
    LB.video.style.display = '';
    LB.video.onerror = function(){
      LB.video.onerror = null;
      LB.video.style.display = 'none';
      LB.img.style.display = '';
      LB.img.src = placeholderURI(16, 9, 'VIDEO');
    };
    LB.video.src = mediaURL(im.src);
    LB.video.play().catch(function(){});
  } else {
    LB.video.style.display = 'none';
    LB.video.removeAttribute('src');
    LB.img.style.display = '';
    LB.img.onerror = function(){ LB.img.onerror = null; LB.img.src = placeholderURI(im.w, im.h, im.alt || 'IMAGE'); };
    LB.img.alt = im.alt || '';
    LB.img.src = mediaURL(im.src);
  }

  var multi = LB.images.length > 1;
  LB.prev.style.display = multi ? '' : 'none';
  LB.next.style.display = multi ? '' : 'none';
  LB.counter.style.display = multi ? '' : 'none';
  LB.counter.textContent = (LB.idx+1) + ' / ' + LB.images.length;
}
function step(d){
  LB.idx = (LB.idx + d + LB.images.length) % LB.images.length;
  renderLB();
}
function openLightbox(images, startIdx){
  LB.images = images; LB.idx = startIdx || 0;
  renderLB();
  LB.el.classList.add('open');
  LB.el.setAttribute('aria-hidden','false');
  document.body.classList.add('lb-open');
}
function closeLightbox(){
  LB.el.classList.remove('open');
  LB.el.setAttribute('aria-hidden','true');
  document.body.classList.remove('lb-open');
  LB.video.pause();
  LB.video.removeAttribute('src');
  lbResetZoom();
  LB.img.removeAttribute('src');
}

/* ---- 1カテゴリ分の個展セットアップ（人物タブ付き） ---- */
function setupCategory(cat){
  var stripEl = cat._stripEl;
  var exhibitEl = cat._exhibitEl;
  cat._filter = "";
  cat._list = [];

  // 人物タブ（データに登場する人物だけ、PERSON_ORDER の順で）
  var present = PERSON_ORDER.filter(function(p){
    return cat.works.some(function(w){
      return (w.images || []).some(function(im){ return im.person === p; });
    });
  });

  function viewList(){
    if (!cat._filter){
      return cat.works.map(function(w){ return { work:w, images:(w.images || []) }; });
    }
    var out = [];
    cat.works.forEach(function(w){
      var imgs = (w.images || []).filter(function(im){ return im.person === cat._filter; });
      if (imgs.length) out.push({ work:w, images:imgs });
    });
    return out;
  }

  function buildStrip(){
    stripEl.innerHTML = '';
    cat._list.forEach(function(entry, idx){
      var btn = document.createElement('button');
      btn.className = 'strip-thumb';
      btn.setAttribute('aria-label', (idx+1)+'番目の作品を表示');
      var extra = EXTRA[entry.work.tweetId] || {};
      var firstImg = null;
      for (var k = 0; k < entry.images.length; k++){
        if (!isVideo(entry.images[k].src)){ firstImg = entry.images[k]; break; }
      }
      var thumbSrc = extra.thumb || (firstImg && firstImg.src) || '';
      if (thumbSrc){
        var img = document.createElement('img');
        img.alt = '';
        img.loading = 'lazy';
        withPlaceholder(img, 4, 3, '');
        img.src = mediaURL(thumbSrc);
        btn.appendChild(img);
      } else {
        btn.textContent = pad(idx+1);
      }
      btn.addEventListener('click', function(){ show(idx, true); });
      stripEl.appendChild(btn);
    });
  }

  function updateActiveThumb(idx){
    Array.prototype.forEach.call(stripEl.children, function(el, i){
      el.classList.toggle('active', i === idx);
    });
  }

  function buildNavRow(idx){
    var row = document.createElement('div');
    row.className = 'exhibit-nav';
    var prev = document.createElement('button');
    prev.className = 'exhibit-nav-btn';
    prev.textContent = '← 前の作品';
    prev.disabled = (idx === 0);
    prev.addEventListener('click', function(){ show(idx-1, true); });
    var next = document.createElement('button');
    next.className = 'exhibit-nav-btn';
    next.textContent = '次の作品 →';
    next.disabled = (idx === cat._list.length - 1);
    next.addEventListener('click', function(){ show(idx+1, true); });
    row.appendChild(prev); row.appendChild(next);
    return row;
  }

  function show(idx, scroll){
    var entry = cat._list[idx];
    if (!entry) return;
    var work = entry.work;
    var extra = EXTRA[work.tweetId] || {};
    exhibitEl.innerHTML = '';
    exhibitEl.appendChild(buildNavRow(idx));

    var num = document.createElement('p');
    num.className = 'work-num';
    var numText = pad(idx+1) + ' / ' + pad(cat._list.length);
    if (extra.createdAt) numText += '　·　' + extra.createdAt.replace(/-/g, '.');
    num.textContent = numText;
    exhibitEl.appendChild(num);

    if (extra.title){
      var title = document.createElement('h3');
      title.className = 'work-title';
      title.textContent = extra.title;
      exhibitEl.appendChild(title);
    }

    // 本体：画像・動画（人物で絞り込み中は、その人物の分だけ）
    var art = buildArtwork(entry.images);
    if (art) exhibitEl.appendChild(art);

    // コメント／備考：Xポスト
    var tnode = getTweetNode(work);
    if (tnode){
      var remark = document.createElement('div');
      remark.className = 'remark';
      var rlab = document.createElement('p');
      rlab.className = 'remark-label';
      rlab.textContent = 'Xでの投稿';
      remark.appendChild(rlab);
      remark.appendChild(tnode);
      exhibitEl.appendChild(remark);
    }

    // 任意のテキスト
    appendField(exhibitEl, 'コメント', extra.thoughts);
    appendField(exhibitEl, '経緯', extra.background);
    appendField(exhibitEl, 'プロンプト', extra.prompt, 'work-prompt');

    exhibitEl.appendChild(buildNavRow(idx));

    updateActiveThumb(idx);
    if (scroll) exhibitEl.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function updateChips(){
    if (!cat._chips) return;
    cat._chips.forEach(function(c){
      c.el.classList.toggle('active', c.value === cat._filter);
    });
  }

  function applyFilter(p, scroll){
    cat._filter = p || '';
    cat._list = viewList();
    buildStrip();
    updateChips();
    if (cat._list.length) show(0, !!scroll);
    else exhibitEl.innerHTML = '';
  }

  if (present.length){
    var plabel = document.createElement('p');
    plabel.className = 'person-label';
    plabel.textContent = 'PERSON';
    var prow = document.createElement('div');
    prow.className = 'person-row';
    cat._chips = [];

    var chipDefs = [{ label:'すべて', value:'' }].concat(present.map(function(p){ return { label:p, value:p }; }));
    chipDefs.forEach(function(def){
      var chip = document.createElement('button');
      chip.className = 'person-chip';
      chip.textContent = def.label;
      chip.addEventListener('click', function(){ applyFilter(def.value, false); });
      cat._chips.push({ el:chip, value:def.value });
      prow.appendChild(chip);
    });

    cat._personWrap.appendChild(plabel);
    cat._personWrap.appendChild(prow);
  }

  applyFilter('', false);
}

/* ---- カテゴリ切り替えUIとセクションを配列から自動生成 ---- */
function buildUI(categories){
  var switchEl = document.getElementById('cat-switch');
  var sectionsEl = document.getElementById('sections');

  categories.forEach(function(cat){
    var btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = cat.label;
    btn.addEventListener('click', function(){ activate(cat.key); });
    cat._btn = btn;
    switchEl.appendChild(btn);

    var sec = document.createElement('section');
    sec.className = 'sec';

    var personWrap = document.createElement('div');

    var lbl = document.createElement('p');
    lbl.className = 'strip-label';
    lbl.textContent = 'WORKS';

    var strip = document.createElement('div');
    strip.className = 'strip';

    var exhibit = document.createElement('div');

    sec.appendChild(personWrap);
    sec.appendChild(lbl);
    sec.appendChild(strip);
    sec.appendChild(exhibit);
    sectionsEl.appendChild(sec);

    cat._sec = sec;
    cat._personWrap = personWrap;
    cat._stripEl = strip;
    cat._exhibitEl = exhibit;
  });

  categories.forEach(setupCategory);

  function activate(key){
    categories.forEach(function(c){
      var on = (c.key === key);
      c._sec.style.display = on ? '' : 'none';
      c._btn.classList.toggle('active', on);
    });
  }

  if (categories.length) activate(categories[0].key);
}

/* ---- 起動 ---- */
initLightbox();
buildUI(CATEGORIES);
</script>
