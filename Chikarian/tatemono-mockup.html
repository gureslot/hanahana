<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>チカリアン 建物</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');
  :root{ --gold-hi:#fff3c8; --gold:#e8c25a; --panel:rgba(20,11,16,.9); --border:1.5px solid rgba(232,194,90,.5); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{font-family:'Shippori Mincho','Yu Mincho',serif; color:var(--gold-hi); background:#070409; overflow:hidden;}
  img{-webkit-user-drag:none; user-select:none;}
  .root{position:relative; width:100%; max-width:480px; margin:0 auto; height:100dvh; overflow:hidden;
        background:#0a0509 radial-gradient(80% 45% at 50% 0%, rgba(120,90,40,.2), transparent 60%); display:flex; flex-direction:column;}
  .head{flex:none; text-align:center; padding:16px 16px 4px;}
  .head .t{font-size:19px; font-weight:800; letter-spacing:4px; text-shadow:0 2px 6px #2a1500,0 0 16px rgba(255,170,70,.35);}
  .head .s{font-size:11px; color:#cdb488; letter-spacing:1px; margin-top:5px;}
  .res{position:absolute; top:16px; right:14px; background:var(--panel); border:var(--border); border-radius:13px; padding:6px 12px; font-size:12px; z-index:5;} .res b{color:#ffe39a;}

  .list{flex:1; overflow-y:auto; padding:10px 16px 90px;}
  .bld{display:flex; gap:13px; background:var(--panel); border:var(--border); border-radius:14px; padding:13px; margin-bottom:12px; box-shadow:0 3px 12px rgba(0,0,0,.4); cursor:pointer;}
  .bIcon{flex:none; width:66px; height:66px; border-radius:12px; overflow:hidden; border:1px solid rgba(232,194,90,.5); background:#1c1218; position:relative;}
  .bIcon img{width:100%; height:100%; object-fit:cover;} .bIcon .ph{position:absolute; inset:0; display:grid; place-items:center; font-size:28px; color:#7a5a3a;}
  .bInfo{flex:1; min-width:0;}
  .bTop{display:flex; align-items:center; gap:8px;}
  .bName{font-size:16px; font-weight:800; letter-spacing:1px;}
  .bLv{font-size:11px; color:#ffd98a; background:rgba(255,210,120,.12); border:1px solid rgba(255,210,120,.4); border-radius:8px; padding:1px 8px;}
  .bDesc{font-size:12px; color:#cdb488; line-height:1.7; margin-top:6px;}
  .bEffect{font-size:12px; color:#9fe0a0; margin-top:5px;}
  .bAct{display:flex; flex-direction:column; gap:7px; margin-top:10px; align-items:flex-start;}
  .bActRow{display:flex; gap:8px; align-items:center;}
  .upCost{display:block;}
  .upBtn{font-family:inherit; font-weight:800; font-size:13px; letter-spacing:1px; color:#2a160a; border:none; padding:8px 16px; border-radius:18px; cursor:pointer; background:linear-gradient(180deg,#ffe49a,#e8b54d 60%,#b9842f);}
  .upBtn:active{transform:translateY(1px);} .upCost{font-size:11px; color:#cdb488;} .upCost b{color:#ffe39a;}
  .maxed{font-size:12px; color:#9a8c70;}
  .enter{font-family:inherit; font-size:12px; color:var(--gold-hi); background:rgba(255,255,255,.05); border:1px solid rgba(232,194,90,.4); border-radius:18px; padding:8px 14px; cursor:pointer;}

  .back{position:absolute; z-index:7; left:14px; bottom:14px; font-family:inherit; font-size:14px; letter-spacing:1px; color:var(--gold-hi); background:var(--panel); border:var(--border); border-radius:22px; padding:10px 20px; cursor:pointer;}
  .toast{position:absolute; z-index:20; left:50%; top:44%; transform:translate(-50%,-50%) scale(.9); background:var(--panel); border:var(--border); border-radius:14px; padding:14px 22px; text-align:center; font-size:13px; opacity:0; pointer-events:none; transition:.25s;}
  .toast.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
</style>
<script src="./cksound.js"></script>
</head>
<body>
<div class="root">
  <div class="head"><div class="t">建物</div><div class="s">拠点の施設を強化して部隊を支える</div></div>
  <div class="res">メダル <b id="medal">1,240</b></div>
  <div class="list" id="list"></div>
  <button class="back" id="back">‹ 戻る</button>
  <div class="toast" id="toast"></div>
</div>
<script>
  const $=s=>document.getElementById(s); const fmt=n=>n.toLocaleString();
  let medal=1240;
  // 建物4種（確定）。効果文・数値は仮。
  const BLD=[
    { key:'shuren', icon:'ic_tatemono_shuren', name:'修練場', lv:3, max:10, noUpgrade:true,
      desc:'固定の的に対してデッキの威力を試せる。消費なし。結果はその場限りで残らない。', effect:()=>'効果：なし（威力試験）', enter:true },
    { key:'kaji', icon:'ic_tatemono_kaji', name:'鍛冶場', lv:2, max:10,
      desc:'装備パワーを生産する。レベルが上がるほど生産量と速度が上がる。', effect:(lv)=>`効果：生産量 +${lv*5}％ ／ 速度 +${lv*4}％（仮）` },
    { key:'kenkyu', icon:'ic_tatemono_kenkyu', name:'研究塔', lv:1, max:10,
      desc:'生産できる装備パワーの上級ランクを研究で解放する。', effect:(lv)=>`効果：解放ランク 〜${['—','Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ','Ⅹ'][lv]}（仮）` },
    { key:'souko', icon:'ic_tatemono_souko', name:'倉庫', lv:4, max:10,
      desc:'報酬・装備パワーの保管上限を増やす。', effect:(lv)=>`効果：保管上限 ${fmt(10000+lv*5000)}（仮）` },
  ];
  function cost(b){ return 300 + b.lv*250; } // 強化費（仮）

  function render(){
    $('medal').textContent=fmt(medal);
    $('list').innerHTML=BLD.map((b,i)=>`
      <div class="bld" data-i="${i}">
        <div class="bIcon"><div class="ph">🏛</div><img src="./images/${b.icon}.png" alt="" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()"></div>
        <div class="bInfo">
          <div class="bTop"><span class="bName">${b.name}</span>${b.noUpgrade?'':`<span class="bLv">Lv ${b.lv}${b.lv>=b.max?'（最大）':''}</span>`}</div>
          <div class="bDesc">${b.desc}</div>
          <div class="bEffect">${b.effect(b.lv)}</div>
          <div class="bAct">
            ${b.noUpgrade
              ? (b.enter?'<div class="bActRow"><button class="enter" data-enter="'+i+'">入る</button></div>':'')
              : (b.lv>=b.max ? '<span class="maxed">レベル最大</span>'
                : `<div class="bActRow"><button class="upBtn" data-up="${i}">強化</button>${b.enter?'<button class="enter" data-enter="'+i+'">入る</button>':''}</div><span class="upCost">消費 <b>${fmt(cost(b))}</b> メダル → Lv ${b.lv+1}</span>`)}
          </div>
        </div>
      </div>`).join('');
    $('list').querySelectorAll('[data-up]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); up(+el.dataset.up); }));
    $('list').querySelectorAll('[data-enter]').forEach(el=>el.addEventListener('click',(e)=>{ e.stopPropagation(); toast(BLD[+el.dataset.enter].name+'（試験場は後日実装）'); }));
  }
  function up(i){ const b=BLD[i]; const c=cost(b); if(b.lv>=b.max) return;
    if(medal<c){ toast('メダルが足りません'); return; }
    medal-=c; b.lv++; render(); toast(b.name+' を Lv'+b.lv+' に強化しました'); }
  function toast(t){ $('toast').textContent=t; const el=$('toast'); el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1500); }
  render();
  $('back').addEventListener('click',()=>{ location.href='./home-mockup.html'; });
</script>
</body>
</html>
