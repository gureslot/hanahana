<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>チカリアン 開発確認コンソール</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; line-height: 1.6; }
    button { font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid #888; cursor: pointer; background:#fff; }
    input { font-size: 15px; padding: 6px 8px; width: 80px; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
    .box { border: 1px solid #ddd; border-radius: 12px; padding: 16px 20px; margin: 14px 0; }
    .err { color: #c00; white-space: pre-wrap; }
    .ok { color: #167c2e; }
    .row { margin: 6px 0; }
    .kv { display:flex; gap:14px; flex-wrap:wrap; }
    .kv span { background:#f7f7f7; border-radius:8px; padding:4px 10px; }
    h3 { margin: 6px 0; }
  </style>
</head>
<body>
  <h2>チカリアン 開発確認コンソール</h2>
  <p>RPCの動作確認用（本番SPAは④で別途作成）。ログイン→初期化→各RPCを叩いて結果を見る。</p>

  <div id="auth" class="box">読み込み中…</div>

  <div id="panel" class="box" style="display:none;">
    <h3>profiles 状態</h3>
    <div id="state" class="kv"></div>
    <div class="row"><button id="refresh">状態を更新</button></div>

    <hr>
    <h3>採取 claim_saishu</h3>
    <div class="row">
      点滅回数 n = <input id="n" type="number" value="5" min="1" />
      <button id="saishu">採取する（+10×n）</button>
    </div>
    <div id="saishuMsg" class="row"></div>
  </div>

  <div id="err" class="err"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ▼▼▼ 自分の値に書き換える（前のテストページと同じ値でOK。値入りはチャット/公開repoに貼らない）▼▼▼
    const SUPABASE_URL      = "ここに Project URL";       // 例: https://xxxxxxxx.supabase.co
    const SUPABASE_ANON_KEY = "ここに Publishable key";   // sb_publishable_... ※service_roleは使わない
    // ▲▲▲

    const { createClient } = window.supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);

    function showErr(m){ $("err").textContent = m ? ('エラー: ' + m) : ''; }

    function renderState(p){
      if(!p){ $("state").innerHTML = '<span>profile未取得</span>'; return; }
      $("state").innerHTML =
        '<span>チカリウム: <b>'+p.chikarium+'</b></span>' +
        '<span>本日採取: '+p.saishu_today+' / 1000</span>' +
        '<span>メダル: '+p.medal+'</span>' +
        '<span>クリスタル 青'+p.crystal_blue+'/赤'+p.crystal_red+'/虹'+p.crystal_rainbow+'</span>' +
        '<span>保証石: '+p.hoshou_stone+'</span>' +
        '<span>クリア面: '+p.cleared_stage+'</span>';
    }

    async function loadProfile(){
      const { data, error } = await sb.rpc('initialize_profile'); // get-or-create
      if(error){ showErr(error.message); return null; }
      return Array.isArray(data) ? data[0] : data;
    }

    async function refresh(){
      showErr('');
      const p = await loadProfile();
      renderState(p);
    }

    async function doSaishu(){
      showErr('');
      const n = parseInt($("n").value, 10);
      const { data, error } = await sb.rpc('claim_saishu', { n });
      if(error){ $("saishuMsg").innerHTML = '<span class="err">'+error.message+'</span>'; return; }
      $("saishuMsg").innerHTML = '<span class="ok">+'+data.granted+' 付与（残り枠 '+data.daily_remaining+'）</span>';
      renderState({ // 表示だけ即更新（chikarium/saishu_todayはRPC結果から）
        chikarium:data.chikarium, saishu_today:data.saishu_today,
        medal:'-', crystal_blue:'-', crystal_red:'-', crystal_rainbow:'-', hoshou_stone:'-', cleared_stage:'-'
      });
      await refresh(); // 全項目を取り直し
    }

    async function render(){
      try{
        const { data: { session } } = await sb.auth.getSession();
        if(!session){
          $("panel").style.display='none';
          $("auth").innerHTML = '<p>未ログイン</p><button id="login">Google でログイン</button>';
          $("login").onclick = async () => {
            const redirectTo = location.origin + location.pathname;
            const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo } });
            if(error) showErr(error.message);
          };
          return;
        }
        const u = session.user;
        $("auth").innerHTML =
          '<p class="ok">✅ ログイン中</p><p>email: '+(u.email??'(なし)')+'</p>'+
          '<p>uid: <code>'+u.id+'</code></p><button id="logout">ログアウト</button>';
        $("logout").onclick = async () => { await sb.auth.signOut(); location.href = location.origin+location.pathname; };
        $("panel").style.display='block';
        $("refresh").onclick = refresh;
        $("saishu").onclick = doSaishu;
        await refresh();
      }catch(e){ showErr(String(e&&e.message?e.message:e)); }
    }

    sb.auth.onAuthStateChange(() => render());
    render();
  </script>

  <!--
    使い方:
    1) SQL Editor で 0003_claim_saishu.sql を実行（0001/0002 は実行済み前提）
    2) 上の2行を自分の値に書き換え
    3) フォルダで  python -m http.server 8000 --bind 127.0.0.1
       ブラウザで  http://127.0.0.1:8000/chikarian-dev.html
    4) ログイン → チカリウム300 表示
    5) n=5 で「採取する」→ +50 付与・チカリウム350・本日採取50/1000 になればOK
       上限1000まで採取すると granted=0・残り枠0 になる（正常）
  -->
</body>
</html>
