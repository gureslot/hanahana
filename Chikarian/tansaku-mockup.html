<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>チカリアン 探索</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');
  :root{ --gold-hi:#fff3c8; --gold:#e8c25a; --panel:rgba(18,10,14,.86); --border:1.5px solid rgba(232,194,90,.55); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{font-family:'Shippori Mincho','Yu Mincho',serif; color:var(--gold-hi); background:#070409; overflow:hidden;}
  img{-webkit-user-drag:none; user-select:none;}

  .root{position:relative; width:100%; max-width:480px; margin:0 auto; height:100dvh; overflow:hidden; background:#070409;}
  .map{position:absolute; inset:0; z-index:0; background:#070409 url('./images/tansaku_map_1.png') center/cover no-repeat;}
  .mapDim{position:absolute; inset:0; z-index:1; pointer-events:none;
          background:linear-gradient(180deg, rgba(0,0,0,.55), transparent 16% 78%, rgba(0,0,0,.6));}

  /* 上部バー */
  .topbar{position:absolute; z-index:5; top:0; left:0; right:0; display:flex; align-items:center; gap:10px;
          padding:12px 14px; }
  .back{font-family:inherit; font-size:13px; letter-spacing:1px; color:var(--gold-hi); background:var(--panel);
        border:var(--border); border-radius:18px; padding:7px 14px; cursor:pointer;}
  .area{flex:1; text-align:center; font-size:16px; font-weight:800; letter-spacing:2px;
        text-shadow:0 2px 6px #000, 0 0 14px rgba(255,180,80,.4);}
  .res{display:flex; gap:8px; align-items:center; background:var(--panel); border:var(--border);
       border-radius:14px; padding:5px 12px; font-size:13px;}
  .res b{color:#ffe39a; font-weight:800;}

  /* ノード */
  .node{position:absolute; z-index:4; transform:translate(-50%,-50%); width:auto; text-align:center; cursor:pointer;}
  .dot{width:34px; height:34px; border-radius:50%; margin:0 auto;
       background:radial-gradient(circle at 50% 40%, #ffe9a8, #e8b54d 55%, #9a6a23);
       border:2px solid #fff3c8; box-shadow:0 0 14px rgba(255,200,90,.9), 0 2px 6px rgba(0,0,0,.6);
       display:grid; place-items:center; animation:nodePulse 2.2s ease-in-out infinite;}
  @keyframes nodePulse{0%,100%{box-shadow:0 0 12px rgba(255,200,90,.7),0 2px 6px rgba(0,0,0,.6);}
                       50%{box-shadow:0 0 22px rgba(255,220,130,1),0 2px 6px rgba(0,0,0,.6);}}
  .node .lbl{margin-top:5px; font-size:11px; letter-spacing:1px; color:var(--gold-hi);
             text-shadow:0 1px 4px #000, 0 0 8px #000; white-space:nowrap;}
  /* ロック */
  .node.locked .dot{background:radial-gradient(circle at 50% 40%,#5a5048,#2a2420);
                    border-color:rgba(180,170,150,.5); box-shadow:0 2px 6px rgba(0,0,0,.6); animation:none;}
  .node.locked .lbl{color:#b9ad95;}
  .node.locked .dot::after{content:'🔒'; font-size:15px; filter:grayscale(1) brightness(1.6);}
  /* 探索中 */
  .node.busy .dot{background:radial-gradient(circle at 50% 40%,#a8e0ff,#4da6e8 55%,#236a9a);
                  border-color:#cfeeff; box-shadow:0 0 18px rgba(120,200,255,.9),0 2px 6px rgba(0,0,0,.6);
                  animation:busySpin 1.4s linear infinite;}
  .node.busy .dot::after{content:'⟳'; font-size:18px; color:#06283a; font-weight:800;}
  @keyframes busySpin{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(40deg)}}

  /* 道を示す（任意・ノード間の薄い線） */
  .paths{position:absolute; inset:0; z-index:3; pointer-events:none;}

  /* 下から出る情報シート */
  .sheet{position:absolute; z-index:8; left:0; right:0; bottom:0; transform:translateY(110%);
          transition:transform .35s cubic-bezier(.2,.8,.25,1);
          background:var(--panel); border-top:var(--border); border-left:var(--border); border-right:var(--border);
          border-radius:18px 18px 0 0; padding:16px 18px 22px; box-shadow:0 -8px 24px rgba(0,0,0,.6);}
  .sheet.show{transform:translateY(0);}
  .sheet h3{margin:2px 0 10px; font-size:18px; letter-spacing:2px; text-align:center;
            text-shadow:0 0 12px rgba(255,180,80,.4);}
  .stat{display:flex; justify-content:space-between; align-items:center; padding:7px 4px;
        border-bottom:1px dashed rgba(232,194,90,.25); font-size:14px;}
  .stat .k{color:#cdb488; letter-spacing:1px;}
  .stat .v{color:var(--gold-hi); font-weight:700;}
  .stat .v.attr-none{color:#9fd09f;}

  .deckRow{margin-top:12px;}
  .deckTitle{font-size:12px; color:#cdb488; letter-spacing:1px; margin-bottom:6px;}
  .decks{display:flex; gap:8px;}
  .deck{flex:1; background:rgba(255,235,180,.06); border:var(--border); border-radius:12px; padding:9px 6px;
        text-align:center; cursor:pointer; transition:.12s;}
  .deck.sel{background:linear-gradient(180deg,rgba(255,228,154,.28),rgba(232,181,77,.18)); box-shadow:0 0 12px rgba(255,200,90,.35);}
  .deck .dn{font-size:13px; font-weight:800;}
  .deck .dp{font-size:11px; color:#cdb488; margin-top:2px;}

  .go{margin-top:14px; width:100%; font-family:inherit; font-weight:800; font-size:16px; letter-spacing:2px;
      color:#2a160a; border:none; padding:13px; border-radius:26px; cursor:pointer;
      background:linear-gradient(180deg,#ffe49a,#e8b54d 60%,#b9842f);
      box-shadow:0 4px 0 #7a531c, 0 8px 18px rgba(0,0,0,.45);}
  .go:active{transform:translateY(3px); box-shadow:0 1px 0 #7a531c,0 4px 10px rgba(0,0,0,.45);}
  .go:disabled{filter:grayscale(.5) brightness(.7); cursor:default;}

  /* 探索中シートの中身 */
  .reward{text-align:center; margin:8px 0 4px;}
  .reward .amt{font-size:26px; font-weight:800; color:#ffe39a; text-shadow:0 0 14px rgba(255,200,90,.6);}
  .reward .cap{font-size:11px; color:#cdb488; letter-spacing:1px;}
  .recall{margin-top:14px; width:100%; font-family:inherit; font-weight:800; font-size:15px; letter-spacing:2px;
          color:var(--gold-hi); background:rgba(120,200,255,.14); border:1.5px solid rgba(150,210,255,.6);
          padding:12px; border-radius:24px; cursor:pointer;}
  .recall:active{transform:translateY(2px);}

  .close{position:absolute; top:10px; right:14px; font-size:20px; color:#cdb488; cursor:pointer; line-height:1;}

  /* スクリム */
  .scrim{position:absolute; inset:0; z-index:7; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:.3s;}
  .scrim.show{opacity:1; pointer-events:auto;}

  /* 回収トースト */
  .toast{position:absolute; z-index:20; left:50%; top:46%; transform:translate(-50%,-50%) scale(.9);
         background:var(--panel); border:var(--border); border-radius:16px; padding:18px 26px; text-align:center;
         opacity:0; pointer-events:none; transition:.25s; box-shadow:0 8px 28px rgba(0,0,0,.6);}
  .toast.show{opacity:1; transform:translate(-50%,-50%) scale(1);}
  .toast .tt{font-size:14px; letter-spacing:2px; color:#cdb488; margin-bottom:8px;}
  .toast .ti{font-size:15px; margin:3px 0;}
  .toast .ti b{color:#ffe39a; font-weight:800;}
</style>
</head>
<body>
<div class="root" id="root">
  <div class="map"></div>
  <div class="mapDim"></div>

  <div class="topbar">
    <button class="back" id="back">‹ 戻る</button>
    <div class="area">古代樹海界</div>
    <div class="res">メダル <b id="medal">1,240</b></div>
  </div>

  <!-- ノード（古代樹海界マップの3広場に配置） -->
  <div class="node" id="n0" style="left:33%; top:22%;" data-i="0">
    <div class="dot"></div><div class="lbl">浅域 ・ 樹冠の広場</div>
  </div>
  <div class="node" id="n1" style="left:47%; top:51%;" data-i="1">
    <div class="dot"></div><div class="lbl">中域 ・ 苔生す祭壇</div>
  </div>
  <div class="node locked" id="n2" style="left:52%; top:78%;" data-i="2">
    <div class="dot"></div><div class="lbl">深域 ・ 霧底の遺構</div>
  </div>

  <div class="scrim" id="scrim"></div>

  <!-- 情報＋デッキ選択シート -->
  <div class="sheet" id="sheet">
    <span class="close" id="close">×</span>
    <h3 id="sheetTitle">浅域 ・ 樹冠の広場</h3>
    <div id="info"></div>
    <div class="deckRow" id="deckRow">
      <div class="deckTitle">派遣するデッキ</div>
      <div class="decks" id="decks"></div>
    </div>
    <button class="go" id="go">出発</button>
  </div>

  <!-- 探索中シート -->
  <div class="sheet" id="busySheet">
    <span class="close" id="busyClose">×</span>
    <h3 id="busyTitle">探索中</h3>
    <div class="reward">
      <div class="amt"><span id="acc">0</span></div>
      <div class="cap">獲得待ちの報酬（メダル）・倉庫上限まで蓄積</div>
    </div>
    <button class="recall" id="recall">引っ込めて回収する</button>
  </div>

  <div class="toast" id="toast">
    <div class="tt">回収しました</div>
    <div id="toastBody"></div>
  </div>
</div>

<script>
  // ===== モックデータ =====
  // 1面=古代樹海界。属性は全エリアなし（段階解放の最初＝属性なし）。
  const NODES = [
    { name:'浅域 ・ 樹冠の広場', power:1200, rate:8,  attr:'なし', locked:false },
    { name:'中域 ・ 苔生す祭壇', power:3500, rate:18, attr:'なし', locked:false },
    { name:'深域 ・ 霧底の遺構', power:8000, rate:40, attr:'なし', locked:true  }, // 中ボスB未撃破で例示ロック
  ];
  const DECKS = [
    { name:'デッキ1', power:4200 },
    { name:'デッキ2', power:2100 },
  ];

  let medal = 1240;
  let selDeck = 0;
  let curNode = -1;
  const deployed = {}; // i -> {since, rate, deckName}

  const $ = s => document.getElementById(s);
  const fmt = n => n.toLocaleString();
  $('medal').textContent = fmt(medal);

  // ノード要素
  const nodeEls = [0,1,2].map(i=>$('n'+i));

  function openSheet(i){
    curNode = i;
    const nd = NODES[i];
    if(nd.locked){ /* ロックは別案内 */ return; }
    if(deployed[i]){ openBusy(i); return; }
    $('sheetTitle').textContent = nd.name;
    $('info').innerHTML = `
      <div class="stat"><span class="k">要求戦力</span><span class="v">${fmt(nd.power)}</span></div>
      <div class="stat"><span class="k">報酬ペース</span><span class="v">メダル ${nd.rate}/分（目安）</span></div>
      <div class="stat"><span class="k">属性要求</span><span class="v attr-none">${nd.attr}</span></div>`;
    // デッキ
    $('decks').innerHTML = DECKS.map((d,di)=>`
      <div class="deck ${di===selDeck?'sel':''}" data-d="${di}">
        <div class="dn">${d.name}</div><div class="dp">戦力 ${fmt(d.power)}</div>
      </div>`).join('');
    $('decks').querySelectorAll('.deck').forEach(el=>{
      el.addEventListener('click', ()=>{ selDeck = +el.dataset.d;
        $('decks').querySelectorAll('.deck').forEach(x=>x.classList.toggle('sel', +x.dataset.d===selDeck)); });
    });
    showSheet('sheet');
  }

  function showSheet(id){ $('scrim').classList.add('show'); $(id).classList.add('show'); }
  function hideSheets(){ $('scrim').classList.remove('show'); $('sheet').classList.remove('show'); $('busySheet').classList.remove('show'); }

  $('go').addEventListener('click', ()=>{
    const i = curNode;
    deployed[i] = { since: Date.now(), rate: NODES[i].rate, deckName: DECKS[selDeck].name };
    nodeEls[i].classList.add('busy');
    hideSheets();
  });

  function openBusy(i){
    curNode = i;
    $('busyTitle').textContent = NODES[i].name + '（探索中）';
    updateAcc();
    showSheet('busySheet');
  }

  // 蓄積（モック：1秒ごとに rate/60*経過 を概算。見栄え用に毎秒少し増やす）
  function accOf(i){
    const d = deployed[i]; if(!d) return 0;
    const min = (Date.now()-d.since)/60000;
    return Math.floor(min * d.rate) + Math.floor((Date.now()-d.since)/1000)*1; // 毎秒+1で動きを見せる
  }
  function updateAcc(){ if(curNode>=0 && deployed[curNode]) $('acc').textContent = fmt(accOf(curNode)); }
  setInterval(()=>{ if($('busySheet').classList.contains('show')) updateAcc(); }, 1000);

  $('recall').addEventListener('click', ()=>{
    const i = curNode;
    const got = Math.max(1, accOf(i));
    medal += got; $('medal').textContent = fmt(medal);
    delete deployed[i];
    nodeEls[i].classList.remove('busy');
    hideSheets();
    $('toastBody').innerHTML = `<div class="ti">メダル <b>+${fmt(got)}</b></div>`;
    const t=$('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1500);
  });

  // ノードのタップ
  nodeEls.forEach((el,i)=>{
    el.addEventListener('click', ()=>{
      if(NODES[i].locked){
        $('toastBody').innerHTML = `<div class="ti">ボスを倒すと解放されます</div>`;
        $('toast').querySelector('.tt').textContent='まだ行けない';
        const t=$('toast'); t.classList.add('show'); setTimeout(()=>{ t.classList.remove('show'); t.querySelector('.tt').textContent='回収しました'; }, 1500);
        return;
      }
      openSheet(i);
    });
  });

  $('close').addEventListener('click', hideSheets);
  $('busyClose').addEventListener('click', hideSheets);
  $('scrim').addEventListener('click', hideSheets);
  $('back').addEventListener('click', ()=>{ location.href='./home-mockup.html'; });
</script>
</body>
</html>
