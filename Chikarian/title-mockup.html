<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>チカリアン タイトル</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');
  :root{ --gold-hi:#fff3c8; --gold:#e8c25a; --border:1.5px solid rgba(232,194,90,.55); --panel:rgba(20,10,16,.72); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{font-family:'Shippori Mincho','Yu Mincho',serif; color:var(--gold-hi); background:#0a0509; overflow:hidden;}
  img{-webkit-user-drag:none; -webkit-touch-callout:none; user-select:none;}

  /* PCでもスマホ同様の縦長コンテナ（ホーム/ガチャと統一） */
  .root{position:relative; width:100%; max-width:480px; margin:0 auto; min-height:100dvh; overflow:hidden;
         background:#070409; cursor:pointer;}

  /* 背景（画像2）：コンテナ内に収める */
  .bg{position:absolute; inset:0; z-index:0;
      background:#070409 url('./images/title_bg.png') center/cover no-repeat;}
  /* 上下を少し締めて文字の視認性を上げる薄ヴィネット */
  .vignette{position:absolute; inset:0; z-index:1; pointer-events:none;
            background:linear-gradient(180deg, rgba(0,0,0,.28), transparent 22% 64%, rgba(0,0,0,.55));}

  /* ===== A: 赤い光の明滅（世界観の核）=====
     手前のハイビスカス〜広場あたりを中心に、赤い光がゆっくり脈打つ。screenで加算的に。 */
  .redpulse{position:absolute; inset:0; z-index:2; pointer-events:none; mix-blend-mode:screen;
            background:
              radial-gradient(45% 30% at 50% 80%, rgba(255,70,45,.55), transparent 70%),
              radial-gradient(35% 22% at 14% 88%, rgba(255,60,40,.5), transparent 72%),
              radial-gradient(35% 22% at 86% 86%, rgba(255,60,40,.5), transparent 72%);
            animation:redbreath 3.8s ease-in-out infinite;}
  @keyframes redbreath{0%,100%{opacity:.22;} 50%{opacity:.8;}}

  .wrap{position:relative; z-index:3; min-height:100dvh; display:flex; flex-direction:column; align-items:center;}

  /* ロゴ（透過PNG）。上から約20%に中央配置 */
  .logoBox{position:relative; width:80%; max-width:380px; margin-top:19vh; aspect-ratio:577/433;
           filter:drop-shadow(0 6px 18px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(255,140,60,.25));
           animation:logoIn 1.1s cubic-bezier(.2,.8,.25,1) both;}
  .logoBox img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block;}
  /* ===== B: ロゴ表面の金箔shine sweep（ロゴ形状にマスク）===== */
  .logoShine{position:absolute; inset:0; mix-blend-mode:screen; pointer-events:none;
    -webkit-mask:url('./images/logo_title.png') center/contain no-repeat;
            mask:url('./images/logo_title.png') center/contain no-repeat;
    background:linear-gradient(108deg, transparent 42%, rgba(255,248,214,.9) 50%, transparent 58%);
    background-size:260% 100%; background-repeat:no-repeat;
    animation:shine 5s ease-in-out infinite;}
  @keyframes shine{0%{background-position:170% 0;} 55%,100%{background-position:-70% 0;}}
  @keyframes logoIn{from{opacity:0; transform:translateY(-14px) scale(.96);} to{opacity:1; transform:none;}}

  .spacer{flex:1;}

  /* ===== C: 「タップでスタート」明滅＋ふわっと ===== */
  .start{position:relative; z-index:3; margin-bottom:13vh; text-align:center;}
  .startTxt{font-size:19px; font-weight:800; letter-spacing:4px; color:var(--gold-hi);
            text-shadow:0 2px 6px #3a0010, 0 0 16px rgba(255,180,80,.6);
            animation:tapPulse 2.2s ease-in-out infinite;}
  .startHint{font-size:11px; letter-spacing:2px; color:#e7d3a6; margin-top:6px; opacity:.85;
             text-shadow:0 1px 3px #000;}
  @keyframes tapPulse{0%,100%{opacity:.55; transform:translateY(2px);} 50%{opacity:1; transform:translateY(-2px);}}

  /* 設定（右下・小・ゲーム開始とは別操作）*/
  .settings{position:absolute; z-index:4; right:14px; bottom:14px; width:42px; height:42px; border-radius:50%;
            background:var(--panel); border:var(--border); display:grid; place-items:center; cursor:pointer;
            box-shadow:inset 0 0 10px rgba(255,200,90,.12);}
  .settings img{width:24px; height:24px; object-fit:contain;}
  .settings .fb{font-size:20px; color:#f0dcb0;}

  /* タップ時の白フェードでホームへ */
  .flash{position:absolute; inset:0; z-index:9; background:#fff; opacity:0; pointer-events:none;
         transition:opacity .45s ease;}
  .flash.on{opacity:1;}

  .toast{position:fixed; left:50%; bottom:74px; transform:translateX(-50%); z-index:20;
         background:rgba(0,0,0,.85); border:var(--border); color:var(--gold-hi);
         padding:8px 18px; border-radius:20px; font-size:13px; white-space:nowrap; display:none;}
  .toast.show{display:block;}
</style>
</head>
<body>
<div class="root" id="root">
  <div class="bg"></div>
  <div class="vignette"></div>
  <div class="redpulse"></div>

  <div class="wrap">
    <div class="logoBox">
      <img src="./images/logo_title.png" alt="チカリアン" />
      <div class="logoShine"></div>
    </div>
    <div class="spacer"></div>
    <div class="start">
      <div class="startTxt">ゲームスタート</div>
      <div class="startHint">画面をタップ</div>
    </div>
  </div>

  <button class="settings" id="settings" aria-label="設定">
    <!-- 本番は ic_settings.png。無ければ⚙ -->
    <img src="./images/ic_settings.png" alt="設定" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
    <span class="fb" style="display:none">⚙</span>
  </button>

  <div class="flash" id="flash"></div>
</div>
<div class="toast" id="toast"></div>

<script>
  const root=document.getElementById('root');
  const flash=document.getElementById('flash');
  const settings=document.getElementById('settings');
  const toast=document.getElementById('toast');
  let started=false;

  function startGame(){
    if(started) return; started=true;
    flash.classList.add('on');
    setTimeout(()=>{ location.href='./opening-mockup.html'; }, 450);
  }
  // 画面どこでもタップで開始
  root.addEventListener('click', startGame);

  // 設定は開始とは別操作（伝播を止める）
  settings.addEventListener('click', (e)=>{
    e.stopPropagation();
    toast.textContent='設定（モック）';
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1400);
  });
</script>
</body>
</html>
