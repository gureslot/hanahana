<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>チカリアン 図鑑</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');
  :root{ --gold-hi:#fff3c8; --gold:#e8c25a; --panel:rgba(20,11,16,.9); --border:1.5px solid rgba(232,194,90,.5);
         --hana:#e86b8a; --ha:#5fa564; --shin:#e8c25a; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{font-family:'Shippori Mincho','Yu Mincho',serif; color:var(--gold-hi); background:#070409; overflow:hidden;}
  img{-webkit-user-drag:none; user-select:none;}
  .root{position:relative; width:100%; max-width:480px; margin:0 auto; height:100dvh; overflow:hidden;
        background:#0a0509 radial-gradient(80% 45% at 50% 0%, rgba(60,70,120,.2), transparent 60%); display:flex; flex-direction:column;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column;} .screen.hide{display:none;}
  .head{flex:none; text-align:center; padding:14px 16px 2px;}
  .head .t{font-size:19px; font-weight:800; letter-spacing:4px; text-shadow:0 2px 6px #10183a,0 0 16px rgba(130,150,255,.3);}
  .badge{font-size:9px; font-weight:800; padding:1px 5px; border-radius:5px; color:#16100a;}
  .badge.hana{background:var(--hana);} .badge.ha{background:var(--ha);} .badge.shin{background:var(--shin);} .badge.sp{background:linear-gradient(90deg,#ffe39a,#e8b54d);}
  .wbadge{font-size:9px; font-weight:800; padding:1px 5px; border-radius:5px; color:#16100a; background:#cdb488;}

  .filters{flex:none; display:flex; gap:6px; padding:6px 14px 2px; overflow-x:auto;}
  .fil{flex:none; font-family:inherit; font-size:11px; color:var(--gold-hi); background:var(--panel); border:var(--border); border-radius:14px; padding:6px 13px; cursor:pointer;}
  .fil.sel{background:linear-gradient(180deg,rgba(255,228,154,.26),rgba(232,181,77,.14)); box-shadow:0 0 10px rgba(255,200,90,.3);}
  .count{flex:none; text-align:center; font-size:11px; color:#cdb488; padding:3px 0 4px;} .count b{color:#ffe39a;}

  /* 2列×2行の大きめカード */
  .pageGrid{flex:1; overflow-y:auto; padding:6px 16px 6px; display:grid; grid-template-columns:1fr 1fr; gap:12px; align-content:start; justify-items:center;}
  .cardItem{position:relative; width:100%; aspect-ratio:5/7; border-radius:12px; overflow:hidden; border:2px solid rgba(232,194,90,.5); background:#241018; cursor:pointer;}
  .cardItem.locked{filter:grayscale(1) brightness(.4); cursor:default;}
  .cardItem .art{position:absolute; inset:0;} .cardItem .art img{width:100%; height:100%; object-fit:cover; display:block;}
  .cardItem .cph{position:absolute; inset:0; display:grid; place-items:center; font-size:30px; color:#7a5a3a;}
  .cardItem .rank{position:absolute; top:6px; right:7px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; color:#1a1206; background:radial-gradient(circle at 50% 40%,#fff3c8,#e8b54d); border:1px solid #fff3c8;}
  .cardItem .cb{position:absolute; top:6px; left:7px; display:flex; gap:3px;}
  .cardItem .foot{position:absolute; left:0; right:0; bottom:0; padding:10px 8px 7px; background:linear-gradient(0deg,rgba(0,0,0,.9),transparent); }
  .cardItem .star{font-size:12px; color:#ffd98a; text-shadow:0 1px 3px #000;}
  .cardItem .nm{font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; text-shadow:0 1px 4px #000;}
  .cardItem .qm{position:absolute; inset:0; display:grid; place-items:center; font-size:34px; color:#5a4a6a;}

  .pager{flex:none; display:flex; align-items:center; justify-content:center; gap:18px; padding:6px 0 8px;}
  .pager button{font-family:inherit; font-size:18px; color:var(--gold-hi); background:var(--panel); border:var(--border); border-radius:50%; width:38px; height:38px; cursor:pointer;}
  .pager button:disabled{opacity:.35; cursor:default;} .pager .pInfo{font-size:12px; color:#cdb488; min-width:56px; text-align:center;}

  .back{position:absolute; z-index:7; left:14px; bottom:12px; font-family:inherit; font-size:14px; color:var(--gold-hi); background:var(--panel); border:var(--border); border-radius:22px; padding:9px 18px; cursor:pointer;}

  /* 詳細（ゼノビアン image2 風＝カード大＋ステータス） */
  .detail{position:absolute; inset:0; z-index:10; background:#0a0509 radial-gradient(80% 45% at 50% 0%, rgba(60,70,120,.2), transparent 60%); display:none; flex-direction:column;}
  .detail.show{display:flex;}
  .dScroll{flex:1; overflow-y:auto; padding:18px 18px 90px; display:flex; flex-direction:column; align-items:center;}
  .dCard{width:66%; max-width:240px; aspect-ratio:5/7; border-radius:14px; overflow:hidden; border:2px solid rgba(232,194,90,.6); background:#241018; position:relative; box-shadow:0 6px 24px rgba(0,0,0,.5);}
  .dCard img{width:100%; height:100%; object-fit:cover;} .dCard .cph{position:absolute; inset:0; display:grid; place-items:center; font-size:30px; color:#7a5a3a;}
  .dCard .rank{position:absolute; top:8px; right:9px; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:14px; font-weight:800; color:#1a1206; background:radial-gradient(circle at 50% 40%,#fff3c8,#e8b54d); border:1px solid #fff3c8;}
  .dName{font-size:18px; font-weight:800; margin-top:14px; letter-spacing:1px;}
  .dBadges{display:flex; gap:5px; margin-top:8px; justify-content:center; flex-wrap:wrap;}
  .dStarRow{font-size:14px; color:#ffd98a; margin-top:7px;}
  .dStats{width:100%; max-width:300px; margin-top:16px; background:var(--panel); border:var(--border); border-radius:12px; padding:12px 14px;}
  .dRow{display:flex; justify-content:space-between; padding:7px 2px; border-bottom:1px dashed rgba(232,194,90,.22); font-size:13px;}
  .dRow:last-child{border-bottom:none;} .dRow .k{color:#cdb488;} .dRow .v{color:var(--gold-hi); font-weight:700;}
  .dFlavor{width:100%; max-width:300px; font-size:12px; color:#9a8c70; line-height:1.8; margin-top:12px; text-align:center;}
  .zActions{width:100%; max-width:300px; display:flex; gap:8px; margin-top:14px;}
  .zaBtn{flex:1; font-family:inherit; font-weight:700; font-size:12px; letter-spacing:1px; color:var(--gold-hi); background:rgba(255,235,180,.06); border:1px solid rgba(232,194,90,.45); border-radius:18px; padding:10px 4px; cursor:pointer;}
  .zaBtn:active{transform:translateY(1px);}
  .dnav{position:absolute; left:0; right:0; bottom:0; padding:12px 16px 18px; background:linear-gradient(0deg,#0a0509 62%,transparent); display:flex; gap:8px; max-width:480px; margin:0 auto;}
  .dnav button{font-family:inherit; font-size:14px; letter-spacing:1px; border-radius:22px; padding:11px 0; cursor:pointer; background:var(--panel); border:var(--border); color:var(--gold-hi);}
  .dnav .b-list{flex:1.2;} .dnav .b-prev,.dnav .b-next{flex:1;} .dnav button:disabled{opacity:.4; cursor:default;}
</style>
<script src="./cksound.js"></script>
</head>
<body>
<div class="root">
  <div class="screen" id="scrList">
    <div class="head"><div class="t">図鑑</div></div>
    <div class="filters" id="filters"></div>
    <div class="count" id="count"></div>
    <div class="pageGrid" id="pageGrid"></div>
    <div class="pager"><button id="pPrev">‹</button><span class="pInfo" id="pInfo">1 / 1</span><button id="pNext">›</button></div>
    <button class="back" id="back">‹ 戻る</button>
  </div>

  <div class="screen hide" id="scrDetail">
    <div class="head"><div class="t">図鑑</div></div>
    <div class="dScroll" id="dScroll"></div>
    <div class="dnav">
      <button class="b-list" id="navList">一覧へ</button>
      <button class="b-prev" id="navPrev">‹ 前</button>
      <button class="b-next" id="navNext">次 ›</button>
    </div>
  </div>
</div>
<script>
  const $=s=>document.getElementById(s); const fmt=n=>n.toLocaleString();
  const ATTR={hana:{lab:'花',cls:'hana'}, ha:{lab:'葉',cls:'ha'}, shin:{lab:'芯',cls:'shin'}};
  const WEAP={ken:'剣', tate:'盾', tsue:'杖'};
  const FAM={hibiscus:'ハイビスカスマン', meshibe:'めしべだけマン'};
  const SPNAME={dragon:'ゴールドドラゴン', girl:'ゴーストガール', houou:'鳳凰'};
  // SP専用固定スキル（特殊枠・錬成/転移の対象外・全て仮／cards §3）
  const SP_SKILL={ dragon:{name:'竜気覚醒', fx:'発動5%／デッキ全体 総合×1.90（仮）'},
                   girl:{name:'呪詛の眼', fx:'発動5%／敵 実戦闘力×0.40（仮）'},
                   houou:{name:'不死鳥の加護', fx:'常時／敗北時 このデッキの武気損失0（仮）'} };
  const RARRANK={n:'N',r:'R',sr:'S',ssr:'A',SP:'SP'}; // 表示用ランク章（仮）
  // ===== カード戦力（戦国IXA式・balance §2-1〜2-4 / apply-spec §3・×0.80世界・図鑑はLv1基準で表示）=====
  //   総合戦力 = 装備項 + 本体戦闘力。表示は「魔装（枠攻撃力33）・満充填」を一律前提。SPは武気なし＝本体のみ。
  const LVCAP={n:30,r:40,sr:50,ssr:60,SP:50};
  const BODY_BASE={n:80,r:200,sr:360,ssr:560};          // 本体戦闘力 基礎 Lv1★0（×0.80・apply-spec §3）
  const SP_BASE={dragon:2260, girl:2160, houou:2060};   // SP本体基礎＝3値（確定 08a5f15・Lv上限50）
  const EQ_ATK=33;                                       // 枠攻撃力＝魔装（満充填一律で表示）
  const CAPBASE={n:80,r:120,sr:160,ssr:200};            // 充填量 基礎 Lv1（×0.80・Flag A）
  const CAPMAX ={n:240,r:400,sr:560,ssr:800};           // 充填量 MAX（×0.80）
  function bodyBase(c){ return c.sp ? (SP_BASE[c.spKey]||2160) : (BODY_BASE[c.rar]||80); }
  function calcBody(c){ const cap=LVCAP[c.rar]||30; return Math.floor(bodyBase(c)*(1+(c.level-1)*(2.0/(cap-1)))*(1+0.15*c.star)); }
  function calcCapacity(c){ if(c.sp||CAPBASE[c.rar]==null) return 0; const cap=LVCAP[c.rar]||30; return Math.round(CAPBASE[c.rar]+(CAPMAX[c.rar]-CAPBASE[c.rar])*(c.level-1)/(cap-1)); }
  // 総合戦力（§2-1）。装備項＝充填量(満充填)×枠攻撃力(魔装)。SPは武気なし＝本体のみ。
  function calcPower(c){ const body=calcBody(c); return c.sp ? body : calcCapacity(c)*EQ_ATK+body; }
  const POOL=["chara_dragon_sp","chara_girl_sp","chara_houou_sp",
    "chara_hibiscus_ha_ken_n","chara_hibiscus_ha_ken_r","chara_hibiscus_ha_ken_sr","chara_hibiscus_ha_ken_ssr",
    "chara_hibiscus_ha_tate_n","chara_hibiscus_ha_tate_r","chara_hibiscus_ha_tate_sr","chara_hibiscus_ha_tate_ssr",
    "chara_hibiscus_ha_tsue_n","chara_hibiscus_ha_tsue_r","chara_hibiscus_ha_tsue_sr","chara_hibiscus_ha_tsue_ssr",
    "chara_hibiscus_hana_ken_n","chara_hibiscus_hana_ken_r","chara_hibiscus_hana_ken_sr","chara_hibiscus_hana_ken_ssr",
    "chara_hibiscus_hana_tate_n","chara_hibiscus_hana_tate_r","chara_hibiscus_hana_tate_sr","chara_hibiscus_hana_tate_ssr",
    "chara_hibiscus_hana_tsue_n","chara_hibiscus_hana_tsue_r","chara_hibiscus_hana_tsue_sr","chara_hibiscus_hana_tsue_ssr",
    "chara_hibiscus_shin_ken_n","chara_hibiscus_shin_ken_r","chara_hibiscus_shin_ken_sr","chara_hibiscus_shin_ken_ssr",
    "chara_hibiscus_shin_tate_n","chara_hibiscus_shin_tate_r","chara_hibiscus_shin_tate_sr","chara_hibiscus_shin_tate_ssr",
    "chara_hibiscus_shin_tsue_n","chara_hibiscus_shin_tsue_r","chara_hibiscus_shin_tsue_sr","chara_hibiscus_shin_tsue_ssr",
    "chara_meshibe_shin_tsue_sr","chara_meshibe_shin_tsue_ssr"];
  function build(name){ const p=name.split('_'); let c;
    if(name.endsWith('_sp')){ c={id:name, sp:true, spKey:p[1], rar:'SP', name:SPNAME[p[1]]||p[1]}; }
    else { c={id:name, sp:false, fam:p[1], attr:p[2], weap:p[3], rar:p[4], name:`${FAM[p[1]]||p[1]}・${ATTR[p[2]].lab}${WEAP[p[3]]}`}; }
    const h=[...name].reduce((a,ch)=>a+ch.charCodeAt(0),0);
    c.owned=(h%5!==0); c.star=c.sp?0:(h%4);
    c.level=1;                                   // 図鑑は基準としてLv1で戦闘力を表示
    c.power=calcPower(c);                         // 総合戦力（設計書§2-1・Lv1基準）
    c.rankCh=RARRANK[c.rar]||'?';
    return c; }
  const CARDS=POOL.map(build);
  const FILTERS=[['all','すべて'],['hana','花'],['shin','芯'],['ha','葉'],['sp','SP']];
  let fil='all', page=0, view=[]; const PER=4; let curId=null;

  function match(c){ if(fil==='all')return true; if(fil==='sp')return c.sp; return !c.sp&&c.attr===fil; }
  function badges(c){ return c.sp?`<span class="badge sp">SP</span>`:`<span class="badge ${ATTR[c.attr].cls}">${ATTR[c.attr].lab}</span><span class="wbadge">${WEAP[c.weap]}</span>`; }
  function stars(c){ return c.sp?'—':(c.star>0?'★'.repeat(c.star):'☆'); }
  function thumb(c){ return `<div class="art"><div class="cph">❖</div><img src="./images/${c.id}.png" alt="" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()"></div>`; }

  function renderList(){
    $('filters').innerHTML=FILTERS.map(([k,l])=>`<button class="fil ${k===fil?'sel':''}" data-k="${k}">${l}</button>`).join('');
    $('filters').querySelectorAll('.fil').forEach(el=>el.addEventListener('click',()=>{ fil=el.dataset.k; page=0; renderList(); }));
    view=CARDS.filter(match); const owned=CARDS.filter(c=>c.owned).length;
    $('count').innerHTML=`コンプリート <b>${owned}</b> / ${CARDS.length}`;
    const pages=Math.max(1,Math.ceil(view.length/PER)); page=Math.max(0,Math.min(page,pages-1));
    const slice=view.slice(page*PER,page*PER+PER);
    $('pageGrid').innerHTML=slice.map(c=>{ if(!c.owned) return `<div class="cardItem locked"><div class="qm">？</div></div>`;
      return `<div class="cardItem" data-id="${c.id}">${thumb(c)}
        <div class="foot"><div class="nm">${c.name}</div></div></div>`;}).join('');
    $('pageGrid').querySelectorAll('.cardItem[data-id]').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.id)));
    $('pInfo').textContent=`${page+1} / ${pages}`; $('pPrev').disabled=page<=0; $('pNext').disabled=page>=pages-1;
  }

  function openDetail(id){ const c=CARDS.find(x=>x.id===id); if(!c||!c.owned) return; curId=id;
    $('dScroll').innerHTML=`
      <div class="dCard">${thumb(c)}<div class="rank">${c.rankCh}</div></div>
      <div class="dName">${c.name}</div>
      <div class="dBadges">${badges(c)}<span class="badge" style="background:#3a2a40;color:#e7d3ff">${c.rar}</span></div>
      <div class="dStarRow">${stars(c)}</div>
      <div class="dStats">
        <div class="dRow"><span class="k">戦闘力</span><span class="v">${fmt(c.power)}（Lv1・魔装満充填・仮）</span></div>
        <div class="dRow"><span class="k">本体戦闘力</span><span class="v">${fmt(calcBody(c))}</span></div>
        <div class="dRow"><span class="k">装備</span><span class="v">${c.sp?'装備なし':('魔装・満充填 '+fmt(calcCapacity(c))+'枠')}</span></div>
        <div class="dRow"><span class="k">種族</span><span class="v">${c.sp?'SP':(FAM[c.fam]||c.fam)}</span></div>
        ${c.sp?`<div class="dRow"><span class="k">SP固定スキル</span><span class="v">${(SP_SKILL[c.spKey]||{}).name||'—'}</span></div>
        <div class="dRow"><span class="k">効果（仮）</span><span class="v" style="font-size:11px">${(SP_SKILL[c.spKey]||{}).fx||''}</span></div>`:''}
      </div>
      <div class="zActions">
        <button class="zaBtn" id="zToSkill">スキル錬成・転移</button>
        ${c.sp?'':`<button class="zaBtn" id="zToSoubi">装備（充填）</button>`}
      </div>
      <div class="dFlavor">※ フレーバー（世界観の解説）は後日。物理描写のみ・実機想起語は使わない方針。</div>`;
    // カード詳細からスキル錬成・転移／装備（充填）へ。SPは充填なし＝装備ボタンを出さない。
    $('zToSkill').addEventListener('click',()=>{ location.href='./skill-mockup.html'; });
    const zs=$('zToSoubi'); if(zs) zs.addEventListener('click',()=>{ location.href='./soubi-mockup.html'; });
    // 前後ナビは「所持済みカードのみ」を巡る
    const owned=CARDS.filter(c=>c.owned); const oi=owned.findIndex(x=>x.id===id);
    $('navPrev').disabled = oi<=0; $('navNext').disabled = oi>=owned.length-1;
    $('navPrev').onclick=()=>{ if(oi>0) openDetail(owned[oi-1].id); };
    $('navNext').onclick=()=>{ if(oi<owned.length-1) openDetail(owned[oi+1].id); };
    $('scrList').classList.add('hide'); $('scrDetail').classList.remove('hide');
  }
  $('navList').addEventListener('click',()=>{ $('scrDetail').classList.add('hide'); $('scrList').classList.remove('hide'); });

  $('pPrev').addEventListener('click',()=>{ page--; renderList(); });
  $('pNext').addEventListener('click',()=>{ page++; renderList(); });
  $('back').addEventListener('click',()=>{ location.href='./home-mockup.html'; });
  renderList();
</script>
</body>
</html>
