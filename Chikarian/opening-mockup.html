<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>チカリアン オープニング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');
  :root{ --gold-hi:#fff3c8; --gold:#e8c25a; --border:1.5px solid rgba(232,194,90,.5); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{font-family:'Shippori Mincho','Yu Mincho',serif; color:var(--gold-hi); background:#050306; overflow:hidden;}

  .root{position:relative; width:100%; max-width:480px; margin:0 auto; min-height:100dvh; overflow:hidden;
         background:#050306; cursor:pointer;}

  /* ===== 赤い光（演出）。小さく明滅→拡大して画面いっぱいに ===== */
  .glow{position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0;
        background:radial-gradient(circle at 50% 44%,
                  rgba(255,90,55,.95), rgba(255,55,30,.5) 16%, rgba(180,30,20,.18) 34%, transparent 52%);
        transform:scale(.16); transform-origin:50% 44%;
        transition:opacity 1.4s ease, transform 2.6s cubic-bezier(.45,.05,.3,1);
        animation:breath 2.7s ease-in-out infinite;}
  .glow.show{opacity:1;}
  .glow.full{transform:scale(1.9);}
  @keyframes breath{0%,100%{filter:brightness(.72) saturate(1);} 50%{filter:brightness(1.35) saturate(1.1);}}
  /* 拡大後に全体へ薄く赤を残す層 */
  .ambient{position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0;
           background:radial-gradient(120% 80% at 50% 50%, rgba(255,70,45,.16), transparent 70%);
           transition:opacity 2s ease; mix-blend-mode:screen;}
  .ambient.show{opacity:1;}

  /* ===== テキスト ===== */
  .stage{position:relative; z-index:3; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:0 30px;}
  .line{font-size:19px; line-height:2.05; letter-spacing:2px; text-align:center; font-weight:600;
        color:var(--gold-hi); text-shadow:0 2px 8px rgba(0,0,0,.9), 0 0 18px rgba(255,150,70,.35);
        opacity:0; transform:translateY(10px); transition:opacity 1.1s ease, transform 1.1s ease; max-width:420px;}
  .line.show{opacity:1; transform:none;}
  .line b{color:#ffe39a; font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,.9), 0 0 20px rgba(255,180,80,.6);}
  .line .em{color:#ffd0c2;}

  /* タップ誘導 */
  .next{position:absolute; z-index:4; left:0; right:0; bottom:7vh; text-align:center;
        font-size:12px; letter-spacing:3px; color:#e7d3a6; opacity:0; transition:opacity .5s;
        text-shadow:0 1px 4px #000; pointer-events:none;}
  .next.show{opacity:1; animation:tapPulse 2.2s ease-in-out infinite;}
  @keyframes tapPulse{0%,100%{opacity:.45;} 50%{opacity:.95;}}

  /* スキップ */
  .skip{position:absolute; z-index:5; top:14px; right:14px; font-family:inherit; font-size:12px; letter-spacing:2px;
        color:#e7d3a6; background:rgba(20,10,16,.6); border:var(--border); border-radius:18px; padding:7px 16px; cursor:pointer;}
  .skip:active{filter:brightness(1.15);}

  /* 終端：白へ抜けてホームへ */
  .flash{position:absolute; inset:0; z-index:9; background:#fff; opacity:0; pointer-events:none; transition:opacity .6s ease;}
  .flash.on{opacity:1;}
</style>
</head>
<body>
<div class="root" id="root">
  <div class="glow" id="glow"></div>
  <div class="ambient" id="ambient"></div>

  <div class="stage"><div class="line" id="line"></div></div>

  <div class="next" id="next">タップで進む</div>
  <button class="skip" id="skip">スキップ ▶</button>
  <div class="flash" id="flash"></div>
</div>

<script>
  // 確定本文。ト書き（暗転/明滅/拡大）はテキストにせず演出フラグで表現。
  // type:'beat' は演出のみ（テキスト非表示）。'text' は地の文を表示。
  const SCRIPT = [
    { type:'beat', glow:'on' },                                   // 暗転→赤い光がかすかに明滅
    { type:'text', html:'世界の大半は、<b>ジャルゴア</b>に覆われていた。' },
    { type:'text', html:'その縁に追いやられ、なお消えぬ小さな地がある。<br><b>チカリア</b>。' },
    { type:'beat', glow:'full' },                                  // 明滅する赤い光が画面いっぱいに広がる
    { type:'text', html:'チカリアの民は知っている。<br>闇深きとき、彼方より光が訪れることを。' },
    { type:'text', html:'<span class="em">——いま、あなたが訪れた。</span>' },
    { type:'text', html:'あなたが届ける赤い光は、この地で<b>チカリウム</b>へと変わる。<br>チカリウムは、辺境を守る戦士たちの力となる。' },
    { type:'text', html:'あなたは<b>灯し手</b>。' },
    { type:'text', html:'灯し手よ。<br>あなたが灯す光は、わたしたち戦士の力となる。<br>どうか、その光をわたしたちに分けてほしい。' },
    { type:'text', html:'<span class="em">——共に、この辺境を守ってほしい。</span>' },
    { type:'text', html:'もしあなたが<b>現実で赤い光</b>を見つけたなら、<br>その光はチカリウムへと変わり、わたしたちをさらに強くする。' },
    { type:'text', html:'まずは、わたしたちと前線へ。' },
  ];

  const root=document.getElementById('root');
  const glow=document.getElementById('glow');
  const ambient=document.getElementById('ambient');
  const lineEl=document.getElementById('line');
  const nextEl=document.getElementById('next');
  const skip=document.getElementById('skip');
  const flash=document.getElementById('flash');

  let i=-1, busy=false, ended=false;

  // beat（演出）は自動で進み、textで停止してタップ待ち
  function step(){
    if(ended) return;
    i++;
    if(i>=SCRIPT.length){ finish(); return; }
    const s=SCRIPT[i];
    if(s.type==='beat'){
      busy=true; nextEl.classList.remove('show');
      if(s.glow==='on'){ glow.classList.add('show'); setTimeout(step,1800); }       // 明滅が立ち上がる間
      else if(s.glow==='full'){ glow.classList.add('full'); ambient.classList.add('show'); setTimeout(step,1700); } // 拡大の余韻
      else setTimeout(step,400);
      return;
    }
    // text：前の行を消してから新しい行を出す
    busy=true; nextEl.classList.remove('show');
    lineEl.classList.remove('show');
    setTimeout(()=>{
      lineEl.innerHTML=s.html;
      lineEl.classList.add('show');
      setTimeout(()=>{ busy=false; nextEl.classList.add('show'); }, 1100); // フェードイン完了でタップ受付
    }, lineEl.textContent ? 600 : 0);
  }

  function advance(){ if(!busy && !ended) step(); }

  function finish(){
    if(ended) return; ended=true;
    nextEl.classList.remove('show');
    flash.classList.add('on');
    setTimeout(()=>{ location.href='./home-mockup.html'; }, 620);
  }

  root.addEventListener('click', advance);
  skip.addEventListener('click', (e)=>{ e.stopPropagation(); finish(); });

  // 開始
  window.addEventListener('load', ()=> setTimeout(step, 500));
</script>
</body>
</html>
