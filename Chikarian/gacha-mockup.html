<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>チカリアン ガチャ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap');

  :root{
    --gold:#e8c25a; --gold-hi:#fff3c8; --panel:rgba(20,10,16,.72);
    --border:1.5px solid rgba(232,194,90,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:'Shippori Mincho','Yu Mincho',serif; color:var(--gold-hi);
    background:#0a0509; overflow:hidden;
  }
  /* 背景：ホームと同系の荘厳トーン。カードを主役にするため暗めに落とす */
  .bg{position:fixed; inset:0; background:
      radial-gradient(120% 80% at 50% 22%, #5a1f3a 0%, #2a1024 40%, #140913 70%, #070409 100%);
      z-index:0;}
  .bgVignette{position:fixed; inset:0; pointer-events:none; z-index:1; background:
      radial-gradient(70% 50% at 50% 38%, rgba(255,180,90,.16), transparent 60%),
      linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,.15) 30%, rgba(0,0,0,.6));}

  .wrap{position:relative; z-index:2; height:100dvh; max-width:480px; margin:0 auto;
        display:flex; flex-direction:column; align-items:center; padding:18px 16px 22px;}

  .title{font-size:22px; font-weight:800; letter-spacing:3px; margin-top:6px;
          color:var(--gold-hi); text-shadow:0 2px 6px #3a0010, 0 0 16px rgba(255,180,80,.5);}
  .sub{font-size:11px; color:#cdb488; letter-spacing:2px; margin-top:4px;}

  /* カード場 */
  .stage{flex:1; width:100%; display:flex; align-items:center; justify-content:center; gap:12px;
         perspective:1200px;}
  .card{
    position:relative; width:30%; max-width:124px; aspect-ratio:5/7;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.7,.25,1);
    transform:rotateY(180deg); /* 初期=裏 */
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.55));
  }
  .card.flipped{transform:rotateY(0deg);}
  .face{position:absolute; inset:0; border-radius:12px; overflow:hidden;
        backface-visibility:hidden; border:var(--border);
        box-shadow:inset 0 0 14px rgba(0,0,0,.5);}
  .face img{width:100%; height:100%; object-fit:cover; display:block;}
  .front{} /* 表（キャラ） */
  .back{transform:rotateY(180deg);
        background:
          radial-gradient(60% 45% at 50% 38%, rgba(255,200,110,.25), transparent 70%),
          linear-gradient(160deg, #2a1430 0%, #160a1c 60%, #0d0612 100%);
        display:grid; place-items:center;}
  .backMark{font-size:34px; color:rgba(232,194,90,.85); filter:drop-shadow(0 0 8px rgba(255,180,80,.5));}
  /* プレースホルダ表面 */
  .frontPh{background:linear-gradient(165deg,#3a2418,#1c1018); display:grid; place-items:center;
           color:#e7d3a6;}
  .frontPh .ph-emoji{font-size:30px; filter:drop-shadow(0 0 6px rgba(0,0,0,.6));}
  .frontPh .ph-name{position:absolute; left:0; right:0; bottom:0; padding:8px 4px 6px; font-size:11px;
                    text-align:center; background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);}

  /* 引くボタン */
  .actions{height:64px; display:flex; align-items:center; justify-content:center; width:100%;}
  .pull{
    font-family:inherit; font-weight:800; font-size:17px; letter-spacing:2px;
    color:#2a160a; cursor:pointer; border:none; padding:13px 46px; border-radius:30px;
    background:linear-gradient(180deg,#ffe49a,#e8b54d 60%,#b9842f);
    box-shadow:0 4px 0 #7a531c, 0 8px 18px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.6);
    transition:transform .08s, box-shadow .08s;
  }
  .pull:active{transform:translateY(3px); box-shadow:0 1px 0 #7a531c, 0 4px 10px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.6);}
  .pull:disabled{filter:grayscale(.5) brightness(.7); cursor:default;}
  .cost{font-size:11px; color:#cdb488; letter-spacing:1px; margin-top:7px; text-align:center;}

  .back-home{margin-top:6px; background:none; border:var(--border); color:var(--gold-hi);
             font-family:inherit; font-size:14px; padding:10px 30px; border-radius:24px; cursor:pointer;
             background:var(--panel);}
  .back-home:active{transform:translateY(1px);}

  .hidden{display:none;}
  .fadein{animation:fadein .5s ease both;}
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}
  /* カード登場：下からスッと整列 */
  .enter{animation:cardEnter .45s cubic-bezier(.2,.8,.25,1) both;}
  @keyframes cardEnter{from{opacity:0; transform:translateY(26px) rotateY(180deg);} to{opacity:1; transform:translateY(0) rotateY(180deg);}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="bgVignette"></div>

<div class="wrap">
  <div class="title">ガチャ</div>
  <div class="sub" id="sub">3枚を引く</div>

  <div class="stage" id="stage"><!-- カードはJSで生成 --></div>

  <div class="actions">
    <button class="pull" id="pull">引く</button>
    <button class="back-home hidden" id="home">ホームに戻る</button>
  </div>
  <div class="cost" id="costLine">1回 300 チカリウム ・ 3枚排出</div>
</div>

<script>
// ===== 画像アセット（後で本番パスに差し替え）=====
const ASSETS = {
  cardBack: null,                 // 例: "./images/card_back.png"
  // 排出結果（モック）。本番はサーバ/ガチャ抽選結果のキャラ画像URLが入る
  // src を入れれば表に画像、null ならプレースホルダ表示
  pool: [
    { name: "花の戦巫女", emoji: "🌺", src: null },
    { name: "芯の守護者", emoji: "🛡", src: null },
    { name: "葉の遊撃手", emoji: "🍃", src: null },
  ],
};

const stage = document.getElementById('stage');
const pull  = document.getElementById('pull');
const home  = document.getElementById('home');
const sub   = document.getElementById('sub');
const costLine = document.getElementById('costLine');

function buildCard(item){
  const card = document.createElement('div');
  card.className = 'card';
  // 表
  const front = document.createElement('div');
  front.className = 'face front';
  if(item.src){
    const img = document.createElement('img'); img.src = item.src; img.alt = item.name;
    front.appendChild(img);
  } else {
    front.classList.add('frontPh');
    front.innerHTML = `<span class="ph-emoji">${item.emoji||'❖'}</span><span class="ph-name">${item.name||''}</span>`;
  }
  // 裏
  const back = document.createElement('div');
  back.className = 'face back';
  if(ASSETS.cardBack){
    const img = document.createElement('img'); img.src = ASSETS.cardBack; img.alt = '';
    back.appendChild(img);
  } else {
    back.innerHTML = `<span class="backMark">❖</span>`;
  }
  card.appendChild(front); card.appendChild(back);
  return card;
}

let drawing = false;
function draw(){
  if(drawing) return; drawing = true;
  pull.disabled = true;
  sub.textContent = '排出中…';

  // 1) カードを裏向きで整列して登場（時間差）
  stage.innerHTML = '';
  const cards = ASSETS.pool.map(buildCard);
  cards.forEach((c, i)=>{
    c.classList.add('enter');
    c.style.animationDelay = (i*0.1)+'s';
    stage.appendChild(c);
  });

  // 2) 登場後に一拍おいて、左から順にめくる
  const enterDone = 0.45 + (cards.length-1)*0.1; // 登場アニメ終了の概算秒
  setTimeout(()=>{
    cards.forEach((c, i)=>{
      setTimeout(()=> c.classList.add('flipped'), i*180);
    });
    // 3) 全部めくり終えたら余韻→ホームボタン表示
    const flipDone = (cards.length-1)*180 + 560;
    setTimeout(()=>{
      sub.textContent = '獲得しました';
      pull.classList.add('hidden');
      home.classList.remove('hidden');
      home.classList.add('fadein');
      drawing = false;
    }, flipDone + 500); // +500 = 余韻の間
  }, enterDone*1000 + 250); // +250 = 登場後の間
}

pull.addEventListener('click', draw);
home.addEventListener('click', ()=>{ location.href = './home-mockup.html'; });
</script>
</body>
</html>
