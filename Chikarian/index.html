/* =================================================================== 装備充填 */
// 込め可能数・プール増減・装備項は全てサーバ(equip_buki)。クライアントは目安と結果表示のみ。
// equip_buki は非破壊（現在の込め武気をプールへ返却→新条件で引き直す）。amount=0 で実質アンロード。
const FILL = {   // 充填量(枠) = 基礎+(MAX-基礎)×(Lv-1)/(上限-1)（balance §2-4）
  n: { b: 80, m: 240, cap: 30 }, r: { b: 120, m: 400, cap: 40 },
  sr: { b: 160, m: 560, cap: 50 }, ssr: { b: 200, m: 800, cap: 60 },
};
function EquipView({ base, refreshAll, onBack, flash }) {
  const info = parseCardKey(base.card_key);
  const f = FILL[info.rarity];
  const capacity = f ? Math.round(f.b + (f.m - f.b) * (((base.lv || 1) - 1) / (f.cap - 1))) : 0;  // 充填量(枠)目安
  const unlockedMax = base.card_key.endsWith('_sp') ? 0 : 999;  // SPはここに来ない想定

  const [pool, setPool] = useState(null);
  const [kajiyaLv, setKajiyaLv] = useState(1);
  const [quality, setQuality] = useState(base.quality || 'crude');
  const [amount, setAmount] = useState(Math.min(base.loaded_buki || 0, capacity));
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  async function loadPool() { try { const r = normalizeRk(await ChikarianAPI.getRenkiden()); setPool(r ? r.buki : 0); } catch (e) { setPool(0); } }
  useEffect(() => {
    loadPool();
    (async () => {
      try { const os = await ChikarianAPI.getKajiyaOrders() || []; setKajiyaLv(os.filter(o => o.claimed).reduce((mx, o) => Math.max(mx, Q_LV[o.quality] || 0), 1)); }
      catch (e) {}
    })();
  }, []);

  const qCost = Q_COST[quality] || 1;
  const poolMax = pool != null ? Math.floor(pool / qCost) : 0;
  const estMax = Math.min(capacity, poolMax);   // 上限目安（refundは含めない簡易目安・最終はサーバ）

  async function equip() {
    if (busy) return; setBusy(true);
    try {
      const res = await ChikarianAPI.equipBuki(base.id, quality, amount);  // ★込め確定はサーバ
      setResult(res);
      await loadPool();      // プール残（renkiden）
      await refreshAll();    // cards（quality/loaded_buki）→ 親で選択中カードも最新化
    } catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }

  if (pool === null) return <Booting />;

  if (result) {
    const soubi = result.soubi_kou != null ? result.soubi_kou : ((result.loaded_buki || 0) * (QATK[result.quality] || 0));
    return (
      <div style={S.root}><div style={S.bg} /><div style={S.vignette} />
        <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: GOLD_HI }}>装備を更新しました</div>
          <div style={{ fontSize: 13, color: '#e7d3a6', marginTop: 14, lineHeight: 2, textAlign: 'center' }}>
            質 {QUALITY_JA[result.quality] || result.quality}／込めた武気 {Number(result.loaded_buki || 0).toLocaleString()} 枠{result.capacity != null ? ` / 充填量 ${result.capacity}` : ''}<br />
            装備項 {Number(soubi).toLocaleString()}<br />
            {result.buki_drawn != null && <>引いた武気 {Number(result.buki_drawn).toLocaleString()}　</>}
            {result.buki_refunded != null && <>返却 {Number(result.buki_refunded).toLocaleString()}<br /></>}
            {result.pool_remaining != null && <>武気プール残 {Number(result.pool_remaining).toLocaleString()}</>}
          </div>
          <div style={{ display: 'flex', gap: 10, marginTop: 22 }}>
            <button onClick={() => { setResult(null); }} style={S.bigBtn}>つづけて調整</button>
            <button onClick={onBack} style={S.lineBtn}>カードに戻る</button>
          </div>
        </div>
      </div>
    );
  }

  const qualities = Q_ORDER.filter(q => Q_LV[q] <= kajiyaLv);

  return (
    <div style={S.root}><div style={S.bg} /><div style={S.vignette} />
      <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', padding: '14px 14px 18px', overflowY: 'auto' }}>
        <button onClick={onBack} style={{ ...S.lineBtn, alignSelf: 'flex-start', padding: '6px 16px' }}>‹ 戻る</button>
        <div style={{ textAlign: 'center', fontSize: 18, fontWeight: 800, letterSpacing: 2, color: GOLD_HI, marginTop: 6 }}>装備（充填）</div>

        <div style={{ marginTop: 10, padding: '8px 12px', background: PANEL, border: BORDER, borderRadius: 8, fontSize: 12, color: '#e7d3a6', lineHeight: 1.8 }}>
          {info.name}（{RAR_LABEL[info.rarity]}・Lv{base.lv}）<br />
          充填量(枠) 目安 {capacity}　武気プール {pool.toLocaleString()}
        </div>

        {/* 質選択（解放済みのみ） */}
        <div style={{ fontSize: 12, color: GOLD, fontWeight: 700, marginTop: 14, marginBottom: 6 }}>装備の質（鍛冶屋Lv{kajiyaLv}まで解放）</div>
        <div style={{ display: 'flex', gap: 6 }}>
          {Q_ORDER.map(q => {
            const locked = Q_LV[q] > kajiyaLv;
            return (
              <button key={q} onClick={() => !locked && setQuality(q)} disabled={locked} style={{ ...S.sideSwitch, flex: 1, padding: '8px 2px', flexDirection: 'column', display: 'flex', ...(q === quality ? S.sideSwitchOn : {}), ...(locked ? { opacity: .4 } : {}) }}>
                <span style={{ fontSize: 12, fontWeight: 700 }}>{QUALITY_JA[q]}</span>
                <span style={{ fontSize: 9, color: '#cdb488' }}>コスト{Q_COST[q]}/攻{QATK[q]}</span>
              </button>
            );
          })}
        </div>

        {/* 枠数 */}
        <div style={{ fontSize: 12, color: GOLD, fontWeight: 700, marginTop: 14, marginBottom: 6 }}>込める枠数</div>
        <input type="range" min="0" max={capacity} value={Math.min(amount, capacity)} onChange={e => setAmount(parseInt(e.target.value, 10))} style={{ width: '100%' }} />
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 4 }}>
          <span style={{ fontSize: 11, color: '#a98f66' }}>0</span>
          <span style={{ fontSize: 20, fontWeight: 800, color: GOLD_HI }}>{amount} 枠</span>
          <span style={{ fontSize: 11, color: '#a98f66' }}>{capacity}</span>
        </div>
        <div style={{ fontSize: 11, color: '#cdb488', marginTop: 6 }}>
          想定 装備項 {(amount * (QATK[quality] || 0)).toLocaleString()}（{amount}枠 × 攻{QATK[quality]}）<br />
          プールから引ける目安 ≤ {estMax}（floor(プール{pool.toLocaleString()} ÷ コスト{qCost})）。非破壊：現在の込めは一度プールへ返却され引き直し。最終確定はサーバ。
        </div>

        <button onClick={equip} disabled={busy} style={{ ...S.bigBtn, marginTop: 16, ...(busy ? { opacity: .45 } : {}) }}>{busy ? '装備中…' : (amount === 0 ? 'アンロード（全返却）' : '装備する')}</button>
      </div>
    </div>
  );
}

/* =================================================================== スキル錬成/転移 */
// 抽選・成否・消費・移動は全てサーバ(do_skill_rensei / do_skill_teni)。クライアントは結果表示のみ。
const RENSEI_RATE = { blue: 10, red: 33, rainbow: 100 };   // 確定（青10/赤33/虹100）
const COLOR_JA = { blue: '青', red: '赤', rainbow: '虹' };
const TENI_COST = 3000;   // メダル（確定）

function SkillView({ base, cards, profile, skillMap, refreshAll, onBack, flash }) {
  const [tab, setTab] = useState('rensei');
  const [skills, setSkills] = useState(null);   // base のスキル
  const [busy, setBusy] = useState(false);
  // 錬成
  const [color, setColor] = useState('blue');
  const [selSlot, setSelSlot] = useState(null);
  const [rResult, setRResult] = useState(null);
  // 転移
  const [srcId, setSrcId] = useState(null);
  const [srcSkills, setSrcSkills] = useState(null);
  const [srcSlot, setSrcSlot] = useState(null);
  const [dstSlot, setDstSlot] = useState(null);
  const [confirm, setConfirm] = useState(false);
  const [tResult, setTResult] = useState(null);

  async function loadBase() { try { setSkills(await ChikarianAPI.getCardSkills(base.id) || []); } catch (e) { flash(errMsg(e)); setSkills([]); } }
  useEffect(() => { loadBase(); }, [base.id]);

  const skName = k => (skillMap[k] && skillMap[k].display_name) || k;
  const skUpg = k => skillMap[k] ? skillMap[k].lv_upgradable : true;

  async function rensei() {
    if (busy || selSlot == null) return; setBusy(true);
    try { const res = await ChikarianAPI.doSkillRensei(base.id, selSlot, color); setRResult(res); await loadBase(); await refreshAll(); }
    catch (e) { flash(errMsg(e)); } finally { setBusy(false); }
  }
  async function pickSrc(id) { setSrcId(id); setSrcSlot(null); setSrcSkills(null); try { setSrcSkills(await ChikarianAPI.getCardSkills(id) || []); } catch (e) { flash(errMsg(e)); setSrcSkills([]); } }
  async function teni() {
    if (busy || srcId == null || srcSlot == null || dstSlot == null) return; setBusy(true);
    try {
      const res = await ChikarianAPI.doSkillTeni(srcId, srcSlot, base.id, dstSlot);
      setTResult(res); setConfirm(false);
      setSrcId(null); setSrcSkills(null); setSrcSlot(null); setDstSlot(null);
      await loadBase(); await refreshAll();
    } catch (e) { flash(errMsg(e)); setConfirm(false); } finally { setBusy(false); }
  }

  if (!skills) return <Booting />;
  const bySlot = {}; skills.forEach(s => { bySlot[s.slot] = s; });
  const emptySlots = [1, 2].filter(s => !bySlot[s]);

  return (
    <div style={S.root}><div style={S.bg} /><div style={S.vignette} />
      <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', padding: '14px 14px 18px', overflowY: 'auto' }}>
        <button onClick={onBack} style={{ ...S.lineBtn, alignSelf: 'flex-start', padding: '6px 16px' }}>‹ 戻る</button>
        <div style={{ display: 'flex', gap: 8, justifyContent: 'center', margin: '10px 0' }}>
          <button onClick={() => setTab('rensei')} style={{ ...S.sideSwitch, ...(tab === 'rensei' ? S.sideSwitchOn : {}) }}>錬成（強化）</button>
          <button onClick={() => setTab('teni')} style={{ ...S.sideSwitch, ...(tab === 'teni' ? S.sideSwitchOn : {}) }}>転移</button>
        </div>

        {/* ===== 錬成 ===== */}
        {tab === 'rensei' && <>
          {rResult && <div style={{ padding: '8px 12px', marginBottom: 10, borderRadius: 8, border: '1px solid rgba(232,194,90,.4)', background: 'rgba(40,30,20,.4)', fontSize: 12, color: rResult.success ? '#ffe28a' : '#ff9aa8' }}>
            {rResult.success ? '成功' : '失敗'}：{skName(rResult.skill_key)} Lv{rResult.old_lv}→{rResult.new_lv}（{COLOR_JA[rResult.color]} 消費{rResult.cost}・残{rResult.crystal_remaining}）
          </div>}
          <div style={{ fontSize: 11, color: '#cdb488', marginBottom: 6 }}>強化するスキル枠を選択（lv_upgradable=false は不可）</div>
          {[0, 1, 2].map(slot => {
            const row = bySlot[slot];
            const upg = row ? skUpg(row.skill_key) : false;
            const sel = selSlot === slot;
            return (
              <button key={slot} onClick={() => row && upg && setSelSlot(slot)} disabled={!row || !upg}
                style={{ display: 'block', width: '100%', textAlign: 'left', marginBottom: 6, padding: '8px 12px', borderRadius: 8, cursor: (row && upg) ? 'pointer' : 'default', background: sel ? 'rgba(232,194,90,.18)' : PANEL, border: sel ? '1.5px solid ' + GOLD : BORDER, opacity: (row && !upg) ? .5 : 1 }}>
                <div style={{ fontSize: 10, color: '#cdb488' }}>{slot === 0 ? '固定スキル' : '空きスロット' + slot}</div>
                {row
                  ? <div style={{ fontSize: 13, color: GOLD_HI, fontWeight: 700 }}>{skName(row.skill_key)} <span style={{ fontSize: 11, color: '#cdb488' }}>Lv{row.skill_lv}{!upg ? '・強化不可' : ''}</span>
                      {skillMap[row.skill_key] && skillMap[row.skill_key].notes && <span style={{ display: 'block', fontSize: 10, color: '#a98f66', fontWeight: 400 }}>{skillMap[row.skill_key].notes}</span>}
                    </div>
                  : <div style={{ fontSize: 12, color: '#a98f66' }}>空き</div>}
              </button>
            );
          })}

          <div style={{ fontSize: 11, color: '#cdb488', margin: '10px 0 6px' }}>クリスタル色（成功率）</div>
          <div style={{ display: 'flex', gap: 6 }}>
            {['blue', 'red', 'rainbow'].map(c => {
              const have = profile ? (profile['crystal_' + c] || 0) : 0;
              return (
                <button key={c} onClick={() => setColor(c)} style={{ ...S.sideSwitch, flex: 1, padding: '8px 2px', flexDirection: 'column', display: 'flex', ...(c === color ? S.sideSwitchOn : {}) }}>
                  <span style={{ fontSize: 13, fontWeight: 700 }}>{COLOR_JA[c]} {RENSEI_RATE[c]}%</span>
                  <span style={{ fontSize: 9, color: '#cdb488' }}>所持 {have}</span>
                </button>
              );
            })}
          </div>
          <div style={{ fontSize: 10, color: '#a98f66', marginTop: 6 }}>消費クリスタル数はサーバ算出（カーブ×レア倍率）。成功＝Lv+1／失敗＝消費のみ・Lv据置。</div>
          <button onClick={rensei} disabled={busy || selSlot == null} style={{ ...S.bigBtn, marginTop: 14, ...((busy || selSlot == null) ? { opacity: .45 } : {}) }}>{busy ? '錬成中…' : '錬成する'}</button>
        </>}

        {/* ===== 転移 ===== */}
        {tab === 'teni' && <>
          {tResult && <div style={{ padding: '8px 12px', marginBottom: 10, borderRadius: 8, border: '1px solid rgba(120,220,140,.4)', background: 'rgba(30,60,40,.3)', fontSize: 12, color: '#bff0cf' }}>
            転移成功：{skName(tResult.moved_skill)} Lv{tResult.moved_lv} を 枠{tResult.dst_slot} へ（メダル −{Number(tResult.medal_spent || TENI_COST).toLocaleString()}／残 {Number(tResult.medal_remaining || 0).toLocaleString()}）
          </div>}
          <div style={{ fontSize: 12, color: '#e7d3a6' }}>受け側：{parseCardKey(base.card_key).name}（空き枠 {emptySlots.length ? emptySlots.join('・') : 'なし'}）</div>
          {emptySlots.length === 0
            ? <div style={{ fontSize: 12, color: '#ff9aa8', marginTop: 10 }}>空き枠がありません（転移先なし）</div>
            : <>
                <div style={{ fontSize: 11, color: '#cdb488', margin: '10px 0 6px' }}>素材カードを選ぶ（同名/別カード可・ロック/SPは不可。素材は消滅）</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 6, maxHeight: 220, overflowY: 'auto' }}>
                  {(cards || []).filter(c => c.id !== base.id && !c.locked && !c.card_key.endsWith('_sp')).map(c => (
                    <div key={c.id} style={{ outline: srcId === c.id ? '2px solid ' + GOLD : 'none', borderRadius: 10 }}>
                      <CardThumb card={c} small onClick={() => pickSrc(c.id)} />
                    </div>
                  ))}
                </div>

                {srcId && (srcSkills === null ? <div style={{ marginTop: 10 }}><div className="spin" /></div>
                  : <>
                      <div style={{ fontSize: 11, color: '#cdb488', margin: '10px 0 6px' }}>移すスキルを1つ選ぶ</div>
                      {srcSkills.length === 0 ? <div style={{ fontSize: 11, color: '#a98f66' }}>スキルがありません</div>
                        : srcSkills.map(s => (
                          <button key={s.slot} onClick={() => setSrcSlot(s.slot)} style={{ display: 'block', width: '100%', textAlign: 'left', marginBottom: 6, padding: '8px 12px', borderRadius: 8, cursor: 'pointer', background: srcSlot === s.slot ? 'rgba(232,194,90,.18)' : PANEL, border: srcSlot === s.slot ? '1.5px solid ' + GOLD : BORDER }}>
                            <span style={{ fontSize: 13, color: GOLD_HI, fontWeight: 700 }}>{skName(s.skill_key)}</span> <span style={{ fontSize: 11, color: '#cdb488' }}>Lv{s.skill_lv}（{s.slot === 0 ? '固定' : '空き' + s.slot}）</span>
                          </button>
                        ))}
                    </>)}

                {srcId && srcSlot != null && <>
                  <div style={{ fontSize: 11, color: '#cdb488', margin: '10px 0 6px' }}>受け側の空き枠</div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    {emptySlots.map(s => <button key={s} onClick={() => setDstSlot(s)} style={{ ...S.sideSwitch, flex: 1, ...(dstSlot === s ? S.sideSwitchOn : {}) }}>枠{s}</button>)}
                  </div>
                </>}

                <button onClick={() => setConfirm(true)} disabled={busy || srcId == null || srcSlot == null || dstSlot == null}
                  style={{ ...S.bigBtn, marginTop: 14, ...((busy || srcId == null || srcSlot == null || dstSlot == null) ? { opacity: .45 } : {}) }}>転移する（メダル{TENI_COST.toLocaleString()}）</button>
              </>}
        </>}
      </div>

      {/* 転移 確認ポップアップ */}
      {confirm && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.7)', display: 'grid', placeItems: 'center', zIndex: 60, padding: 24 }}>
          <div style={{ maxWidth: 360, background: '#160a13', border: BORDER, borderRadius: 12, padding: 18, textAlign: 'center' }}>
            <div style={{ fontSize: 14, color: GOLD_HI, fontWeight: 700, marginBottom: 8 }}>転移の確認</div>
            <div style={{ fontSize: 12, color: '#e7d3a6', lineHeight: 1.8 }}>素材カードと、<b>選ばなかったスキルも失われます</b>。<br />メダル {TENI_COST.toLocaleString()} を消費します。よろしいですか？</div>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 16 }}>
              <button onClick={teni} disabled={busy} style={S.bigBtn}>{busy ? '転移中…' : '実行する'}</button>
              <button onClick={() => setConfirm(false)} disabled={busy} style={S.lineBtn}>やめる</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* =================================================================== 交換所 */
// 交換個数・種類・カード消滅・クリスタル付与は全てサーバ(do_card_exchange)。クライアントは見込みと結果表示のみ。
// 見込み = round(base_value_blue × (1 + star_coeff×★) ÷ divisor)（crystal_exchange_master・確定はサーバ）。
function ExchangeView({ base, refreshAll, onBack, flash }) {
  const info = parseCardKey(base.card_key);
  const [rates, setRates] = useState(null);
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  useEffect(() => { (async () => { try { setRates(await ChikarianAPI.getExchangeRates() || []); } catch (e) { setRates([]); } })(); }, []);

  const rate = (rates || []).find(r => r.rarity === info.rarity) || null;
  const est = rate ? { color: rate.crystal_color, count: Math.round(rate.base_value_blue * (1 + (rate.star_coeff || 0) * (base.star || 0)) / (rate.divisor || 1)) } : null;

  async function exchange() {
    if (busy) return; setBusy(true);
    try { const res = await ChikarianAPI.doCardExchange(base.id); setResult(res); }  // 成功時はここでは再取得しない（結果表示を残す）
    catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }
  async function done() { await refreshAll(); }  // カード消滅を親が検知→詳細を閉じて一覧へ（sel同期）

  if (rates === null) return <Booting />;

  if (result) {
    return (
      <div style={S.root}><div style={S.bg} /><div style={S.vignette} />
        <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: GOLD_HI }}>交換しました</div>
          <div style={{ fontSize: 14, color: '#e7d3a6', marginTop: 14, lineHeight: 2, textAlign: 'center' }}>
            {COLOR_JA[result.crystal_color] || result.crystal_color}クリスタル ×{Number(result.crystal_count || 0).toLocaleString()} 獲得<br />
            <span style={{ fontSize: 12, color: '#cdb488' }}>
              所持 青{Number(result.crystal_blue || 0).toLocaleString()}／赤{Number(result.crystal_red || 0).toLocaleString()}／虹{Number(result.crystal_rainbow || 0).toLocaleString()}
            </span>
          </div>
          <button onClick={done} style={{ ...S.bigBtn, marginTop: 22 }}>完了</button>
        </div>
      </div>
    );
  }

  return (
    <div style={S.root}><div style={S.bg} /><div style={S.vignette} />
      <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', padding: '14px 14px 18px' }}>
        <button onClick={onBack} style={{ ...S.lineBtn, alignSelf: 'flex-start', padding: '6px 16px' }}>‹ 戻る</button>
        <div style={{ textAlign: 'center', fontSize: 18, fontWeight: 800, letterSpacing: 2, color: GOLD_HI, marginTop: 6 }}>交換所</div>

        <div style={{ display: 'flex', gap: 12, marginTop: 14, alignItems: 'center' }}>
          <div style={{ width: 80 }}><CardThumb card={base} small /></div>
          <div style={{ fontSize: 13, color: '#e7d3a6', lineHeight: 1.8 }}>
            {info.name}<br />レア {RAR_LABEL[info.rarity]}　★{base.star || 0}
          </div>
        </div>

        <div style={{ marginTop: 16, padding: '12px 14px', background: PANEL, border: BORDER, borderRadius: 8, textAlign: 'center' }}>
          {est
            ? <div style={{ fontSize: 14, color: GOLD_HI }}>見込み：{COLOR_JA[est.color] || est.color}クリスタル ×{est.count}</div>
            : <div style={{ fontSize: 12, color: '#ff9aa8' }}>このレアの交換レートが見つかりません（最終判定はサーバ）</div>}
          <div style={{ fontSize: 11, color: '#ff9aa8', marginTop: 8, fontWeight: 700 }}>このカードは消滅します。元に戻せません。</div>
          <div style={{ fontSize: 10, color: '#a98f66', marginTop: 4 }}>個数・種類はサーバ確定（マスタ計算）。手計算との丸め差±1は仕様内。図鑑の収集記録は消えません。</div>
        </div>

        <button onClick={exchange} disabled={busy} style={{ ...S.bigBtn, marginTop: 18, ...(busy ? { opacity: .45 } : {}) }}>{busy ? '交換中…' : '交換する（不可逆）'}</button>
      </div>
    </div>
  );
}

/* =================================================================== ミッション */
// 達成判定・報酬付与は全てサーバ(claim_mission)。クライアントは表示と受取ボタンのみ。
// 進捗はクライアント目安（導出可能なもののみ）。最終判定はサーバ。報酬は mission_master.reward / 返り値のみ。
const REWARD_LABEL = { medal: 'メダル', chikarium: 'チカリウム', buki: '武気', c_blue: '青', c_red: '赤', c_rainbow: '虹', hoshou: '保証石' };
const CAT_JA = { daily: 'デイリー', weekly: 'ウィークリー', achievement: '達成' };
const CAT_RESET = { daily: '毎日0時(JST)にリセット', weekly: '毎週月曜0時(JST)にリセット', achievement: '恒常（1回限り）' };
function jstWeekStart() {
  const d = new Date(jstToday() + 'T00:00:00Z');
  const wd = d.getUTCDay();            // 0=日..6=土
  d.setUTCDate(d.getUTCDate() - (wd === 0 ? 6 : wd - 1));  // 月曜起点（PG date_trunc('week')と一致）
  return d.toISOString().slice(0, 10);
}
function rewardChips(reward) {
  if (!reward) return null;
  return Object.keys(reward).map(k => REWARD_LABEL[k] ? <span key={k} style={{ fontSize: 11, color: '#fff3c8', background: 'rgba(232,194,90,.15)', border: '1px solid rgba(232,194,90,.4)', borderRadius: 10, padding: '2px 8px', marginRight: 4 }}>{REWARD_LABEL[k]}×{reward[k]}</span> : null);
}

function MissionScreen({ profile, cards, refreshAll, back, flash }) {
  const [tab, setTab] = useState('daily');
  const [master, setMaster] = useState(null);
  const [missions, setMissions] = useState(null);
  const [zukan, setZukan] = useState(null);
  const [kajiyaLv, setKajiyaLv] = useState(1);
  const [tansaku, setTansaku] = useState(null);
  const [busy, setBusy] = useState(false);

  async function loadMissions() { try { setMissions(await ChikarianAPI.getMissions() || []); } catch (e) { setMissions([]); } }
  useEffect(() => {
    (async () => {
      try { setMaster(await ChikarianAPI.getMissionMaster() || []); } catch (e) { flash(errMsg(e)); setMaster([]); }
      await loadMissions();
      try { setZukan(await ChikarianAPI.getZukan() || []); } catch (e) {}
      try { setTansaku(await ChikarianAPI.getTansaku() || []); } catch (e) {}
      try { const os = await ChikarianAPI.getKajiyaOrders() || []; setKajiyaLv(os.filter(o => o.claimed).reduce((mx, o) => Math.max(mx, Q_LV[o.quality] || 0), 1)); } catch (e) {}
    })();
  }, []);

  if (!master || !missions) return <Booting />;

  const periodOf = cat => cat === 'daily' ? jstToday() : (cat === 'weekly' ? jstWeekStart() : '1970-01-01');
  const masterByKey = {}; master.forEach(m => { masterByKey[m.mission_key] = m; });
  const rowOf = mm => missions.find(r => r.mission_key === mm.mission_key && r.period_start === periodOf(mm.category)) || null;
  const dayStartMs = new Date(jstToday() + 'T00:00:00+09:00').getTime();

  function claimedCount(cat) {
    const p = periodOf(cat);
    return missions.filter(r => r.period_start === p && r.claimed && masterByKey[r.mission_key] && masterByKey[r.mission_key].category === cat && masterByKey[r.mission_key].condition_type !== ('all_' + cat)).length;
  }

  function estProgress(mm, row) {
    switch (mm.condition_type) {
      case 'saishu_today': return (profile && profile.saishu_date === jstToday()) ? (profile.saishu_today || 0) : 0;
      case 'boss_attempt_today': return (profile && profile.boss_date === jstToday()) ? (profile.boss_count_today || 0) : 0;
      case 'gacha_today': return (cards || []).filter(c => c.obtained_at && new Date(c.obtained_at).getTime() >= dayStartMs).length;
      case 'tansaku_collect_today': return tansaku ? tansaku.filter(t => t.last_collect_at && new Date(t.last_collect_at).getTime() >= dayStartMs).length : null;
      case 'cleared_stage': return profile ? (profile.cleared_stage || 0) : 0;
      case 'zukan_count': return zukan ? zukan.length : null;
      case 'kajiya_lv': return kajiyaLv;
      case 'all_daily': return claimedCount('daily');
      case 'all_weekly': return claimedCount('weekly');
      case 'cnt_kyoka': case 'cnt_rensei': case 'cnt_saishu_week': return row ? (row.progress || 0) : 0;
      default: return null;  // boss_win_week / max_skill_lv / deck_power はサーバ判定
    }
  }

  async function claim(mm) {
    if (busy) return; setBusy(true);
    try {
      const res = await ChikarianAPI.claimMission(mm.mission_key);
      const r = res && res.reward ? res.reward : {};
      const parts = Object.keys(r).map(k => (REWARD_LABEL[k] || k) + '×' + r[k]);
      flash('受け取りました：' + (parts.join('・') || 'なし'));
      await loadMissions(); await refreshAll();
    } catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }

  const list = master.filter(m => m.category === tab).sort((a, b) => (a.tier - b.tier) || a.mission_key.localeCompare(b.mission_key));

  return (
    <div style={S.root}><div style={S.bg} /><div style={S.vignette} />
      <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', padding: '14px 12px 18px', overflowY: 'auto' }}>
        <div style={{ textAlign: 'center', fontSize: 20, fontWeight: 800, letterSpacing: 3, color: GOLD_HI }}>ミッション</div>
        <div style={{ display: 'flex', gap: 6, justifyContent: 'center', margin: '12px 0' }}>
          {['daily', 'weekly', 'achievement'].map(c => (
            <button key={c} onClick={() => setTab(c)} style={{ ...S.sideSwitch, padding: '6px 14px', ...(c === tab ? S.sideSwitchOn : {}) }}>{CAT_JA[c]}</button>
          ))}
        </div>
        <div style={{ textAlign: 'center', fontSize: 10, color: '#a98f66', marginBottom: 8 }}>{CAT_RESET[tab]}</div>

        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {list.map(mm => {
            const row = rowOf(mm);
            const claimed = row ? row.claimed : false;
            const est = estProgress(mm, row);
            const isBonus = mm.condition_type === 'all_daily' || mm.condition_type === 'all_weekly';
            const met = est == null ? null : est >= Number(mm.threshold);
            const claimable = !claimed && (met === null || met === true);
            return (
              <div key={mm.mission_key} style={{ padding: '10px 12px', background: PANEL, border: BORDER, borderRadius: 8, opacity: claimed ? .6 : 1 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <span style={{ fontSize: 14, color: GOLD_HI, fontWeight: 700 }}>{mm.title}</span>
                  <span style={{ fontSize: 11, color: met === false ? '#cdb488' : '#7fd39a' }}>{est == null ? '？' : Math.floor(est)} / {Number(mm.threshold).toLocaleString()}</span>
                </div>
                <div style={{ marginTop: 6 }}>{rewardChips(mm.reward)}</div>
                <div style={{ marginTop: 8 }}>
                  {claimed
                    ? <button disabled style={{ ...S.lineBtn, opacity: .5, width: '100%' }}>受取済</button>
                    : claimable
                      ? <button onClick={() => claim(mm)} disabled={busy} style={{ ...S.bigBtn, width: '100%', padding: '9px' }}>受け取る</button>
                      : <button disabled style={{ ...S.lineBtn, opacity: .5, width: '100%' }}>{isBonus ? '先に各ミッションを受け取る' : '条件未達'}</button>}
                </div>
                {est == null && !claimed && <div style={{ fontSize: 9, color: '#a98f66', marginTop: 4 }}>進捗はサーバ判定（押すと判定）</div>}
              </div>
            );
          })}
        </div>
        <button onClick={back} style={{ ...S.lineBtn, marginTop: 12, alignSelf: 'center' }}>ホームに戻る</button>
      </div>
    </div>
  );
}
