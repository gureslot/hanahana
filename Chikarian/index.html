`;
// 名前・界名・モチーフ・ボス画像は boss-mockup の STAGES が正（デザイン確定値／boss_master には無い）。
// bosses 配列の並びは [中ボスA, 中ボスB, 面ボス]＝role a/b/boss。画像 boss_<面>_<role>。戦闘数値は boss_master を bossKey で引く。
const BOSS_STAGES = [
  { stage: 1, world: '古代樹海界', motif: 'リス', bosses: [{ role: '中ボスA', name: 'ヴェルグラフ', img: 'boss_1_a' }, { role: '中ボスB', name: 'ゼルヴァニクス', img: 'boss_1_b' }, { role: '面ボス', name: 'アルヴェノクス', img: 'boss_1_boss' }] },
  { stage: 2, world: '黒曜山界', motif: '牛', bosses: [{ role: '中ボスA', name: 'グラドム', img: 'boss_2_a' }, { role: '中ボスB', name: 'ヴォルガルド', img: 'boss_2_b' }, { role: '面ボス', name: 'ザグロディオン', img: 'boss_2_boss' }] },
  { stage: 3, world: '神域界', motif: '柴犬', bosses: [{ role: '中ボスA', name: 'シラフェイン', img: 'boss_3_a' }, { role: '中ボスB', name: 'アークレオン', img: 'boss_3_b' }, { role: '面ボス', name: 'ラディシオン', img: 'boss_3_boss' }] },
  { stage: 4, world: '鋼殻要塞界', motif: 'サイ', bosses: [{ role: '中ボスA', name: 'フォートガル', img: 'boss_4_a' }, { role: '中ボスB', name: 'アイゼルバスト', img: 'boss_4_b' }, { role: '面ボス', name: 'ガルドニクス', img: 'boss_4_boss' }] },
  { stage: 5, world: '雷帝界', motif: '虎', bosses: [{ role: '中ボスA', name: 'ライガルス', img: 'boss_5_a' }, { role: '中ボスB', name: 'ジンライヴァ', img: 'boss_5_b' }, { role: '面ボス', name: 'ザルギアント', img: 'boss_5_boss' }] },
  { stage: 6, world: '群体界', motif: 'ネズミ', bosses: [{ role: '中ボスA', name: 'ミュラト', img: 'boss_6_a' }, { role: '中ボスB', name: 'ミュラゴス', img: 'boss_6_b' }, { role: '面ボス', name: 'ヌグラミアス', img: 'boss_6_boss' }] },
  { stage: 7, world: '幻妖界', motif: '狐', bosses: [{ role: '中ボスA', name: 'セリナフ', img: 'boss_7_a' }, { role: '中ボスB', name: 'ファルヴェイラ', img: 'boss_7_b' }, { role: '面ボス', name: 'ナギュリスカ', img: 'boss_7_boss' }] },
  { stage: 8, world: '終幕界', motif: 'ピエロ', bosses: [{ role: '中ボスA', name: 'カリヴェナ', img: 'boss_8_a' }, { role: '中ボスB', name: 'ノルディアス', img: 'boss_8_b' }, { role: '面ボス', name: 'グラヴィネア＝ディスカリオ', img: 'boss_8_boss' }] },
];
// 終幕界2周目（女型3体）。マップ・解放は今後対応のためデータのみ保持（UI未使用）。
const BOSS_FINALE_R2 = { stage: 8, round: 2, world: '終幕界', motif: 'ピエロ（女型）', bosses: [{ role: '中ボスA', name: 'カリオネラ', img: 'boss_8_a_r2' }, { role: '中ボスB', name: 'ノルディアーナ', img: 'boss_8_b_r2' }, { role: '面ボス', name: 'グラヴィエラ＝ディスカリス', img: 'boss_8_boss_r2' }] };
const BOSS_ROLE_KEYS = ['a', 'b', 'boss'];                                   // ノード並び＝STAGES bosses 並び
const BOSS_NODES = [{ left: '28%', top: '23%', size: 'sub' }, { left: '70%', top: '53.5%', size: 'sub' }, { left: '52%', top: '84%', size: 'boss', up: true }];

function BossNodeImg({ src }) {
  // マップのピン＝ic_map_subboss / ic_map_boss（汎用アイコン）。読めなければ赤い拍動ドット(.boss-gi)にフォールバック。
  const [err, setErr] = useState(false);
  if (err) return null;
  return <img src={src} alt="" onError={() => setErr(true)} />;
}
// 出撃のローカル秒読み：サーバ now と clientの差(offset)で残り秒・phaseを毎秒再計算（最終判定はサーバ）。
function bossLivePhase(s, offset, nowMs) {
  const serverNow = nowMs + offset;
  if (s.returning) {
    const ret = s.return_until ? new Date(s.return_until).getTime() : serverNow;
    const rem = Math.max(0, Math.ceil((ret - serverNow) / 1000));
    return { phase: rem <= 0 ? 'return_done' : 'returning', remaining: rem };
  }
  const arr = new Date(s.arrive_at).getTime();
  const rem = Math.max(0, Math.ceil((arr - serverNow) / 1000));
  return { phase: rem <= 0 ? 'arrived' : 'out', remaining: rem };
}
function bossMmss(t) { t = Math.max(0, Math.floor(t)); const m = Math.floor(t / 60), s = t % 60; return m + ':' + String(s).padStart(2, '0'); }
function bossSortieName(bossKey) {
  const m = /^boss_([1-8])_(a|b|boss)/.exec(bossKey || '');
  if (!m) return bossKey;
  const st = BOSS_STAGES[+m[1] - 1]; const idx = BOSS_ROLE_KEYS.indexOf(m[2]);
  return (st && st.bosses[idx]) ? st.bosses[idx].name : bossKey;
}

const BUKI_CAP = { n: { base: 80, max: 240, lvcap: 30 }, r: { base: 120, max: 400, lvcap: 40 }, sr: { base: 160, max: 560, lvcap: 50 }, ssr: { base: 200, max: 800, lvcap: 60 } };  // 武気の充填量(枠上限)＝0017準拠
const BUKI_COLOR = { crude: '#9aa0a6', refined: '#7ec8ff', enchanted: '#c08bff', holy: '#ffd86a' };  // 質ごとのゲージ色
function bukiCapacity(card) { if (/_sp$/.test(card.card_key || '')) return 0; const r = (parseCardKey(card.card_key) || {}).rarity || 'n'; const b = BUKI_CAP[r] || BUKI_CAP.n; return Math.floor(b.base + (b.max - b.base) * ((card.lv || 1) - 1) / (b.lvcap - 1)); }

function BossScreen({ profile, cards, onRefresh, back, flash }) {
  const [bosses, setBosses] = useState(null);
  const [decks, setDecks] = useState(null);
  const [skillMap, setSkillMap] = useState({});
  const [spSet, setSpSet] = useState({});                              // SP離脱中（card_id→true）。出撃シートで離脱SPを除外表示
  const [detailCard, setDetailCard] = useState(null);                  // カードタップ→CardDetail オーバーレイ
  const [editDeckNo, setEditDeckNo] = useState(null);                  // 編成ボタン→DeckScreen オーバーレイ
  const [fillingDeck, setFillingDeck] = useState(null);                // 最大充填 処理中のデッキ番号（連打防止）
  const [emptyingDeck, setEmptyingDeck] = useState(null);              // 空にする 処理中のデッキ番号（連打防止）
  const [deckNo, setDeckNo] = useState(1);
  const cleared = (profile && profile.cleared_stage) || 0;
  const [stage, setStage] = useState(() => Math.min(cleared + 1, 8));   // 既定＝次の未クリア面（フロンティア）
  const [openNode, setOpenNode] = useState(null);                       // 開いているノード index(0..2) or null
  const [worldOpen, setWorldOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [sorties, setSorties] = useState([]);                           // get_boss_sorties の sorties[]
  const [clockOffset, setClockOffset] = useState(0);                    // サーバ now − client now（ms）
  const [now, setNow] = useState(Date.now());
  const collectedRef = useRef({});                                      // 自動回収の重複防止（deck_no:started_at）

  const maxDecks = Math.min(2 + Math.floor(((profile && profile.cleared_stage) || 0) / 2), 6);
  const triesUsed = (profile && profile.boss_date === jstToday()) ? (profile.boss_count_today || 0) : 0;
  const triesLeft = Math.max(0, 3 - triesUsed);
  const BOSS_TEST_NO_LIMIT = true;                                       // ★テスト用・本番前に false か削除
  const effTriesLeft = BOSS_TEST_NO_LIMIT ? 99 : triesLeft;             // 出撃可否のみ解放（表示の triesLeft は実数のまま）

  async function refetchSorties() {
    try { const d = await ChikarianAPI.getBossSorties(); setSorties((d && d.sorties) || []); setClockOffset(d && d.now ? (new Date(d.now).getTime() - Date.now()) : 0); }
    catch (e) { /* 取得失敗時はゲージ非表示（最終判定はサーバ操作で担保） */ }
  }
  useEffect(() => {
    (async () => {
      try { setBosses(await ChikarianAPI.getBossMaster() || []); } catch (e) { flash(errMsg(e)); setBosses([]); }
      try { setDecks(await ChikarianAPI.getDecks() || []); } catch (e) { setDecks([]); }
      try { const sm = await ChikarianAPI.getSkillMaster(); const m = {}; (sm || []).forEach(s => { m[s.skill_key] = s; }); setSkillMap(m); } catch (e) {}
      try { const sp = await ChikarianAPI.getSpStates(); const t = jstToday(); const ss = {}; (sp || []).forEach(x => { if (x.unavailable_until >= t) ss[x.card_id] = true; }); setSpSet(ss); } catch (e) {}
    })();
    refetchSorties();
    const t1 = setInterval(() => setNow(Date.now()), 1000);          // ローカル秒読み
    const t2 = setInterval(refetchSorties, 20000);                   // periodic 再取得
    return () => { clearInterval(t1); clearInterval(t2); };
  }, []);

  // 自動回収：到着('arrived'=戦闘＋復路入り)／帰宅('return_done'=解放)を各1回 collect（0045）。結果は battle_logs へ。
  async function autoCollect(dno, k) {
    try {
      const res = await ChikarianAPI.collectBossResult(dno);
      flash(res && res.returning ? `デッキ${dno} 到着・帰還中（報告書に記録）` : `デッキ${dno} 帰還`);
    } catch (e) { if (/STILL_/.test((e && e.message) || '')) delete collectedRef.current[k]; }  // 復路未完は次tick再試行・NOT_ON_SORTIE等はキー保持
    finally { await refetchSorties(); try { await onRefresh(); } catch (e) {} }
  }
  useEffect(() => {
    sorties.forEach(s => {
      const L = bossLivePhase(s, clockOffset, now);
      if (L.phase === 'arrived' || L.phase === 'return_done') {
        const k = s.deck_no + ':' + s.started_at + ':' + L.phase;
        if (!collectedRef.current[k]) { collectedRef.current[k] = true; autoCollect(s.deck_no, k); }
      }
    });
  }, [sorties, now, clockOffset]);

  // 出撃（戦闘はまだ起きない・回数消費＋デッキ占有）。bossKey は従来形式。
  async function startSortie(role) {
    if (busy) return; setBusy(true);
    try { await ChikarianAPI.startBossBattle(deckNo, 'boss_' + stage + '_' + role); setOpenNode(null); await refetchSorties(); await onRefresh(); flash('出撃しました'); }
    catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }
  // キャンセル（出撃中のみ・経過時間ぶん帰還／回数返金）。帰還完了は自動回収で解放。
  async function cancelSortie(dno) {
    if (busy) return; setBusy(true);
    try { await ChikarianAPI.cancelBossSortie(dno); await refetchSorties(); await onRefresh(); flash('引き返します（帰還中）'); }
    catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }

  if (bosses === null || decks === null) return <Booting />;

  const curStage = BOSS_STAGES[stage - 1];                              // 表示中の面（名前/界/ボス画像の正）
  const closeSheet = () => setOpenNode(null);
  const busyDecks = new Set(sorties.map(s => s.deck_no));               // 出撃中デッキ
  function openSheet(i) { setOpenNode(i); const free = Array.from({ length: maxDecks }, (_, k) => k + 1).find(n => deckLock(n) === null && deckUsable(n) > 0); if (free) setDeckNo(free); }

  // デッキ内容（CardThumb＋名前）と総合戦力（computeStats の総合の和）
  const cardById = {}; (cards || []).forEach(c => { cardById[c.id] = c; });
  function deckMembers(n) { const row = (decks || []).find(d => d.deck_no === n); const ids = row ? [row.slot1_card_id, row.slot2_card_id, row.slot3_card_id] : [null, null, null]; return ids.map(id => id ? cardById[id] : null); }
  function deckTotal(n) { return deckMembers(n).filter(c => c && !spSet[c.id]).reduce((a, c) => a + computeStats(c).sougou, 0); }   // 離脱SPは戦力から除外
  function deckUsable(n) { return deckMembers(n).filter(c => c && !spSet[c.id]).length; }   // 出撃に出せる枚数（離脱SP除く）
  function deckLock(n) { if (busyDecks.has(n)) return 'boss'; if (deckMembers(n).some(c => c && c.tansaku_deck_no != null)) return 'tansaku'; return null; }   // 'boss'=出撃中 / 'tansaku'=探索中 / null=出撃可

  // 最大充填：当該デッキの全カードを順次（並列不可）込められるだけ満タンに。SPはスキップ。
  //   equip_buki に大きな枠数を渡す→サーバが枠上限/プール残でキャップ＝「最大充填」。質は現状維持(null→crude)。
  async function maxFillDeck(n) {
    if (fillingDeck !== null) return; setFillingDeck(n);
    let totalFilled = 0;
    try {
      for (const c of deckMembers(n).filter(Boolean)) {
        if (/_sp$/.test(c.card_key || '')) continue;                  // SP＝武気を持たない
        const before = c.loaded_buki || 0;
        try {
          const res = await ChikarianAPI.equipBuki(c.id, c.quality || 'crude', 100000);   // 質維持・大量指定でキャップ
          const after = (res && res.loaded_buki != null) ? Number(res.loaded_buki) : before;
          totalFilled += Math.max(0, after - before);
        } catch (e) { /* 個別失敗は継続（最終判定はサーバ） */ }
      }
      try { await onRefresh(); } catch (e) {}                         // cards 再取得（loaded_buki 表示更新）
      let remaining = null;
      try { const rk = normalizeRk(await ChikarianAPI.getRenkiden()); remaining = rk ? rk.buki : null; } catch (e) {}
      if (totalFilled > 0) flash(`武気を ${totalFilled.toLocaleString()} 枠充填しました` + (remaining != null ? `（練気殿 残り ${Number(remaining).toLocaleString()}）` : ''));
      else if (remaining != null && remaining <= 0) flash('練気殿に武気がありません');
      else flash('すでに最大まで充填されています');
    } finally { setFillingDeck(null); }
  }

  // 空にする：当該デッキの全カードの武気を解除（loaded_buki=0）→プールへ返却。SPはスキップ。
  async function emptyDeck(n) {
    if (fillingDeck !== null || emptyingDeck !== null) return; setEmptyingDeck(n);
    let totalEmptied = 0;
    try {
      for (const c of deckMembers(n).filter(Boolean)) {
        if (/_sp$/.test(c.card_key || '')) continue;                  // SP＝武気を持たない
        const before = c.loaded_buki || 0;
        if (before <= 0) continue;
        try {
          await ChikarianAPI.equipBuki(c.id, c.quality || 'crude', 0);   // 0=空（武気はプールへ返却）
          totalEmptied += before;
        } catch (e) { /* 個別失敗は継続（最終判定はサーバ） */ }
      }
      try { await onRefresh(); } catch (e) {}                         // cards 再取得（loaded_buki 表示更新）
      let remaining = null;
      try { const rk = normalizeRk(await ChikarianAPI.getRenkiden()); remaining = rk ? rk.buki : null; } catch (e) {}
      if (totalEmptied > 0) flash(`武気を ${totalEmptied.toLocaleString()} 枠 解除しました` + (remaining != null ? `（練気殿 残り ${Number(remaining).toLocaleString()}）` : ''));
      else flash('解除する武気がありません');
    } finally { setEmptyingDeck(null); }
  }

  // 各デッキの live phase（毎秒再計算）
  const liveByDeck = {};
  sorties.forEach(s => { liveByDeck[s.deck_no] = Object.assign({ s }, bossLivePhase(s, clockOffset, now)); });
  // 現在の面に出撃中のロール → ノード busy 表示
  const busyRoleOnStage = {};
  sorties.forEach(s => { const m = /^boss_([1-8])_(a|b|boss)/.exec(s.boss_key); if (m && +m[1] === stage) busyRoleOnStage[m[2]] = true; });

  return (
    <div style={bossRoot}>
      <style>{BOSS_CSS}</style>
      <div className="boss-mapWrap" style={{ backgroundImage: `url(./images/boss_map_${stage}.png)` }}>
        <div className="boss-mapDim" />
        {curStage.bosses.map((b, i) => {
          const pos = BOSS_NODES[i];
          const role = BOSS_ROLE_KEYS[i];
          const pinSrc = i < 2 ? './images/ic_map_subboss.png' : './images/ic_map_boss.png';   // ピン＝汎用アイコン（ボス絵は報告書で使う）
          const nodeBusy = !!busyRoleOnStage[role];
          return (
            <div key={i} className={'boss-node' + (pos.up ? ' up' : '') + (nodeBusy ? ' busy' : '')} style={{ left: pos.left, top: pos.top }} onClick={() => openSheet(i)}>
              <div className={'boss-dot ' + pos.size}><span className="boss-gi" /><BossNodeImg src={pinSrc} /></div>
              <div className="boss-lbl">{b.role} ・ {b.name}</div>
            </div>
          );
        })}
      </div>

      {/* 左上：アクティブ出撃ピル（ゲージ） */}
      <div className="boss-topleft">
        {sorties.map(s => {
          const L = liveByDeck[s.deck_no]; if (!L) return null;
          const phase = L.phase, rem = L.remaining;
          // 帰還の総時間＝(return_until − started_at)/2（経過ぶん折り返し）。出撃は travel_sec。
          let total = s.travel_sec || 1;
          if (s.returning && s.return_until) total = Math.max(1, (new Date(s.return_until).getTime() - new Date(s.started_at).getTime()) / 1000 / 2);
          const pct = (phase === 'arrived' || phase === 'return_done') ? 100 : Math.min(100, Math.max(0, (total - rem) / total * 100));
          const phCls = phase === 'returning' ? 'back' : ((phase === 'arrived' || phase === 'return_done') ? 'done' : 'go');
          const phLbl = phase === 'out' ? '到達まで' : (phase === 'returning' ? '帰還まで' : '回収中');
          return (
            <div key={s.deck_no} className="boss-sortie">
              <div className="boss-sortieTop">デッキ{s.deck_no} ・ {bossSortieName(s.boss_key)}</div>
              <div className="boss-sgRow">
                <span className={'ph ' + phCls}>{phLbl}</span>
                <div className="boss-sgbar"><span className={'boss-sgfill ' + phCls} style={{ width: pct + '%' }} /></div>
                <span className="tm">{(phase === 'arrived' || phase === 'return_done') ? '—' : bossMmss(rem)}</span>
              </div>
              {phase === 'out' && <button className="boss-sgbtn" onClick={() => cancelSortie(s.deck_no)} disabled={busy}>キャンセル（帰還）</button>}
              {phase === 'returning' && <button className="boss-sgbtn" disabled>帰還中…</button>}
              {(phase === 'arrived' || phase === 'return_done') && <div className="boss-sgnote">自動回収中…</div>}
            </div>
          );
        })}
      </div>

      {/* 右上：界選択（畳み式・界名のみ）＋本日の挑戦 */}
      <div className={'boss-worldsel' + (worldOpen ? ' open' : '')}>
        <div className="boss-wbtn" onClick={() => setWorldOpen(o => !o)}><span className="boss-wn">{WORLD_NAMES[stage]}</span><span className="boss-ar">▾</span></div>
        <div className="boss-wlist">
          {Array.from({ length: 8 }, (_, i) => i + 1).map(s => {
            const locked = s > cleared + 1;                            // 解放＝cleared_stage+1 まで（サーバ整合）
            return (
              <div key={s} className={'boss-witem' + (s === stage ? ' cur' : '') + (locked ? ' locked' : '')} onClick={() => { if (locked) return; setStage(s); setWorldOpen(false); setOpenNode(null); }}>
                <span>{WORLD_NAMES[s]}</span>
                {locked && <span>🔒</span>}
              </div>
            );
          })}
        </div>
        <div className="boss-tries">本日の挑戦 残り <b>{triesLeft}</b>/3</div>
      </div>
      {/* 界ドロップダウンの外側タップで閉じる */}
      {worldOpen && <div className="boss-wscrim" onClick={() => setWorldOpen(false)} />}

      <button className="boss-back" onClick={back}>‹ 戻る</button>

      <div className={'boss-scrim' + (openNode !== null ? ' show' : '')} onClick={closeSheet} />

      <div className={'boss-sheet' + (openNode !== null ? ' show' : '')}>
        {openNode !== null && (() => {
          const i = openNode; const sb = curStage.bosses[i]; const role = BOSS_ROLE_KEYS[i];
          const bm = (bosses || []).find(x => x.boss_key === 'boss_' + stage + '_' + role);   // 戦闘数値は boss_master
          const selLock = deckLock(deckNo); const selUsable = deckUsable(deckNo);   // 選択中デッキの占有種別・出せる枚数
          return (
            <>
              <span className="boss-close" onClick={closeSheet}>×</span>
              <h3>{sb.name}</h3>
              <div className="boss-subt">{i < 2 ? '中ボス' : '面ボス'} ・ {curStage.world}</div>
              {bm
                ? <>
                    <div className="boss-stat"><span className="k">敵の戦力</span><span className="v">{Number(bm.base_power).toLocaleString()}（1周目・balance §6-1）</span></div>
                    <div className="boss-stat"><span className="k">属性</span><span className="v">{arrJA(bm.attrs, ATTR_JA)}</span></div>
                    <div className="boss-stat"><span className="k">武器</span><span className="v">{arrJA(bm.weapons, WEAP_JA)}</span></div>
                  </>
                : <div className="boss-stat"><span className="k">敵情報</span><span className="v" style={{ color: '#ff6a7a' }}>boss_master にデータがありません</span></div>}
              <div className="boss-note">出撃すると約30分（テスト中30秒）デッキが出払う。帰還で自動解放＝結果は戦闘報告書へ。三すくみ 有利×1.2／不利×0.8。勝敗・損失・報酬はサーバ判定。</div>

              <div className="boss-secTitle">出撃するデッキ</div>

                  const lock = deckLock(n); const blocked = lock !== null; const members = deckMembers(n);

                                </div>; })()}
                            </div>
                          : <div key={si} className="boss-deck2Empty">空き</div>)}
                      </div>
                    </div>
                  );
                })}
              </div>

              <button className="boss-go" onClick={() => startSortie(role)} disabled={busy || effTriesLeft <= 0 || selLock !== null || selUsable === 0}>{busy ? '処理中…' : (selLock === 'boss' ? `デッキ${deckNo}は出撃中` : (selLock === 'tansaku' ? '探索中のデッキです' : (selUsable === 0 ? '出撃できるカードがありません' : (effTriesLeft <= 0 ? '本日の挑戦は終了' : `デッキ${deckNo}で出撃`))))}</button>
              {effTriesLeft <= 0 && selLock === null && selUsable > 0 && <div className="boss-warn">本日の挑戦回数を使い切りました（0時に回復）</div>}
            </>
          );
        })()}
      </div>

      {/* カードタップ→詳細（スキル＋武気充填）。戻るで出撃シートに復帰 */}
      {detailCard && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 200, overflowY: 'auto', background: '#0a0608' }}>
          <CardDetail card={detailCard} cards={cards} profile={profile} skillMap={skillMap} refreshAll={onRefresh} onSelect={setDetailCard} flash={flash}
            back={async () => { setDetailCard(null); try { await onRefresh(); } catch (e) {} }} />
        </div>
      )}

      {/* 編成ボタン→DeckScreen。戻るでデッキ内容を反映して出撃シートに復帰 */}
      {editDeckNo !== null && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 200, overflowY: 'auto', background: '#0a0608' }}>
          <DeckScreen profile={profile} cards={cards} refreshAll={onRefresh} flash={flash} initialDeckNo={editDeckNo}
            back={async () => { setEditDeckNo(null); try { setDecks(await ChikarianAPI.getDecks() || []); } catch (e) {} await refetchSorties(); try { await onRefresh(); } catch (e) {} }} />
        </div>
      )}
    </div>
  );
}

function KyokaView({ base, cards, profile, refreshAll, onBack, flash }) {
  const isSp = base.card_key.endsWith('_sp');
  const baseInfo = parseCardKey(base.card_key);
  const star = base.star || 0;
  const cost = 500 * (star + 1);                                  // balance §5
  const hoshouHave = profile ? (profile.hoshou_stone || 0) : 0;
  const medalHave = profile ? (profile.medal || 0) : 0;
  const [matId, setMatId] = useState(null);
  const [hoshou, setHoshou] = useState(0);
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  const rate = Math.min(100, Math.max(30, 90 - 5 * star) + 10 * hoshou);   // balance §5
  // 候補: 同レア同★（SPは同名同★）／ロック除外／本体自身除外（クライアント目安・最終判定はサーバ）
  const candidates = (cards || []).filter(c => {
    if (c.id === base.id || c.locked) return false;
    if ((c.star || 0) !== star) return false;
    if (isSp) return c.card_key === base.card_key;
    const r = parseCardKey(c.card_key).rarity;
    return r !== 'sp' && r === baseInfo.rarity;
  });

  async function enhance() {
    if (busy) return;
    if (!matId) { flash('素材カードを選んでください'); return; }
    setBusy(true);
    try {
      const res = await ChikarianAPI.doKyoka(base.id, matId, hoshou);  // ★成否・消費はサーバ
      if (window.CKSound) CKSound.play(res && res.success ? 'se_enhance_success' : 'se_enhance_fail');  // 成功/失敗SE（既存音源）
      setResult(res);

// 練成量・解放・時刻判定は全てサーバ(renkiden系/kajiya系RPC)。クライアントは表示と入力のみ。
// ※ renkiden/kajiya のRPC定義は repo 未配置（0012-0019外）。返り値/コードはタスク記載に従い防御的に扱う。
const Q_COST = { crude: 1, refined: 2, enchanted: 4, holy: 8 };   // 枠コスト（balance §2-1）
const Q_LV = { crude: 1, refined: 2, enchanted: 3, holy: 4 };
const KAJIYA_HOURS = { refined: 24, enchanted: 36, holy: 48 };    // 作業時間（balance §11）
const Q_ORDER = ['crude', 'refined', 'enchanted', 'holy'];

function normalizeRk(r) {
  if (!r) return null;
  const g = (a, b) => (r[a] != null ? r[a] : (r[b] != null ? r[b] : null));
  const lv = g('lv') != null ? g('lv') : 1;
  const buki = g('buki_stored', 'buki') != null ? g('buki_stored', 'buki') : 0;
  const fuel = g('fuel_medal', 'fuel') != null ? g('fuel_medal', 'fuel') : 0;
  const cap = r.cap != null ? r.cap : (1000 + 1500 * (lv - 1));     // 確定式（balance §11）
  const rate = r.rate_per_sec != null ? r.rate_per_sec : (0.1 * lv); // 確定式
  return { lv, buki, fuel, cap, rate };
}
function fmtRemain(ms) {
  if (ms <= 0) return '完成';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return (h > 0 ? h + '時間' : '') + m + '分';
}

        <div className="tat-qrow">

/* =================================================================== 探索/放置 */
// メダル/EXP増・時刻計算・Lv反映は全てサーバ(start/collect_tansaku)。クライアントは目安表示と入力のみ。
// ※ tansaku系RPCは repo 未配置（0012-0019外）。返り値/コードはタスク記載に従い防御的に扱う。
const DEPTHS = [   // balance §7（確定・毎分）
  { key: 'shallow', n: 1, label: '浅域', medal: 2, exp: 0.5 },
  { key: 'mid', n: 2, label: '中域', medal: 5, exp: 1.2 },
  { key: 'deep', n: 3, label: '深域', medal: 10, exp: 2.5 },
];
function depthInfo(d) { return DEPTHS.find(x => x.key === d || x.n === d) || null; }   // 文字列/整数どちらでも解決
function tansakuEstimate(row, now) {
  if (!row) return null;
  const di = depthInfo(row.depth); if (!di || !row.last_collect_at) return null;
  const min = Math.max(0, (now - new Date(row.last_collect_at).getTime()) / 60000);
  return { di, min, medal: Math.floor(min * di.medal), exp: +(min * di.exp).toFixed(1) };
}

// ノード座標＝mockup の検出座標。depth キー（shallow/mid/deep）に対応（本番の深さ3種＝3ノード）。
const TAN_NODES = {
  shallow: { left: '35.7%', top: '22.2%', name: '浅域 ・ 樹冠の広場' },
  mid: { left: '49.9%', top: '51.3%', name: '中域 ・ 苔生す祭壇' },
  deep: { left: '52.6%', top: '79.3%', name: '深域 ・ 霧底の遺構' },
};
function TansakuScreen({ profile, refreshAll, back, flash }) {
  const maxDecks = Math.min(2 + Math.floor(((profile && profile.cleared_stage) || 0) / 2), 6);
  const [states, setStates] = useState(null);
  const [deckNo, setDeckNo] = useState(1);
  const [openNode, setOpenNode] = useState(null);   // 開いているノード(depthキー) or null
  const [busy, setBusy] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [toast, setToast] = useState(null);         // 回収結果トースト {medal, exp}

  async function load() { try { setStates(await ChikarianAPI.getTansaku() || []); } catch (e) { flash(errMsg(e)); setStates([]); } }
  useEffect(() => { load(); const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);

  async function run(fn, okMsg) {
    if (busy) return; setBusy(true);
    try { const r = await fn(); if (okMsg) flash(okMsg); await load(); await refreshAll(); return r; }
    catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }
  // 出発：選択中デッキ＋このノードの深さで開始（深さ変更時の「既存分は自動回収」は startTansaku 仕様のまま）。area=1固定。
  const doStart = () => { const depth = openNode; setOpenNode(null); run(() => ChikarianAPI.startTansaku(deckNo, 1, depth), '探索を開始しました'); };
  // 回収：選択中デッキの探索を回収。返り値の実数のみトースト表示（捏造しない）。
  const doCollect = async () => {
    const r = await run(() => ChikarianAPI.collectTansaku(deckNo));
    setOpenNode(null);
    if (r) { setToast({ medal: Number(r.medal_gain || 0), exp: r.exp_gain_per_card }); setTimeout(() => setToast(null), 1800); }
  };

  if (!states) return <Booting />;
  const cur = states.find(s => s.deck_no === deckNo) || null;            // 選択中デッキの探索状態（1デッキ＝1探索）
  const curDi = cur ? depthInfo(cur.depth) : null;
  const curKey = curDi ? curDi.key : null;                              // 選択中デッキが探索中の深さ＝busyノード
  const est = tansakuEstimate(cur, now);
  const byDeck = {}; states.forEach(s => { byDeck[s.deck_no] = s; });
  const isBusyNode = openNode && curKey === openNode;                    // 開いたノードが選択中デッキの探索先か
  const od = openNode ? depthInfo(openNode) : null;

  return (
    <div style={tanRoot}>
      <style>{TAN_CSS}</style>
      <div className="tan-mapWrap">
        <div className="tan-mapDim" />
        {DEPTHS.map(d => {
          const pos = TAN_NODES[d.key]; if (!pos) return null;
          const nodeBusy = curKey === d.key;
          return (
            <div key={d.key} className={'tan-node' + (nodeBusy ? ' busy' : '')} style={{ left: pos.left, top: pos.top }} onClick={() => setOpenNode(d.key)}>
              <div className="tan-dot" /><div className="tan-lbl">{pos.name}</div>
            </div>
          );
        })}
      </div>

      <div className="tan-topbar">
        <div className="tan-area">{WORLD_NAMES[1]}</div>
        <div className="tan-res">メダル <b>{((profile && profile.medal) || 0).toLocaleString()}</b></div>
      </div>

      <div className={'tan-scrim' + (openNode ? ' show' : '')} onClick={() => setOpenNode(null)} />

      <div className={'tan-sheet' + (openNode ? ' show' : '')}>
        {openNode && isBusyNode && (
          /* 探索中ノード：経過/見込み＋回収 */
          <>
            <span className="tan-close" onClick={() => setOpenNode(null)}>×</span>
            <h3>{TAN_NODES[openNode].name}（探索中）</h3>
            <div className="tan-reward">
              <div className="tan-col"><div className="tan-amt">{est ? est.medal.toLocaleString() : '0'}</div><div className="tan-cap">メダル（目安）</div></div>
              <div className="tan-col"><div className="tan-amt">{est ? est.exp : '0'}</div><div className="tan-cap">各カードEXP（目安）</div></div>
            </div>
            <div className="tan-note">経過 約{est ? Math.floor(est.min) : 0}分 ／ デッキ{deckNo}。増減・時刻計算・Lv反映はサーバ判定（balance §7）。</div>
            <button className="tan-recall" onClick={doCollect} disabled={busy}>引っ込めて回収する</button>
          </>
        )}
        {openNode && !isBusyNode && od && (
          /* 未探索ノード：レート＋デッキ選択＋出発 */
          <>
            <span className="tan-close" onClick={() => setOpenNode(null)}>×</span>
            <h3>{TAN_NODES[openNode].name}</h3>
            {/* 要求戦力・ドロップchip は本番にデータが無いため省略（捏造しない） // TODO 深さ別の戦力ゲート/ドロップが確定したら追加 */}
            <div className="tan-stat"><span className="k">属性要求</span><span className="v attr-none">なし</span></div>
            <div className="tan-secTitle">時間で蓄積（balance §7・上限なし・張り付き不要）</div>
            <div className="tan-stat"><span className="k">メダル</span><span className="v">{od.medal} /分</span></div>
            <div className="tan-stat"><span className="k">各カードEXP</span><span className="v">{od.exp} /分</span></div>
            <div className="tan-deckTitle">派遣するデッキ</div>
            <div className="tan-decks">
              {Array.from({ length: maxDecks }, (_, i) => i + 1).map(n => {
                const st = byDeck[n]; const di = st && depthInfo(st.depth);
                return (
                  <div key={n} className={'tan-deck' + (n === deckNo ? ' sel' : '')} onClick={() => setDeckNo(n)}>
                    <div className="tan-dn">デッキ{n}</div>
                    <div className="tan-dp">{di ? di.label + '探索中' : '待機'}</div>
                  </div>
                );
              })}
            </div>
            <button className="tan-go" onClick={doStart} disabled={busy}>{cur ? '出発（既存分は自動回収）' : '出発'}</button>
            <div className="tan-note">レートは balance §7 の確定値。増減・時刻計算・Lv反映はサーバ。area は当面1固定（面別解放は未確定）。</div>
          </>
        )}
      </div>

      {toast && (
        <div className="tan-toast">
          <div className="tt">回収しました</div>
          <div className="ti">メダル <b>+{toast.medal.toLocaleString()}</b></div>
          {toast.exp != null && <div className="ti">各カードEXP <b>+{toast.exp}</b></div>}
        </div>
      )}

      <button className="tan-back" onClick={back}>‹ 戻る</button>
    </div>
  );
}

  pill: { fontSize: 10, fontWeight: 700, padding: '3px 10px', borderRadius: 12, letterSpacing: .5 },
  pillOn: { color: '#aee3dd', background: 'rgba(111,184,176,.18)', border: '1px solid rgba(58,122,115,.8)' },
  pillOff: { color: '#9a8c70', background: 'rgba(255,255,255,.04)', border: '1px solid rgba(150,140,110,.35)' },
  est: { fontSize: 11, color: '#e7d3a6', marginTop: 6 },
  btns: { display: 'flex', gap: 8, marginTop: 10 },
  collect: { flex: 1, fontFamily: 'inherit', fontWeight: 800, fontSize: 13, color: '#2a160a', border: 'none', padding: '10px 6px', borderRadius: 12, cursor: 'pointer', background: 'linear-gradient(180deg,#ffe49a,#e8b54d 60%,#b9842f)' },
  collectOff: { filter: 'grayscale(.6) brightness(.8)', cursor: 'not-allowed' },
};
function HouchiScreen({ profile, refreshAll, back, flash }) {
  const maxDecks = Math.min(2 + Math.floor(((profile && profile.cleared_stage) || 0) / 2), 6);
  const [states, setStates] = useState(null);
  const [busy, setBusy] = useState(false);
  const [now, setNow] = useState(Date.now());

  async function load() { try { setStates(await ChikarianAPI.getTansaku() || []); } catch (e) { flash(errMsg(e)); setStates([]); } }
  useEffect(() => { load(); const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  async function run(fn, okMsg) {
    if (busy) return; setBusy(true);
    try { await fn(); if (okMsg) flash(okMsg); await load(); await refreshAll(); }
    catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }

  if (!states) return <Booting />;
  const byDeck = {}; states.forEach(s => { byDeck[s.deck_no] = s; });

  return (
    <div style={S.root}>
      <div style={S.bg} /><div style={S.vignette} />
      <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', padding: '14px 12px 18px', overflowY: 'auto' }}>
        <div style={houS.title}>放置報酬</div>
        <div style={houS.sub}>放置＝浅域での探索（貯まった分を回収）</div>

        <div style={{ marginTop: 14, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {Array.from({ length: maxDecks }, (_, i) => i + 1).map(n => {
            const row = byDeck[n]; const est = tansakuEstimate(row, now); const di = row && depthInfo(row.depth);
            return (
              <div key={n} style={houS.card}>
                <div style={houS.top}>
                  <span style={houS.deck}>デッキ{n}</span>
                  <span style={{ ...houS.pill, ...(di ? houS.pillOn : houS.pillOff) }}>{di ? di.label + '探索中' : '未探索'}</span>
                </div>
                {est && <div style={houS.est}>見込み メダル+{est.medal.toLocaleString()}・各カードEXP+{est.exp}（{Math.floor(est.min)}分・目安）</div>}
                <div style={houS.btns}>
                  <button onClick={() => run(() => ChikarianAPI.collectTansaku(n), '回収しました')} disabled={busy || !row} style={{ ...houS.collect, ...((busy || !row) ? houS.collectOff : {}) }}>回収</button>
                  <button onClick={() => run(() => ChikarianAPI.startTansaku(n, 1, 'shallow'), '浅域で放置開始')} disabled={busy} style={{ ...S.lineBtn, flex: 1, padding: '10px 6px', ...(busy ? { opacity: .45 } : {}) }}>浅域で放置開始</button>
                </div>
              </div>
            );
          })}
        </div>
        <button onClick={back} style={{ ...S.lineBtn, marginTop: 16, alignSelf: 'center' }}>ホームに戻る</button>
      </div>
    </div>
  );
}

const SOUBI_QCLASS = { crude: 'gin', refined: 'ao', enchanted: 'mura', holy: 'kin' };
const SOUBI_QFILL = { crude: 'linear-gradient(90deg,#8b9099,#c9ccd3)', refined: 'linear-gradient(90deg,#2f5e95,#5a93d6)', enchanted: 'linear-gradient(90deg,#6f4aa3,#a274d6)', holy: 'linear-gradient(90deg,#a07e2a,#e6c060)' };
function EquipView({ base, refreshAll, onBack, flash }) {
  const [artErr, setArtErr] = useState(false);
  const info = parseCardKey(base.card_key);
  const f = FILL[info.rarity];
  const capacity = f ? Math.round(f.b + (f.m - f.b) * (((base.lv || 1) - 1) / (f.cap - 1))) : 0;  // 充填量(枠)目安
  const unlockedMax = base.card_key.endsWith('_sp') ? 0 : 999;  // SPはここに来ない想定

  const [pool, setPool] = useState(null);
  const [kajiyaLv, setKajiyaLv] = useState(1);
  const [quality, setQuality] = useState(base.quality || 'crude');
  const [amount, setAmount] = useState(Math.min(base.loaded_buki || 0, capacity));
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  async function loadPool() { try { const r = normalizeRk(await ChikarianAPI.getRenkiden()); setPool(r ? r.buki : 0); } catch (e) { setPool(0); } }
  useEffect(() => {
    loadPool();
    (async () => {
      try { const os = await ChikarianAPI.getKajiyaOrders() || []; setKajiyaLv(os.filter(o => o.claimed).reduce((mx, o) => Math.max(mx, Q_LV[o.quality] || 0), 1)); }
      catch (e) {}
    })();
  }, []);

  const qCost = Q_COST[quality] || 1;
  const poolMax = pool != null ? Math.floor(pool / qCost) : 0;
  const estMax = Math.min(capacity, poolMax);   // 上限目安（refundは含めない簡易目安・最終はサーバ）

  async function equip() {
    if (busy) return; setBusy(true);
    try {
      const res = await ChikarianAPI.equipBuki(base.id, quality, amount);  // ★込め確定はサーバ
      setResult(res);
      await loadPool();      // プール残（renkiden）
      await refreshAll();    // cards（quality/loaded_buki）→ 親で選択中カードも最新化
    } catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }

  if (pool === null) return <Booting />;

  // 数値は本番 computeStats 準拠（★0.10・枠攻撃力 QATK 10/15/22/34）。mockup の旧値は使わない。
  const star = base.star || 0; const starMul = 1 + 0.10 * star;
  const qatk = QATK[quality] || 0;
  const baseBody = computeStats(base).body;                          // 本体（★適用済・装備非依存）
  const amt = Math.min(amount, capacity);
  const previewEquip = Math.round(amt * qatk * starMul);             // 装備項（プレビュー）
  const previewTotal = baseBody + previewEquip;
  const pct = capacity > 0 ? Math.round(amt / capacity * 100) : 0;

  if (result) {
    const soubi = result.soubi_kou != null ? result.soubi_kou : ((result.loaded_buki || 0) * (QATK[result.quality] || 0));
    return (
      <div className="sb-root"><style>{SOUBI_CSS}</style>
        <div className="sb-wrap" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '100dvh', textAlign: 'center' }}>

          <div style={{ fontSize: 13, color: '#b6a890', marginTop: 14, lineHeight: 2 }}>
            質 {QUALITY_JA[result.quality] || result.quality}／込めた武気 {Number(result.loaded_buki || 0).toLocaleString()} 枠{result.capacity != null ? ` / 充填量 ${result.capacity}` : ''}<br />
            装備項 {Number(soubi).toLocaleString()}<br />
            {result.buki_drawn != null && <>引いた武気 {Number(result.buki_drawn).toLocaleString()}　</>}
            {result.buki_refunded != null && <>返却 {Number(result.buki_refunded).toLocaleString()}<br /></>}
            {result.pool_remaining != null && <>武気プール残 {Number(result.pool_remaining).toLocaleString()}</>}

          <button onClick={() => { setResult(null); }} className="sb-cta" style={{ maxWidth: 280 }}>つづけて調整</button>
          <button onClick={onBack} className="sb-back">‹ カードに戻る</button>
        </div>
      </div>
    );
  }

  return (
    <div className="sb-root"><style>{SOUBI_CSS}</style>
      <div className="sb-wrap">
        <div className="sb-hdr"><span className="sb-deco">CHIKARIAN</span><h1>装備（充填）</h1><div className="sb-divider" />
          <div className="sb-note">充填枠に武気を込める。装備の質で「枠コスト」と「枠攻撃力」が変わる。</div>

          <div className="sb-cmeta">

            <div className="sb-ctag">{info.attr}・{info.weap}　Lv {base.lv}／★{star}</div>
            <div className="sb-cstat">
              <div className="it">本体戦闘力<b>{baseBody.toLocaleString()}</b></div>
              <div className="it">充填量（枠）<b>{capacity.toLocaleString()}</b></div>
            </div>
          </div>
        </div>

        {/* 武気プール */}
        <div className="sb-pool">
          <div className="lab">手持ち 武気<span className="src">練気殿で練成（メダル）</span></div>
          <div className="amt"><b>{pool.toLocaleString()}</b><span className="max">プールから引ける目安 ≤ {estMax}</span></div>
        </div>

        {/* 装備の質（鍛冶屋で解放） */}
        <div className="sb-seclabel">装備の質（鍛冶屋Lv{kajiyaLv}まで解放）</div>
        <div className="sb-ranks">
          {Q_ORDER.map(q => {
            const locked = Q_LV[q] > kajiyaLv;
            return (
              <div key={q} className={'sb-rk ' + SOUBI_QCLASS[q] + (q === quality ? ' on' : '') + (locked ? ' lock' : '')} onClick={() => !locked && setQuality(q)}>
                <div className="dot" />
                <div className="nm">{QUALITY_JA[q]}</div>
                {locked ? <div className="lk">未解放<br />鍛冶屋Lv{Q_LV[q]}</div> : <div className="sub">攻 {QATK[q]}<br />コスト {Q_COST[q]}</div>}
              </div>
            );
          })}
        </div>

        {/* 充填パネル */}
        <div className="sb-panel">
          <div className="sb-ph">
            <span className="rkname">{QUALITY_JA[quality]}</span>
            <span className="spec">枠攻撃力 <b>{qatk}</b>　／　枠コスト <b>{qCost}</b>（武気/枠）</span>
          </div>
          <div className="sb-barwrap">
            <div className="sb-barlab"><span>込める枠数</span><span><b>{amt.toLocaleString()}</b> / {capacity.toLocaleString()} 枠（{pct}%）</span></div>
            <div className="sb-bar"><i style={{ width: pct + '%', background: SOUBI_QFILL[quality] }} /></div>
            <input className="sb-slider" type="range" min="0" max={capacity} value={amt} onChange={e => setAmount(parseInt(e.target.value, 10))} />
          </div>
          <div className="sb-calc">
            <div className="row"><span className="k">込めた武気</span><span className="v">{amt.toLocaleString()}</span></div>
            <div className="row"><span className="k">消費 武気</span><span className="v">{(amt * qCost).toLocaleString()}　<span className="mul">＝ {amt} × コスト{qCost}</span></span></div>
            <div className="row"><span className="k">装備項</span><span className="v">{previewEquip.toLocaleString()}　<span className="mul">＝ {amt} × 攻{qatk}{star > 0 ? ` ×★${star}` : ''}</span></span></div>
            <div className="row"><span className="k">本体戦闘力</span><span className="v">{baseBody.toLocaleString()}</span></div>
          </div>
          <div className="sb-total"><span className="k">カード総合戦力（目安）</span><span className="v">{previewTotal.toLocaleString()}</span></div>
          {amt < capacity && <div className="sb-warn">充填枠が埋まっていません（{amt}/{capacity}）。プールから引ける目安 ≤ {estMax}（floor(プール{pool.toLocaleString()} ÷ コスト{qCost})）。非破壊：現在の込めは一度プールへ返却され引き直し。最終確定はサーバ。</div>}
        </div>

        <button onClick={equip} disabled={busy} className="sb-cta">{busy ? '装備中…' : (amt === 0 ? 'アンロード（全返却）' : '装備する')}</button>
        <button onClick={onBack} className="sb-back">‹ カードに戻る</button>
        <div className="sb-foot">数値は本番 computeStats 準拠（本体×0.80・★0.10・枠攻撃力10/15/22/34）。武気は練気殿で練成・保管。質は鍛冶屋で解放。</div>
      </div>
    </div>
  );
}

.sk-mode.on{color:#0c0a09; border-color:#c7a14e; background:linear-gradient(180deg,#ecd28a,#c7a14e); box-shadow:0 0 14px rgba(199,161,78,.35);}
.sk-card{display:flex; gap:12px; padding:13px; margin-top:12px; border-radius:4px; border:1px solid #3a2c22; background:linear-gradient(180deg,#241a17,#1c1513);}
.sk-art{width:64px; height:90px; flex:none; border-radius:3px; position:relative; border:1px solid #8c7038; overflow:hidden; background:#241a16;}
.sk-art img{width:100%; height:100%; object-fit:cover;} .sk-art .g{position:absolute; inset:0; display:grid; place-items:center; font-size:26px; color:#8c7038;}
.sk-art .rare{position:absolute; top:-1px; right:-1px; font-size:10px; font-weight:800; padding:2px 6px; color:#0c0a09; background:#c7a14e; border-radius:0 3px 0 6px; z-index:2;}
.sk-cmeta{flex:1; min-width:0;} .sk-cname{font-size:16px; font-weight:700; color:#efe6d5;} .sk-ctag{font-size:11px; color:#7d7160; margin-top:1px;} .sk-clv{font-size:11px; color:#c7a14e; margin-top:7px;}
.sk-seclabel{font-size:11px; letter-spacing:.3em; color:#c7a14e; margin:16px 0 8px; opacity:.85;}
.sk-slot{padding:11px 12px; border-radius:4px; margin-bottom:8px; cursor:pointer; border:1px solid #3a2c22; background:#150f0d; position:relative; width:100%; text-align:left; display:block; color:inherit; font-family:inherit;}
.sk-slot.sel{border-color:#c7a14e; background:#1a140d; box-shadow:0 0 0 1px #c7a14e inset;}
.sk-slot.empty{border-style:dashed; color:#7d7160; cursor:default; text-align:center; font-size:13px;}
.sk-slot.off{opacity:.5; cursor:default;}
.sk-slot .pin{position:absolute; top:9px; right:11px; font-size:9px; letter-spacing:.15em; color:#8c7038;}
.sk-sn{font-size:14px; font-weight:700; color:#efe6d5;} .sk-se{font-size:11px; color:#b6a890; margin-top:3px;} .sk-sm{font-size:10px; color:#7d7160; margin-top:4px;}
.sk-crys{display:flex; gap:8px; margin-top:12px;}
.sk-cry{flex:1; padding:10px 4px 9px; text-align:center; cursor:pointer; border-radius:4px; border:1px solid #3a2c22; background:#0f0c0b;}
.sk-cry .gem{width:26px; height:26px; margin:0 auto 5px; transform:rotate(45deg); border-radius:5px;}
.sk-cry.ao .gem{background:linear-gradient(135deg,#7fb6ec,#3a78b8); box-shadow:0 0 12px rgba(58,120,184,.5);}
.sk-cry.aka .gem{background:linear-gradient(135deg,#e87f8f,#b83b4d); box-shadow:0 0 12px rgba(184,59,77,.5);}
.sk-cry.niji .gem{background:conic-gradient(from 0deg,#e87f8f,#ecd28a,#7fb6ec,#a78fd6,#e87f8f); box-shadow:0 0 14px rgba(255,255,255,.45);}
.sk-cry .nm{font-size:11px; font-weight:600; color:#b6a890; letter-spacing:.2em;}
.sk-cry .rate{font-size:24px; font-weight:800; margin-top:5px;}
.sk-cry.ao .rate{color:#7fb6ec;} .sk-cry.aka .rate{color:#e87f8f;} .sk-cry.niji .rate{color:#ecd28a;}
.sk-cry .hold{font-size:11px; color:#b6a890; margin-top:7px; padding-top:6px; border-top:1px solid #3a2c22;}
.sk-cry.on{border-color:#c7a14e; background:#171210; box-shadow:0 0 12px rgba(199,161,78,.3);}
.sk-cta{display:block; width:100%; margin-top:16px; padding:14px 0; border:none; border-radius:4px; cursor:pointer; font-family:inherit; font-size:16px; font-weight:800; letter-spacing:.16em; color:#0c0a09; background:linear-gradient(180deg,#ecd28a,#c7a14e); box-shadow:0 0 16px rgba(199,161,78,.3);}
.sk-cta:disabled{filter:grayscale(.5) brightness(.8); cursor:not-allowed;}
.sk-back{display:block; text-align:center; margin-top:14px; font-size:12px; color:#b6a890; cursor:pointer; background:none; border:none; font-family:inherit; width:100%;}
.sk-hint{font-size:11px; color:#7d7160; margin:8px 0 2px; line-height:1.5;}
.sk-banner{padding:9px 12px; margin-top:10px; border-radius:4px; border:1px solid #3a2c22; font-size:12px;}
.sk-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-height:220px; overflow-y:auto;}
.sk-dst{display:flex; gap:8px;}
.sk-dstb{flex:1; padding:10px 0; text-align:center; cursor:pointer; border-radius:4px; border:1px solid #3a2c22; background:#150f0d; color:#b6a890; font-family:inherit; font-size:13px; font-weight:700;}
.sk-dstb.on{color:#0c0a09; border-color:#c7a14e; background:linear-gradient(180deg,#ecd28a,#c7a14e);}
`;
function SkillView({ base, cards, profile, skillMap, refreshAll, onBack, flash }) {
  const [tab, setTab] = useState('rensei');
  const [artErr, setArtErr] = useState(false);
  const [skills, setSkills] = useState(null);   // base のスキル
  const [busy, setBusy] = useState(false);
  // 錬成
  const [color, setColor] = useState('blue');
  const [selSlot, setSelSlot] = useState(null);
  const [rResult, setRResult] = useState(null);
  // 転移
  const [srcId, setSrcId] = useState(null);
  const [srcSkills, setSrcSkills] = useState(null);
  const [srcSlot, setSrcSlot] = useState(null);
  const [dstSlot, setDstSlot] = useState(null);
  const [confirm, setConfirm] = useState(false);
  const [tResult, setTResult] = useState(null);

  async function loadBase() { try { setSkills(await ChikarianAPI.getCardSkills(base.id) || []); } catch (e) { flash(errMsg(e)); setSkills([]); } }
  useEffect(() => { loadBase(); }, [base.id]);

  const skName = k => (skillMap[k] && skillMap[k].display_name) || k;
  const skUpg = k => skillMap[k] ? skillMap[k].lv_upgradable : true;

  async function rensei() {
    if (busy || selSlot == null) return; setBusy(true);
    try { const res = await ChikarianAPI.doSkillRensei(base.id, selSlot, color); setRResult(res); await loadBase(); await refreshAll(); }
    catch (e) { flash(errMsg(e)); } finally { setBusy(false); }
  }
  async function pickSrc(id) { setSrcId(id); setSrcSlot(null); setSrcSkills(null); try { setSrcSkills(await ChikarianAPI.getCardSkills(id) || []); } catch (e) { flash(errMsg(e)); setSrcSkills([]); } }
  async function teni() {
    if (busy || srcId == null || srcSlot == null || dstSlot == null) return; setBusy(true);
    try {
      const res = await ChikarianAPI.doSkillTeni(srcId, srcSlot, base.id, dstSlot);
      setTResult(res); setConfirm(false);
      setSrcId(null); setSrcSkills(null); setSrcSlot(null); setDstSlot(null);
      await loadBase(); await refreshAll();
    } catch (e) { flash(errMsg(e)); setConfirm(false); } finally { setBusy(false); }
  }

  if (!skills) return <Booting />;
  const bySlot = {}; skills.forEach(s => { bySlot[s.slot] = s; });
  const emptySlots = [1, 2].filter(s => !bySlot[s]);

  const bInfo = parseCardKey(base.card_key);
  return (
    <div className="sk-root"><style>{SKILL_CSS}</style>
      <div className="sk-wrap">
        <div className="sk-hdr"><span className="sk-deco">CHIKARIAN</span><h1>スキル錬成・転移</h1><div className="sk-divider" /></div>

        {/* モード切替（錬成/転移） */}
        <div className="sk-modes">
          <div className={'sk-mode' + (tab === 'rensei' ? ' on' : '')} onClick={() => setTab('rensei')}>錬成<span className="sub">強化</span></div>
          <div className={'sk-mode' + (tab === 'teni' ? ' on' : '')} onClick={() => setTab('teni')}>転移<span className="sub">移す</span></div>
        </div>

        {/* 受け側カード */}
        <div className="sk-card">
          <div className="sk-art">{artErr ? <span className="g">❖</span> : <img src={'./images/' + base.card_key + '.png'} alt="" onError={() => setArtErr(true)} />}<span className="rare">{RAR_LABEL[bInfo.rarity]}</span></div>
          <div className="sk-cmeta">
            <div className="sk-cname">{bInfo.name}</div>
            <div className="sk-ctag">{bInfo.isSp ? '無属性・装備なし' : `${bInfo.attr}・${bInfo.weap}`}　Lv {base.lv}／★{base.star || 0}</div>
            <div className="sk-clv">スキル {skills.length} / 3 枠</div>
          </div>
        </div>

        {/* ===== 錬成 ===== */}
        {tab === 'rensei' && <>
          {rResult && <div className="sk-banner" style={{ color: rResult.success ? '#ecd28a' : '#e87f8f', borderColor: rResult.success ? '#8c7038' : '#b83b4d' }}>
            {rResult.success ? '成功' : '失敗'}：{skName(rResult.skill_key)} Lv{rResult.old_lv}→{rResult.new_lv}（{COLOR_JA[rResult.color]} 消費{rResult.cost}・残{rResult.crystal_remaining}）
          </div>}
          <div className="sk-seclabel">強化するスキル枠（lv_upgradable=false は不可）</div>
          {[0, 1, 2].map(slot => {
            const row = bySlot[slot];
            const upg = row ? skUpg(row.skill_key) : false;
            const sel = selSlot === slot;
            const m = row ? skillMap[row.skill_key] : null;
            if (!row) return <div key={slot} className="sk-slot empty">{slot === 0 ? '固定スキル' : '空きスロット' + slot}（空き）</div>;
            return (
              <button key={slot} onClick={() => upg && setSelSlot(slot)} disabled={!upg} className={'sk-slot' + (sel ? ' sel' : '') + (!upg ? ' off' : '')}>
                <span className="pin">{slot === 0 ? '固定' : '空き' + slot}</span>
                <div className="sk-sn">{skName(row.skill_key)} <span style={{ fontSize: 11, color: '#c7a14e' }}>Lv{row.skill_lv}{!upg ? '・強化不可' : ''}</span></div>
                {m && m.notes && <div className="sk-sm">{m.notes}</div>}
              </button>
            );
          })}

          <div className="sk-seclabel">クリスタル色（成功率）</div>
          <div className="sk-crys">
            {[['blue', 'ao'], ['red', 'aka'], ['rainbow', 'niji']].map(([c, cls]) => {
              const have = profile ? (profile['crystal_' + c] || 0) : 0;
              return (
                <div key={c} className={'sk-cry ' + cls + (c === color ? ' on' : '')} onClick={() => setColor(c)}>
                  <div className="gem" /><div className="nm">{COLOR_JA[c]}</div>
                  <div className="rate">{RENSEI_RATE[c]}<span style={{ fontSize: 14 }}>%</span></div>
                  <div className="hold">所持 {have}</div>
                </div>
              );
            })}
          </div>
          <div className="sk-hint">消費クリスタル数はサーバ算出（カーブ×レア倍率）。成功＝Lv+1／失敗＝消費のみ・Lv据置。</div>
          <button onClick={rensei} disabled={busy || selSlot == null} className="sk-cta">{busy ? '錬成中…' : '錬成する'}</button>
        </>}

        {/* ===== 転移 ===== */}
        {tab === 'teni' && <>
          {tResult && <div className="sk-banner" style={{ color: '#9fe0a0', borderColor: '#3a7a40' }}>
            転移成功：{skName(tResult.moved_skill)} Lv{tResult.moved_lv} を 枠{tResult.dst_slot} へ（メダル −{Number(tResult.medal_spent || TENI_COST).toLocaleString()}／残 {Number(tResult.medal_remaining || 0).toLocaleString()}）
          </div>}
          <div className="sk-hint" style={{ color: '#b6a890' }}>受け側：{bInfo.name}（空き枠 {emptySlots.length ? emptySlots.join('・') : 'なし'}）</div>
          {emptySlots.length === 0
            ? <div className="sk-banner" style={{ color: '#e87f8f', borderColor: '#b83b4d' }}>空き枠がありません（転移先なし）</div>
            : <>
                <div className="sk-seclabel">素材カードを選ぶ（ロック/SPは不可・素材は消滅）</div>
                <div className="sk-grid">
                  {(cards || []).filter(c => c.id !== base.id && !c.locked && !c.card_key.endsWith('_sp')).map(c => (
                    <div key={c.id} style={{ outline: srcId === c.id ? '2px solid #c7a14e' : 'none', borderRadius: 10 }}>
                      <CardThumb card={c} small onClick={() => pickSrc(c.id)} />
                      <div style={{ fontSize: 8, lineHeight: 1.2, textAlign: 'center', color: '#cdb488', marginTop: 1 }}>{cardFullName(c)}</div>
                    </div>
                  ))}
                </div>

                {srcId && (srcSkills === null ? <div style={{ marginTop: 10 }}><div className="spin" /></div>
                  : <>
                      <div className="sk-seclabel">移すスキルを1つ選ぶ</div>
                      {srcSkills.length === 0 ? <div className="sk-hint">スキルがありません</div>
                        : srcSkills.map(s => (
                          <button key={s.slot} onClick={() => setSrcSlot(s.slot)} className={'sk-slot' + (srcSlot === s.slot ? ' sel' : '')}>
                            <span className="pin">{s.slot === 0 ? '固定' : '空き' + s.slot}</span>
                            <div className="sk-sn">{skName(s.skill_key)} <span style={{ fontSize: 11, color: '#c7a14e' }}>Lv{s.skill_lv}</span></div>
                          </button>
                        ))}
                    </>)}

                {srcId && srcSlot != null && <>
                  <div className="sk-seclabel">受け側の空き枠</div>
                  <div className="sk-dst">
                    {emptySlots.map(s => <div key={s} className={'sk-dstb' + (dstSlot === s ? ' on' : '')} onClick={() => setDstSlot(s)}>枠{s}</div>)}
                  </div>
                </>}

                <button onClick={() => setConfirm(true)} disabled={busy || srcId == null || srcSlot == null || dstSlot == null} className="sk-cta">転移する（メダル{TENI_COST.toLocaleString()}）</button>
              </>}
        </>}

        <button onClick={onBack} className="sk-back">‹ カードに戻る</button>
      </div>

      {/* 転移 確認ポップアップ */}
      {confirm && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.7)', display: 'grid', placeItems: 'center', zIndex: 60, padding: 24 }}>
          <div style={{ maxWidth: 360, background: '#1c1513', border: '1px solid #8c7038', borderRadius: 12, padding: 18, textAlign: 'center' }}>
            <div style={{ fontSize: 14, color: '#ecd28a', fontWeight: 700, marginBottom: 8 }}>転移の確認</div>
            <div style={{ fontSize: 12, color: '#b6a890', lineHeight: 1.8 }}>素材カードと、<b style={{ color: '#e87f8f' }}>選ばなかったスキルも失われます</b>。<br />メダル {TENI_COST.toLocaleString()} を消費します。よろしいですか？</div>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 16 }}>
              <button onClick={teni} disabled={busy} className="sk-cta" style={{ marginTop: 0, flex: 1 }}>{busy ? '転移中…' : '実行する'}</button>
              <button onClick={() => setConfirm(false)} disabled={busy} className="sk-back" style={{ marginTop: 0, flex: 1, border: '1px solid #8c7038', borderRadius: 4, padding: '14px 0' }}>やめる</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* =================================================================== 交換所 */
// 交換個数・種類・カード消滅・クリスタル付与は全てサーバ(do_card_exchange)。クライアントは見込みと結果表示のみ。
// 見込み = round(base_value_blue × (1 + star_coeff×★) ÷ divisor)（crystal_exchange_master・確定はサーバ）。
function ExchangeView({ base, refreshAll, onBack, flash }) {
  const info = parseCardKey(base.card_key);
  const [rates, setRates] = useState(null);
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);

  useEffect(() => { (async () => { try { setRates(await ChikarianAPI.getExchangeRates() || []); } catch (e) { setRates([]); } })(); }, []);

  const rate = (rates || []).find(r => r.rarity === info.rarity) || null;
  const est = rate ? { color: rate.crystal_color, count: Math.round(rate.base_value_blue * (1 + (rate.star_coeff || 0) * (base.star || 0)) / (rate.divisor || 1)) } : null;

  async function exchange() {
    if (busy) return; setBusy(true);
    try { const res = await ChikarianAPI.doCardExchange(base.id); setResult(res); }  // 成功時はここでは再取得しない（結果表示を残す）
    catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }
  async function done() { await refreshAll(); }  // カード消滅を親が検知→詳細を閉じて一覧へ（sel同期）

  if (rates === null) return <Booting />;

  if (result) {
    return (
      <div style={S.root}><div style={S.bg} /><div style={S.vignette} />
        <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: GOLD_HI }}>交換しました</div>
          <div style={{ fontSize: 14, color: '#e7d3a6', marginTop: 14, lineHeight: 2, textAlign: 'center' }}>
            {COLOR_JA[result.crystal_color] || result.crystal_color}クリスタル ×{Number(result.crystal_count || 0).toLocaleString()} 獲得<br />
            <span style={{ fontSize: 12, color: '#cdb488' }}>
              所持 青{Number(result.crystal_blue || 0).toLocaleString()}／赤{Number(result.crystal_red || 0).toLocaleString()}／虹{Number(result.crystal_rainbow || 0).toLocaleString()}
            </span>
          </div>
          <button onClick={done} style={{ ...S.bigBtn, marginTop: 22 }}>完了</button>
        </div>
      </div>
    );
  }

  return (
    <div style={S.root}><div style={S.bg} /><div style={S.vignette} />
      <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', padding: '14px 14px 18px' }}>
        <button onClick={onBack} style={{ ...S.lineBtn, alignSelf: 'flex-start', padding: '6px 16px' }}>‹ 戻る</button>
        <div style={{ textAlign: 'center', fontSize: 18, fontWeight: 800, letterSpacing: 2, color: GOLD_HI, marginTop: 6 }}>交換所</div>

        <div style={{ display: 'flex', gap: 12, marginTop: 14, alignItems: 'center' }}>
          <div style={{ width: 80 }}><CardThumb card={base} small /></div>
          <div style={{ fontSize: 13, color: '#e7d3a6', lineHeight: 1.8 }}>
            {info.name}<br />レア {RAR_LABEL[info.rarity]}　★{base.star || 0}
          </div>
        </div>

        <div style={{ marginTop: 16, padding: '12px 14px', background: PANEL, border: BORDER, borderRadius: 8, textAlign: 'center' }}>
          {est
            ? <div style={{ fontSize: 14, color: GOLD_HI }}>見込み：{COLOR_JA[est.color] || est.color}クリスタル ×{est.count}</div>
            : <div style={{ fontSize: 12, color: '#ff9aa8' }}>このレアの交換レートが見つかりません（最終判定はサーバ）</div>}
          <div style={{ fontSize: 11, color: '#ff9aa8', marginTop: 8, fontWeight: 700 }}>このカードは消滅します。元に戻せません。</div>
          <div style={{ fontSize: 10, color: '#a98f66', marginTop: 4 }}>個数・種類はサーバ確定（マスタ計算）。手計算との丸め差±1は仕様内。図鑑の収集記録は消えません。</div>
        </div>

        <button onClick={exchange} disabled={busy} style={{ ...S.bigBtn, marginTop: 18, ...(busy ? { opacity: .45 } : {}) }}>{busy ? '交換中…' : '交換する（不可逆）'}</button>
      </div>
    </div>
  );
}

/* =================================================================== ミッション */
// 達成判定・報酬付与は全てサーバ(claim_mission)。クライアントは表示と受取ボタンのみ。
// 進捗はクライアント目安（導出可能なもののみ）。最終判定はサーバ。報酬は mission_master.reward / 返り値のみ。
const REWARD_LABEL = { medal: 'メダル', chikarium: 'チカリウム', buki: '武気', c_blue: '青', c_red: '赤', c_rainbow: '虹', hoshou: '保証石' };
const CAT_JA = { daily: 'デイリー', weekly: 'ウィークリー', achievement: '達成' };
const CAT_RESET = { daily: '毎日0時(JST)にリセット', weekly: '毎週月曜0時(JST)にリセット', achievement: '恒常（1回限り）' };
function jstWeekStart() {
  const d = new Date(jstToday() + 'T00:00:00Z');
  const wd = d.getUTCDay();            // 0=日..6=土
  d.setUTCDate(d.getUTCDate() - (wd === 0 ? 6 : wd - 1));  // 月曜起点（PG date_trunc('week')と一致）
  return d.toISOString().slice(0, 10);
}
function rewardChips(reward) {
  if (!reward) return null;
  return Object.keys(reward).map(k => REWARD_LABEL[k] ? <span key={k} style={{ fontSize: 11, color: '#fff3c8', background: 'rgba(232,194,90,.15)', border: '1px solid rgba(232,194,90,.4)', borderRadius: 10, padding: '2px 8px', marginRight: 4 }}>{REWARD_LABEL[k]}×{reward[k]}</span> : null);
}

/* ミッション画面 専用スタイル（mission-mockup 移植・共有 S は上書きしない） */
const misS = {
  bg: { position: 'absolute', inset: 0, background: '#0a0509 radial-gradient(80% 45% at 50% 0%, rgba(90,80,40,.2), transparent 60%)' },
  body: { position: 'relative', zIndex: 2, height: '100dvh', display: 'flex', flexDirection: 'column' },
  head: { flex: 'none', textAlign: 'center', padding: '16px 16px 4px' },
  title: { fontSize: 19, fontWeight: 800, letterSpacing: 4, color: GOLD_HI, textShadow: '0 2px 6px #2a2000,0 0 16px rgba(255,180,70,.3)' },
  sub: { fontSize: 11, color: '#cdb488', letterSpacing: 1, marginTop: 5 },
  tabs: { flex: 'none', display: 'flex', gap: 6, padding: '8px 14px 4px' },

function MissionScreen({ profile, cards, refreshAll, back, flash }) {
  const [tab, setTab] = useState('daily');
  const [master, setMaster] = useState(null);
  const [missions, setMissions] = useState(null);
  const [zukan, setZukan] = useState(null);
  const [kajiyaLv, setKajiyaLv] = useState(1);
  const [tansaku, setTansaku] = useState(null);
  const [busy, setBusy] = useState(false);

  async function loadMissions() { try { setMissions(await ChikarianAPI.getMissions() || []); } catch (e) { setMissions([]); } }
  useEffect(() => {
    (async () => {
      try { setMaster(await ChikarianAPI.getMissionMaster() || []); } catch (e) { flash(errMsg(e)); setMaster([]); }
      await loadMissions();
      try { setZukan(await ChikarianAPI.getZukan() || []); } catch (e) {}
      try { setTansaku(await ChikarianAPI.getTansaku() || []); } catch (e) {}
      try { const os = await ChikarianAPI.getKajiyaOrders() || []; setKajiyaLv(os.filter(o => o.claimed).reduce((mx, o) => Math.max(mx, Q_LV[o.quality] || 0), 1)); } catch (e) {}
    })();
  }, []);

  if (!master || !missions) return <Booting />;

  const periodOf = cat => cat === 'daily' ? jstToday() : (cat === 'weekly' ? jstWeekStart() : '1970-01-01');
  const masterByKey = {}; master.forEach(m => { masterByKey[m.mission_key] = m; });
  const rowOf = mm => missions.find(r => r.mission_key === mm.mission_key && r.period_start === periodOf(mm.category)) || null;
  const dayStartMs = new Date(jstToday() + 'T00:00:00+09:00').getTime();

  function claimedCount(cat) {
    const p = periodOf(cat);
    return missions.filter(r => r.period_start === p && r.claimed && masterByKey[r.mission_key] && masterByKey[r.mission_key].category === cat && masterByKey[r.mission_key].condition_type !== ('all_' + cat)).length;
  }

  function estProgress(mm, row) {
    switch (mm.condition_type) {
      case 'saishu_today': return (profile && profile.saishu_date === jstToday()) ? (profile.saishu_today || 0) : 0;
      case 'boss_attempt_today': return (profile && profile.boss_date === jstToday()) ? (profile.boss_count_today || 0) : 0;
      case 'gacha_today': return (cards || []).filter(c => c.obtained_at && new Date(c.obtained_at).getTime() >= dayStartMs).length;
      case 'tansaku_collect_today': return tansaku ? tansaku.filter(t => t.last_collect_at && new Date(t.last_collect_at).getTime() >= dayStartMs).length : null;
      case 'cleared_stage': return profile ? (profile.cleared_stage || 0) : 0;
      case 'zukan_count': return zukan ? zukan.length : null;
      case 'kajiya_lv': return kajiyaLv;
      case 'all_daily': return claimedCount('daily');
      case 'all_weekly': return claimedCount('weekly');
      case 'cnt_kyoka': case 'cnt_rensei': case 'cnt_saishu_week': return row ? (row.progress || 0) : 0;
      default: return null;  // boss_win_week / max_skill_lv / deck_power はサーバ判定
    }
  }

  async function claim(mm) {
    if (busy) return; setBusy(true);
    try {
      const res = await ChikarianAPI.claimMission(mm.mission_key);
      const r = res && res.reward ? res.reward : {};
      const parts = Object.keys(r).map(k => (REWARD_LABEL[k] || k) + '×' + r[k]);
      flash('受け取りました：' + (parts.join('・') || 'なし'));
      await loadMissions(); await refreshAll();
    } catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); }
  }

  const list = master.filter(m => m.category === tab).sort((a, b) => (a.tier - b.tier) || a.mission_key.localeCompare(b.mission_key));

  return (
    <div style={S.root}><div style={misS.bg} />
      <div style={misS.body}>
        <div style={misS.head}><div style={misS.title}>ミッション</div><div style={misS.sub}>目標を達成して報酬を受け取る</div></div>
        <div style={misS.tabs}>
          {['daily', 'weekly', 'achievement'].map(c => (
            <button key={c} onClick={() => setTab(c)} style={{ ...misS.tab, ...(c === tab ? misS.tabSel : {}) }}>{CAT_JA[c]}</button>
          ))}
        </div>
        <div style={misS.reset}>{CAT_RESET[tab]}</div>

        <div style={misS.list}>
          {list.map(mm => {
            const row = rowOf(mm);
            const claimed = row ? row.claimed : false;
            const est = estProgress(mm, row);
            const isBonus = mm.condition_type === 'all_daily' || mm.condition_type === 'all_weekly';
            const met = est == null ? null : est >= Number(mm.threshold);
            const claimable = !claimed && (met === null || met === true);
            const thr = Number(mm.threshold);
            const pct = claimed ? 100 : (est == null ? 0 : Math.min(100, est / (thr || 1) * 100));
            return (
              <div key={mm.mission_key} style={misS.ms}>
                <div style={misS.msTop}>
                  <span style={misS.msName}>{mm.title}</span>
                  {claimed
                    ? <span style={{ ...misS.state, ...misS.stGot }}>受取済</span>
                    : claimable
                      ? <span style={{ ...misS.state, ...misS.stClaim }}>受取可</span>
                      : <span style={{ ...misS.state, ...misS.stProg }}>進行中</span>}
                </div>
                <div style={{ marginTop: 8 }}>{rewardChips(mm.reward)}</div>
                <div style={misS.bar}><div style={{ ...misS.fill, width: pct + '%' }} /></div>
                <div style={misS.foot}>
                  <span style={misS.progT}>{est == null ? '？' : Math.floor(est)} / {thr.toLocaleString()}</span>
                  {claimed
                    ? <button disabled style={{ ...misS.claimBtn, ...misS.claimOff }}>受取済</button>
                    : claimable
                      ? <button onClick={() => claim(mm)} disabled={busy} style={{ ...misS.claimBtn, ...(busy ? misS.claimOff : {}) }}>受け取る</button>
                      : <button disabled style={{ ...misS.claimBtn, ...misS.claimOff }}>{isBonus ? '先に各ミッションを' : '条件未達'}</button>}
                </div>
                {est == null && !claimed && <div style={misS.note}>進捗はサーバ判定（押すと判定）</div>}
              </div>
            );
          })}
        </div>
      </div>
      <button onClick={back} style={misS.back}>‹ 戻る</button>
    </div>
  );
}

function parseBossKey(k) {
  const m = /^boss_([1-8])_(a|b|boss)(?:_r([0-9]+))?$/.exec(k || '');
  if (!m) return null;
  return { stage: +m[1], role: m[2], round: m[3] ? +m[3] : 1 };
}

function BattleLogView({ back, flash }) {
  const [logs, setLogs] = useState(null);
  const [err, setErr] = useState(null);
  const [skillMap, setSkillMap] = useState({});
  const [sel, setSel] = useState(null);
  useEffect(() => {
    (async () => {
      try { setLogs(await ChikarianAPI.getBattleLogs(30) || []); }
      catch (e) { setErr((e && e.message) || String(e)); setLogs([]); }
      try { const sm = await ChikarianAPI.getSkillMaster(); const m = {}; (sm || []).forEach(s => { m[s.skill_key] = s; }); setSkillMap(m); } catch (e) {}
    })();
  }, []);
  const skName = k => (skillMap[k] && skillMap[k].display_name) || k;
  const fmtDt = ts => { try { return new Date(ts).toLocaleString('ja-JP'); } catch (e) { return ts; } };
  // ボス名は STAGES（マップと同じ名前テーブル）から。界・役割は補足に併記。
  const bossLabel = k => { const b = parseBossKey(k); return b ? `${bossSortieName(k)}${b.round > 1 ? `(${b.round}周)` : ''}` : k; };
  const bossSub = k => { const b = parseBossKey(k); return b ? `${WORLD_NAMES[b.stage] || (b.stage + '面')}・${ROLE_JA[b.role]}` : ''; };

  if (logs === null) return <Booting />;

    const fired = Array.isArray(sel.fired_skills) ? sel.fired_skills : [];

    const win = sel.win;
    const label = bossLabel(sel.boss_key);
    const bk = parseBossKey(sel.boss_key);                              // 面/役割（ボスイラスト用）
    const idx = logs.findIndex(l => l.id === sel.id);   // 前(古い)/次(新しい)ナビ用（報告書はサーバ取得＝削除なし）
    const deckTotal = deck.reduce((a, c) => a + (Number(c.sougou) || 0), 0);

    const msg = win ? `部隊は ${label} の討伐に成功した。` : `部隊は ${label} に届かなかった。戦力の差を埋められなかった。`;

              <div style={repS.secT}>戦闘力</div>

  );

/* 修練場 専用スタイル（shurenjo-mockup の暖色意匠・tatemonoタブ内で使用・共有 S 不変） */
const shurS = {
  dummy: { margin: '4px 0 6px', padding: '18px 12px 14px', borderRadius: 5, textAlign: 'center', border: '1px solid #3a2c22', background: 'radial-gradient(80% 120% at 50% 0%, #221a16, #140f0d)' },
  target: { width: 84, height: 84, margin: '0 auto 8px', borderRadius: '50%', position: 'relative', overflow: 'hidden', border: '2px solid #8c7038', background: 'repeating-radial-gradient(circle at 50% 50%, rgba(199,161,78,.16) 0 8px, transparent 8px 16px)', display: 'grid', placeItems: 'center', fontSize: 32, color: '#8c7038' },
  dn: { fontSize: 13, color: '#b6a890', letterSpacing: '.08em' },
  ds: { fontSize: 11, color: '#7d7160', marginTop: 3 },
  seclabel: { fontSize: 11, letterSpacing: '.3em', color: '#c7a14e', margin: '16px 0 9px', opacity: .85 },
  chips: { display: 'flex', gap: 8, flexWrap: 'wrap' },
  chip: { flex: 1, minWidth: 60, padding: '10px 4px', textAlign: 'center', cursor: 'pointer', borderRadius: 4, border: '1px solid #3a2c22', background: 'linear-gradient(180deg,#181210,#120d0c)', color: '#b6a890', fontSize: 13, fontWeight: 700, fontFamily: 'inherit' },
  chipOn: { color: '#0c0a09', borderColor: '#c7a14e', background: 'linear-gradient(180deg,#ecd28a,#c7a14e)' },
  input: { width: '100%', marginTop: 8, background: '#100c0b', border: '1px solid #3a2c22', borderRadius: 4, color: '#ecd28a', fontFamily: 'inherit', fontSize: 16, fontWeight: 700, padding: '9px 12px', textAlign: 'right' },
  panel: { marginTop: 14, padding: 13, borderRadius: 5, border: '1px solid #3a2c22', background: 'linear-gradient(180deg,#241a17,#1c1513)' },
  crow: { display: 'flex', justifyContent: 'space-between', fontSize: 12, color: '#b6a890', padding: '4px 0' },
  total: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginTop: 10, padding: '13px 14px', borderRadius: 4, border: '1px solid #8c7038', background: 'linear-gradient(180deg,#1d160e,#15100b)' },
  foot: { fontSize: 10, color: '#7d7160', marginTop: 12, lineHeight: 1.7 },
};
function ShurenjoView({ profile, cards, flash }) {
  const maxDecks = Math.min(2 + Math.floor(((profile && profile.cleared_stage) || 0) / 2), 6);
  const [decks, setDecks] = useState(null);
  const [deckNo, setDeckNo] = useState(1);
  const [target, setTarget] = useState(8000);
  const [sukumi, setSukumi] = useState(1.0);
  const [kErr, setKErr] = useState(false);

  useEffect(() => { (async () => { try { setDecks(await ChikarianAPI.getDecks() || []); } catch (e) { flash(errMsg(e)); setDecks([]); } })(); }, []);
  if (decks === null) return <Booting />;

  const cardById = {}; (cards || []).forEach(c => { cardById[c.id] = c; });
  const row = decks.find(d => d.deck_no === deckNo);
  const ids = row ? [row.slot1_card_id, row.slot2_card_id, row.slot3_card_id] : [null, null, null];
  const members = ids.map(id => id ? cardById[id] : null).filter(Boolean);
  const perCard = members.map(c => ({ c, st: computeStats(c) }));
  const deckTotal = perCard.reduce((a, x) => a + x.st.sougou, 0);
  const finalPow = Math.round(deckTotal * sukumi);
  const win = finalPow >= target;

  return (
    <div style={{ padding: '4px 0' }}>
      {/* カカシ（戦力確認用の的） */}
      <div style={shurS.dummy}>
        <div style={shurS.target}>{kErr ? '◎' : <img src="./images/kakashi.png" alt="" onError={() => setKErr(true)} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain' }} />}</div>
        <div style={shurS.dn}>カカシ（戦力確認用の的）</div>
        <div style={shurS.ds}>強化なし・報酬なし・回数無制限</div>
      </div>

      {/* 測定するデッキ */}
      <div style={shurS.seclabel}>測定するデッキ</div>
      <div style={shurS.chips}>
        {Array.from({ length: maxDecks }, (_, i) => i + 1).map(n => (
          <div key={n} onClick={() => setDeckNo(n)} style={{ ...shurS.chip, ...(n === deckNo ? shurS.chipOn : {}) }}>デッキ{n}</div>
        ))}
      </div>

      {/* カード内訳（本番 computeStats） */}
      <div style={shurS.panel}>
        {perCard.length === 0
          ? <div style={{ fontSize: 12, color: '#7d7160' }}>このデッキは未編成です</div>
          : perCard.map(({ c, st }, i) => (
              <div key={i} style={{ ...shurS.crow, borderBottom: i < perCard.length - 1 ? '1px dotted #3a2c22' : 'none' }}>
                <span>{st.info.name}{st.isSp ? '' : `（${st.info.attr}${st.info.weap}）`} Lv{c.lv}★{c.star || 0}</span>
                <span>本体{st.body.toLocaleString()}＋装備{st.equip.toLocaleString()}＝<b style={{ color: '#efe6d5' }}>{st.sougou.toLocaleString()}</b></span>
              </div>
            ))}
        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontSize: 13, color: '#ecd28a', fontWeight: 700 }}>
          <span>デッキ総合（素）</span><span>{deckTotal.toLocaleString()}</span>
        </div>
      </div>

      {/* 三すくみ補正 */}
      <div style={shurS.seclabel}>三すくみ補正（測定用・任意）</div>
      <div style={shurS.chips}>
        {SUKUMI_OPT.map(o => <div key={o.v} onClick={() => setSukumi(o.v)} style={{ ...shurS.chip, ...(sukumi === o.v ? shurS.chipOn : {}) }}>{o.label}×{o.v}</div>)}
      </div>

      {/* カカシ戦力 */}
      <div style={shurS.seclabel}>カカシ（敵戦力）</div>
      <div style={shurS.chips}>
        {KAKASHI_PRESETS.map(p => <div key={p.v} onClick={() => setTarget(p.v)} style={{ ...shurS.chip, fontSize: 11, ...(target === p.v ? shurS.chipOn : {}) }}>{p.label}</div>)}
      </div>
      <input type="number" min="0" value={target} onChange={e => setTarget(Math.max(0, parseInt(e.target.value, 10) || 0))} style={shurS.input} />

      {/* 結果 */}
      <div style={{ ...shurS.panel, textAlign: 'center' }}>
        <div style={{ fontSize: 11, letterSpacing: '.2em', color: '#c7a14e' }}>補正後の実戦闘力（素×三すくみ）</div>
        <div style={{ fontSize: 32, fontWeight: 800, color: '#ecd28a', textShadow: '0 0 18px rgba(236,210,138,.3)', marginTop: 2 }}>{finalPow.toLocaleString()}</div>
        <div style={{ fontSize: 12, color: '#7d7160', marginTop: 4 }}>カカシ {target.toLocaleString()} と比較</div>
        <div style={{ fontSize: 18, fontWeight: 800, marginTop: 6, color: win ? '#7fb6ec' : '#d08a8a' }}>{win ? '勝てる見込み（目安）' : '届かない見込み（目安）'}</div>
      </div>

      <div style={shurS.foot}>
        報酬はありません（戦力確認用・何度でもノーリスク）。表示は発動前の素の戦力＝balance確定式（computeStats）のみ。
        スキル発動による上振れ・本判定はボス戦（サーバ）で反映されます。
      </div>
    </div>
  );
}

/* =================================================================== 設定 */
// サーバを呼ばない＝資産不変。実際に効く項目のみ（捏造UI禁止）。音設定はセッション内state（localStorage不使用）。
function Toggle({ on, onToggle }) {
  // settings-mockup .toggle（50×28・onで金グラデ・knob22）
  return (
    <button onClick={onToggle} aria-pressed={on} style={{ width: 50, height: 28, borderRadius: 16, border: '1px solid rgba(232,194,90,.3)', background: on ? 'linear-gradient(90deg,#e8b54d,#ffd98a)' : 'rgba(255,255,255,.15)', position: 'relative', cursor: 'pointer', padding: 0, flex: 'none', transition: '.2s' }}>
      <span style={{ position: 'absolute', top: 2, left: on ? 26 : 2, width: 22, height: 22, borderRadius: '50%', background: '#fff', transition: '.2s' }} />
    </button>
  );
}

  row: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: PANEL, border: BORDER, borderRadius: 12, padding: '13px 14px', marginBottom: 8, gap: 12 },
  k: { fontSize: 14, color: GOLD_HI },
  sub: { fontSize: 10, color: '#9a8c70', marginTop: 3 },
  small: { fontFamily: 'inherit', fontSize: 12, color: GOLD_HI, background: 'rgba(255,255,255,.05)', border: '1px solid rgba(232,194,90,.4)', borderRadius: 14, padding: '7px 14px', cursor: 'pointer', flex: 'none' },
  uid: { fontSize: 11, color: '#9a8c70', marginTop: 4, wordBreak: 'break-all' },

  back: { position: 'absolute', zIndex: 7, left: 14, bottom: 14, fontFamily: 'inherit', fontSize: 14, color: GOLD_HI, background: PANEL, border: BORDER, borderRadius: 22, padding: '10px 20px', cursor: 'pointer' },
};
function SettingsScreen({ bgmOn, setBgmOn, volume, setVolume, logout, playOpening, back }) {
  const seAvail = !!window.CKSound;   // SE は cksound.js が担当（無ければ項目を出さない）
  const [seOn, setSeOn] = useState(seAvail ? CKSound.isOn() : true);
  const [email, setEmail] = useState(null);
  const [confirm, setConfirm] = useState(false);
  useEffect(() => { (async () => { try { const u = await ChikarianAPI.auth.getUser(); setEmail(u && (u.email || u.id)); } catch (e) {} })(); }, []);
  const toggleSe = () => { const n = !seOn; setSeOn(n); if (window.CKSound) CKSound.setOn(n); };

  return (
    <div style={S.root}><div style={setS.bg} />
      <div style={setS.body}>
        <div style={setS.head}><div style={setS.title}>設定</div></div>
        <div style={setS.scroll}>

          {/* サウンド */}
          <div style={setS.sec}>サウンド</div>
          <div style={setS.row}>
            <div><div style={setS.k}>BGM</div><div style={setS.sub}>タイトル・ホームのBGM</div></div>
            <Toggle on={bgmOn} onToggle={() => setBgmOn(v => !v)} />
          </div>
          <div style={setS.row}>
            <div style={setS.k}>音量 <span style={{ color: bgmOn ? '#cdb488' : '#7a6848' }}>{Math.round(volume * 100)}%</span></div>
            <input type="range" min="0" max="100" value={Math.round(volume * 100)} disabled={!bgmOn}
              onChange={e => setVolume(parseInt(e.target.value, 10) / 100)} style={{ width: 130, accentColor: '#e8b54d', opacity: bgmOn ? 1 : .4 }} />
          </div>
          {seAvail && <div style={setS.row}>
            <div><div style={setS.k}>効果音</div><div style={setS.sub}>ボタン・カードめくり等のSE</div></div>
            <Toggle on={seOn} onToggle={toggleSe} />
          </div>}

          {/* その他 */}
          <div style={setS.sec}>その他</div>
          <div style={setS.row}>
            <div><div style={setS.k}>プロローグ</div><div style={setS.sub}>冒頭の物語をもう一度見る</div></div>
            <button onClick={playOpening} style={setS.small}>プロローグを見る</button>
          </div>

          {/* アカウント・データ */}
          <div style={setS.sec}>アカウント・データ</div>
          <div style={setS.row}>
            <div style={{ minWidth: 0 }}><div style={setS.k}>ログイン中アカウント</div><div style={setS.uid}>{email || '取得中…'}</div></div>
          </div>
          <div style={setS.row}>
            <div><div style={setS.k}>ログアウト</div><div style={setS.sub}>このアカウントから出る</div></div>
            <button onClick={() => setConfirm(true)} style={{ ...setS.small, color: '#ff9a8a', borderColor: 'rgba(224,86,59,.5)' }}>ログアウト</button>
          </div>

          {/* バージョン */}
          <div style={setS.ver}>チカリアン（開発版）<br />© Chikarian</div>
        </div>
      </div>

      <button onClick={back} style={setS.back}>‹ 戻る</button>

      {confirm && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.7)', display: 'grid', placeItems: 'center', zIndex: 60, padding: 24 }}>
          <div style={{ maxWidth: 340, background: '#160a13', border: BORDER, borderRadius: 12, padding: 18, textAlign: 'center' }}>
            <div style={{ fontSize: 14, color: GOLD_HI, fontWeight: 700 }}>ログアウトしますか？</div>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 16 }}>
              <button onClick={() => { setConfirm(false); logout(); }} style={S.bigBtn}>ログアウト</button>
              <button onClick={() => setConfirm(false)} style={S.lineBtn}>やめる</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
