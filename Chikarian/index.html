  フェーズ1: 認証ゲート＋home＋採取（ログイン→home→採取→残量がサーバ値で更新）。
  以降のフェーズで ガチャ/編成/図鑑/ボス/報告書/強化/探索/放置/ミッション/スキル/修練場/装備/建物 を追加。

  方針:
   - 画面遷移は URL でなく state（screen）で切替＝1枚もの。最上位の <audio> は絶対にアンマウントしない。
   - データは window.ChikarianAPI（chikarian-api.js）経由。資産が動く操作はサーバRPC（不正対策C）。
   - レイアウト/配色は既存 mockup を踏襲（縦480px・Shippori Mincho・深紅/漆黒/金・物理描写語のみ）。

  ★ OAuth リダイレクト URL を Supabase に登録すること（dev は Live Server）:
     http://127.0.0.1:5500/index.html   （本番は GitHub Pages の URL も）
-->

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ===== Supabase 設定（anon は公開可・dev/console.html と同じ）=====
const SUPABASE_URL = "https://ufqnxpljakrzvivfgenk.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mjEggLBf6A3HjR8UqiEDOw_cJeam2aK";

// ===== 色・共通スタイル =====
const GOLD = "#e8c25a", GOLD_HI = "#fff3c8";
const PANEL = "rgba(20,10,16,.72)", BORDER = "1.5px solid rgba(232,194,90,.55)";
const DAILY_MAX = 1000;

// ===== エラーコード→和文 =====
const ERR_JA = {
  'not authenticated': 'ログインが必要です',

  'not enough chikarium': 'チカリウムが足りません',

  'boss daily limit reached (3/day)': '本日のボス挑戦は上限（3回）です',
  'INSUFFICIENT_MEDAL': 'メダルが足りません',
  'EXCEEDS_CAP': '上限を超えています',
  'DECK_LOCKED': 'このデッキは使用できません（未解放/出撃中）',
  'ALREADY_CLAIMED': 'すでに受け取り済みです',
  'NOT_READY': 'まだ完了していません',
  // 探索（start_tansaku / collect_tansaku）※RPCはrepo外＝タスク記載のコードに対応
  'NOT_EXPLORING': 'このデッキは探索していません',
  'INVALID_DEPTH': '探索の深さが不正です',
  'INVALID_AREA': 'エリア指定が不正です',
  // 装備充填（equip_buki）※RPCはrepo外＝タスク記載のコードに対応
  'SP_NO_EQUIP': 'SPは装備できません',
  'QUALITY_LOCKED': 'その質はまだ解放されていません（鍛冶屋）',
  'INVALID_AMOUNT': '数量が不正です',
  'CARD_NOT_FOUND': 'カードが見つかりません',
  // do_kyoka（★強化・0021）
  'NOT_AUTHENTICATED': 'ログインが必要です',
  'SAME_CARD': '本体と素材が同じカードです',
  'RARITY_MISMATCH': 'レアリティが違います（同レアの素材が必要）',

  'SP_MATERIAL_MISMATCH': '同名のSPカードが必要です',
  'SP_NOT_MATERIAL': 'SPは素材に使えません',
  'BASE_LOCKED': '本体カードがロック中です',
  'MATERIAL_LOCKED': '素材カードがロック中です',
  'INSUFFICIENT_HOSHOU': '保証石が足りません',
  'INVALID_HOSHOU': '保証石の指定が不正です',
  'BASE_NOT_FOUND': '本体カードが見つかりません',
  'MATERIAL_NOT_FOUND': '素材カードが見つかりません',
  // 鍛冶屋（place_kajiya_order / claim_kajiya）※RPCはrepo外＝タスク記載のコードに対応
  'ORDER_IN_PROGRESS': '他の依頼が進行中です（1件ずつ）',
  'ALREADY_UNLOCKED': 'すでに解放済みです',
  'PREREQUISITE_MISSING': '前段階の質が未解放です',
  'INVALID_QUALITY': '対象外の質です',
  'ORDER_NOT_FOUND': '依頼が見つかりません',
  // スキル錬成（do_skill_rensei・0021）
  'CARD_NOT_OWNED': '自分のカードではありません',
  'SKILL_NOT_FOUND': 'スキルが見つかりません',
  'NOT_UPGRADABLE': 'このスキルは強化できません',
  'RARITY_NOT_SUPPORTED': 'このレアは錬成の対象外です',
  'INSUFFICIENT_CRYSTAL': 'クリスタルが足りません',
  'INVALID_COLOR': 'クリスタルの色が不正です',
  // スキル転移（do_skill_teni）※RPCはrepo外＝タスク記載のコードに対応
  'DST_SLOT_INVALID': '空き枠（1/2）を指定してください',
  'SP_NOT_TRANSFERABLE': 'SPのスキルは転移できません',
  'SP_NO_SLOT': 'SPには空き枠がありません',
  'SRC_LOCKED': '素材カードがロック中です',
  'SRC_SKILL_NOT_FOUND': '素材のスキルが見つかりません',
  'DST_SLOT_OCCUPIED': '指定した空き枠は埋まっています',
  // 交換所（do_card_exchange）※RPCはrepo外＝タスク記載のコードに対応
  'CARD_LOCKED': 'ロック中は交換できません',
  'RARITY_NOT_EXCHANGEABLE': 'このカードは交換の対象外です',
  // ミッション（claim_mission・0020）
  'MISSION_NOT_FOUND': 'ミッションがありません',
  'NOT_COMPLETE': '条件を満たしていません',
  'UNKNOWN_CONDITION': '未知の条件です（要報告）',
};
function errMsg(e) {
  const m = (e && e.message) ? e.message : String(e);
  if (ERR_JA[m]) return ERR_JA[m];
  // 部分一致（update_deck 等は RAISE の % 置換で実値が入るため substring で判定）
  if (m.includes('not unlocked')) return 'このデッキはまだ解放されていません';
  if (m.includes('duplicate card')) return '同じカードを複数の枠に入れられません';
  if (m.includes('SP-unavailable')) return 'SPカードが本日離脱中のため編成できません';
  if (m.includes('exceeds limit')) return 'デッキの合計コストが上限（11）を超えています';
  if (m.includes('daily limit')) return '本日のボス挑戦は上限（3回）です';
  if (m.includes('is empty')) return 'デッキが空です（編成してください）';
  if (m.includes('boss') && m.includes('not found')) return 'ボスが見つかりません';
  if (m.includes('deck') && m.includes('not found')) return 'デッキが見つかりません（未編成）';
  if (m.includes('not owned') || m.includes('not found')) return '所持していないカードが含まれています';
  return 'エラー: ' + m;
}

// ===== JST 当日（採取日次リセットの表示用）=====
function jstToday() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Tokyo' }); // YYYY-MM-DD
}
// profile から「本日の採取量」を算出（保存日付が古ければ0表示）
function dailyGotOf(profile) {
  if (!profile) return 0;
  if (profile.saishu_date && profile.saishu_date < jstToday()) return 0;
  return profile.saishu_today || 0;
}
function fmtClock(ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  const h = String(Math.floor(s / 3600)).padStart(2, "0");
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
  const ss = String(s % 60).padStart(2, "0");
  return `${h}:${m}:${ss}`;
}
function msUntilMidnight() {
  const now = new Date(); const next = new Date(now); next.setHours(24, 0, 0, 0); return next - now;
}

/* =================================================================== App */
// オープニング視聴済みフラグ（端末単位・v1。設定から再生可。将来 profile 化も可）
function openingSeen() { try { return localStorage.getItem('ck_opening_seen') === '1'; } catch (e) { return false; } }
function markOpeningSeen() { try { localStorage.setItem('ck_opening_seen', '1'); } catch (e) {} }

function App() {
  const [phase, setPhase] = useState('booting');   // booting | title | login | opening | app
  const [profile, setProfile] = useState(null);
  const [cards, setCards] = useState([]);          // 所持カード（サーバ値）
  const [screen, setScreen] = useState('home');
  const [toast, setToast] = useState(null);
  const [authed, setAuthed] = useState(false);  // セッション有無（タイトルのタップ分岐に使用）
  const [bgmOn, setBgmOn] = useState(true);     // BGM音声状態（単一ソース・設定画面と共有）
  const [volume, setVolume] = useState(0.45);   // 0..1（セッション内のみ・localStorage不使用）
  const audioRef = useRef(null);
  const bgmStarted = useRef(false);
  const phaseRef = useRef('booting');
  const navedOnce = useRef(false);   // サインイン後の自動遷移（opening/app）を一度だけ行うガード
  const routing = useRef(false);     // routeAfterLogin の多重実行防止
  useEffect(() => { phaseRef.current = phase; }, [phase]);

  const flash = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 1800); }, []);

  // サインイン後（OAuth復帰含む）: プロフィール読込 → 未視聴なら opening / 視聴済みなら app
  async function routeAfterLogin() {
    if (routing.current || navedOnce.current) return;
    routing.current = true;
    try {
      await boot();
      if (window.location.hash) history.replaceState(null, "", window.location.pathname);
      navedOnce.current = true;
      setPhase(openingSeen() ? 'app' : 'opening');
    } catch (e) { flash(errMsg(e)); setPhase('login'); }
    finally { routing.current = false; }
  }

  // 初期化＋認証監視
  useEffect(() => {
    ChikarianAPI.init(SUPABASE_URL, SUPABASE_ANON_KEY);
    const oauthReturn = !!window.location.hash;   // OAuth リダイレクト復帰（URLにトークンハッシュ）
    let sub = null;
    (async () => {
      try {
        const session = await ChikarianAPI.auth.getSession();
        setAuthed(!!session);
        if (session && oauthReturn) {
          await routeAfterLogin();              // 直前にサインイン＝タイトルを挟まず opening/app へ
        } else if (session) {
          setPhase('title');                    // 既ログインの通常起動：まずタイトル。プロフィールは裏で用意
          boot().catch((e) => flash(errMsg(e)));
        } else {
          setPhase('title');                    // 未ログイン：タイトル → タップ → login
        }
      } catch (e) { setPhase('title'); }
    })();
    sub = ChikarianAPI.auth.onChange((session) => {
      setAuthed(!!session);
      if (session) {
        // 自動遷移は「genuineなサインイン」のみ：OAuth復帰(hash) か login画面での確定。
        // 既ログインの通常起動(INITIAL_SESSION)は必ずタイトルを挟む（boot のみ）。
        if (oauthReturn || phaseRef.current === 'login') routeAfterLogin();
        else boot().catch(() => {});            // 既にapp/title：プロフィールを最新化のみ
      } else {
        navedOnce.current = false;              // 次回サインインで再び自動遷移できるよう解除
        setProfile(null); setScreen('home'); setPhase('title');
      }
    });
    return () => {
      // onChange は supabase-js の {data:{subscription}} 形を返す（実装差を吸収）
      const s = sub && (sub.unsubscribe ? sub : (sub.subscription || (sub.data && sub.data.subscription)));
      if (s && s.unsubscribe) s.unsubscribe();
    };
  }, []);

  // プロフィール/所持カードをサーバ値で用意（phaseは変えない＝遷移は呼び出し側が決める）
  async function boot() {
    await ChikarianAPI.rpc('initialize_profile');   // get-or-create
    const p = await ChikarianAPI.getProfile();
    setProfile(p);
    try { setCards(await ChikarianAPI.getCards() || []); } catch (e) {}
  }

  // オープニング終了/スキップ → 視聴済みにして home へ
  const finishOpening = useCallback(() => { markOpeningSeen(); setScreen('home'); setPhase('app'); }, []);

  const refreshProfile = useCallback(async () => {
    try { const p = await ChikarianAPI.getProfile(); setProfile(p); return p; }
    catch (e) { flash(errMsg(e)); }
  }, [flash]);

  // ガチャ等の後: profile と所持カードをサーバ値で再取得
  const refreshAll = useCallback(async () => {
    try {
      const p = await ChikarianAPI.getProfile(); setProfile(p);
      const c = await ChikarianAPI.getCards(); setCards(c || []);
    } catch (e) { flash(errMsg(e)); }
  }, [flash]);

  // BGM: 最初のユーザー操作で再生開始（自動再生制限対策）。<audio>は常駐＝アンマウントしない。
  useEffect(() => {
    const start = () => {
      if (bgmStarted.current) return; bgmStarted.current = true;
      const a = audioRef.current;
      if (a) { a.volume = volume; a.muted = !bgmOn; const p = a.play(); if (p && p.catch) p.catch(() => {}); }
      window.removeEventListener('pointerdown', start);
    };
    window.addEventListener('pointerdown', start);
    return () => window.removeEventListener('pointerdown', start);
  }, []);
  // 音設定の反映（muted/volume）。再生位置はそのまま（停止せずミュートのみ）。
  useEffect(() => { const a = audioRef.current; if (a) { a.muted = !bgmOn; a.volume = volume; } }, [bgmOn, volume]);

  async function logout() {
    try { await ChikarianAPI.auth.signOut(); } catch (e) { flash(errMsg(e)); }
  }

  let body;
  if (phase === 'booting') body = <Booting />;
  else if (phase === 'title') body = <Title bgmOn={bgmOn} setBgmOn={setBgmOn} onStart={() => {
    if (!authed) setPhase('login');
    else setPhase(openingSeen() ? 'app' : 'opening');
  }} />;
  else if (phase === 'login') body = <Login flash={flash} />;
  else if (phase === 'opening') body = <Opening onDone={finishOpening} />;
  else {
    if (screen === 'home') body = <Home profile={profile} go={setScreen} flash={flash} onRefresh={refreshAll} />;
    else if (screen === 'saishu') body = <Saishu profile={profile} onExit={async () => { await refreshProfile(); setScreen('home'); }} flash={flash} />;
    else if (screen === 'gacha') body = <Gacha profile={profile} onRefresh={refreshAll} back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'zukan') body = <ZukanScreen cards={cards} profile={profile} refreshAll={refreshAll} back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'deck') body = <DeckScreen profile={profile} cards={cards} refreshAll={refreshAll} back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'boss') body = <BossScreen profile={profile} cards={cards} onRefresh={refreshAll} back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'kyoka') body = <KyokaScreen cards={cards} profile={profile} refreshAll={refreshAll} back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'tatemono') body = <TatemonoScreen profile={profile} cards={cards} refreshAll={refreshAll} back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'tansaku') body = <TansakuScreen profile={profile} refreshAll={refreshAll} back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'houchi') body = <HouchiScreen profile={profile} refreshAll={refreshAll} back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'mission') body = <MissionScreen profile={profile} cards={cards} refreshAll={refreshAll} back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'report') body = <BattleLogView back={() => setScreen('home')} flash={flash} />;
    else if (screen === 'settings') body = <SettingsScreen bgmOn={bgmOn} setBgmOn={setBgmOn} volume={volume} setVolume={setVolume} logout={logout} playOpening={() => setPhase('opening')} back={() => setScreen('home')} />;
    else body = <Placeholder name={screen} back={() => setScreen('home')} logout={logout} />;
  }

  return (
    <div style={{ position: 'relative', width: '100%', maxWidth: 480, margin: '0 auto', minHeight: '100dvh', overflow: 'hidden', background: '#0a0509' }}>
      {/* 常駐 BGM（絶対にアンマウントしない） */}
      <audio ref={audioRef} src="sounds/bgm_home.mp3" loop preload="auto" muted={!bgmOn} />
      {body}
      {toast && <div style={S.toast}>{toast}</div>}
    </div>
  );
}

function Opening({ onDone }) {
  const [lineHtml, setLineHtml] = useState('');
  const [lineShow, setLineShow] = useState(false);
  const [glowShow, setGlowShow] = useState(false);
  const [glowFull, setGlowFull] = useState(false);
  const [ambient, setAmbient] = useState(false);
  const [nextShow, setNextShow] = useState(false);
  const [flashing, setFlashing] = useState(false);
  const i = useRef(-1), busy = useRef(false), ended = useRef(false);
  const hasText = useRef(false);   // 既に地の文を出したか（前行フェードアウト待ちの有無）
  const timers = useRef([]);
  const T = (fn, ms) => { const id = setTimeout(fn, ms); timers.current.push(id); };

  const finish = () => {
    if (ended.current) return; ended.current = true;
    setNextShow(false); setFlashing(true);
    T(() => onDone(), 620);
  };

  const step = () => {
    if (ended.current) return;
    i.current++;
    if (i.current >= OPENING_SCRIPT.length) { finish(); return; }
    const s = OPENING_SCRIPT[i.current];
    if (s.type === 'beat') {                       // 演出のみ（テキスト非表示）・自動で進む
      busy.current = true; setNextShow(false);
      if (s.glow === 'on') { setGlowShow(true); T(step, 1800); }
      else if (s.glow === 'full') { setGlowFull(true); setAmbient(true); T(step, 1700); }
      else T(step, 400);
      return;
    }
    // text：前の行を消してから新しい行を出す → フェードイン完了でタップ受付
    busy.current = true; setNextShow(false);
    setLineShow(false);
    const delay = hasText.current ? 600 : 0;
    T(() => {
      setLineHtml(s.html); hasText.current = true; setLineShow(true);
      T(() => { busy.current = false; setNextShow(true); }, 1100);
    }, delay);
  };

  const advance = () => { if (!busy.current && !ended.current) step(); };

  useEffect(() => {
    T(step, 500);
    return () => { timers.current.forEach(clearTimeout); };
  }, []);

  return (
    <div className="opn-root" onClick={advance}>
      <div className={'opn-glow' + (glowShow ? ' show' : '') + (glowFull ? ' full' : '')} />
      <div className={'opn-ambient' + (ambient ? ' show' : '')} />
      <div className="opn-stage">
        <div className={'opn-line' + (lineShow ? ' show' : '')} dangerouslySetInnerHTML={{ __html: lineHtml }} />
      </div>
      <div className={'opn-next' + (nextShow ? ' show' : '')}>タップで進む</div>
      <button className="opn-skip" onClick={(e) => { e.stopPropagation(); finish(); }}>スキップ ▶</button>
      <div className={'opn-flash' + (flashing ? ' on' : '')} />
    </div>
  );
}

function Home({ profile, go, flash, onRefresh }) {
  const chikarium = profile ? (profile.chikarium || 0) : 0;
  const medal = profile ? (profile.medal || 0) : 0;
  const dailyGot = dailyGotOf(profile);
  const reachedCap = dailyGot >= DAILY_MAX;
  const pct = Math.min(100, dailyGot / DAILY_MAX * 100);
  const [countdown, setCountdown] = useState(msUntilMidnight());
  useEffect(() => { const t = setInterval(() => setCountdown(msUntilMidnight()), 1000); return () => clearInterval(t); }, []);

  // 報告書の未読バッジ（localStorage 自己完結：ck_reports vs ck_reports_read）
  const [hasUnread, setHasUnread] = useState(false);
  useEffect(() => {
    try {
      const log = JSON.parse(localStorage.getItem('ck_reports') || '[]');
      const read = +(localStorage.getItem('ck_reports_read') || 0);
      setHasUnread(log.length > 0 && log[0].t > read);
    } catch (e) {}
  }, []);

  // 出撃中（ボス）／探索中（探索）の部隊。Home 自身が getBossSorties / getTansaku を保持し、
  // ボス戦ページと同じ毎秒判定で帰還時間に自動回収＝デッキ解放（マップを開かなくても解放／報告書記録）。
  const [sorties, setSorties] = useState([]);          // get_boss_sorties の sorties[]
  const [tansaku, setTansaku] = useState([]);          // get_tansaku の depth付き行（探索中）
  const [clockOffset, setClockOffset] = useState(0);   // サーバ now − client now（ms）
  const [now, setNow] = useState(Date.now());
  const [fleetSheet, setFleetSheet] = useState(null);  // 管理シート 'boss' | 'tansaku' | null
  const [fleetBusy, setFleetBusy] = useState(false);   // キャンセル/回収中の二重防止
  const [fleetConfirm, setFleetConfirm] = useState(null); // {kind:'boss'|'tansaku', deckNo} 帰還/回収の確認
  const collectedRef = useRef({});                     // 自動回収の重複防止（deck_no:started_at）

  async function refetchSorties() {
    try { const d = await ChikarianAPI.getBossSorties(); setSorties((d && d.sorties) || []); setClockOffset(d && d.now ? (new Date(d.now).getTime() - Date.now()) : 0); }
    catch (e) { /* 取得失敗時はゲージ非表示（最終判定はサーバ操作で担保） */ }
  }
  async function refetchTansaku() {
    try { setTansaku((await ChikarianAPI.getTansaku() || []).filter(x => x.depth)); } catch (e) {}
  }
  useEffect(() => {
    refetchSorties(); refetchTansaku();
    const t1 = setInterval(() => setNow(Date.now()), 1000);             // ローカル秒読み
    const t2 = setInterval(() => { refetchSorties(); refetchTansaku(); }, 25000);  // periodic 再取得
    return () => { clearInterval(t1); clearInterval(t2); };
  }, []);

  // ライブphase（毎秒再計算）。出撃ピル＝'out'/'returning'（arrived/return_done は数えない＝自動回収待ち）。
  const outSorties = sorties.map(s => ({ s, L: bossLivePhase(s, clockOffset, now) }))
    .filter(x => x.L.phase === 'out' || x.L.phase === 'returning');
  const fleetBoss = outSorties.length;
  const fleetTansaku = tansaku.length;

  // 毎秒：到着('arrived')／帰宅('return_done')のデッキを各1回 collectBossResult（撃ちっぱなし＝報告書＋復路解放／0045）。
  useEffect(() => {
    const pending = [];
    sorties.forEach(s => {
      const L = bossLivePhase(s, clockOffset, now);
      if (L.phase !== 'arrived' && L.phase !== 'return_done') return;
      const k = s.deck_no + ':' + s.started_at + ':' + L.phase;
      if (collectedRef.current[k]) return;
      collectedRef.current[k] = true; pending.push({ s, k });
    });
    if (!pending.length) return;
    (async () => {
      for (const { s, k } of pending) {
        try {
          const res = await ChikarianAPI.collectBossResult(s.deck_no);
          flash(res && res.returning ? `デッキ${s.deck_no} 到着・帰還中（報告書に記録）` : `デッキ${s.deck_no} 帰還`);
        } catch (e) { if (/STILL_/.test((e && e.message) || '')) delete collectedRef.current[k]; }  // 復路未完（クロックずれ）は次tick再試行
      }
      await refetchSorties(); try { await onRefresh(); } catch (e) {}
    })();
  }, [sorties, now, clockOffset]);

  // 管理シートは対象が空になったら自動で閉じる。
  useEffect(() => {
    if (fleetSheet === 'boss' && fleetBoss === 0) setFleetSheet(null);
    if (fleetSheet === 'tansaku' && fleetTansaku === 0) setFleetSheet(null);
  }, [fleetSheet, fleetBoss, fleetTansaku]);

  // キャンセル（'out'のみ有効・経過ぶん帰還／回数返金はサーバ）。'returning'は非表示。
  async function cancelSortie(dno) {
    if (fleetBusy) return; setFleetBusy(true);
    try { await ChikarianAPI.cancelBossSortie(dno); await refetchSorties(); await onRefresh(); flash('引き返します（帰還中）'); }
    catch (e) { flash(errMsg(e)); } finally { setFleetBusy(false); }
  }
  // 回収して戻す（蓄積回収＝デッキ解放はサーバ collect_tansaku）。
  async function recallTansaku(dno) {
    if (fleetBusy) return; setFleetBusy(true);
    try { await ChikarianAPI.collectTansaku(dno); await refetchTansaku(); await onRefresh(); flash('回収しました'); }
    catch (e) { flash(errMsg(e)); } finally { setFleetBusy(false); }
  }

  return (
    <div style={S.root}>
      <div className="home-whitein" />
      <div style={S.bg} /><div style={HS.bgImg} /><div style={S.vignette} />
      <div style={S.frame}>
        {/* 上部リソース */}
        <header style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
          <div style={{ ...S.resPanel, ...HS.resPanelGlow }}>
            <ResIcon src={ASSETS.ic.chikarium} fallback="◈" big />
            <div style={S.resCol}>
              <div style={S.resLabel}>チカリウム</div>

              <div style={{ marginTop: 3 }}>

/* =================================================================== 採取（カメラ） */
// saishu-test.html の検出ロジックを移植。検出した点滅数を blinksRef に貯め、
// 退出時に claimSaishu(blinks) でサーバ確定（日次1000上限はサーバがクランプ）。
const TUNE = { U_DIFF_MIN: 39, COLORGAP_MIN: 25, PETAL_H: 60, LEAF_H_LO: 15, LOCK_WIN: 20, LOCK_RATE: 0.60, HZ_LO: 5.5, HZ_HI: 12.0, HZ_WIN: 20, PEAK_WIN: 10 };
const OUTER_L = {
  stamen: { x: 0.564, y: 0.075, w: 0.219, h: 0.280, c: '#ffd60a' },
  petal: { x: 0.171, y: 0.180, w: 0.588, h: 0.670, c: '#ff2d55' },
  leaf1: { x: 0.144, y: 0.595, w: 0.231, h: 0.288, c: '#32d74b' },
  leaf2: { x: 0.652, y: 0.446, w: 0.188, h: 0.280, c: '#32d74b' },
};
const INNER_L = {
  stamen: { x: 0.646, y: 0.178, w: 0.055, h: 0.073 },
  petal: { x: 0.304, y: 0.292, w: 0.278, h: 0.279 },
  leaf1: { x: 0.203, y: 0.658, w: 0.098, h: 0.119 },
  leaf2: { x: 0.721, y: 0.553, w: 0.050, h: 0.065 },
};
function mirror(r) { return { x: 1 - r.x - r.w, y: r.y, w: r.w, h: r.h, c: r.c }; }
function regionsFor(side) {
  if (side === 'L') return { outer: OUTER_L, inner: INNER_L };
  const o = {}, inn = {};
  for (const k in OUTER_L) o[k] = mirror(OUTER_L[k]);
  for (const k in INNER_L) inn[k] = mirror(INNER_L[k]);
  return { outer: { stamen: o.stamen, petal: o.petal, leaf1: o.leaf2, leaf2: o.leaf1 },
           inner: { stamen: inn.stamen, petal: inn.petal, leaf1: inn.leaf2, leaf2: inn.leaf1 } };
}
function avgRect(img, W, H, x0, y0, x1, y1) {
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0)); x1 = Math.min(W, Math.floor(x1)); y1 = Math.min(H, Math.floor(y1));
  let R = 0, G = 0, B = 0, n = 0;
  for (let y = y0; y < y1; y += 2) for (let x = x0; x < x1; x += 2) { const i = (y * W + x) * 4; R += img[i]; G += img[i + 1]; B += img[i + 2]; n++; }
  if (!n) return { r: 0, g: 0, b: 0, br: 0 }; R /= n; G /= n; B /= n; return { r: R, g: G, b: B, br: (R + G + B) / 3 };
}
function unionInOut(img, W, H, outers) {
  const boxes = Object.values(outers).map(r => ({ x0: r.x * W, y0: r.y * H, x1: (r.x + r.w) * W, y1: (r.y + r.h) * H }));
  let inSum = 0, inN = 0, outSum = 0, outN = 0;
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) {
    let inside = false;
    for (const b of boxes) { if (x >= b.x0 && x < b.x1 && y >= b.y0 && y < b.y1) { inside = true; break; } }
    const i = (y * W + x) * 4, br = (img[i] + img[i + 1] + img[i + 2]) / 3;
    if (inside) { inSum += br; inN++; } else { outSum += br; outN++; }
  }
  return { diff: (inN ? inSum / inN : 0) - (outN ? outSum / outN : 0) };
}
function measure(img, W, H, inner) {
  const inn = avgRect(img, W, H, inner.x * W, inner.y * H, (inner.x + inner.w) * W, (inner.y + inner.h) * H);
  const mx = Math.max(inn.r, inn.g, inn.b), mn = Math.min(inn.r, inn.g, inn.b), dd = mx - mn;
  let h = 0; if (dd) { if (mx === inn.r) h = ((inn.g - inn.b) / dd) % 6; else if (mx === inn.g) h = (inn.b - inn.r) / dd + 2; else h = (inn.r - inn.g) / dd + 4; h *= 60; if (h < 0) h += 360; }
  return { r: inn.r, g: inn.g, b: inn.b, br: inn.br, h };
}

function Saishu({ profile, onExit, flash }) {
  const videoRef = useRef(null), cvRef = useRef(null);
  const [side, setSide] = useState('L');
  const [sessionGain, setSessionGain] = useState(0);
  const [locked, setLocked] = useState(false);
  const [camErr, setCamErr] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const blinksRef = useRef(0);
  const sideRef = useRef('L');
  const runningRef = useRef(false);
  const streamRef = useRef(null);
  const stateRef = useRef({ brBuf: [], tBuf: [], udBuf: [], okBuf: [], prevBr: 0, rising: false, lastSpawn: 0, locked: false });

  useEffect(() => { sideRef.current = side; stateRef.current.okBuf = []; }, [side]);

  const serverDaily = dailyGotOf(profile);
  const remaining = Math.max(0, DAILY_MAX - serverDaily);

  useEffect(() => {
    let tid = null;
    const video = videoRef.current, cv = cvRef.current;
    const ctx = cv.getContext('2d', { willReadFrequently: true });

    function dominantHz() {
      const st = stateRef.current; const n = st.brBuf.length; if (n < TUNE.HZ_WIN) return 0;
      const v = st.brBuf.slice(-TUNE.HZ_WIN), t = st.tBuf.slice(-TUNE.HZ_WIN), m = v.length;
      const dur = (t[m - 1] - t[0]) / 1000; if (dur < 0.4) return 0;
      const mean = v.reduce((a, b) => a + b, 0) / m;
      const w = v.map((x, i) => (x - mean) * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (m - 1))));
      let best = 0, bm = -1;
      for (let f = 1; f <= 12; f += 0.1) { let re = 0, im = 0; for (let i = 0; i < m; i++) { const ph = -2 * Math.PI * f * (t[i] - t[0]) / 1000; re += w[i] * Math.cos(ph); im += w[i] * Math.sin(ph); } const mag = re * re + im * im; if (mag > bm) { bm = mag; best = f; } }
      return best;
    }
    function onPeak() {
      blinksRef.current += 1;
      setSessionGain(g => g + 10);
    }
    function analyze() {
      if (!video.videoWidth) return;
      ctx.drawImage(video, 0, 0, 320, 240);
      const img = ctx.getImageData(0, 0, 320, 240).data, W = 320, H = 240;
      const rs = regionsFor(sideRef.current);
      const P = measure(img, W, H, rs.inner.petal);
      const L1 = measure(img, W, H, rs.inner.leaf1);
      const L2 = measure(img, W, H, rs.inner.leaf2);
      const Sm = measure(img, W, H, rs.inner.stamen);
      const U = unionInOut(img, W, H, rs.outer);
      const st = stateRef.current;
      st.brBuf.push(P.br); st.tBuf.push(Date.now());
      if (st.brBuf.length > TUNE.HZ_WIN) { st.brBuf.shift(); st.tBuf.shift(); }
      const hz = dominantHz(); const hzOK = hz >= TUNE.HZ_LO && hz <= TUNE.HZ_HI;
      st.udBuf.push(U.diff); if (st.udBuf.length > TUNE.PEAK_WIN) st.udBuf.shift();
      const shapeOK = Math.max.apply(null, st.udBuf) > TUNE.U_DIFF_MIN;
      const petalRed = (P.h < TUNE.PETAL_H || P.h > 340);
      const colorGap = (Math.abs(P.r - Sm.r) + Math.abs(P.g - Sm.g) + Math.abs(P.b - Sm.b)) / 3 > TUNE.COLORGAP_MIN;
      const leafGreen = (L1.h >= TUNE.LEAF_H_LO && L2.h >= TUNE.LEAF_H_LO);
      const frameOK = shapeOK && petalRed && colorGap && leafGreen && hzOK;
      st.okBuf.push(frameOK ? 1 : 0); if (st.okBuf.length > TUNE.LOCK_WIN) st.okBuf.shift();
      const rate = st.okBuf.reduce((a, b) => a + b, 0) / st.okBuf.length;
      const isLocked = st.okBuf.length >= TUNE.LOCK_WIN && rate >= TUNE.LOCK_RATE;
      if (isLocked !== st.locked) { st.locked = isLocked; setLocked(isLocked); }
      // ピーク検出（明るさの立ち上がり→下降で1点滅）
      if (isLocked) {
        const cur = P.br;
        if (cur > st.prevBr) st.rising = true;
        else if (st.rising && cur < st.prevBr) { st.rising = false; const now = Date.now(); if (now - st.lastSpawn > 80) { onPeak(); st.lastSpawn = now; } }
        st.prevBr = cur;
      } else { st.rising = false; st.prevBr = P.br; }
    }

    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } } });
        streamRef.current = stream; video.srcObject = stream; await video.play();
        cv.width = 320; cv.height = 240;
        // 露出を下げる（点滅を捉えやすく）
        try {
          const track = stream.getVideoTracks()[0];
          if (track && track.getCapabilities) {
            const cap = track.getCapabilities(); const adv = [];
            if (cap.exposureMode && cap.exposureMode.includes('manual')) adv.push({ exposureMode: 'manual' });
            if (cap.exposureCompensation) adv.push({ exposureCompensation: Math.max(cap.exposureCompensation.min, -2) });
            if (cap.iso) adv.push({ iso: cap.iso.min });
            if (adv.length) await track.applyConstraints({ advanced: adv });
          }
        } catch (e) {}
        runningRef.current = true; tid = setInterval(analyze, 50);
      } catch (e) { setCamErr(e.message || String(e)); }
    })();

    return () => {
      runningRef.current = false;
      if (tid) clearInterval(tid);
      if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
    };
  }, []);

  async function handleBack() {
    if (submitting) return;
    setSubmitting(true);
    const blinks = blinksRef.current;
    try {
      if (blinks > 0) {
        const res = await ChikarianAPI.claimSaishu(blinks);
        const granted = res && res.granted != null ? res.granted : 0;
        flash(`チカリウム +${granted.toLocaleString()}（本日 ${res ? res.saishu_today : ''}/${DAILY_MAX}）`);
      }
    } catch (e) { flash(errMsg(e)); }
    finally { onExit(); }   // profile 再取得→home
  }

  const rs = regionsFor(side);
  const optimistic = Math.min(remaining, sessionGain);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', width: '100%', height: '100dvh', background: '#0a0509' }}>
      <div style={{ position: 'relative', width: '100%', aspectRatio: '4/3', background: '#000', overflow: 'hidden' }}>
        <video ref={videoRef} autoPlay playsInline muted style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
        <canvas ref={cvRef} style={{ display: 'none' }} />
        {/* 枠ガイド */}
        {Object.keys(rs.outer).map(k => { const r = rs.outer[k]; return <div key={'o' + k} style={{ position: 'absolute', left: `${r.x * 100}%`, top: `${r.y * 100}%`, width: `${r.w * 100}%`, height: `${r.h * 100}%`, border: `2px solid ${r.c}`, borderRadius: 3 }} />; })}
        {Object.keys(rs.inner).map(k => { const r = rs.inner[k]; return <div key={'i' + k} style={{ position: 'absolute', left: `${r.x * 100}%`, top: `${r.y * 100}%`, width: `${r.w * 100}%`, height: `${r.h * 100}%`, border: `1px dashed ${rs.outer[k].c}`, opacity: .7 }} />; })}
        {camErr && <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', color: '#ff8', fontSize: 13, padding: 20, textAlign: 'center' }}>カメラを起動できません<br />{camErr}</div>}
      </div>

      <div style={{ flex: 1, background: 'linear-gradient(180deg,#140913,#0a0509)', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '14px 16px', gap: 10, overflowY: 'auto' }}>
        <div style={{ fontSize: 15, letterSpacing: 3, color: GOLD }}>チカリウム採取</div>
        <div style={{ fontSize: 40, fontWeight: 800, color: GOLD_HI, textShadow: '0 0 16px rgba(255,200,90,.6)' }}>
          +{optimistic.toLocaleString()}<span style={{ fontSize: 16, color: '#cdb488' }}> / 残 {remaining.toLocaleString()}</span>

const WEAP_JA = { ken: '剣', tate: '盾', tsue: '杖' };
const ATTR_IC = { hana: './images/ic_attr_hana.png', ha: './images/ic_attr_ha.png', shin: './images/ic_attr_shin.png' };
function parseCardKey(key) {
  if (key.endsWith('_sp')) {
    const n = { chara_dragon_sp: 'ゴールドドラゴン', chara_girl_sp: 'ゴーストガール', chara_houou_sp: '鳳凰' }[key] || 'SP';
    return { rarity: 'sp', name: n, attr: '', weap: '', attrKey: '' };
  }
  const p = key.split('_');
  const rar = p[p.length - 1];
  const isMeshibe = p[1] === 'meshibe';
  return { rarity: rar, name: isMeshibe ? 'めしべだけマン' : 'ハイビスカスマン', attr: ATTR_JA[p[2]] || '', weap: WEAP_JA[p[3]] || '', attrKey: p[2] || '' };
}
// 表示名＝レア＋名前＋属性＋武器（例「SSRめしべだけマン芯杖」）。card オブジェクト/キー文字列どちらでも可。
function cardFullName(card) {
  const i = parseCardKey(typeof card === 'string' ? card : card.card_key);
  return (RAR_LABEL[i.rarity] || '') + i.name + i.attr + i.weap;
}

const gachaS = {

  bg: { position: 'absolute', inset: 0, backgroundImage: "url('./images/gacha-bg.png'), radial-gradient(120% 90% at 50% 18%, #5a1f3a 0%, #2a1024 38%, #140913 68%, #090509 100%)", backgroundSize: 'cover, cover', backgroundPosition: 'center, center', backgroundRepeat: 'no-repeat, no-repeat', backgroundColor: '#070409' },

};
function Gacha({ profile, onRefresh, back, flash }) {
  const [drawing, setDrawing] = useState(false);
  const [results, setResults] = useState(null);   // [{id, card_key, rarity, skill_key}]
  const [flipped, setFlipped] = useState([]);
  const [skillMap, setSkillMap] = useState({});
  const chikarium = profile ? (profile.chikarium || 0) : 0;

  useEffect(() => {
    (async () => {
      try { const sm = await ChikarianAPI.getSkillMaster(); const m = {}; (sm || []).forEach(s => { m[s.skill_key] = s.display_name; }); setSkillMap(m); }
      catch (e) {}
    })();
  }, []);

  async function draw() {
    if (drawing) return;
    if (chikarium < GACHA_COST) { flash('チカリウムが足りません'); return; }
    setDrawing(true); setResults(null); setFlipped([]);
    try {
      const res = await ChikarianAPI.doGacha();      // ★抽選はサーバ。返り値を表示するだけ
      const drawn = (res && res.cards) ? res.cards : [];
      setResults(drawn);
      setFlipped(drawn.map(() => false));
      // 登場→順次めくる演出
      drawn.forEach((_, i) => setTimeout(() => {
        setFlipped(f => { const n = f.slice(); n[i] = true; return n; });
        if (window.CKSound) CKSound.play('se_card_flip');
      }, 700 + i * 180));
      // 演出後に所持カード・残チカリウムをサーバ値で再取得
      const total = 700 + (drawn.length - 1) * 180 + 700;
      setTimeout(async () => { await onRefresh(); setDrawing(false); }, total);
    } catch (e) { flash(errMsg(e)); setDrawing(false); }
  }

  return (
    <div style={S.root}>
      <div style={gachaS.bg} /><div style={gachaS.vignette} />
      <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '18px 16px 22px' }}>
        <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: 3, color: GOLD_HI, textShadow: '0 2px 6px #3a0010, 0 0 16px rgba(255,180,80,.5)' }}>チカリアンガチャ</div>
        <div style={{ ...S.resPanelSm, marginTop: 8 }}>
          <span style={S.ic}>◈</span>
          <div style={S.resCol}><div style={S.resLabel}>所持チカリウム</div><div style={S.resVal}>{chikarium.toLocaleString()}</div></div>
        </div>
        <div style={{ fontSize: 11, color: '#cdb488', letterSpacing: 1, marginTop: 6 }}>1回 {GACHA_COST} チカリウム ・ 6枚排出</div>
        {/* 排出率（balance §1 確定値） */}
        <div style={{ fontSize: 10, color: '#a98f66', marginTop: 2 }}>排出率 N55.45 / R31.65 / SR9 / SP1.7 / SSR2.2 ％</div>

        <div className="gstage" style={{ flex: 1, marginTop: 14, marginBottom: 14, minHeight: 220 }}>
          {results && results.map((c, i) => <GCard key={c.id} data={c} flipped={flipped[i]} skillName={skillMap[c.skill_key]} index={i} />)}
        </div>

        <button onClick={draw} disabled={drawing} style={S.bigBtn}>{drawing ? '排出中…' : '引く（300）'}</button>
        <button onClick={back} disabled={drawing} style={{ ...S.lineBtn, marginTop: 16 }}>ホームに戻る</button>
      </div>
    </div>
  );
}

// 戦力の数値は balance の確定値（§2-2 本体基礎/Lv上限・§2-1 枠攻撃力）。勝手な値は作らない。
const CARD_BASE = { n: { base: 80, cap: 30 }, r: { base: 200, cap: 40 }, sr: { base: 360, cap: 50 }, ssr: { base: 560, cap: 60 } }; // balance §2-2
const SP_BASE = { chara_dragon_sp: 3200, chara_girl_sp: 3200, chara_houou_sp: 3200 };  // SP本体3種同値（2026-06-18改定 / 0039）
const QATK = { crude: 10, refined: 15, enchanted: 22, holy: 34 };                      // ギア枠攻撃力（0032 canon-04 §3）
const QUALITY_JA = { crude: '粗製', refined: '精製', enchanted: '魔装', holy: '聖装' };

// 図鑑母数＝cards §4（ハイビスカス36＋めしべ2＋SP3＝41種）
const CATALOG = (() => {
  const arr = [];
  for (const rare of ['n', 'r', 'sr', 'ssr']) for (const attr of ['hana', 'ha', 'shin']) for (const weap of ['ken', 'tate', 'tsue']) arr.push('chara_hibiscus_' + attr + '_' + weap + '_' + rare);
  arr.push('chara_meshibe_shin_tsue_sr', 'chara_meshibe_shin_tsue_ssr', 'chara_dragon_sp', 'chara_girl_sp', 'chara_houou_sp');
  return arr;
})();

function computeStats(card) {
  const key = card.card_key, isSp = key.endsWith('_sp');
  const info = parseCardKey(key);
  let base, cap;
  if (isSp) { base = SP_BASE[key] || 0; cap = 50; }
  else { const b = CARD_BASE[info.rarity] || CARD_BASE.n; base = b.base; cap = b.cap; }
  const rL = 2.0 / (cap - 1);                                            // balance §2-2
  const body = base * (1 + ((card.lv || 1) - 1) * rL);                  // 本体は★非依存（0026）
  const qatk = isSp ? 0 : (QATK[card.quality] || 0);
  const equip = isSp ? 0 : ((card.loaded_buki || 0) * qatk);            // 装備項＝込めた武気×枠攻撃力
  const starMul = 1 + 0.10 * (card.star || 0);                         // ★は総合(装備項+本体)に乗る・係数0.10（0026）
  const bodyS = body * starMul, equipS = equip * starMul;              // 内訳の和＝総合になるよう表示にも同倍率
  return { isSp, info, base, cap, body: Math.round(bodyS), equip: Math.round(equipS), sougou: Math.round(bodyS + equipS) };
}

  const [err, setErr] = useState(false);
  return (
    <div style={{ position: 'relative', width: '100%', paddingTop: '150%', borderRadius: 14, overflow: 'hidden', border: '2px solid rgba(232,194,90,.6)', background: '#241018', boxShadow: '0 6px 24px rgba(0,0,0,.5)' }}>
      {err
        ? <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: 6, textAlign: 'center' }}><div style={{ fontSize: 34 }}>❖</div><div style={{ fontSize: 12, color: '#e7d3a6', marginTop: 4 }}>{info.name}</div>{(info.attr || info.weap) && <div style={{ fontSize: 11, color: '#cdb488' }}>{info.attr}{info.weap}</div>}</div>
        : <img src={'./images/' + cardKey + '.png'} alt="" onError={() => setErr(true)} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />}
    </div>
  );
}

function ZukanScreen({ cards, profile, refreshAll, back, flash, initialTab }) {
  const PAGE_SIZE = 24;
  const [tab, setTab] = useState(initialTab || 'catalog');   // catalog | owned
  const [facet, setFacet] = useState('attr');                // attr | weap | rarity | species
  const [fval, setFval] = useState('all');                   // 選択中ファセット値 or 'all'
  const [sortField, setSortField] = useState('rarity');      // rarity | lv | atk
  const [sortDir, setSortDir] = useState('desc');            // desc | asc
  const [page, setPage] = useState(0);
  const [zukan, setZukan] = useState(null);
  const [skillMap, setSkillMap] = useState({});
  const [sel, setSel] = useState(null);
  useEffect(() => {
    (async () => {
      try { setZukan(await ChikarianAPI.getZukan() || []); } catch (e) { flash(errMsg(e)); setZukan([]); }
      try { const sm = await ChikarianAPI.getSkillMaster(); const m = {}; (sm || []).forEach(s => { m[s.skill_key] = s; }); setSkillMap(m); } catch (e) {}
    })();
  }, []);
  // 強化等で cards が更新されたら、選択中カードを最新へ同期（素材化で消えたら閉じる）
  useEffect(() => {
    setSel(prev => prev ? ((cards || []).find(c => c.id === prev.id) || null) : prev);
  }, [cards]);
  // フィルタ/ソート/タブ変更時はページを先頭へ
  useEffect(() => { setPage(0); }, [tab, facet, fval, sortField, sortDir]);

  if (sel) return <CardDetail card={sel} cards={cards} profile={profile} skillMap={skillMap} refreshAll={refreshAll} back={() => setSel(null)} onSelect={setSel} flash={flash} />;

  const collected = new Set((zukan || []).map(z => z.card_key));
  const ownedByKey = {};
  (cards || []).forEach(c => { (ownedByKey[c.card_key] = ownedByKey[c.card_key] || []).push(c); });

  // 生キー抽出（SP は属性/レア/種族='sp'・武器なし）。キー形式 chara_<種>_<attr>_<weap>_<rare> / chara_*_sp
  const rawRar = k => k.endsWith('_sp') ? 'sp' : k.split('_').pop();
  const rawAttr = k => k.endsWith('_sp') ? 'sp' : k.split('_')[2];
  const rawWeap = k => k.endsWith('_sp') ? null : k.split('_')[3];
  const rawSpec = k => k.endsWith('_sp') ? 'sp' : k.split('_')[1];   // hibiscus | meshibe
  const RAR_ORD = { n: 0, r: 1, sr: 2, ssr: 3, sp: 4 };

  const FACETS = {
    attr:    { label: '属性', vals: [['hana', '花'], ['shin', '芯'], ['ha', '葉'], ['sp', 'SP']] },
    weap:    { label: '武器', vals: [['ken', '剣'], ['tate', '盾'], ['tsue', '杖']] },
    rarity:  { label: 'レア', vals: [['n', 'N'], ['r', 'R'], ['sr', 'SR'], ['ssr', 'SSR'], ['sp', 'SP']] },
    species: { label: '種族', vals: [['hibiscus', 'ハイビスカス'], ['meshibe', 'めしべ'], ['sp', 'SP']] },
  };
  const FACET_ORDER = ['attr', 'weap', 'rarity', 'species'];
  const matchFacet = k => {
    if (fval === 'all') return true;
    if (facet === 'attr') return rawAttr(k) === fval;
    if (facet === 'weap') return rawWeap(k) === fval;
    if (facet === 'rarity') return rawRar(k) === fval;
    if (facet === 'species') return rawSpec(k) === fval;
    return true;
  };

  // 一覧（owned=各インスタンス / catalog=全41種）→ フィルタ → ソート
  let items;
  if (tab === 'owned') {
    items = (cards || []).map(c => ({ key: c.card_key, card: c, id: c.id, got: true, inst: c }));
  } else {
    items = CATALOG.map(k => { const inst = ownedByKey[k] && ownedByKey[k][0]; return { key: k, card: inst || null, id: 'cat_' + k, got: collected.has(k), inst }; });
  }
  items = items.filter(it => matchFacet(it.key));
  const sval = it => sortField === 'rarity' ? (RAR_ORD[rawRar(it.key)] != null ? RAR_ORD[rawRar(it.key)] : 0)
    : sortField === 'lv' ? (it.card ? (it.card.lv || 1) : 0)
    : (it.card ? computeStats(it.card).sougou : 0);
  const dir = sortDir === 'asc' ? 1 : -1;
  items.sort((a, b) => (sval(a) - sval(b)) * dir || ((RAR_ORD[rawRar(b.key)] || 0) - (RAR_ORD[rawRar(a.key)] || 0)) || a.key.localeCompare(b.key));

  const total = items.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const pg = Math.min(page, totalPages - 1);
  const pageItems = items.slice(pg * PAGE_SIZE, pg * PAGE_SIZE + PAGE_SIZE);

  const SORTS = [['rarity', 'レアリティ'], ['lv', 'レベル'], ['atk', '攻撃力']];
  const arrow = f => sortField === f ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';

  return (
    <div style={S.root}>
      <div style={zS.bg} />
      <div style={zS.body}>
        <div style={zS.head}>図鑑</div>
        <div style={zS.tabs}>
          <button style={{ ...zS.tab, ...(tab === 'catalog' ? zS.tabSel : {}) }} onClick={() => setTab('catalog')}>図鑑</button>
          <button style={{ ...zS.tab, ...(tab === 'owned' ? zS.tabSel : {}) }} onClick={() => setTab('owned')}>所持カード（{(cards || []).length}）</button>
        </div>
        <div style={zS.filters}>
          {FACET_ORDER.map(f => <button key={f} style={{ ...zS.fil, ...(facet === f ? zS.filSel : {}) }} onClick={() => { setFacet(f); setFval('all'); }}>{FACETS[f].label}</button>)}
        </div>
        <div style={zS.filters}>
          <button style={{ ...zS.fil, ...(fval === 'all' ? zS.filSel : {}) }} onClick={() => setFval('all')}>すべて</button>
          {FACETS[facet].vals.map(([k, l]) => <button key={k} style={{ ...zS.fil, ...(fval === k ? zS.filSel : {}) }} onClick={() => setFval(k)}>{l}</button>)}
        </div>
        <div style={zS.srow}>
          <span style={zS.slab}>並び替え</span>
          {SORTS.map(([k, l]) => <button key={k} style={{ ...zS.sbtn, ...(sortField === k ? zS.ssel : {}) }} onClick={() => { if (sortField === k) setSortDir(d => d === 'asc' ? 'desc' : 'asc'); else { setSortField(k); setSortDir('desc'); } }}>{l}{arrow(k)}</button>)}
        </div>
        <div style={zS.count}>
          {tab === 'catalog'
            ? <>コンプリート <b style={{ color: '#ffe39a' }}>{collected.size}</b> / {CATALOG.length} 種</>
            : <>所持 <b style={{ color: '#ffe39a' }}>{(cards || []).length}</b> 枚</>}
          {total > 0 && <span style={{ color: '#a98f66' }}>　（{total} 件・{pg + 1}/{totalPages}）</span>}
        </div>
        {total === 0
          ? <div style={{ flex: 1, textAlign: 'center', color: '#cdb488', marginTop: 30, fontSize: 13 }}>{tab === 'owned' ? '該当する所持カードがありません' : '該当カードなし'}</div>
          : <div style={zS.grid}>
              {pageItems.map(it => {
                if (tab === 'catalog' && !it.got) return <ZCard key={it.id} placeholder />;
                return <ZCard key={it.id} cardKey={it.key} star={it.card ? (it.card.star || 0) : 0} recorded={tab === 'catalog' && !it.inst} onClick={it.card ? () => setSel(it.card) : null} />;
              })}
            </div>}
        <div style={zS.botBar}>
          <button style={zS.back2} onClick={back}>‹ 戻る</button>
          <div style={{ flex: 1 }} />
          {totalPages > 1 && <>
            <button style={{ ...zS.pgBtn, ...(pg <= 0 ? zS.pgOff : {}) }} disabled={pg <= 0} onClick={() => setPage(pg - 1)}>‹ 前</button>
            <div style={zS.pgInfo}>{pg + 1} / {totalPages}</div>
            <button style={{ ...zS.pgBtn, ...(pg >= totalPages - 1 ? zS.pgOff : {}) }} disabled={pg >= totalPages - 1} onClick={() => setPage(pg + 1)}>次 ›</button>
          </>}
        </div>
      </div>
    </div>
  );
}

function CardDetail({ card, cards, profile, skillMap, refreshAll, back, flash, onSelect }) {
  const [skills, setSkills] = useState(null);
  const [mode, setMode] = useState(null);   // null | 'kyoka'
  useEffect(() => { (async () => { try { setSkills(await ChikarianAPI.getCardSkills(card.id) || []); } catch (e) { flash(errMsg(e)); setSkills([]); } })(); }, [card.id]);

  if (mode === 'kyoka') return <KyokaView base={card} cards={cards} profile={profile} refreshAll={refreshAll} onBack={() => setMode(null)} flash={flash} />;
  if (mode === 'equip') return <EquipView base={card} refreshAll={refreshAll} onBack={() => setMode(null)} flash={flash} />;
  if (mode === 'skill') return <SkillView base={card} cards={cards} profile={profile} skillMap={skillMap} refreshAll={refreshAll} onBack={() => setMode(null)} flash={flash} />;
  if (mode === 'exchange') return <ExchangeView base={card} refreshAll={refreshAll} onBack={() => setMode(null)} flash={flash} />;

  const st = computeStats(card);
  const info = st.info;
  const bySlot = {}; (skills || []).forEach(s => { bySlot[s.slot] = s; });

  // ロック切替: 専用RPCが無いため未実装（cards を直接UPDATEしない＝RLS/不正対策C）。
  // ※ chikarian-api.js / 0001-0011 にロックRPCは無い。RPCが用意されたらここを有効化する。
  const LOCK_RPC_AVAILABLE = false;

  const op = (label) => () => flash(label + 'は準備中です（次フェーズ）');

  function SkillSlot({ slot }) {
    const isFixed = slot === 0;
    const row = bySlot[slot];
    if (st.isSp && slot > 0) {
      return <div style={dS.slot}><div style={dS.slotHead}>空きスロット{slot}</div><div style={{ fontSize: 11, color: '#a98f66' }}>SPは追加スロットなし</div></div>;
    }
    const m = row ? skillMap[row.skill_key] : null;
    return (
      <div style={dS.slot}>
        <div style={dS.slotHead}>{isFixed ? '固定スキル' : '空きスロット' + slot}</div>
        {row
          ? <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: GOLD_HI }}>{m ? m.display_name : row.skill_key} <span style={{ fontSize: 11, color: '#cdb488' }}>Lv{row.skill_lv}</span></div>
              {m && m.notes && <div style={{ fontSize: 11, color: '#cdb488', marginTop: 2 }}>{m.notes}</div>}
            </div>
          : <div style={{ fontSize: 11, color: '#a98f66' }}>空き（転移で付与）</div>}
      </div>
    );
  }

  // 前後ナビ＝所持カード(cards)を巡る（容易に配線できるため対応）。
  const navList = cards || [];
  const navIdx = navList.findIndex(c => c.id === card.id);
  const canNav = typeof onSelect === 'function';

  return (
    <div style={S.root}>
      <div style={zS.bg} />
      <div style={zS.dScroll}>
        {/* カード絵（rank文字＝レア・失敗時 ❖＋名前＋属性/武器）＋ロック */}
        <div style={zS.dCard}>
          <ZDetailArt cardKey={card.card_key} info={info} />
          <div style={zS.rank}>{RAR_LABEL[info.rarity]}</div>
          {card.locked && <div style={{ position: 'absolute', top: 8, left: 9, fontSize: 15, filter: 'drop-shadow(0 1px 2px #000)' }}>🔒</div>}
        </div>

        <div style={zS.dName}>{cardFullName(card)}</div>
        <div style={zS.dBadges}>
          {st.isSp
            ? <span style={{ ...zS.badge, background: 'linear-gradient(90deg,#ffe39a,#e8b54d)' }}>SP</span>
            : <><span style={{ ...zS.badge, background: DECK_ATTR_COL[info.attr] || '#888' }}>{info.attr}</span><span style={zS.wbadge}>{info.weap}</span></>}
          <span style={{ ...zS.badge, background: '#3a2a40', color: '#e7d3ff' }}>{RAR_LABEL[info.rarity]}</span>
        </div>
        <div style={zS.dStarRow}>{st.isSp ? '—' : (card.star > 0 ? '★'.repeat(card.star) : '☆')}　Lv {card.lv}{card.lv != null && <span style={{ fontSize: 11, color: '#7a6848' }}> / 上限{st.cap}</span>}</div>

        {/* ステータス（数値は本番 computeStats＝SP本体3200・★0.10・枠攻撃力10/15/22/34） */}
        <div style={zS.dStats}>
          <div style={zS.dRow}><span style={zS.dk}>総合戦力（発動前）</span><span style={zS.dv}>{st.sougou.toLocaleString()}</span></div>
          <div style={zS.dRow}><span style={zS.dk}>本体戦闘力</span><span style={zS.dv}>{st.body.toLocaleString()}</span></div>
          <div style={zS.dRow}><span style={zS.dk}>装備項</span><span style={zS.dv}>{st.equip.toLocaleString()}</span></div>
          <div style={{ ...zS.dRow, borderBottom: 'none' }}><span style={zS.dk}>充填（武気）</span><span style={zS.dv}>{st.isSp ? '装備なし（SP）' : `${QUALITY_JA[card.quality] || '—'}・${(card.loaded_buki || 0).toLocaleString()}枠（枠攻${QATK[card.quality] || 0}）`}</span></div>
        </div>

        {/* スキル3枠（getCardSkills＋skillMap の実データ） */}
        <div style={zS.dSec}>スキル（固定1＋空き2）</div>
        <div style={{ width: '100%', maxWidth: 320 }}>
          <SkillSlot slot={0} /><SkillSlot slot={1} /><SkillSlot slot={2} />
        </div>

        {/* 操作（本番の全操作を維持＝各 setMode） */}
        <div style={zS.dSec}>操作（カード詳細が共通入口）</div>
        <div style={zS.zActions}>
          <button style={{ ...zS.zaBtn, ...(card.locked ? zS.zaOff : {}) }} disabled={!!card.locked} onClick={() => setMode('kyoka')}>★強化</button>
          <button style={{ ...zS.zaBtn, ...(st.isSp ? zS.zaOff : {}) }} disabled={st.isSp} onClick={() => setMode('skill')}>スキル強化/転移{st.isSp ? '（SP不可）' : ''}</button>
          <button style={{ ...zS.zaBtn, ...(st.isSp ? zS.zaOff : {}) }} disabled={st.isSp} onClick={() => setMode('equip')}>装備（充填）{st.isSp ? '（SP不可）' : ''}</button>
          <button style={{ ...zS.zaBtn, ...(card.locked ? zS.zaOff : {}) }} disabled={!!card.locked} onClick={() => setMode('exchange')}>交換所</button>
          <button style={{ ...zS.zaBtn, ...zS.zaOff, gridColumn: '1 / -1' }} disabled={!LOCK_RPC_AVAILABLE}
            onClick={() => flash('ロック切替には専用RPCが必要です（cardsの直接更新はRLS/不正対策Cで不可）')}>
            {card.locked ? 'ロック解除' : 'ロックする'}（専用RPC待ち）
          </button>
        </div>
      </div>

      {/* 下部ナビ：一覧へ／前／次（所持カードを巡る） */}
      <div style={zS.dnav}>
        <button style={{ ...zS.navBtn, flex: 1.2 }} onClick={back}>一覧へ</button>
        <button style={{ ...zS.navBtn, flex: 1, ...((!canNav || navIdx <= 0) ? zS.zaOff : {}) }} disabled={!canNav || navIdx <= 0} onClick={() => { if (canNav && navIdx > 0) onSelect(navList[navIdx - 1]); }}>‹ 前</button>
        <button style={{ ...zS.navBtn, flex: 1, ...((!canNav || navIdx < 0 || navIdx >= navList.length - 1) ? zS.zaOff : {}) }} disabled={!canNav || navIdx < 0 || navIdx >= navList.length - 1} onClick={() => { if (canNav && navIdx >= 0 && navIdx < navList.length - 1) onSelect(navList[navIdx + 1]); }}>次 ›</button>
      </div>
    </div>
  );
}

function CardPicker({ title, cards, getStatus, chooseLabel, onChoose, onClear, back, busy, flash }) {
  const [sel, setSel] = useState(null);
  const [facet, setFacet] = useState('attr');
  const [fval, setFval] = useState('all');
  const [sortField, setSortField] = useState('body');
  const [sortDir, setSortDir] = useState('desc');
  const [skillMap, setSkillMap] = useState({});
  const [selSkills, setSelSkills] = useState(null);
  const cardById = {}; (cards || []).forEach(c => { cardById[c.id] = c; });

  useEffect(() => { (async () => { try { const sm = await ChikarianAPI.getSkillMaster(); const m = {}; (sm || []).forEach(s => { m[s.skill_key] = s; }); setSkillMap(m); } catch (e) {} })(); }, []);
  useEffect(() => {
    let live = true; setSelSkills(null);
    if (sel != null) { (async () => { try { const s = await ChikarianAPI.getCardSkills(sel) || []; if (live) setSelSkills(s); } catch (e) { if (live) setSelSkills([]); } })(); }
    return () => { live = false; };
  }, [sel]);

  const rawRar = k => k.endsWith('_sp') ? 'sp' : k.split('_').pop();
  const rawAttr = k => k.endsWith('_sp') ? 'sp' : k.split('_')[2];
  const rawWeap = k => k.endsWith('_sp') ? null : k.split('_')[3];
  const rawSpec = k => k.endsWith('_sp') ? 'sp' : k.split('_')[1];
  const RAR_ORD = { n: 0, r: 1, sr: 2, ssr: 3, sp: 4 };
  const FACETS = {
    attr: { label: '属性', vals: [['hana', '花'], ['shin', '芯'], ['ha', '葉'], ['sp', 'SP']] },
    weap: { label: '武器', vals: [['ken', '剣'], ['tate', '盾'], ['tsue', '杖']] },
    rarity: { label: 'レア', vals: [['n', 'N'], ['r', 'R'], ['sr', 'SR'], ['ssr', 'SSR'], ['sp', 'SP']] },
    species: { label: '種族', vals: [['hibiscus', 'ハイビスカス'], ['meshibe', 'めしべ'], ['sp', 'SP']] },
  };
  const FACET_ORDER = ['attr', 'weap', 'rarity', 'species'];
  const matchFacet = k => fval === 'all' ? true : facet === 'attr' ? rawAttr(k) === fval : facet === 'weap' ? rawWeap(k) === fval : facet === 'rarity' ? rawRar(k) === fval : rawSpec(k) === fval;
  const items = (cards || []).filter(c => matchFacet(c.card_key));
  const bodyOf = c => computeStats(c).body;
  const sval = c => sortField === 'rarity' ? (RAR_ORD[rawRar(c.card_key)] || 0) : sortField === 'lv' ? (c.lv || 1) : bodyOf(c);
  const dir = sortDir === 'asc' ? 1 : -1;
  items.sort((a, b) => (sval(a) - sval(b)) * dir || ((RAR_ORD[rawRar(b.card_key)] || 0) - (RAR_ORD[rawRar(a.card_key)] || 0)) || a.card_key.localeCompare(b.card_key));

  const SORTS = [['body', '本体戦闘力'], ['lv', 'レベル'], ['rarity', 'レア']];
  const arrow = f => sortField === f ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '';
  const onSort = k => { if (sortField === k) setSortDir(d => d === 'asc' ? 'desc' : 'asc'); else { setSortField(k); setSortDir('desc'); } };

  const selCard = sel != null ? cardById[sel] : null;
  const selStatus = selCard ? getStatus(selCard) : null;
  const selInfo = selCard ? parseCardKey(selCard.card_key) : null;
  const selStats = selCard ? computeStats(selCard) : null;
  const selCap = selCard ? bukiCapacity(selCard) : 0;
  const bySlot = {}; (selSkills || []).forEach(s => { bySlot[s.slot] = s; });

  return (
    <div style={S.root}>
      <div style={S.bg} /><div style={S.vignette} />
      <div style={cpS.wrap}>
        <div style={cpS.head}>
          <button onClick={back} style={{ ...S.lineBtn, padding: '6px 14px' }}>‹ 戻る</button>
          <div style={cpS.title}>{title}</div>
        </div>
        <div style={cpS.facetRow}>
          {FACET_ORDER.map(f => <button key={f} onClick={() => { setFacet(f); setFval('all'); }} style={{ ...cpS.chip, ...(facet === f ? cpS.chipSel : {}) }}>{FACETS[f].label}</button>)}
        </div>
        <div style={cpS.facetRow}>
          <button onClick={() => setFval('all')} style={{ ...cpS.chip, ...(fval === 'all' ? cpS.chipSel : {}) }}>すべて</button>
          {FACETS[facet].vals.map(([k, l]) => <button key={k} onClick={() => setFval(k)} style={{ ...cpS.chip, ...(fval === k ? cpS.chipSel : {}) }}>{l}</button>)}
        </div>
        <div style={cpS.facetRow}>
          <span style={cpS.sortLab}>並び替え</span>
          {SORTS.map(([k, l]) => <button key={k} onClick={() => onSort(k)} style={{ ...cpS.chip, ...(sortField === k ? cpS.chipSel : {}) }}>{l}{arrow(k)}</button>)}
        </div>
        <div style={cpS.split}>
          <div style={cpS.left}>
            {items.length === 0
              ? <div style={cpS.empty}>該当カードなし</div>
              : items.map(c => {
                  const st = getStatus(c);
                  const info = parseCardKey(c.card_key);
                  return (
                    <button key={c.id} onClick={() => setSel(c.id)} style={{ ...cpS.li, ...(sel === c.id ? cpS.liSel : {}), ...(st.dim ? { opacity: .45 } : {}) }}>
                      <div style={cpS.liThumb}><CardThumb card={c} small /></div>
                      <div style={cpS.liMeta}>
                        <div style={cpS.liNameRow}><span style={cpS.liRar}>{RAR_LABEL[info.rarity]}</span><span style={cpS.liName}>{info.name}</span></div>
                        <div style={cpS.liBadges}><DeckBadges info={info} />{st.tag && <span style={cpS.liTag}>{st.tag}</span>}</div>
                      </div>
                    </button>
                  );
                })}
          </div>
          <div style={cpS.right}>
            {!selCard
              ? <div style={cpS.ph}>← 左の一覧から<br />カードを選ぶと<br />詳細が出ます</div>
              : <>
                  <div style={cpS.dArt}><DeckSlotArt cardKey={selCard.card_key} /></div>
                  <div style={cpS.dNameRow}><span style={cpS.dRar}>{RAR_LABEL[selInfo.rarity]}</span><span style={cpS.dName}>{selInfo.name}</span></div>
                  <div style={cpS.dBadges}><DeckBadges info={selInfo} /></div>
                  <div style={cpS.dRow}><span>レベル</span><span style={cpS.dv}>Lv {selCard.lv || 1} / 上限 {selStats.cap}</span></div>
                  <div style={cpS.dRow}><span>強化値</span><span style={cpS.dv}>★{selCard.star || 0}</span></div>
                  <div style={cpS.dRow}><span>本体戦闘力</span><span style={cpS.dv}>{selStats.body.toLocaleString()}</span></div>
                  {!selStats.isSp && <div style={cpS.dRow}><span>充填（武気）</span><span style={cpS.dv}>{(selCard.loaded_buki || 0)} / {selCap} 枠</span></div>}
                  <div style={{ ...cpS.dRow, borderBottom: 'none' }}><span>コスト</span><span style={cpS.dv}>{COST_BY_RAR[selInfo.rarity] || 0}</span></div>
                  <div style={cpS.skTitle}>スキル</div>
                  {selSkills === null
                    ? <div style={cpS.skMuted}>読込中…</div>
                    : <div style={cpS.skList}>
                        {[0, 1, 2].map(slot => {
                          if (selStats.isSp && slot > 0) return null;
                          const row = bySlot[slot]; const m = row ? skillMap[row.skill_key] : null;
                          return (
                            <div key={slot} style={cpS.skItem}>
                              <div style={cpS.skHead}>{slot === 0 ? '固定スキル' : '移植スロット' + slot}{row && <span style={cpS.skLv}>・Lv{row.skill_lv}</span>}</div>
                              {row
                                ? <><div style={cpS.skName}>{m ? m.display_name : row.skill_key}</div>{m && m.notes && <div style={cpS.skEff}>{m.notes}</div>}</>
                                : <div style={cpS.skEmpty}>（空き）</div>}
                            </div>
                          );
                        })}
                      </div>}
                  {selStatus.disabled
                    ? <div style={cpS.dLock}>{selStatus.reason || selStatus.tag || '選べません'}</div>
                    : <button onClick={() => onChoose(selCard)} disabled={busy} style={{ ...cpS.choose, ...(busy ? { opacity: .5 } : {}) }}>{typeof chooseLabel === 'function' ? chooseLabel(selCard) : chooseLabel}</button>}
                </>}
          </div>
        </div>
        {onClear && <button onClick={onClear} disabled={busy} style={{ ...S.lineBtn, marginTop: 12, alignSelf: 'center', ...(busy ? { opacity: .45 } : {}) }}>この枠を空にする</button>}
      </div>
    </div>
  );
}

function AttrIcon({ info }) {
  const [err, setErr] = useState(false);
  const src = ATTR_IC[info.attrKey];
  if (!src || err) return <span style={{ ...deckS.badge, background: DECK_ATTR_COL[info.attr] || '#888' }}>{info.attr}</span>;
  return <img src={src} alt={info.attr} title={info.attr} style={deckS.attrIc} onError={() => setErr(true)} />;
}
function DeckBadges({ info }) {
  // SP は無属性＝SPバッジ。属性は画像アイコン（ic_attr_*・onError時はテキストバッジ）＋武器はテキストバッジ（武器アイコン素材は未作成）
  if (info.rarity === 'sp') return <span style={{ ...deckS.badge, background: 'linear-gradient(90deg,#ffe39a,#e8b54d)' }}>SP</span>;
  return (<>
    <AttrIcon info={info} />
    <span style={deckS.wbadge}>{info.weap}</span>
  </>);
}
function DeckSlotArt({ cardKey }) {
  // カード絵を cover 表示・失敗時は ph プレースホルダ（GCard / CardThumb と同方式）
  const [err, setErr] = useState(false);
  if (err) return <div style={deckS.slotPh}>❖</div>;
  return <img src={'./images/' + cardKey + '.png'} alt="" onError={() => setErr(true)} style={deckS.slotImg} />;
}

function DeckScreen({ profile, cards, refreshAll, back, flash, initialDeckNo }) {
  const maxDecks = Math.min(2 + Math.floor(((profile && profile.cleared_stage) || 0) / 2), 6); // balance §10
  const [decks, setDecks] = useState(null);
  const [spSet, setSpSet] = useState(null);     // {card_id:true} 本日離脱中
  const [deckNo, setDeckNo] = useState(initialDeckNo || 1);
  const [picking, setPicking] = useState(null); // 編集中の枠 index or null
  const [busy, setBusy] = useState(false);      // 即コミット中（二重防止）
  const [moveConfirm, setMoveConfirm] = useState(null); // {cardId, slot, fromDeckNo} 他デッキ移動の確認
  const [recallConfirm, setRecallConfirm] = useState(null); // {kind:'boss'|'tansaku', deckNo} 帰還/回収の確認
  const [bukiEdit, setBukiEdit] = useState(null);   // 武気充填モーダル対象 card_id
  const [bukiBusy, setBukiBusy] = useState(false);
  const [pool, setPool] = useState(null);           // renkiden 武気プール
  const [kajiyaLv, setKajiyaLv] = useState(1);       // 装備の質アンロック上限
  const [pickSel, setPickSel] = useState(null);      // ④ カード選択パネルで選択中の card_id

  const cardById = {}; (cards || []).forEach(c => { cardById[c.id] = c; });

  async function loadDecks() { try { const d = await ChikarianAPI.getDecks(); setDecks(d || []); return d || []; } catch (e) { flash(errMsg(e)); setDecks([]); return []; } }
  useEffect(() => {
    (async () => {
      await loadDecks();
      try { const sp = await ChikarianAPI.getSpStates(); const t = jstToday(); const s = {}; (sp || []).forEach(x => { if (x.unavailable_until >= t) s[x.card_id] = true; }); setSpSet(s); }
      catch (e) { setSpSet({}); }   // 読めなければバッジ無し（最終判定はサーバ拒否で対応）
    })();
  }, []);
  useEffect(() => { setPicking(null); setMoveConfirm(null); setRecallConfirm(null); }, [deckNo]);   // デッキ切替で編集状態をリセット
  useEffect(() => { setPickSel(null); }, [picking]);   // ④ 枠を開き直したら選択をクリア
  useEffect(() => {
    (async () => {
      try { const r = normalizeRk(await ChikarianAPI.getRenkiden()); setPool(r ? r.buki : 0); } catch (e) { setPool(0); }
      try { const os = await ChikarianAPI.getKajiyaOrders() || []; setKajiyaLv(os.filter(o => o.claimed).reduce((mx, o) => Math.max(mx, Q_LV[o.quality] || 0), 1)); } catch (e) {}
    })();
  }, []);

  // 現在の編成は decks（サーバ値）から導く curSlots を唯一のソースに（draft 廃止）。
  const curSlots = (() => { if (!decks) return [null, null, null]; const row = decks.find(x => x.deck_no === deckNo); return row ? [row.slot1_card_id || null, row.slot2_card_id || null, row.slot3_card_id || null] : [null, null, null]; })();
  const withSlot = (slot, id) => { const n = curSlots.slice(); n[slot] = id; return n; };

  let costTotal = 0;
  curSlots.forEach(id => { const c = cardById[id]; if (!c) return; costTotal += COST_BY_RAR[parseCardKey(c.card_key).rarity] || 0; });  // SP=4 を算入
  // このデッキ自身が出撃中（編成カードに探索/ボス占有が付く）＝編集不可（対称ケースの CARD_IN_TANSAKU を防ぐ）
  // 種別を判定：boss_deck_no===deckNo → ボス出撃中／tansaku_deck_no===deckNo → 探索中。
  const deckBossSortie = curSlots.some(id => { const c = id && cardById[id]; return c && Number(c.boss_deck_no) === deckNo; });
  const deckTansaku = curSlots.some(id => { const c = id && cardById[id]; return c && Number(c.tansaku_deck_no) === deckNo; });
  const deckSortie = deckBossSortie || deckTansaku;

  // 即コミット：操作の都度 updateDeck → サーバ値で反映（撃ちっぱなし）。
  async function commit(newSlots) {
    if (busy) return; setBusy(true);
    try { await ChikarianAPI.updateDeck(deckNo, newSlots[0], newSlots[1], newSlots[2]); await loadDecks(); }
    catch (e) { flash(errMsg(e)); }
    finally { setBusy(false); setPicking(null); }
  }
  // カードの在籍デッキ（このデッキ以外）。0043 で 1カード=1デッキ。
  const deckNoOf = (cardId) => { const d = (decks || []).find(x => x.deck_no !== deckNo && [x.slot1_card_id, x.slot2_card_id, x.slot3_card_id].includes(cardId)); return d ? d.deck_no : null; };

  // 出撃中デッキの解除（判定・回数返却・蓄積回収はサーバ。成功で decks＋cards 再取得）。
  async function releaseBoss() {
    if (busy) return; setBusy(true);
    try { await ChikarianAPI.cancelBossSortie(deckNo); await loadDecks(); await refreshAll(); flash('引き返します（帰還中）'); }
    catch (e) { flash(errMsg(e)); } finally { setBusy(false); }
  }
  async function releaseTansaku() {
    if (busy) return; setBusy(true);
    try { await ChikarianAPI.collectTansaku(deckNo); await loadDecks(); await refreshAll(); flash('回収しました'); }
    catch (e) { flash(errMsg(e)); } finally { setBusy(false); }
  }

  async function loadPool() { try { const r = normalizeRk(await ChikarianAPI.getRenkiden()); setPool(r ? r.buki : 0); } catch (e) {} }
  // 武気の付け外し（amount: 0=空 / 100000=最大 / loaded±1=微調整）。質変更は loaded 維持で再込め（サーバが返却→引直し）。
  async function applyBuki(c, quality, amount) {
    if (bukiBusy || deckSortie) return; setBukiBusy(true);
    try { await ChikarianAPI.equipBuki(c.id, quality, Math.max(0, amount)); await loadPool(); await refreshAll(); }
    catch (e) { flash(errMsg(e)); } finally { setBukiBusy(false); }
  }
  // デッキ単位の一括（最大充填 / 空にする）。SPはスキップ。
  async function fillDeck(empty) {
    if (bukiBusy || deckSortie) return; setBukiBusy(true);
    try {
      for (const id of curSlots) { const c = id && cardById[id]; if (!c || /_sp$/.test(c.card_key)) continue; await ChikarianAPI.equipBuki(c.id, c.quality || 'crude', empty ? 0 : 100000); }
      await loadPool(); await refreshAll();
    } catch (e) { flash(errMsg(e)); } finally { setBukiBusy(false); }
  }

  if (decks === null) return <Booting />;

  // カード選択パネル
  if (picking !== null) {
    const stateOf = (c) => {
      const sameDeckOther = curSlots.some((id, i) => id === c.id && i !== picking);
      const sp = !!(spSet && spSet[c.id]);
      const sortieLocked = (c.tansaku_deck_no != null) || (c.boss_deck_no != null);
      const otherDeck = deckNoOf(c.id);
      return { sameDeckOther, sp, sortieLocked, otherDeck };
    };
    const getStatus = (c) => {
      const st = stateOf(c);
      const dim = st.sameDeckOther || st.sp || st.sortieLocked;
      const tag = st.sp ? '離脱中' : st.sortieLocked ? (c.tansaku_deck_no != null ? '探索中' : '出撃中') : st.sameDeckOther ? '編成中' : st.otherDeck ? ('デッキ' + st.otherDeck) : null;
      const reason = st.sp ? 'SP離脱中（本日）は編成できません' : st.sortieLocked ? (c.tansaku_deck_no != null ? '探索に出撃中です' : 'ボスに出撃中です') : st.sameDeckOther ? 'このデッキの別の枠で編成中です' : '選べません';
      return { disabled: dim, dim, tag, reason };
    };
    const chooseLabel = (c) => { const ot = deckNoOf(c.id); return ot ? ('これを選ぶ（デッキ' + ot + 'から移動）') : 'これを選ぶ'; };
    const onChoose = (c) => { const ot = deckNoOf(c.id); if (ot) setMoveConfirm({ cardId: c.id, slot: picking, fromDeckNo: ot }); else commit(withSlot(picking, c.id)); };
    return (
      <>
        <CardPicker key={picking} title={'枠 ' + (picking + 1) + ' に入れるカード'} cards={cards} getStatus={getStatus} chooseLabel={chooseLabel} onChoose={onChoose} onClear={() => { if (!busy) commit(withSlot(picking, null)); }} back={() => setPicking(null)} busy={busy} flash={flash} />
        {moveConfirm && (() => {
          const mc = moveConfirm; const mcCard = cardById[mc.cardId];
          const nm = mcCard ? parseCardKey(mcCard.card_key).name : 'カード';
          return (
            <div style={deckS.mScrim} onClick={() => setMoveConfirm(null)}>
              <div style={deckS.mBox} onClick={(e) => e.stopPropagation()}>
                <div style={deckS.mTitle}>デッキ移動の確認</div>
                <div style={deckS.mMsg}>《{nm}》は デッキ{mc.fromDeckNo} に編成済みです。<br />デッキ{mc.fromDeckNo} から外して デッキ{deckNo} に移動しますか？</div>
                <div style={deckS.mBtns}>
                  <button style={deckS.mCancel} onClick={() => setMoveConfirm(null)} disabled={busy}>やめる</button>
                  <button style={deckS.mMove} onClick={() => { const m = mc; setMoveConfirm(null); commit(withSlot(m.slot, m.cardId)); }} disabled={busy}>{busy ? '移動中…' : '移動する'}</button>
                </div>
              </div>
            </div>
          );
        })()}
      </>
    );
  }

  return (
    <div style={S.root}>
      <div style={S.bg} /><div style={S.vignette} />
      <div style={{ position: 'relative', zIndex: 2, minHeight: '100dvh', display: 'flex', flexDirection: 'column', padding: '14px 12px 18px' }}>
        <div style={{ textAlign: 'center', fontSize: 20, fontWeight: 800, letterSpacing: 3, color: GOLD_HI }}>デッキ編成</div>
        <div style={{ textAlign: 'center', fontSize: 11, color: '#cdb488', marginTop: 2 }}>解放 {maxDecks} 本（2＋クリア面/2・上限6）</div>

        {/* デッキ番号タブ（mockup .tab/.tab.sel/.tab.locked／解放数は maxDecks まで） */}
        <div style={deckS.tabs}>
          {Array.from({ length: 6 }, (_, i) => i + 1).map(n => {
            const locked = n > maxDecks;
            return (
              <button key={n} onClick={() => { if (!locked) setDeckNo(n); }} style={{ ...deckS.tab, ...(n === deckNo ? deckS.tabSel : {}), ...(locked ? deckS.tabLocked : {}) }}>デッキ{n}{locked ? ' 🔒' : ''}</button>
            );
          })}
        </div>

        {/* 出撃/探索中バナー（編集ロック＝枠タップで picking を開かない・解除ボタン付き） */}
        {deckSortie && (
          <div style={deckS.sortieBanner}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: '#fff3c8' }}>{deckBossSortie ? 'このデッキはボス出撃中です' : 'このデッキは探索中です'}</div>
              <div style={{ fontSize: 10, color: '#cdb488', marginTop: 2 }}>解除すると編成できます</div>
            </div>
            <button style={{ ...deckS.sortieRelease, ...(busy ? { opacity: .5 } : {}) }} disabled={busy} onClick={() => setRecallConfirm({ kind: deckBossSortie ? 'boss' : 'tansaku', deckNo })}>{deckBossSortie ? 'キャンセル（帰還）' : '回収して戻す'}</button>
          </div>
        )}

        {/* デッキ単位の武気一括（最大充填 / 空にする）＋プール残 */}
        {!deckSortie && <div style={bukiS.deckBtns}>
          <button disabled={bukiBusy || busy} onClick={() => fillDeck(false)} style={{ ...bukiS.fillBtn, ...((bukiBusy || busy) ? bukiS.off : {}) }}>{bukiBusy ? '処理中…' : '⚡ 最大充填'}</button>
          <button disabled={bukiBusy || busy} onClick={() => fillDeck(true)} style={{ ...bukiS.emptyBtn, ...((bukiBusy || busy) ? bukiS.off : {}) }}>武気を空にする</button>
          {pool != null && <span style={bukiS.poolTag}>プール {pool.toLocaleString()}</span>}
        </div>}
        {/* 3枠（即確定：枠タップで選択／×で即空に。出撃中デッキは編集不可） */}
        <div style={{ ...deckS.slots, opacity: (busy || deckSortie) ? .6 : 1 }}>
          {[0, 1, 2].map(slot => {
            const id = curSlots[slot]; const c = id ? cardById[id] : null;
            const sp = c && spSet && spSet[c.id];
            const info = c ? parseCardKey(c.card_key) : null;
            return (
              <div key={slot} onClick={() => { if (!busy && !deckSortie) setPicking(slot); }} style={{ ...deckS.slot, ...(c ? deckS.slotFilled : {}) }}>
                {c
                  ? <>
                      <div onClick={(e) => { e.stopPropagation(); if (!busy && !deckSortie) commit(withSlot(slot, null)); }} style={deckS.rm}>×</div>
                      <DeckSlotArt cardKey={c.card_key} />
                      <div style={deckS.meta}><DeckBadges info={info} /></div>
                      {sp && <div style={badge('#ff6a7a')}>離脱中</div>}
                    </>
                  : <div style={deckS.empty}>＋<small style={deckS.emptySmall}>枠 {slot + 1}</small></div>}
              </div>
            );
          })}
        </div>

        {/* 各カードの充填ゲージ（タップで微調整モーダル）。SP は武気なし */}
        {!deckSortie && <div style={bukiS.row}>
          {[0, 1, 2].map(slot => {
            const id = curSlots[slot]; const c = id ? cardById[id] : null;
            if (!c) return <div key={slot} style={bukiS.cell} />;
            if (/_sp$/.test(c.card_key)) return <div key={slot} style={{ ...bukiS.cell, cursor: 'default' }}><div style={bukiS.spLab}>SP・武気なし</div></div>;
            const cap = bukiCapacity(c), loaded = c.loaded_buki || 0, pct = cap > 0 ? Math.min(100, loaded / cap * 100) : 0;
            return (
              <button key={slot} disabled={busy || bukiBusy} onClick={() => setBukiEdit(c.id)} style={bukiS.cell}>
                <div style={bukiS.gauge}><div style={{ height: '100%', width: pct + '%', background: BUKI_COLOR[c.quality] || '#9a7' }} /></div>
                <div style={bukiS.lab}>武 {loaded}/{cap} ⚡</div>
              </button>
            );
          })}
        </div>}

        {/* コスト目安（mockup .summary：中央寄せ・本番の文言を維持） */}
        <div style={deckS.summary}>
          <div style={{ fontSize: 13, fontWeight: 700, color: costTotal > 11 ? '#ff6a7a' : GOLD_HI }}>
            合計コスト目安 <b style={{ fontSize: 24, color: costTotal > 11 ? '#ff6a7a' : '#ffe39a', textShadow: '0 0 12px rgba(255,200,90,.5)', marginLeft: 6 }}>{costTotal}</b> / 11{costTotal > 11 ? '（上限超過）' : ''}
          </div>
          <div style={deckS.legend}>コスト N1 / R2 / SR3 / SSR5 / SP4（確定）。三すくみ 有利×1.2・不利×0.8（balance 2026-06-14）。<br />可否（コスト上限11・本数・SP離脱・重複）はサーバ判定です。</div>
          <div style={deckS.autoSave}>編成は自動で保存されます</div>
        </div>

        <button onClick={back} style={{ ...S.lineBtn, marginTop: 16, alignSelf: 'center' }}>ホームに戻る</button>
      </div>

        {/* 武気充填の微調整モーダル（質・±・最大・空） */}
        {bukiEdit && (() => {
          const c = cardById[bukiEdit]; if (!c) return null;
          const cap = bukiCapacity(c), loaded = c.loaded_buki || 0, q = c.quality || 'crude';
          const pct = cap > 0 ? Math.min(100, loaded / cap * 100) : 0;
          return (
            <div style={bukiS.scrim} onClick={() => { if (!bukiBusy) setBukiEdit(null); }}>
              <div style={bukiS.sheet} onClick={(e) => e.stopPropagation()}>
                <div style={bukiS.title}>{parseCardKey(c.card_key).name} ・武気充填</div>
                <div style={bukiS.cap}>{loaded} / {cap} 枠　｜　プール {pool != null ? pool.toLocaleString() : '—'}</div>
                <div style={bukiS.bigGauge}><div style={{ height: '100%', width: pct + '%', background: BUKI_COLOR[q] || '#9a7' }} /></div>
                <div style={bukiS.qrow}>
                  {Q_ORDER.map(qq => { const locked = Q_LV[qq] > kajiyaLv; return (
                    <button key={qq} disabled={bukiBusy || locked} onClick={() => applyBuki(c, qq, loaded)} style={{ ...bukiS.q, ...(qq === q ? bukiS.qOn : {}), ...(locked ? bukiS.qLock : {}) }}>{QUALITY_JA[qq]}{locked ? ' 🔒' : ''}<br /><small>攻{QATK[qq]}/コ{Q_COST[qq]}</small></button>
                  ); })}
                </div>
                <div style={bukiS.pmRow}>
                  <button disabled={bukiBusy || loaded <= 0} onClick={() => applyBuki(c, q, loaded - 1)} style={bukiS.pm}>−</button>
                  <button disabled={bukiBusy} onClick={() => applyBuki(c, q, 0)} style={bukiS.mid}>空にする</button>
                  <button disabled={bukiBusy} onClick={() => applyBuki(c, q, 100000)} style={bukiS.mid}>最大充填</button>
                  <button disabled={bukiBusy || loaded >= cap} onClick={() => applyBuki(c, q, loaded + 1)} style={bukiS.pm}>＋</button>
                </div>
                <button style={bukiS.close} onClick={() => { if (!bukiBusy) setBukiEdit(null); }}>閉じる</button>
              </div>
            </div>
          );
        })()}

      {/* 帰還/回収の確認モーダル（moveConfirm と同じ意匠） */}
      {recallConfirm && (() => {
        const rc = recallConfirm; const isBoss = rc.kind === 'boss';
        return (
          <div style={deckS.mScrim} onClick={() => setRecallConfirm(null)}>
            <div style={deckS.mBox} onClick={(e) => e.stopPropagation()}>
              <div style={deckS.mTitle}>{isBoss ? '帰還の確認' : '回収の確認'}</div>
              <div style={deckS.mMsg}>{isBoss ? `デッキ${rc.deckNo} を帰還させますか？` : `デッキ${rc.deckNo} を回収して戻しますか？`}</div>
              <div style={deckS.mBtns}>
                <button style={deckS.mCancel} onClick={() => setRecallConfirm(null)} disabled={busy}>いいえ</button>
                <button style={deckS.mMove} onClick={() => { setRecallConfirm(null); isBoss ? releaseBoss() : releaseTansaku(); }} disabled={busy}>{busy ? '処理中…' : (isBoss ? 'はい（帰還）' : 'はい（回収）')}</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}
function badge(col) {
  return { position: 'absolute', top: 3, left: '50%', transform: 'translateX(-50%)', fontSize: 9, fontWeight: 700, color: '#1a0f06', background: col, borderRadius: 5, padding: '0 6px', whiteSpace: 'nowrap' };
}

const WORLD_NAMES = { 1: '古代樹海界', 2: '黒曜山界', 3: '神域界', 4: '鋼殻要塞界', 5: '雷帝界', 6: '群体界', 7: '幻妖界', 8: '終幕界' }; // balance §6-1

const SP_DEP = { sp_ryuki: 'ゴールドドラゴン', sp_aitou: 'ゴーストガール', sp_fushichou: '鳳凰' };
function arrJA(arr, map) { return (arr && arr.length) ? arr.map(x => map[x] || x).join('・') : 'なし'; }
